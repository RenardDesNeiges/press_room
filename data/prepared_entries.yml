- title: 'Philippe, Attal et Glucksmann ciblés par des ingérences russes : la campagne
    présidentielle dans les enfumages du Kremlin'
  summary: Les trois prétendants à l’Elysée ont été victimes ces derniers jours d’opérations
    russes de désinformation sur les réseaux sociaux. A gauche comme à droite, la
    menace inquiète, alors qu’un projet de loi censé être plus dissuasif a été déposé
    en juillet au Sénat.
