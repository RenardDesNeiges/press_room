- title: Les fans argentins de Rosalía chantent contre Milei que "la patrie ne se
    vend pas" lors de son concert à Buenos Aires
  summary: 'Les fans de l''artiste ont chanté le cantique au milieu du débat sur l''étrangélisation
    du territoire dans le pays, un projet de loi que le gouvernement de Milei cherche
    à promouvoir ce jeudi au Congrès. La famille de Robe Iniesta annonce que la «
    pesade » de leur relation avec Live Nation est « en voie d''arriver prochainement
    à sa fin ».


    Les fans argentins de Rosalía qui ont assisté mardi à son troisième concert de
    la tournée Lux à Buenos Aires ont chanté que « la patrie ne se vend pas » au milieu
    du débat sur l''étrangélisation du territoire dans le pays, car il s''agit d''un
    projet de loi que le gouvernement de Javier Milei cherche à promouvoir ce jeudi
    au Congrès. « Nous ne vendons pas, la patrie ne se vend pas », a chanté le public
    du troisième et avant-dernier spectacle de la chanteuse au Movistar Arena de la
    ville.


    Cette expression s''est produite en prévision du débat au Sénat sur la Loi de
    l''Inviolabilité de la Propriété Privée, une initiative gouvernementale qui, entre
    autres modifications de résonance, relâche les limites pour la vente de terres
    argentine aux étrangers. Pour ce jeudi, jour où les sénateurs débattront de l''initiative,
    une manifestation a été conviée qui verra la participation d''organisations sociales,
    syndicales, environnementales et universitaires, ainsi que de groupes politiques
    opposés au gouvernement.


    Devant le cantique de l''ensemble de l''arène, Rosalía a agité un drapeau au-dessus
    de sa tête, en signe d''encouragement. « C''est que vous êtes le meilleur public,
    c''est indéniable. Merci pour cette énergie toujours si haute », a déclaré l''auteure
    de Motomami qui, cependant, n''a donné aucun signe de comprendre le fond du cantique.


    La loi en vigueur établit, entre autres points, que les étrangers ne peuvent posséder
    plus de 15% du total des terres rurales au niveau national, provincial ou municipal,
    et qu''un même titulaire étranger ne peut avoir plus de 1 000 hectares dans la
    zone agricole centrale-est (centre-est de l''Argentine). Le projet, qui cherchera
    à obtenir l''approbation ce jeudi au Sénat, cherchera à élargir cette limite à
    25%. Les objections à la réforme se concentrent également sur la absence de limites
    spécifiques aux achats de propriétés dans des zones stratégiques, comme les frontières,
    les miroirs d''eau, les glaciers ou les zones littorales.'
