- title: Une frontière louée
  summary: "La situation de Ceuta est la facture d’un modèle de relation que l’UE\
    \ a choisi il y a exactement une décennie : l’externalisation des frontières,\
    \ c’est-à-dire sous-traiter le contrôle de ses propres limites à des pays voisins.\
    \ Quelle distance morale y a-t-il entre regretter aujourd’hui 140 noyés et avoir\
    \ construit pendant des années le dispositif qui rendait parfaitement prévisible\
    \ leur noyade ? Ceuta : de zombies, d’invasions et d’avalanches\n        Dès que\
    \ l’on a su ce qui se passait à Ceuta, la majorité de la droite espagnole, politique\
    \ et médiatique, s’est jetée à la gorge du gouvernement. C’est déjà presque un\
    \ réflexe, une sorte de ressort automatique qu’ils ont installé au moins depuis\
    \ que le PP a perdu la Moncloa en 2018. On dirait que c’est de la rancœur, mais\
    \ je crains qu’il s’agisse de quelque chose de plus simple : la conviction profondément\
    \ ancrée qu’ils ont naturellement le droit de gouverner l’Espagne et que tout\
    \ autre locataire est une anomalie qu’il faut corriger rapidement. Critiquer le\
    \ gouvernement est légitime toujours, mais c’est très contestable quand on le\
    \ fait sans avoir posé la moindre question sur ce qui se trouve devant soi.\n\
    \    \n        Nous nous plaignons beaucoup de la droite espagnole, mais c’est\
    \ que la droite européenne n’a pas voulu lever le nez non plus. L’Italie a imposé\
    \ des contrôles temporaires aux voyages venus d’Espagne, plusieurs ministres de\
    \ l’Intérieur ont ordonné de renforcer les passages de la frontière commune et\
    \ d’autres pays ont demandé la suspension de la participation espagnole à Schengen.\
    \ Tout cela concernait un territoire dont les citoyens de pays tiers ne peuvent\
    \ pas sortir vers la Péninsule – ni, par conséquent, vers le reste de l’espace\
    \ Schengen – sans contrôle d’identité et visa. C’est-à-dire : on a fait un grand\
    \ scandale contre un déplacement qui, par définition, ne pouvait pas se produire.\
    \ Absurde en réalité, mais à la fois symptôme de la profonde blessure du projet\
    \ européen.\n    \n        En revanche, ce qui s’est produit, c’est l’entrée de\
    \ quelque 70 000 personnes dans une ville de 83 000 habitants, chose qui ne se\
    \ produit que si derrière il y a un impulsion vitale insurmontable – comme fuir\
    \ une guerre – ou une décision politique qui favorise le mouvement. Le flux continu\
    \ existe, bien sûr, et il est alimenté par des milliers de personnes prêtes à\
    \ risquer leur vie pour atteindre des pays du Nord Global. Mais la manivelle qui\
    \ régule ce flux n’est pas entre les mains de ceux qui n’agissent pas, et le Maroc\
    \ a montré à plusieurs reprises qu’il savait ouvrir et fermer cette manivelle\
    \ selon son bon vouloir. De sorte que la question qui devait commencer tout examen\
    \ sérieux était autre : qu’est-ce que le Maroc demande maintenant à l’Espagne\
    \ et à l’Union européenne ?\n    \n        À l’absence d’informations vérifiées\
    \ propres aux services de renseignement, qui apparaissent publiquement comme notoirement\
    \ remis en question, il ne nous reste que de conjecturer. Mais cette conjecture\
    \ se fonde sur une histoire récente, ce qui la rend plus solide. Par exemple,\
    \ on sait que le Maroc poursuit depuis un demi-siècle le reconnu international\
    \ de sa souveraineté sur le Sahara occidental, et qu’il a constaté depuis un demi-siècle\
    \ que la pression frontalière fonctionne : en mai 2021, 8 000 personnes sont entrées\
    \ à Ceuta alors que le chef du Front Polisario était hospitalisé en Espagne, et\
    \ un an plus tard le gouvernement espagnol (le PSOE, en réalité) a fini par soutenir\
    \ le plan de autonomie marocain. Par hasard, ce qui s’est passé ces derniers jours\
    \ s’est produit peu de semaines après le voyage de Pedro Sánchez à Alger. Il y\
    \ a, outre cela, d’autres intérêts que le Maroc aspire à protéger, comme des pêcheurs,\
    \ agricoles, géopolitiques… et il sait qu’il le fait en comptant sur le soutien\
    \ politique de ses alliés aux États-Unis et d’Israël, qui sont actuellement en\
    \ conflit avec l’Espagne (et la dignité humaine, d’ailleurs). Quelle que soit\
    \ la motivation concrète de cette occasion, il semble clair que le Maroc sait\
    \ comment rappeler qu’il veut quelque chose de l’Espagne.\n    \n        Au fond,\
    \ la situation de Ceuta est la facture d’un modèle de relation que l’UE a choisi\
    \ délibérément il y a exactement une décennie : l’externalisation des frontières,\
    \ c’est-à-dire sous-traiter le contrôle de ses propres limites à des pays voisins.\
    \ La logique est que l’UE paie les polices du Maroc, de Libye, de Tunisie ou de\
    \ Turquie pour que la violence nécessaire pour contenir les gens se produise loin\
    \ des caméras européennes. C’était en 2016 que l’UE a signé l’accord avec la Turquie\
    \ qui s’appuyait précisément sur la transfert de 6 milliards d’euros en échange\
    \ de ne pas laisser passer les réfugiés qui fuient la guerre, relabelisés convenablement\
    \ dans le texte comme “immigrants illégaux”. Selon ce que Médecins sans Frontières\
    \ a dénoncé cette année, au cours de cette décennie, ils ont documenté de manière\
    \ répétée “la violence aux frontières, des camps surpeuplés, un entretien inadéquat,\
    \ un accès limité à la santé et un grave déclin de la santé mentale parmi les\
    \ personnes coincées dans ces conditions”.\n    \n        Malgré ces considérations\
    \ humanitaires, et bien que les pays membres ne respectent pas les engagements\
    \ de solidarité interne (comme le fait le PP dans le cas des Communautés Autonomes),\
    \ cette stratégie européenne est devenue la référence pour des accords avec d’autres\
    \ pays comme la Tunisie, la Libye, le Maroc ou l’Égypte. En le faisant, elle a\
    \ accordé à ces pays un pouvoir immense pour chantage à l’UE avec de nouvelles\
    \ pressions. Au fond, les immigrants continuent d’arriver aux frontières et seule\
    \ change la route qu’ils empruntent, devenue plus mortelle. En définitive, l’Europe\
    \ a payé pour regarder moins le drame en face et pour une nouvelle dépendance\
    \ géopolitique.\n    \n        Mais la droite ne frappe pas le gouvernement pour\
    \ tout cela. Au contraire, presque toutes les droites européennes ont réagi en\
    \ pensant uniquement à rentabiliser électoralement une situation qu’elles avaient\
    \ stimulée le peur de leurs électeurs. Il est probable que une grande partie de\
    \ cet électorat ne sait pas situer Ceuta sur une carte, mais cela n’avait pas\
    \ d’importance : il suffisait de la peur, amplifiée par des réseaux dont les propriétaires\
    \ ont des intérêts politiques déclarés – Elon Musk a comparé les migrants à la\
    \ foule de zombies de la film Guerre mondiale Z –, pour que la médaille se la\
    \ prenne la droite extrême et ses opérateurs internationaux. Il est possible que\
    \ de nombreux gouvernements européens, presque tous de droite, aient eu envie\
    \ du gouvernement espagnol pour son leadership international dans des questions\
    \ comme l’opposition au génocide en Palestine ou la guerre en Iran, mais il est\
    \ sûr que leur cortège électoral a pesé plus lourd.\n    \n        Et pendant\
    \ ce temps, la partie souffrante de l’humanité. Lorsque j’écris ces lignes, les\
    \ chiffres officiels parlent déjà de plus de 140 personnes noyées parmi les dizaines\
    \ de milliers qui sont entrées dans l’eau pour toucher une terre qui représentait\
    \ pour elles un avenir meilleur. L’immense majorité des survivants avait déjà\
    \ regagné le Maroc en quelques heures après avoir constaté qu’à Ceuta il n’y avait\
    \ ni nourriture ni endroit où dormir. L’opération se termine donc sans que rien\
    \ de substantiel ait changé, sauf que de nombreuses familles cherchent et enterrer\
    \ des êtres chers. C’étaient des gens ordinaires, partie de cette classe ouvrière\
    \ mondiale que les gouvernants et les entrepreneurs d’ici et d’ailleurs manipulent\
    \ comme des pions sur un échiquier, inutilisables par définition car toujours\
    \ plus. C’étaient des personnes"
