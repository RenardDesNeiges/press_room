- title: 'La Bolsa, un record por día: pourquoi l''Ibex confirme les 20.000 points
    et prolonge son rally historique'
  summary: 'L''indice boursier clôture à 20.057 points, soutenu par la banque et le
    bon momentum des résultats des entreprises, selon les experts, marquant une nouvelle
    étape d''une progression en hausse qui a dépassé le précédent plafond (16.000
    points, en 2007) il y a presque un an. Les grandes compagnies pétrolières réalisent
    93.000 millions de dollars de bénéfices au milieu de la guerre en Iran.


    La Bourse espagnole atteint un nouveau record par jour et s''installe au-dessus
    des 20.000 points. Après avoir franchi pour la première fois cette barrière, l''indice
    principal de la Bourse espagnole a de nouveau clôturé mercredi en records historiques,
    atteignant une valeur de 20.057 points. Avec une progression de 0,17%, il a consolidé
    un niveau qui, il y a seulement quelques jours, semblait inatteignable. L''indice
    prolonge ainsi une remontée qui a accumulé plus de 40% de valorisation au cours
    de l''année dernière, soutenue par la banque, des bénéfices des entreprises meilleurs
    que prévu et un nouveau regain d''intérêt des investisseurs pour la rente variable
    européenne.


    La séance a été marquée par les gains à Wall Street et par la continuité de l''optimisme
    sur les marchés malgré l''incertitude géopolitique en Moyen-Orient. Le pétrole,
    qui avait chuté mardi en raison des attentes d''un accord entre les États-Unis
    et l''Iran pour réouvrir le détroit d''Ormuz, a rebondi légèrement mercredi, tandis
    que l''Ibex a de nouveau enregistré de nouveaux maxima intraday et a enchaîné
    une nouvelle clôture historique.


    L''indice continue à se situer dans une zone inconnue : le record confirme un
    changement de cycle pour la Bourse espagnole. Après presque deux décennies sans
    dépasser les maxima atteints avant la crise financière, l''indice n''a pas seulement
    dépassé le plafond de 2007 en octobre dernier, mais il a réussi à s''installer
    au-dessus d''un seuil (20.000 points) qui pendant des années semblait inatteignable.


    Du bubble de 2007 à l''effondrement de la pandémie

    La remontée n''est pas due à un seul jour : l''indice a accumulé une remontée
    supérieure à 41% en moins de treize mois, depuis les 14.000 points d''il y a un
    an jusqu''aux maxima actuels. En 2025, c''était son meilleur annee dans ce siècle,
    avec une valorisation de 49%, juste dépassée par 54% en 1993. Et dans ce qui a
    été de 2026 (qui a commencé à 17.307 points), l''indice a déjà accumulé plus de
    15%.


    Le 8 novembre 2007, l''Ibex a marqué ce qui a été pendant presque deux décennies
    son maximum historique de clôture, à 15.945,70 points, poussé par l''essor du
    crédit et du secteur immobilier. Le lendemain, il a atteint un maximum intraday
    de 16.040,40 points, mais cette séance a fini par clôturer en baisse. Il y a à
    peine quelques mois, il a commencé une chute qui a effacé plus de la moitié de
    sa valeur avec la crise de Lehman Brothers, la récession et, ultérieurement, la
    crise de la dette de la zone euro.


    Ce record a fallu presque dix-huit ans pour tomber : il n''a été jusqu''au 27
    octobre 2025 quand l''Ibex a clôturé au-dessus des 15.945,70 points de 2007, à
    16.000,2 points, et peu après a dépassé également le maximum intraday de ce novembre.
    Depuis, l''indice n''a cessé d''enchaîner des maxima, jusqu''à atteindre les 20.000
    points de cette semaine.


    Entretemps, la pandémie a représenté un autre coup de grande envergure. En mars
    2020, avec le confinement mondial et la paralysie de l''activité économique, l''Ibex
    a perdu près de 40% de sa valeur en quelques semaines et est tombé jusqu''à 6.107
    points, son niveau le plus bas depuis 2012. Bien que la rétablissement a été rapide
    sur d''autres indices, le marché espagnol a pris plus de temps à se recomposer
    en raison du poids des secteurs particulièrement pénalisés, comme le tourisme,
    et de la faiblesse de la banque dans un environnement de taux négatifs.


    C''est précisément là que se trouve l''une des clés du moment actuel pour les
    experts. « La combinaison de bénéfices des entreprises solides, le leadership
    de la banque et des infrastructures, une valorisation attrayante par rapport à
    d''autres marchés et le retour du capital international vers l''Europe expliquent
    que l''Ibex ait atteint maintenant les 20.000 points », résume Javier Molina,
    analyste des marchés de eToro.


    Le poids de la banque

    Si il y a un protagoniste de la remontée boursière des dernières années, c''est
    le secteur financier. La composition de l''Ibex, traditionnellement critiquée
    pour sa forte dépendance aux banques et sa faible présence technologique, s''est
    transformée en cette occasion en une avantage.


    « Pendant presque une décennie, la banque a opéré avec des taux négatifs qui pénalisait
    énormément sa rentabilité. Aujourd''hui, le paysage est complètement différent,
    avec des marges financières beaucoup plus élevées », explique Manuel Pinto, analyste
    des marchés de XTB.


    Les successives hausses des taux du BCE depuis 2022 ont déclenché le bénéfice
    des intérêts des entités financières et permis de chaîner des bénéfices records.
    En conséquence, des banques comme Santander, BBVA, CaixaBank, Sabadell ou Unicaja
    ont été certains des grands moteurs de l''indice.


    Cependant, ce rôle de premier plan a une double lecture. Que le secteur financier
    représente environ 40% de l''Ibex a propulsé l''indice dans ce cycle, mais cela
    augmente également sa dépendance à un seul facteur : la politique monétaire du
    BCE.


    « Aujourd''hui, c''est une avantage parce qu''il coïncide avec le cycle, mais
    à long terme, cela augmente la dépendance de l''indice à un seul secteur et réduit
    sa diversification structurelle », avertit Molina.


    Pinto concorde avec ce diagnostic. Il considère que le principal risque est que
    un durcissement excessif de la politique monétaire finisse par freiner la demande
    de crédit et, avec, les bénéfices des entités financières.


    Dans ce bloc bancaire, il est également important de ne pas le traiter comme un
    tout homogène, comme le soulignent les experts. Les deux grands banquiers de l''Ibex,
    par exemple, suivent des stratégies de capital presque opposées. Santander a opté
    pour le croissance via des acquisitions (comme TSB ou Webster Financial), tandis
    que BBVA a privilégié de retourner le capital à ses actionnaires via des rachats
    et des amortissements d''actions.


    Plus que une rotation vers le ''value''

    Le bon comportement de l''Ibex ne peut pas être expliqué uniquement par le retour
    de l''appétit des investisseurs pour des secteurs traditionnels face aux grandes
    technologies américaines.


    Les analystes s''accordent à dire que la rotation internationale vers des sociétés
    considérées comme value (banques, énergie, industrie ou infrastructures) a favorisé
    particulièrement le marché espagnol, mais soulignent qu''il s''agit d''une corrente
    qui s''est appuyée également sur des résultats des entreprises solides.


    « La rotation internationale a agi comme catalyseur, mais il est difficile qu''elle
    ait eu le même impact si les sociétés espagnoles n''étaient pas présentant des
    résultats solides », soutient Pinto.


    Le croissance économique de l''Espagne, plus intense que prévu, le bon comportement
    de l''emploi, du tourisme et du consommation ont renforcé les bénéfices de bonne
    partie des cotisées. A cela s''ajoute l''amélioration des perspectives pour des
    sociétés liées'
