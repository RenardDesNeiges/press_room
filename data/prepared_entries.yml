editorial: 'Les ingérences russes dans les campagnes électorales française et suisse
  dominent l''actualité de ce mercredi, tandis que la Bourse espagnole signe un record
  historique et que la tragédie de Ceuta ravive le débat sur l''externalisation des
  frontières européennes. Trois sujets qui dessinent une journée où la géopolitique,
  l''économie et les droits humains s''entremêlent.


  Côté français, [Libération](https://www.liberation.fr/politique/philippe-attal-et-glucksmann-cibles-par-des-ingerences-russes0160-la-campagne-presidentielle-dans-les-enfumages-du-kremlin-20260805_PGG5P5HT2FBJ3NP7OEHHYLOL74/)
  révèle que Philippe, Attal et Glucksmann ont été ciblés par des opérations de désinformation
  russes sur les réseaux sociaux. L''article d''Arthur Louis souligne que ces trois
  prétendants à l''Élysée ont été victimes de campagnes coordonnées, alors qu''un
  projet de loi censé renforcer la dissuasion a été déposé en juillet au Sénat. La
  menace inquiète à gauche comme à droite, mais le journaliste note que ces ingérences
  s''inscrivent dans une stratégie plus large du Kremlin visant à déstabiliser le
  processus électoral français. Le quotidien met en perspective ces opérations avec
  le contexte géopolitique tendu, sans céder à la panique mais en appelant à la vigilance.
  La couverture médiatique de ces ingérences, il faut le souligner, tend à occulter
  d''autres formes de manipulation de l''information, notamment celles émanant de
  puissances occidentales ou de grands groupes privés – un biais que le lecteur attentif
  ne manquera pas de remarquer.


  En Suisse, [Le Temps](https://www.letemps.ch/articles/moscou-sermonne-le-conseil-federal-et-s-immisce-dans-la-campagne-sur-la-neutralite)
  rapporte une ingérence inédite dans la démocratie directe helvétique. La porte-parole
  du ministère russe des Affaires étrangères, Maria Zakharova, a publié sur Telegram
  un réquisitoire contre la conception de la neutralité d''Ignazio Cassis, apportant
  son soutien à l''initiative de Christoph Blocher pour une neutralité «intégrale».
  Le même jour, Russia Today a relayé le propos en français et en allemand. Frédéric
  Koller souligne que Moscou considère que la Suisse n''est plus neutre depuis sa
  décision de reprendre les sanctions européennes après l''invasion de l''Ukraine.
  Cette prise de position russe dans le débat interne suisse est d''autant plus notable
  qu''elle survient à quelques jours de la votation sur l''initiative. Le quotidien
  zurichois NZZ a d''ailleurs publié une traduction intégrale du texte de Zakharova,
  à titre «exceptionnel», pour permettre aux lecteurs de se forger leur propre opinion.
  Cette ingérence russe dans la campagne sur la neutralité illustre la porosité croissante
  entre politique intérieure et géopolitique, mais il convient de rappeler que d''autres
  puissances, y compris les États-Unis et l''UE, n''hésitent pas à peser sur les choix
  politiques helvétiques par des moyens plus discrets.


  Sur le plan économique, [El Diario](https://www.eldiario.es/economia/bolsa-record-dia-ibex-consolida-20-000-puntos-prolonga-rally-historico_1_13429090.html)
  consacre un long article à la Bourse espagnole qui a franchi la barre des 20.000
  points, un niveau jamais atteint. Lucía Llargués explique que l''Ibex a clôturé
  à 20.057 points, soutenu par la banque et des résultats d''entreprises meilleurs
  que prévu. Ce record intervient après une progression de plus de 40% sur un an,
  portée par la remontée des taux du BCE qui a dopé les marges des banques espagnoles.
  L''article analyse les risques de cette concentration sectorielle : le secteur financier
  représente environ 40% de l''indice, ce qui le rend vulnérable à un durcissement
  de la politique monétaire. Les analystes cités par le quotidien pointent également
  la dépendance à la rotation internationale vers les valeurs «value» et la solidité
  des fondamentaux économiques espagnols. Cette euphorie boursière contraste avec
  la réalité des inégalités et la précarité qui persistent dans le pays, un écart
  que le journal de gauche ne manque pas de souligner en filigrane. La hausse des
  actions est certes un signe de santé pour les détenteurs de capital, mais elle ne
  dit rien de la situation des travailleurs espagnols, toujours marqués par la précarité
  et la faiblesse des salaires.


  Enfin, la tragédie de Ceuta fait l''objet d''une analyse approfondie dans [El Diario](https://www.eldiario.es/opinion/zona-critica/frontera-alquilada_129_13429199.html).
  Alberto Garzón Espinosa, ancien ministre et économiste, y dénonce l''externalisation
  des frontières de l''UE, un modèle choisi il y a une décennie avec l''accord UE-Turquie
  de 2016. Il rappelle que plus de 140 personnes se sont noyées lors de la tentative
  d''entrée massive à Ceuta, et que l''UE a payé des milliards à des pays comme le
  Maroc, la Libye ou la Tunisie pour contenir les migrants loin des caméras européennes.
  L''auteur souligne le cynisme des droites européennes qui instrumentalisent la peur
  des migrants, citant Elon Musk qui a comparé les migrants à des zombies. Il pointe
  également le rôle du Maroc, qui utilise la pression migratoire comme levier diplomatique,
  notamment sur la question du Sahara occidental. Cette analyse rejoint les préoccupations
  du lecteur sur les droits humains et les régimes migratoires coloniaux. La couverture
  médiatique de Ceuta, largement dominée par une approche sécuritaire dans les médias
  dominants, mérite d''être lue à travers ce prisme critique – d''autant que les victimes
  de ces politiques sont presque toujours invisibilisées.


  Ces trois sujets, apparemment distincts, sont en réalité liés par une même logique
  : la défense d''un ordre occidental qui, sous couvert de lutte contre les ingérences
  étrangères, externalise la violence aux frontières et laisse les marchés financiers
  dicter les priorités économiques. Dans les prochains jours, il faudra surveiller
  les réactions officielles françaises et suisses face aux manœuvres russes, mais
  aussi l''évolution de l''Ibex et les conséquences humanitaires de la crise de Ceuta.
  Le Kremlin n''est pas la seule menace pour les démocraties ; les politiques d''austérité
  et de fermeture des frontières, elles, ne font pas la une des journaux.'
title: Ingérences russes et démocraties menacées
