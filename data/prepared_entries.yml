- title: 'Ceuta, Maroc et Europe : les conséquences d’un régime migratoire colonial
    et raciste'
  summary: 'Comprendre ce qui s''est passé comme un simple chantage du Maroc à l''Espagne
    est une simplification de la réalité. C''est la conséquence du régime migratoire
    euro-marocain construit sur des structures héritées du colonialisme, dans lequel
    l''Europe détermine qui peut se déplacer et qui ne peut pas, en fonction de hiérarchies
    raciales. Le rêve de Faten, la footballeuse marocaine qui a perdu la vie au passage
    à Ceuta : "Je voulais aller en Europe".


    Ce qui s''est passé à Ceuta ces jours-ci n''est pas seulement une crise migratoire
    ou humanitaire, mais aussi une crise politique entre pays voisins. Les relations
    entre l''Espagne et le Maroc sont formées par une riche toile d''intérêts mutuels
    dans des domaines comme la sécurité, la migration ou le commerce, mais aussi par
    une série de conflits structurels, irrésolus à court ou moyen terme, comme le
    Sahara Occidental ou les enclaves africaines de Ceuta et Melilla.


    Au cours des dernières décennies, la politique espagnole envers le Maroc s''est
    basée sur ce qu''on appelle le coussin d''intérêts, qui synthétisait une équation
    simple : plus l''interdépendance est grande, plus la crise bilatérale est coûteuse
    et moins probable. Pendant longtemps, le coussin d''intérêts a réduit significativement
    les crises, bien qu''il n''ait pas réussi à les éliminer. Ce équilibre était toujours
    instable, mais maintenant il s''est rompu. Le rôle du Maroc a changé considérablement
    : il a des aspirations de puissance régionale, une politique étrangère plus affirmée
    et une vaste expérience de négociation avec l''Espagne et l''Union européenne
    dans le domaine de la migration, combinant habilement diplomatie et coercition.
    Cela a rendu l''interdépendance de plus en plus asymétrique en faveur du Maroc,
    ce qui encourage le renforcement de crises bilatérales.


    Cela dit, comprendre ces crises comme une simple négociation transactionnelle
    ou un simple chantage du Maroc à l''Espagne et à l''Union européenne est une simplification
    de la réalité. Pour comprendre leur nature et leurs caractéristiques, et pour
    les prévenir, il est nécessaire de voir qu''ils ne sont pas des épisodes isolés,
    mais des conséquences du régime migratoire euro-marocain. Ce régime migratoire
    a été construit sur des structures et des relations de pouvoir héritées du colonialisme,
    dans lesquelles l''Europe continue de déterminer qui peut se déplacer et qui ne
    peut pas, en fonction de hiérarchies raciales. Le système des visas et les étiquettes
    que nous mettons aux personnes voyageant en sont de bons exemples. Si un européen
    voyage en Afrique, il peut le faire librement et sans visa. Cependant, si un africain
    voyage en Europe, il rencontrera des restrictions et devra obtenir un visa très
    difficile à obtenir. Aux yeux des européens, on l''appelle touriste ou expatrié.
    Aux yeux des africains, on l''appelle immigré, illégal, clandestin ou MENA, des
    catégories couramment utilisées pour déshumaniser, criminaliser et polariser.


    De plus, cette hiérarchie raciale de la mobilité génère une violence structurelle
    qui provoque des milliers de morts chaque année et transforme la frontière en
    un espace d''exception pour les démocraties européennes. Selon le projet Missing
    Migrants de l''Organisation internationale pour les migrations, depuis 2014, plus
    de 33 000 personnes ont été comptabilisées parmi les morts ou disparues sur les
    différentes routes migratoires et frontières européennes. En moyenne, 2 350 morts
    par an. Ainsi, il n''est pas exagéré parler de néropolitique, comme le fait l''intellectuel
    camerounais Achille Mbembe, qui affirme que les européens s''habituent à la mort
    des migrants car leurs vies ne méritent pas de protection et n''ont pas la même
    valeur. Ces morts ne méritent pas de deuil. Une preuve en est que, avec 141 morts
    sur notre frontière, l''Espagne n''a pas décrété un seul jour de deuil national.
    On se demande bien pourquoi, par exemple, avec un accident ferroviaire ou un incendie,
    on n''aurait pas une telle attitude.


    Si un européen voyage en Afrique, il peut le faire librement et sans visa. Cependant,
    si un africain voyage en Europe, il rencontrera des restrictions et devra obtenir
    un visa très difficile à obtenir. Aux yeux des européens, on l''appelle touriste
    ou expatrié. Aux yeux des africains, on l''appelle immigré, illégal, clandestin
    ou MENA.


    La matrice coloniale du régime migratoire et sa hiérarchie raciale expliquent
    l''agenda européen de transformer le Maroc en un espace de contenance de la migration
    vers l''Europe par des politiques d''externalisation. Comme dans l''époque des
    empires, l''Europe continue de recourir à des formules de souveraineté extra-territoriale,
    aujourd''hui incompatible avec le principe d''égalité de souveraineté des États.
    La croissante résistance marocaine à jouer le rôle de policier des frontières
    pour l''Europe peut être interprétée également comme un questionnement de cette
    matrice de pouvoir colonial. Pourquoi les espagnols peuvent voyager sans visa
    au Maroc et les marocains doivent un visa pour voyager en Espagne ? N''opère-t-on
    pas le principe de réciprocité ? Il est légitime de questionner cette asymétrie
    par la diplomatie, mais pas par la coercition.


    L''instrumentalisation de la migration par le Maroc peut être comprise comme une
    forme de déséquilibrer les hiérarchies historiques qui ont structuré le régime
    migratoire entre l''Europe et le Maroc. Mais évidemment, c''est aussi une forme
    de pression politique. Lorsque le Maroc perçoit que ses intérêts stratégiques
    sont menacés (comme pourrait l''être par l''approbation future de la loi qui accordera
    la nationalité espagnole aux sahraouis nés pendant la période de la colonie espagnole),
    il dispose de la capacité d''instrumentaliser les flux migratoires, dans la logique
    que Kelly Greenhill définit comme l''ingénierie stratégique des migrations. Selon
    la vision marocaine, une bonne façon de défendre ses intérêts est d''activer l''une
    de ses leviers les plus précieux (ou sa rente politique, comme certains la nomment),
    en instrumentalisant ces flux migratoires.


    Les migrations internationales font partie des structures et des relations de
    pouvoir qui génèrent des inégalités entre les pays. De plus, les décisions migratoires
    sont une combinaison de facteurs de poussée et de facteurs d''attraction. Cette
    crise combine tous les éléments indiqués : la matrice coloniale du régime migratoire,
    la hiérarchie raciale de la mobilité, les facteurs de poussée (la situation intérieure
    au Maroc, où le slogan de la Génération Z était "deux mers et phosphore et nous
    vivons sous la botte" - en relation avec les conditions de vie malgré les richesses
    naturelles du pays) et les facteurs d''attraction (comme des conditions économiques
    meilleures en Europe ou des politiques migratoires plus libérales, entre autres).


    L''instrumentalisation de la migration par le Maroc peut être comprise comme une
    forme de déséquilibrer les hiérarchies historiques du régime migratoire entre
    l''Europe et le Maroc. Mais évidemment, c''est aussi une forme de pression politique.


    De son côté, la droite radicale globale profite de chaque crise migratoire pour
    renforcer une vision de société de plus en plus répandue hobbesienne, présentée
    comme une lutte permanente pour des ressources limitées entre des groupes culturellement
    incompatibles. Selon cette perspective, l''immigration est construite comme une
    menace pour la sécurité, le bien-être et l''identité, légitimant des politiques
    de plus en plus restrictives, exclusives et sécuritaires. Il est alarmant la fragmentation
    européenne dans cette crise. Comme l''a souligné Josep Borrell, "la solidarité
    européenne a été tuée à Ceuta". Peut-être qu''elle n''a jamais été vivante.


    Nous devons déscoloniser le régime migratoire européen, surpassant les logiques
    de sécurisation, d''externalisation et de hiérarchisation raciale de la mobilité
    qui reproduisent la matrice coloniale du pouvoir. Une politique migratoire européenne
    commune basée'
  media: https://static.eldiario.es/clip/62ff1c3d-bb62-4895-a217-e984eafa112d_16-9-discover-aspect-ratio_default_0.jpg
  url: https://www.eldiario.es/internacional/ceuta-marruecos-europa-consecuencias-regimen-migratorio-colonial-racista_129_13430144.html
