- title: L'ex-ministre du PP José Manuel Soria s'attaque aux 5 millions facturés avec
    sa consultante d'entreprises
  summary: 'La firme Sorben Partners, que creó poco después de dimitir por los Papeles
    de Panamá en 2016, facturó 408.228 euros en 2025 y este año puede superar los
    5 millones desde que arrancó. Así van todas las puertas giratorias que atravesó
    el exministro Soria después de denunciar las trapisondas de Montoro.


    El exministro del PP José Manuel Soria ha facturado ya más de 4,5 millones de
    euros con Sorben Partners SL, la consultora de empresas que puso en marcha hace
    casi una década, tras dimitir como ministro de Industria y abandonar la política
    en abril de 2016 por el escándalo de los Papeles de Panamá y la aparición de una
    empresa familiar en el paraíso fiscal de Jersey.


    Sorben facturó en el ejercicio 2025 un total de 408.228 euros, un 12% más, con
    un beneficio de 66.513 euros, según las cuentas que acaba de remitir al Registro
    Mercantil, disponibles a través de Insight View. Teniendo en cuenta su cifra de
    negocios anual media desde 2018 (más de medio millón al año), en 2026 va a enfilar
    los 5 millones facturados desde que empezó a operar.


    El nombre de esta empresa de Soria utiliza una fórmula parecida a la de la sociedad
    familiar que creó su admirado José María Aznar (con el que el canario guarda gran
    parecido físico) cuando abandonó la Moncloa.


    Así, si la patrimonial del expresidente del Gobierno (quien acaba de superar los
    5 millones de dólares cobrados solo como consejero del gigante mediático News
    Corp, al que Aznar asesora hace 20 años) es el acrónimo de Familia Aznar Botella,
    Sorben bebe de los apellidos de Soria y de su esposa, Carmen Benítez. Esta última,
    procuradora de los tribunales, trabajaba para empresas reguladas por su marido,
    como Endesa, Orange y Telefónica, cuando él era ministro de Industria, Energía
    y Turismo.


    Sorben Partners se dedica a asesorar a empresas en expansión nacional e internacional.
    Su objeto social es el “asesoramiento y consultoría para la expansión nacional
    e internacional de empresas, facilitando soluciones comerciales, financieras,
    jurídicas, técnicas y fiscales a tales efectos, incluyendo la realización de estudios
    de mercados”. No tiene página web y no detalla en sus cuentas quiénes son sus
    clientes.


    La firma llegó a facturar en su mejor año (2019) cerca de 900.000 euros. Desde
    que se creó hasta diciembre del año pasado la consultora ha facturado en total
    4.550.663,14 euros.


    Esta cifra multiplica por 60 los 76.320 euros brutos anuales que el expolítico
    canario cobró en su último año completo al frente de Industria. El año pasado
    la firma solo tenía un empleado, frente a los cuatro con los que llegó a contar
    en 2019. Su activo ascendía a casi 850.000 euros. La partida de “inversiones financieras
    a largo plazo” (de las que no da ninguna información) se disparó el pasado ejercicio
    al pasar de 200.000 euros a casi medio millón.


    Su administrador único es el exministro, que se autoasignó en 2018 un sueldo de
    235.000 euros como administrador de Sorben Partners. En 2025 esa cifra fue sensiblemente
    inferior, de 156.000 euros.


    “El valor de las percepciones convenidas ha de coincidir con el valor de mercado,
    por lo que se han calculado en al menos el 75% del resultado derivado de los ingresos
    y gastos estrictamente de la actividad profesional y previo a la deducción de
    las retribuciones del socio profesional”, explica la firma en sus cuentas.


    Soria, de 68 años, fue alcalde de Las Palmas de Gran Canaria (1995-2003), presidente
    del Cabildo Insular de Gran Canaria (2003-2007), vicepresidente del Gobierno de
    Canarias y consejero de Economía y Hacienda (2007-2010), además de ministro desde
    finales de 2011 hasta su dimisión.


    El expolítico canario constituyó su consultora el 25 de noviembre de 2016, solo
    dos meses después de que el Gobierno de Mariano Rajoy, y en concreto su amigo
    personal Luis de Guindos, abortase a última hora su intención de designarle como
    director ejecutivo del Banco Mundial dentro del cupo asignado a España en esta
    institución. Allí habría tenido una retribución de 226.000 euros al año, libres
    de impuestos.


    Dinero perdido en política


    El canario, que durante su etapa en política llegó a quejarse de haber perdido
    dinero al dedicarse a esta actividad, es técnico comercial y economista del Estado
    (''teco'', en el argot funcionarial) de la misma promoción que Guindos, aunque
    apenas ejerció como tal.


    Su consultora inició sus operaciones el 1 de febrero de 2017, una vez que Soria
    obtuvo la preceptiva autorización de la Oficina de Conflictos de Intereses para
    ejercer actividades privadas y renunció a su indemnización como exministro. Por
    esas fechas, la justicia desestimó una demanda que Soria presentó contra elDiario.es
    por revelar que un empresario hotelero amigo le regaló varias noches en la suite
    presidencial de un hotel de cinco estrellas en Punta Cana cuando era ministro.


    A los pocos meses, en 2018, Soria empezó a colaborar con la firma internacional
    de consultoría Grant Thornton, de la que pasó a ser socio en Canarias en 2021.
    También en 2018, el que fuera ministro de Industria de España durante el estallido
    del escándalo de manipulación de emisiones conocido como dieselgate se convirtió
    en consejero de Domingo Alonso Group.


    Esta empresa canaria, a la que sigue asesorando en la actualidad, es importador
    y distribuidor de Volkswagen en el archipiélago (además de Andorra, Panamá y otros
    mercados internacionales como Colombia, Cuba y Venezuela). El exministro es también
    “miembro del Consejo Asesor de diferentes compañías de los sectores energético,
    financiero, infraestructuras, digitalización, turístico e industrial”, según explica
    él mismo en la web de Grant Thornton.


    El canario, que en su mandato en Industria impulsó el conocido como impuesto al
    sol para bloquear el autoconsumo y aprobó un duro recorte retroactivo a las renovables
    que aún colea (en forma de condenas multimillonarias contra el Reino de España
    tras las denuncias de inversores extranjeros), se convirtió en 2021 en presidente
    para España de Island Green Power. Esta empresa británica tiene más de 300 megavatios
    (MW) fotovoltaicos operativos en Aragón, Andalucía y Baleares, según su web.


    También es senior advisor del fondo Alantra, que pilota Santiago Eguidazu (''teco'',
    como él), consejero de la hotelera canaria Servatur y, desde hace dos años, asesor
    de Forestalia.


    Esta firma de renovables, perteneciente al controvertido empresario aragonés Fernando
    Samper, empezó a ser conocida en el sector al irrumpir en la subasta de renovables
    que el Gobierno de Rajoy adjudicó en enero de 2016, cuando Soria todavía era ministro.
    Forestalia está siendo investigada por lograr supuestamente que el Ejecutivo de
    Pedro Sánchez y el de Aragón dieran visto bueno a sus proyectos a cambio de presuntas
    mordidas.'
