editorial: 'La journée est marquée par un faisceau de tensions géopolitiques : un
  drone explosif découvert à Leipzig, des contre-mesures chinoises face aux États-Unis
  et une campagne présidentielle française saturée par les accusations d’ingérence.


  L’actualité française est d’abord politique. [Libération](https://www.liberation.fr/politique/philippe-attal-et-glucksmann-cibles-par-des-ingerences-russes0160-la-campagne-presidentielle-dans-les-enfumages-du-kremlin-20260805_PGG5P5HT2FBJ3NP7OEHHYLOL74/)
  affirme que Philippe, Attal et Glucksmann ont été ciblés par des « opérations russes
  de désinformation » sur les réseaux sociaux ; le quotidien rappelle qu’un projet
  de loi durcissant la réponse a été déposé au Sénat en juillet. Le journal [donne
  aussi la parole à Marine Tondelier](https://www.liberation.fr/politique/ingerences-etrangeres-marine-tondelier-demande-linterdiction-de-x-source-de-fake-news-a-lalgorithme-pipe-20260805_526AOJ6MTFCSJAWFRFUY6ERY5A/),
  qui réclame l’interdiction de X, « source de fake news » à l’« algorithme pipé ».
  Ce thème de l’ingérence, très présent dans la presse occidentale, doit être lu avec
  distance : les faits proviennent encore largement de signalements et d’analyses
  dont la vérification indépendante reste difficile. Pendant ce temps, [Mediapart](https://www.mediapart.fr/journal/politique/050826/la-primaire-15-euros-divise-un-peu-plus-le-ps)
  montre le PS divisé sur le coût de la primaire : 15 euros, jugés prohibitifs par
  le camp Faure, qui accuse le camp Glucksmann de verrouiller le scrutin. À Agde,
  [Libération](https://www.liberation.fr/politique/ta-chicha-et-ta-musique-on-nen-veut-pas-la-mairie-rn-dagde-retire-une-affiche-jugee-discriminante-20260806_IRO6ZM22EVFYNJG4NRKXULLCPI/)
  relate le retrait d’une affiche de la mairie RN, générée par IA, jugée discriminante.
  [Mediapart](https://www.mediapart.fr/journal/france/060826/corse-le-flnc-uc-menace-les-non-corses-venant-vivre-sur-l-ile-l-antiterrorisme-saisi),
  avec l’AFP, signale que le FLNC-UC menace les non-Corses et que l’antiterrorisme
  a été saisi. Le même média [alerte](https://www.mediapart.fr/journal/france/060826/des-milliers-de-places-d-hebergement-d-urgence-menacees-paris-pour-des-raisons-budgetaires)
  sur des milliers de places d’hébergement d’urgence menacées à Paris après une baisse
  annoncée des financements de l’État. [Libération](https://www.liberation.fr/politique/suicides-et-tentatives-a-matignon-mis-en-cause-les-services-du-premier-ministre-donnent-leur-version-des-faits-20260805_JI3K4NCY2FDPBGTJ3XM2Y6L24M/)
  revient sur les suicides à Matignon et la réponse des services du Premier ministre,
  et [sur l’Institut pratique du journalisme](https://www.liberation.fr/politique/comme-sil-navait-pas-fait-de-geste-illegal-a-linstitut-pratique-du-journalisme-tensions-apres-les-saluts-nazis-dun-etudiant-20260806_VY5H3SCTYNEHXDWSRUQRL5A2OA/),
  sur la sanction jugée trop clémente après des saluts nazis d’un étudiant.


  En Suisse, le débat sur la neutralité est percuté par Moscou. [Le Temps](https://www.letemps.ch/articles/moscou-sermonne-le-conseil-federal-et-s-immisce-dans-la-campagne-sur-la-neutralite)
  rapporte que Maria Zakharova, porte-parole du ministère russe des affaires étrangères,
  a publié sur Telegram un réquisitoire contre Ignazio Cassis, soutenant l’initiative
  de Christoph Blocher pour une « neutralité intégrale » ; le texte a été repris par
  Russia Today. Le même quotidien [publie un entretien](https://www.letemps.ch/articles/albert-rosti-sur-les-coupes-dans-l-adaptation-des-forets-je-ne-peux-pas-justifier-cette-decision-sur-le-fond-ces-moyens-sont-necessaires)
  avec Albert Rösti, qui admet ne pas pouvoir justifier la coupe de 25 millions dans
  l’adaptation des forêts et annonce une nouvelle loi CO₂. [La Tribune de Genève](https://www.tdg.ch/rapport-larmee-suisse-est-mal-preparee-en-cas-de-guerre-888510203019)
  révèle qu’un rapport du Contrôle fédéral des finances épingle les failles logistiques
  de l’armée suisse en cas de conflit. [24 heures](https://www.24heures.ch/secheresse-en-suisse-des-centaines-de-milliers-de-poissons-morts-565011553129)
  mesure la sécheresse : des centaines de milliers de poissons meurent dans les rivières.
  Sur le plan économique, [La Tribune de Genève](https://www.tdg.ch/lufthansa-le-groupe-gonfle-ses-prix-grace-a-son-monopole-en-suisse-801292329145)
  montre que Lufthansa profite de son quasi-monopole pour augmenter les prix à Genève
  et Zurich ; [Swisscom](https://www.tdg.ch/swisscom-le-benefice-grimpe-grace-a-la-hausse-des-tarifs-727319130958)
  affiche 668 millions de bénéfice net semestriel après ses hausses de tarifs ; [la
  NZZ](https://www.nzz.ch/schweiz/so-stimmten-die-eingebuergerten-bei-der-initiative-zur-10-millionen-schweiz-ld.10017615)
  explique que les citoyens naturalisés ont massivement contribué à faire échouer
  l’initiative de l’UDC sur une Suisse de 10 millions, un revers pour la droite nationaliste.
  [24 heures](https://www.24heures.ch/chomage-legere-hausse-en-juillet-le-taux-passe-a-3-872634288526)
  note enfin que le chômage a légèrement monté en juillet et que les postes vacants
  reculent.


  En Europe, l’Allemagne alerte sur une « nouvelle dimension de menace » après la
  découverte d’un drone porteur d’un engin explosif à l’aéroport de Leipzig, hub logistique
  pour l’Otan, rapporte [Mediapart et l’AFP](https://www.mediapart.fr/journal/international/060826/drone-explosif-leipzig-l-allemagne-alerte-sur-une-nouvelle-dimension-de-menace).
  [Le Grand Continent](https://legrandcontinent.eu/fr/2026/08/05/attentat-de-berlin-tournant-sahelien-du-djihad-europeen/)
  publie par ailleurs de nouveaux documents sur l’attentat de Berlin, qui signaleraient
  un tournant sahélien du djihad européen. En Suède, [la NZZ](https://www.nzz.ch/international/streik-gegen-tesla-in-schweden-warum-der-widerstand-scheitert-ld.10018291)
  consacre un reportage à la grève contre Tesla : elle dure depuis plus de deux ans,
  n’a rien apporté et des syndicalistes changent de camp. En Espagne, [El Diario](https://www.eldiario.es/internacional/ceuta-marruecos-europa-consecuencias-regimen-migratorio-colonial-racista_129_13430144.html)
  décrypte la crise de Ceuta comme le produit d’un régime migratoire euro-marocain
  « colonial et raciste », tandis qu’[El Pais](https://elpais.com/economia/2026-08-06/la-aportacion-clave-de-la-comunidad-marroqui-en-espana-las-remesas-son-criticas-para-marruecos.html)
  souligne l’importance des transferts d’argent du Maroc : plus de 1 % du PIB du royaume.
  Le même journal [relève](https://www.eldiario.es/economia/bolsa-record-dia-ibex-consolida-20-000-puntos-prolonga-rally-historico_1_13429090.html)
  le record de l’Ibex au-dessus de 20 000 points, porté par les banques ; [El Diario](https://www.eldiario.es/economia/exministro-pp-jose-manuel-soria-enfila-5-millones-facturados-consultora-empresas_1_13420609.html)
  révèle que l’ex-ministre du PP José Manuel Soria approche les 5 millions d’euros
  facturés par sa société de conseil créée après les Panama Papers. [El Pais](https://elpais.com/economia/2026-08-06/la-ue-se-suma-a-la-ola-proteccionista-con-varias-normas-que-favorecen-a-las-empresas-europeas-frente-a-las-de-terceros-paises.html)
  note que l’UE adopte à son tour des normes protectionnistes favorisant les entreprises
  européennes.


  La guerre commerciale s’intensifie entre Washington et Pékin. [La NZZ](https://www.nzz.ch/wirtschaft/trump-und-zoelle-aktuelle-news-und-hintergruende-ld.1869433)
  indique que l’administration Trump veut imposer 15 % de droits de douane sur le
  polysilicium, après une décision de la Cour suprême jugeant ses tarifs illégaux.
  [Cubadebate](http://www.cubadebate.cu/noticias/2026/08/05/china-anuncia-contramedidas-necesarias-ante-restricciones-tecnologicas-de-estados-unidos/)
  relaie l’annonce chinoise de « contre-mesures nécessaires » : des contrôles sur
  les exportations de biens liés aux drones vers les États-Unis. Le même média [rapporte](http://www.cubadebate.cu/noticias/2026/08/06/trump-arremete-contra-el-comunismo-y-advierte-a-los-estadounidenses-de-una-vida-en-el-infierno/)
  les propos de Donald Trump, qui présente le communisme comme la plus grande menace
  de l’histoire américaine. Aux États-Unis, [Mediapart](https://www.mediapart.fr/journal/international/050826/dans-le-michigan-la-gauche-progressiste-renforce-ses-positions-avant-les-midterms)
  suit la poussée de la gauche progressiste dans le Michigan, avec les victoires d’Abdul
  el-Sayed et William Lawrence aux primaires ; [Le Grand Continent](https://legrandcontinent.eu/fr/2026/08/06/la-rougeole-explose-aux-etats-unis-de-donald-trump/)
  s’inquiète de la pire épidémie de rougeole depuis trente-cinq ans, face à l’inaction
  de Robert F. Kennedy Jr. Au Moyen-Orient, [Mediapart et l’AFP](https://www.mediapart.fr/journal/international/060826/l-iran-dit-s-etre-accorde-avec-oman-sur-ormuz-mais-la-reouverture-dependra-de-washington)
  rapportent que l’Iran s’est accordé avec Oman sur un itinéraire de transit dans
  le détroit d’Ormuz, mais que la réouverture dépendra de Washington ; face au risque
  de guerre en Iran, [la SSR](https://www.srf.ch/news/schweiz/wegen-iran-krieg-sorge-vor-gas-mangellage-taskforce-soll-loesungen-suchen)
  indique que les réservoirs de gaz européens, auxquels la Suisse est liée, ne sont
  pas pleins. En Ukraine, [Le Grand Continent](https://legrandcontinent.eu/fr/2026/08/06/lukraine-peut-elle-gagner-la-guerre-aux-entrepots/)
  analyse la stratégie ukrainienne contre les entrepôts russes, tandis que [la NZZ](https://www.nzz.ch/international/wirren-bei-russlands-drohnentruppen-putin-nimmt-eine-rochade-bei-seinen-generaelen-vor-ld.10018328)
  décrit des remous au sein des troupes de drones russes, avec un changement de commandement.
  Dans le Sud, [Mediapart](https://www.mediapart.fr/journal/international/060826/intimidations-faux-pv-prison-les-rouages-de-la-repression-de-la-genz-marocaine)
  documente la répression du mouvement GenZ au Maroc, avec intimidations, faux PV
  et prison ; [El Diario](https://www.eldiario.es/cultura/musica/fans-argentinos-rosalia-cantan-milei-patria-no-vende-concierto-buenos-aires_1_13431364.html)
  raconte comment, à Buenos Aires, les fans de Rosalía ont chanté « la patrie ne se
  vend pas » contre la loi Milei sur la vente de terres aux étrangers ; [Granma](http://www.granma.cu/cuba/2026-08-05/bloqueo-de-ee-uu-impacta-fuertemente-el-acceso-a-medicamentos-esenciales-05-08-2026-10-08-58)
  dénonce l’impact du blocus américain sur l’accès aux médicaments à Cuba ; [Cubadebate](http://www.cubadebate.cu/noticias/2026/08/06/quiero-derrotarlos-a-todos-juntos-lula-desafia-a-rubio-a-hacer-campana-por-bolsonaro/)
  rapporte le défi de Lula à l’administration américaine, qui pourrait faire campagne
  pour Bolsonaro. La journée confirme un durcissement global : les États se préparent
  à des conflits économiques et militaires, pendant que les inégalités sociales et
  les répressions nourrissent des résistances, des grèves aux concerts. Reste à surveiller
  les suites des annonces d’Ormuz, des contre-mesures chinoises et de la réponse européenne
  aux tarifs américains.'
title: Tensions géopolitiques montantes
