- title: Al menos 141 personas han muerto en el intento de entrada a Ceuta, según
    la ONG Caminando Fronteras
  summary: "Desde la organización apuntan que las personas fallecidas no solo son\
    \ de nacionalidad marroquí, sino que también procedentes de Sudán, Eritrea, Guinea\
    \ y Costa de MarfilEspaña arranca a la UE un respaldo expreso por la crisis de\
    \ Ceuta y consigue aplacar las críticas de sus socios\n        Al menos 141 personas\
    \ han muerto en Ceuta y Marruecos entre el 30 de julio y el 4 de agosto en el\
    \ intento de entrar a España, según el recuento de la ONG Caminando Fronteras,\
    \ que está haciendo un seguimiento de los casos y tratando de contactar con las\
    \ familias. El Gobierno español ha cifrado en 75 las personas muertas en la costa\
    \ ceutí.\n    \n        Desde la organización apuntan a elDiario.es que las personas\
    \ fallecidas no solo son de nacionalidad marroquí, sino que también procedentes\
    \ de Sudán, Eritrea, Guinea y Costa de Marfil. “Estamos colaborando con las familias\
    \ en las identificaciones”, señala a elDiario.es la organización, que prevé que\
    \ la cifra de personas muertas “irá subiendo”.\n    \n        Más de medio millar\
    \ de migrantes, sobre todo subsaharianos, permanecen aún en el exterior del Centro\
    \ de Estancia Temporal de Inmigrantes (CETI) de Ceuta para poder ocupar una plaza\
    \ en este recinto, que está colapsado al haber cubierto sus 512 plazas.\n    \n\
    \        El presidente de Ceuta, Juan Jesús Vivas, ha indicado que la ciudad autónoma\
    \ está atendiendo en estos momentos a unos 1.100 menores migrantes y ha asegurado\
    \ que se están realizando traslados de niños y niñas no acompañados a la Península,\
    \ por lo que ha defendido que están “cumpliendo la ley”.\n    \n        La Unión\
    \ Europea dio por superada este martes la emergencia en Ceuta después de que 72.000\
    \ personas migrantes ingresaran en la ciudad autónoma de Ceuta y más de 70.000\
    \ fueran retornados a Marruecos, según cifras oficiales, en una situación que\
    \ parte de la derecha y la extrema derecha aprovecharon para criticar las políticas\
    \ del Gobierno español.\n    \n        “Por el momento, creo que Europa ha superado\
    \ definitivamente esta prueba”, aseguró el comisario europeo de Interior, el austríaco\
    \ Magnus Brunner, tras la reunión extraordinaria de ministros de Interior de los\
    \ Veintisiete por videoconferencia, en la que, a diferencia de la primera reacción,\
    \ hubo muestras unánimes de solidaridad hacia España.\n    \n        Brunner,\
    \ del conservador Partido Popular Austríaco, también negó que exista una relación\
    \ entre la regularización de migrantes y la situación en Ceuta.\n    \n      \
    \  Por su parte, parlamentarios del Consejo de Europa instaron a los Estados a\
    \  respetar plenamente el principio de no devolución, “incluso cuando la migración\
    \ se instrumentaliza” y advirtieron que “las preocupaciones de seguridad nacional\
    \ no deben utilizarse para justificar expulsiones colectivas ni excepciones a\
    \ los derechos humanos. obligaciones”.\n    \n        “Es fundamental una respuesta\
    \ firme pero humana: luchar contra las redes criminales de traficantes, defender\
    \ el principio de no devolución, apoyar a las regiones fronterizas y situar la\
    \ solidaridad, los derechos humanos y el Estado de derecho en el centro de la\
    \ gestión migratoria europea”, señalaron en una declaración comjunta la presidenta\
    \ de la Comisión de Migración de la Asamblea Parlamentaria del Consejo de Europa\
    \ (PACE), Sandra Zampa, y Christiana Erotokritou, ponente del Consejo.\n    \n\
    \        Las autoridades han habilitado el correo Ce-cmd-ceuta-pjlaboratorio-identificacion@guardiacivil.org\
    \ y el número de Whatsapp +212 694 86 99 82 para identificar a personas fallecidas."
