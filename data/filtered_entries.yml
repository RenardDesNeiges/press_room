- title: Ceuta ha sido un carnaval de contenidos para los odiadores de la derecha...
    y una lección para la izquierda
  summary: "Si Ceuta fue un fallo de seguridad accidental o un evento planeado no\
    \ tiene sentido. El punto es que a medida que la derecha global crezca en confianza,\
    \ habrá más Ceutas en el futuro. Y la izquierda debe pensar en una mejor respuesta\
    \ que simplemente estar agradecida de que los migrantes se hayan vuelto a casa\n\
    \        Las transmisiones en vivo continúan con sus cámaras en la playa de Ceuta,\
    \ donde no pasa nada. Los autodenominados periodistas ciudadanos siguen recorriendo\
    \ las calles, capturando imágenes con sus teléfonos inteligentes. Zia Yusuf, de\
    \ Reform UK, estuvo allí el fin de semana, vistiendo una camisa blanca y nítida\
    \ y pantalones elegantes a medida, para que nadie lo confundiera con las otras\
    \ personas morenasí. La mala gente morena.\n    \n        ¿Por qué la incursión\
    \ migratoria en Ceuta, en la frontera hispano-marroquí, fue una historia tan grande\
    \ en todo el mundo? ¿Cómo se les arregló para despertar el interés de Donald Trump\
    \ y Elon Musk, para aparecer en Nightly News de NBC, un programa no habituado,\
    \ por así decirlo, a destacar noticias de África continental? ¿Qué la llevó a\
    \ provocar tal reacción en los jefes de gobierno de Europa? ¿Qué la convirtió\
    \ en una historia irresistible de primera plana en el Daily Mail, el Daily Express\
    \ y el Daily Telegraph?\n    \n        Ciertamente no hay ningún tipo de amenaza\
    \ urgente o inminente a nuestras propias fronteras, y mucho menos a las fronteras\
    \ de los Estados Unidos. Los enclaves españoles de Ceuta y Melilla operan bajo\
    \ exenciones especiales del espacio Schengen, lo que hace casi imposible que un\
    \ migrante indocumentado llegue a la parte continental de España, a unas 12 millas\
    \ de distancia a través del Mediterráneo. Una vez que muchos de los migrantes\
    \ se dieron cuenta de esto, se macharon de vuelta.\n    \n        Tampoco hubo\
    \ ningún tipo de preocupación humanitaria por aquellos que se ahogaron o murieron\
    \ en el aplastamiento de la multitud. “Alrededor de 48.000 de las hasta 60.000\
    \ personas que llegaron a Ceuta desde Marruecos regresaron en un día. Aún así,\
    \ la afluencia repentina creó una crisis para el gobierno proinmigración de España.\
    \ Casi tres docenas murieron”, se leía en un subtítulo de The New York Times el\
    \ viernes. Una vez te la has arreglado para superar la retorcida sintaxis, ¿has\
    \ notado algo inusual? Primero la integridad de la frontera, luego las ramificaciones\
    \ políticas, luego las personas que murieron: la jerarquía del discurso migratorio\
    \ de derecha expresado en tres frases perfectas. Desde entonces, el número de\
    \ muertos ha aumentado a 72 o 88, las autoridades no están de acuerdo con el número,\
    \ y nadie parece demasiado preocupado de ninguna manera.\n    \n        Más bien,\
    \ Ceuta funciona como una especie de pornografía fronteriza para la extrema derecha\
    \ global: un lugar sobre el que proyectar sus fantasías más vívidas y apocalípticas.\
    \ Si el historiador Mike Davis describió alguna vez el muro fronterizo entre Estados\
    \ Unidos y México como “un escenario político”, entonces, en la era del deepfake\
    \ y la granja de trolls, Ceuta ha demostrado ser una fuente de contenido similarmente\
    \ fértil: la interfaz fronteriza reinventada como teatro digital, la migración\
    \ masiva como televisión en horario estelar.\n    \n        La rica ironía aquí\
    \ es que desde el punto de vista de la titulización, Ceuta funciona casi exactamente\
    \ como se pretendía. Una valla de alambre de púas de seis metros de altura, reforzada\
    \ por torres de vigilancia y una red de cámaras de video, la separa de Marruecos.\
    \ Desde Ceuta, un puesto de control interno custodia la única ruta en ferry a\
    \ España continental. La Unión Europea ha dedicado años y cientos de millones\
    \ de euros a desarrollar asociaciones con Marruecos en la gestión de fronteras.\n\
    \    \n        Nada de lo cual parecía importar en lo más mínimo cuando los líderes\
    \ europeos hicieron cola para azotar al gobierno de Pedro Sánchez. Italia reintrodujo\
    \ controles fronterizos aéreos y marítimos con España. Emmanuel Macron desplegó\
    \ unidades móviles en la frontera española para fortalecer los controles. Giorgia\
    \ Meloni, respaldada por Finlandia, Dinamarca y Chequia, ha argumentado que la\
    \ membresía de España en el espacio Schengen debería suspenderse.\n    \n    \
    \    Y, por supuesto, se trata principalmente de políticos nacionales que atienden\
    \ a un mercado interno, ante un ciclo electoral en el que los titulares  en Francia,\
    \ Italia y Polonia están siendo copados por insurgentes nativistas a su derecha.\
    \ El propio Sánchez se enfrenta a las urnas en 2027, una elección en la que su\
    \ gobierno puede presumir de un fuerte crecimiento económico y que, por lo tanto,\
    \ sus oponentes de derecha intentarán desesperadamente convertir en un referéndum\
    \ sobre inmigración.\n    \n        Ese es el punto de vista político. Pero realmente\
    \ el espectáculo de Ceuta representa una necesidad más primitiva, particularmente\
    \ en el mundo de habla inglesa, para que la cruzada inflamada contra la inmigración\
    \ se vea al tiempo que hable del tema. Las fotos y las imágenes del enclave en\
    \ los últimos días, todas tomadas desde la distancia y casi nunca en primer plano,\
    \ están orientadas hacia un solo extremo: alentar al espectador a ver estos cuerpos\
    \ marrones como una sola masa, cada uno indistinguible del otro, los contables\
    \ y médicos de los fabricantes de bombas y violadores, los vivos de los muertos.\n\
    \    \n        Y así, poco a poco, la línea entre el nacionalismo y la supremacía\
    \ blanca de sangre pura se desdibuja un poco más. De hecho, la idea misma de que\
    \ una sola frontera que cruza a mil millas y dos mares de distancia de nosotros\
    \ es de alguna manera nuestro problema urgente solo tiene sentido realmente en\
    \ una visión del mundo cuya verdadera distinción no es entre “Gran Bretaña” y\
    \ “el extranjero”, sino entre una Europa cristiana blanca imaginada y una otra\
    \ salvaje y marrón.\n    \n        Por todo esto, el derecho no actúa solo. El\
    \ alivio palpable en muchas partes de la izquierda cuando la mayoría de los 60.000\
    \ migrantes originales regresaron a Marruecos hablaba de una aquiescencia preocupante:\
    \ una aceptación tácita del peligroso tropo de la migración como un problema prima\
    \ facie. He aquí un pensamiento radical: ¿y si la migración es solo un problema\
    \ para quienes quieren que sea? ¿Qué pasaría si empezáramos a ver el movimiento\
    \ masivo de personas menos como una amenaza existencial y más como una simple\
    \ inevitabilidad de la existencia humana? Hace nueve años, el gran Gary Younge\
    \ expuso en The Guardian una visión utópica de fronteras abiertas y sin controles\
    \ migratorios. ¿Qué pasó con ese sentido de visión e idealismo? ¿Cuándo el discurso\
    \ fronterizo, la conversación sobre por qué y cómo nos movemos, se convirtió en\
    \ algo que hay que temer y no abrazar?\n    \n        Si Ceuta fue un fallo de\
    \ seguridad accidental o un evento planeado no tiene sentido. El punto es que\
    \ a medida que la derecha global crezca en confianza, a medida que el complejo\
    \ industrial migratorio tenga sed de nuevos contenidos, de nuevos pornos fronterizos,\
    \ habrá más Ceutas en el futuro. La gente seguirá migrando y muriendo en el intento,\
    \ y como esto tiene gancho narrativo seguirá sucediendo. “Hoy más que nunca”,\
    \ escribe la socióloga Mimi Sheller en su libro Mobility Justice, “estas tierras\
    \ fronterizas están empapadas en la sangre del nacionalismo blanco, el perfil\
    \ étnico y la muerte forzada en la tierra de nadie”.\n    \n        El final aquí\
    \ son masacres,  vigilancia violenta, no “detener los barcos”, sino disparar a\
    \ los barcos, la frontera reinventada como una zona de guerra de juegos de computadora.\
    \ El final del juego es lo que Musk y sus títeres de carne y hueso de extrema\
    \ derecha ya están describiendo: un mundo donde ejércitos zombies de “hombres\
    \ en edad militar” invaden nuestro territorio virgen, y el problema no son las\
    \ fuerzas que los expulsaron de sus hogares, sino la “empatía suicida” de quienes\
    \ los acogen, porque los que llegan no son humanos iguales que merecen un trato\
    \ igualitario. Estas son las apuestas. Y francamente, cuando ocurra el próximo\
    \ Ceuta, la izquierda debe pensar en una mejor respuesta que simplemente estar\
    \ agradecida de que se hayan vuelto a casa."
