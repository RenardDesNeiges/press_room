- title: Abdul El-Sayed gana las primarias de Michigan en una victoria clave para
    el ala izquierdista del Partido Demócrata
  summary: "El candidato progresista desbanca a Haley Stevens, respaldada por el 'establishment'\
    \ demócrata, tras un agónico recuento de votos en este estado considerado clave\
    \ en las elecciones de Estados UnidosDuelo por el futuro del Partido Demócrata\
    \ en el estado clave de Michigan: el candidato de la izquierda desafía a la favorita\
    \ del ‘establishment’\n        Después de un sufrido recuento de votos que se\
    \ ha alargado hasta la mañana del miércoles en Estados Unidos, el candidato progresista\
    \ Abdul El-Sayed se ha impuesto en las elecciones primarias del Partido Demócrata\
    \ celebradas el martes 4 de agosto en Michigan, un estado considerado clave para\
    \ que los demócratas opten a hacerse con la mayoría en el Senado en los comicios\
    \ de medio mandato que se celebrarán el próximo noviembre.\n    \n        El-Sayed\
    \ se ha proclamado ganador frente a la congresista Haley Stevens, a pesar de la\
    \ cantidad de dinero que el lobby Comité de Asuntos Públicos Estadounidense-Israelí\
    \ (AIPAC) ha inyectado en la candidatura de Stevens para intentar que desbancara\
    \ al que partía como favorito. \n    \n        El ganador, musulmán e hijo de\
    \ inmigrantes egipcios, es el último progresista y outsider que consigue desbancar\
    \ a los candidatos impulsados por el aparato del Partido Demócrata. Así pues,\
    \ su victoria se suma a la de los Socialistas Democráticos de América (DSA) en\
    \ Colorado y Nueva York. Pero la de Michigan es la más significativa, pues se\
    \ trata de un llamado 'swing state', donde en 2024 Donald Trump ganó por solo\
    \ 80.000 votos a la demócrata Kamala Harris. \n    \n        Con más de 10 millones\
    \ de habitantes, Michigan es el décimo estado más poblado de EEUU. La victoria\
    \ de El-Sayed puede interpretrarse como un indicador de que un programa más a\
    \ la izquierda tiene opciones de triunfar en el resto del país. Una de las principales\
    \ críticas que se ha hecho hasta ahora al fenómeno de Zohran Mamdani, el alcalde\
    \ socialista de Nueva York, o a otros perfiles del sector más izquierdista del\
    \ Partido Demócrata es que sus propuestas solo funcionan en estados nicho y marcadamente\
    \ progresistas. El-Sayed ha debilitado esta teoría, aunque la prueba de fuego\
    \ será en las elecciones de medio mandato de noviembre, cuando se disputará con\
    \ el republicano Mike Rogers el escaño del Senado que deja vacío el demócrata\
    \ Gary Peters. \n    \n        El único hecho que podría empeñar la victoria de\
    \ El-Sayed es el estrecho margen por el que se ha impuesto a su rival, Stevens.\
    \ Con un 95% de los votos escrutados, la agencia Associated Press le ha dado por\
    \ ganador con tan solo 20.000 votos de diferencia (0,90 puntos porcentuales).\
    \ \n    \n        El-Sayed, a pesar de no pertenecer directamente al DSA, ha contado\
    \ con el apoyo de los dos pesos pesados de la órbita progresista: el senador independiente\
    \ Bernie Sanders y la congresista Alexandria Ocasio-Cortez. El resultado de Michigan\
    \ también refuerza la posibilidad de que Ocasio-Cortez presente su candidatura\
    \ para las presidenciales de 2028.\n    \n        A pesar de ir a lomos de la\
    \ ola izquierdista y en contra del aparato del partido que han impulsado los candidatos\
    \ del DSA, El-Sayed ha rechazado activamente la etiqueta de “socialista” y ha\
    \ evitado enmarcar su campaña en una disputa derecha-izquierda. Ha querido que\
    \ su agenda de izquierdas hable por sí sola y ha optado por una campaña que ha\
    \ definido como “un movimiento para el pueblo”. \n    \n        “Tanto si me apoyasteis\
    \ como si no, tanto si votasteis a la vicepresidenta Harris en 2024 como si votasteis\
    \ a Donald Trump; si, como yo, creéis que deberíais poder pagar la compra; si,\
    \ como yo, creéis que deberíais poder permitiros una vivienda; si, como yo, creéis\
    \ que vuestros impuestos deberían invertirse en vosotros y no enviarse a otros\
    \ lugares; si, como yo, creéis que un gobierno del pueblo, por el pueblo y para\
    \ el pueblo es un derecho de nacimiento en este país [...] espero que os unáis\
    \ a este movimiento”, ha declarado El-Sayed esta mañana en una comparecencia posterior\
    \ a la confirmación de los resultados.\n    \n        Con su campaña, se ha convertido\
    \ en uno de los principales defensores de una sanidad pública en Estados Unidos,\
    \ bajo el lema “Medicare para todos”, en referencia al actual programa que subvenciona\
    \ los seguros médicos a buena parte de los estadounidenses. El programa Medicare\
    \ ha quedado herido de muerte después de que el año pasado el presidente Donald\
    \ Trump lograra aprobar la denominada Big Beautiful Bill, una ley fiscal que prevé\
    \ mantener las rebajas de impuestos a los ricos a costa de recortar millones de\
    \ dólares destinados a la asistencia sanitaria y otras ayudas.\n    \n       \
    \ La victoria de El-Sayed envía un claro mensaje a la cúpula del Partido Demócrata\
    \ sobre el descontento de las bases y la necesidad de construir un nuevo relato\
    \ que conecte con las preocupaciones materiales de los votantes. “Lo que hemos\
    \ demostrado es que, si estás dispuesto a construir un movimiento ladrillo a ladrillo,\
    \ si estás dispuesto a recorrer todo tu estado y mantener conversaciones en salas\
    \ grandes y pequeñas, empezando cuando la gente ni siquiera está pendiente de\
    \ unas elecciones, sino del precio de la gasolina, de los alimentos, de la vivienda\
    \ y de la asistencia sanitaria, entonces puedes construir una conversación que\
    \ acabe convirtiéndose en un movimiento capaz de derrotar a Goliat”, ha expuesto.\n\
    \    Revés a la AIPAC\n        No pasa por alto que El-Sayed ha ganado las primarias\
    \ en un estado con una alta concentración de población árabe y musulmana. En las\
    \ elecciones presidenciales de 2024, el apoyo a Israel del Partido Demócrata y\
    \ las reticencias a criticar sus acciones en Gaza pasaron factura a Kamala Harris.\
    \ En este nuevo ciclo, El-Sayed es una de las muchas figuras de la órbita progresista\
    \ que ha corregido el rumbo, cargando abiertamente contra el AIPAC y denunciando\
    \ el genocidio contra los palestinos. \n    \n        Destaca que El-Sayed ha\
    \ hecho hincapié en diferenciar el lobby proisraelí y el Estado de Israel de la\
    \ comunidad judía. “AIPAC e Israel no son lo mismo que el judaísmo y el pueblo\
    \ judío. Amo el judaísmo y amo al pueblo judío. Lo más peligroso es ampliar la\
    \ definición de antisemitismo para incluir las críticas a Israel”, dijo durante\
    \ uno de sus últimos actos de campaña. \n    \n        El AIPAC, a través de plataformas\
    \ de donación afiliadas, se ha gastado unos 30 millones de dólares en promocionar\
    \ a Stevens, la rival de El-Sayed. Es la mayor inversión de dinero que ha hecho\
    \ el lobby proisraelí en una única carrera electoral en años. “Gastaron una cantidad\
    \ de dinero sin precedentes para derrotarnos: anuncio de ataque tras anuncio de\
    \ ataque tras anuncio de ataque tras anuncio de ataque, una campaña publicitaria\
    \ constante. Pero resulta que los anuncios son la parte del programa de televisión\
    \ que la mayoría de la gente no quiere ver”, ha remarcado El-Sayed, demostrando\
    \ que es posible ganar una contienda desafiando al poderoso lobby. \n    \n  \
    \      La cantidad ingente de dinero que ha volcado la AIPAC en la campaña de\
    \ las primarias demócratas también ha servido a El-Sayed para poner en cuestión\
    \ el modelo a través del que se financian las campañas electorales en EEUU. El\
    \ candidato ha denunciado la facilidad con la que las grandes fortunas pueden\
    \ interferir en la democracia del país, como ya se vio en 2024 con la inyección\
    \ millonaria de Elon Musk a la candidatura de Trump."
