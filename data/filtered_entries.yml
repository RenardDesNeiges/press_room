    \ \n            \n                Cabo de Estaca de Bares.                   \
    \         \n                                    \n            \n             \
    \   Estaca de Bares, desde A Coruña o Lugo\n        Pocos lugares pueden presumir\
    \ de una ubicación tan privilegiada como Estaca de Bares. Situado en el punto\
    \ más septentrional de la península Ibérica, este gran cabo se adentra en el mar\
    \ separando las aguas del Atlántico y el Cantábrico y ofrece un horizonte completamente\
    \ abierto hacia el oeste, una condición ideal para seguir un eclipse que llegará\
    \ cuando el sol casi toque el horizonte. Desde A Coruña o Lugo se tarda alrededor\
    \ de una hora y cuarenta minutos, aunque conviene tener en cuenta que los últimos\
    \ kilómetros discurren por una carretera estrecha, por lo que es recomendable\
    \ salir con margen.\n    \n        Una vez allí, la espera resulta cualquier cosa\
    \ menos aburrida. El faro, los acantilados y los miradores convierten este rincón\
    \ en uno de los paisajes costeros más espectaculares del norte de España. Además,\
    \ Estaca de Bares es uno de los principales observatorios de aves de Europa y\
    \ muy cerca se encuentran lugares como Porto do Barqueiro o la desembocadura del\
    \ río Sor, perfectos para completar una jornada en la que el día tendrá dos noches.\n\
    \    \n    \n            \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nEl eclipse\
    \ total de Sol del 12 de agosto de 2026\n    \n        Por dónde pasará la sombra\
    \ de la Luna y cómo se verá el eclipse en cada punto de España\n    \n\n    \n\
    \n    \n        Fuente: elDiario.es. Trayectoria, franja de totalidad, sombra\
    \ y circunstancias al hacer\n        clic calculadas con un motor besseliano propio\
    \ sobre los elementos del eclipse de la\n        NASA/GSFC (F. Espenak). El «%\
    \ de nubes previstas» es la cobertura nubosa total (fracción\n        del cielo\
    \ que se prevé cubierta por nubes) según el modelo de ECMWF para esa hora; son\n\
    \        estimaciones a varios días vista. La capa «Sin visibilidad» señala dónde\
    \ el relieve del terreno\n        tapará el Sol sobre el horizonte en el instante\
    \ del eclipse (que ocurre al atardecer), calculada\n        con un modelo digital\
    \ de elevaciones (Copernicus GLO-90). Hora peninsular de verano (CEST)."
