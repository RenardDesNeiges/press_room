- title: El Gobierno de Ayuso compró el ático de Chamberí por 6,3 millones de euros
  summary: "El Ejecutivo madrileño dijo inicialmente que adquirió el inmueble de 485\
    \ metros cuadrados y una amplia terraza para emplearlo como \"oficinas\" pese\
    \ a que su uso solo puede ser residencialLa empresa pública que compró el ático\
    \ para uso temporal de Ayuso exigió confidencialidad al vendedor antes incluso\
    \ de la visita\n        El Gobierno de Isabel Díaz Ayuso compró el polémico ático\
    \ de Chamberí por 6,3 millones, tal y como adelantó laSexta y ha confirmado este\
    \ martes el diario El País.\n    \n        La operación se llevó a cabo a través\
    \ de la empresa pública Planifica Madrid. Tal y como adelantó elDiario.es, en\
    \ la transacción se exigió a la parte vendedora del inmueble un acuerdo de confidencialidad\
    \ con carácter previo a la adquisición.\n    \n        La propia presidenta de\
    \ la Comunidad de Madrid defendió que el ático se iba a utilizar para “reuniones”,\
    \ aunque no puede convertirse en oficinas, por unas obras en la Real Casa de Correos,\
    \ sede del Ejecutivo madrileño. Aunque, finalmente, el Gobierno de Ayuso terminó\
    \ vendiéndolo.\n    Compra y venta\n        El Ejecutivo madrileño adquirió el\
    \ inmueble el pasado 14 de abril. Una operación que no constaba en Transparencia\
    \ y que se empezó a conocer a través de los medios de comunicación y que tenía\
    \ como objetivo que “la presidenta y su equipo lo usaran durante las obras de\
    \ la sede en Sol”, según fuentes autonómicas.\n    \n        Un supuesto traslado\
    \ del Gobierno de Isabel Díaz Ayuso que justificaron con unos trabajos que se\
    \ iban a ejecutar en la Real Casa de Correos. “La Real Casa de Correos seguirá\
    \ este verano con las obras planificadas, que comenzaron en 2025, y que en este\
    \ periodo iban a afectar a los patios y segunda planta, para mantener en las mejores\
    \ condiciones un edificio de más de 250 años declarado BIC”, explicaron fuentes\
    \ de Presidencia entonces.\n    \n        De los 485 metros cuadrados del inmueble,\
    \ situado en el número 35 de la calle General Martínez Campos, pleno corazón de\
    \ Chamberí, que no estaba destinado como oficinas, casi 200 se corresponden a\
    \ una impresionante terraza.\n    \n        La propia inmobiliaria promocionaba\
    \ en enero el ático que el Gobierno de Isabel Díaz Ayuso terminó adquiriendo.\
    \ “Y estoy por fin en la cima. Solo unos pájaros llegamos a ser libres como esos\
    \ pájaros que vuelan tan alto. El cielo es inmenso y te veo pequeño desde arriba”,\
    \ aseguraban en el vídeo promocional en redes sociales. \n    \n        Ayuso\
    \ ofreció una comparecencia para cargar contra los medios de comunicación. Aseguró\
    \ que se trataba de una “campaña de desprestigio”. “Están a ver si se me echa\
    \ la gente encima, en un momento en el que la gente ha perdido sus casas, sus\
    \ propiedades”, acusó.\n    \n        Después de toda la polémica, el portavoz\
    \ y consejero de Presidencia, Miguel Ángel García, del que depende Planifica Madrid,\
    \ anunció el pasado 30 de julio, durante una visita a la zona afectada por los\
    \ incendios en Madrid, que rectificaban y que iban a vender el ático.\n    \n\
    \        El Gobierno madrileño aseguró que iba a vender los cinco inmuebles -el\
    \ ático del Paseo General Martínez Campos y los otros cuatro situados en la Gran\
    \ Vía de Madrid- para generar unos 20 millones de euros de ingresos. Unos fondos\
    \ que va a destinar a sufragar los cerca de 100 millones de euros que costarán\
    \ las ayudas aprobadas para la reconstrucción de la Sierra Oeste después de ser\
    \ arrasada por el fuego.\n    La venta del piso y del ático de González Amador\n\
    \        Pero esa no iba a ser la única operación inmobiliaria cercana a Isabel\
    \ Díaz Ayuso que iba a dar que hablar estas últimas semanas. Días después, según\
    \ adelantó El Plural, su pareja, el empresario y comisionista Alberto González\
    \ Amador puso a la venta el piso donde vive con la dirigente autonómica y un ático\
    \ ubicado en la planta inmediatamente superior.\n    \n        Tal y como se podía\
    \ ver en el conocido portal Idealista, González Amador puso a la venta a través\
    \ de la inmobiliaria Gilmar. Dos anuncios que ha terminado eliminando.\n    \n\
    \        La pareja de Ayuso pedía 1.790.000 euros por el piso que comparten con\
    \ la presidenta madrileña, una cantidad superior al doble de la que abonó en 2022\
    \ y puso a la venta el ático de 206 metros cuadrados con terraza ubicado en la\
    \ planta superior por 1.630.000 euros."
