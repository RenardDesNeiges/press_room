- title: La Junta de Castilla y León aprecia posibles incumplimientos en el matadero
    donde agonizaron más de 200 cervatillos
  summary: "La Dirección General de Salud Pública aprecia un posible incumplimiento\
    \ de la normativa de bienestar animal, al considerar que el establecimiento no\
    \ habría garantizado el correcto aturdimiento de los animales antes de su sacrificio,\
    \ una medida obligatoria para evitarles sufrimiento\nAnimales desangrados a tiros,\
    \ conscientes de su agonía: la muerte de 200 cervatillos de El Pardo en un matadero\
    \ segoviano\n\n        La Consejería de Sanidad y Bienestar Social de la Junta\
    \ de Castilla y León ha abierto un expediente sancionador al matadero Vicente\
    \ de Lucas Fuentetaja al verificar irregularidades en materia de bienestar animal,\
    \ como consta en un documento al cual ha accedido elDiario.es. El matadero, ubicado\
    \ en la provincia de Segovia, sacrificó a unos 200 cervatillos que convivían aglomerados\
    \ en la zona de sacrificio, con signos evidentes de miedo y estrés debido al incorrecto\
    \ trato realizado por los operarios del establecimiento industrial, como avanzó\
    \ este diario. Concretamente, la Dirección General de Salud Pública ha incoado\
    \ un expediente sancionador –que se encuentra en fase de instrucción– al no haberse\
    \ comprobado la eficacia del aturdimiento tras el uso de un arma de proyectil\
    \ libre, tal y como exige la normativa.\n    \n        elDiario.es se ha puesto\
    \ en contacto con la Consejería de Sanidad para consultar si ha abierto un expediente\
    \ sancionador al matadero Vicente de Lucas Fuentetaja por presuntos incumplimientos\
    \ de la normativa de bienestar animal, sin que haya sido posible obtener una respuesta\
    \ en el momento en que se publica esta noticia. Tampoco ha respondido la empresa\
    \ asociada al matadero, a la que se le ha preguntado si quería realizar alguna\
    \ valoración sobre el expediente incoado por la Junta de Castilla y León y si\
    \ había subsanado las irregularidades señaladas.\n    \n        Estos hechos coinciden\
    \ con las grabaciones –proporcionadas por la entidad Igualdad Animal– publicadas\
    \ por este diario, que describen que los animales seguían conscientes tras los\
    \ disparos, que movían la cola, las patas y levantaban la cabeza mientras se desangraban.\
    \ Los cervatillos, además, presenciaron el sacrificio del resto, mientras que\
    \ otros animales de la misma especie eran colgados por una sola extremidad cuando\
    \ aún estaban vivos. En algunos casos, los animales intentaban escapar malheridos\
    \ del cajón de sacrificio por los pasillos, lo que obligaba a los trabajadores\
    \ a avisar al matarife para que los rematara a distancia.\n    \n        Por otro\
    \ lado, la Consejería de Sanidad ha explicado que los ciervos sacrificados en\
    \ el matadero Vicente de Lucas el 5 de marzo de 2025 se incorporaron a la cadena\
    \ alimentaria, siempre que fueran declarados aptos para consumo humano por los\
    \ servicios oficiales de inspección veterinaria. La resolución también señala\
    \ que la declaración de aptitud permite su libre comercialización dentro del mercado\
    \ único de la Unión Europea, aunque en este caso no se emitió documentación para\
    \ exportaciones a terceros países. En este caso, la carne solo fue comercializada\
    \ en establecimientos ubicados en territorio nacional.\n    Sanción de hasta 100.000\
    \ euros\n        “La apertura del expediente sancionador supone un primer paso\
    \ y confirma que los hechos denunciados requerían una respuesta por parte de la\
    \ Administración”, afirma a este diario Anna Mulá, gerente de Incidencia Legislativa\
    \ de Igualdad Animal. La portavoz animalista lamenta al mismo tiempo que la Junta\
    \ de Castilla y León haya confirmado que los ciervos sacrificados en el matadero\
    \ investigado se hayan incorporado a la cadena alimentaria.\n    \n        “Este\
    \ caso demuestra que el consumidor no tiene ninguna forma de saber si la carne\
    \ que llega a su plato procede de un proceso en el que se haya respetado la legislación\
    \ de bienestar animal”, asegura Mulá y añade que es imprescindible, a su juicio,\
    \ que la instrucción “analice el alcance de los posibles incumplimientos, que\
    \ se esclarezca qué falló en los mecanismos de control y que, si se acreditan\
    \ responsabilidades, existan consecuencias proporcionales a la gravedad de los\
    \ hechos”.\n    \n        La Ley 32/2007, para el cuidado de los animales, en\
    \ su explotación, transporte, experimentación y sacrificio, considera una infracción\
    \ muy grave “el incumplimiento de la obligación del aturdimiento previo”, así\
    \ como “educar o manejar al animal con métodos agresivos o violentos que puedan\
    \ provocar maltrato al animal, o causarle estados de ansiedad o miedo”, como se\
    \ desprende del artículo 14.1 en los apartados e) y n). Por tanto, el matadero\
    \ segoviano podría enfrentarse a multas de entre 6.001 y 100.000 euros, como figura\
    \ en el artículo 16 de la normativa.\n    \n        \n                       \
    \                     \n\n\n\n\n\n\n    \n                                   \
