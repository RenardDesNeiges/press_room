- title: 'El increíble acoso de eBay a un matrimonio: porno, cucarachas, fetos de
    cerdo y vigilancia por escribir sobre la compañía'
  summary: "La plataforma, su ex consejero delegado y otros dos altos directivos pagarán\
    \ 56 millones de dólares a la pareja a la que intentaron intimidar para que dejaran\
    \ de publicar artículos críticos en su 'newsletter'Uno de cada tres trabajadores\
    \ ha visto o sufrido violencia laboral\n        “Acabad con ella”. “Quiero ver\
    \ cenizas. El tiempo que sea necesario. Lo que haga falta”. Son las declaraciones\
    \ del ex consejero delegado de eBay y de su antiguo director de Comunicación sobre\
    \ Ina Steiner, que desataron sobre ella y su marido David una de las campañas\
    \ de acoso corporativo más increíbles que han podido ser documentadas: durante\
    \ tres semanas, el equipo de seguridad de la multinacional envió a su domicilio\
    \ paquetes que incluían cucarachas vivas, larvas de mosca, un feto de cerdo, una\
    \ corona fúnebre y libros sobre cómo sobrellevar el duelo por la muerte de un\
    \ cónyuge.\n    \n        Los empleados de eBay también vigilaron físicamente\
    \ los desplazamientos del matrimonio, tratando de que los Steiner se dieran cuenta\
    \ de ello; intentaron instalar un localizador GPS en su coche, con el objetivo\
    \ de anticiparse a sus movimientos; publicaron la dirección de su vivienda en\
    \ redes sociales y plataformas de citas, organizando encuentros sexuales en su\
    \ casa sin su conocimiento; y enviaron pornografía a nombre de David a sus vecinos,\
    \ simulando que había habido un error con la dirección.\n    \n        \n    \
    \                                        \n\n\n\n\n\n\n    \n                \
    \                    \n                                                      \
    \                                                                            \
    \      \n                                                    \n              \
    \                                  \n                                        \
    \                                                                            \
    \    \n                                                    \n                \
    \                                \n                                          \
    \                          \n                                                \
    \    \n                                                \n                    \
    \                \n                \n\n                \n\n            \n    \
    \        \n\n            \n            \n                            \n      \
    \      \n                El libro \"sobreviviendo a la pérdida de una esposa\"\
    \ y una máscara de cerdo ensangrentado que fueron enviados a los Steiner.    \
    \                        \n                                    \n            \n\
    \                \n        Todo por un boletín de comercio electrónico, aunque\
    \ entonces ellos no lo sabían. “Una campaña sistemática, financiada con los recursos\
    \ de una empresa de la lista Fortune 500, para aterrorizar emocional y psicológicamente\
    \ a esta pareja de mediana edad... con el objetivo de disuadirlos de escribir\
    \ cosas negativas en internet sobre eBay”, ha declarado uno de los fiscales encargados\
    \ del caso.\n    El poder de una newsletter\n        Desde 1999, los Steiner habían\
    \ formado una modesta comunidad de seguidores alrededor de EcommerceBytes. Se\
    \ trata de un boletín enviado a través de correo electrónico donde se proporciona\
    \ información útil para los vendedores minoristas de plataformas de comercio electrónico,\
    \ como sus políticas sobre disputas o cómo limitar los gastos de envío.\n    \n\
    \        Con Ina encargada de la redacción y David de la gestión comercial, la\
    \ newsletter se convirtió en la ocupación principal del matrimonio de periodistas.\
    \ Así fue hasta 2019, cuando Ina publicó diversos artículos críticos con la decisión\
    \ de eBay de centrarse en las grandes cadenas de distribución en lugar de en los\
    \ vendedores individuales que representaban el público de EcommerceBytes. \n \
    \   \n        En ellos, Ina incluyó datos como el sueldo del CEO Devin Wenig (información\
    \ pública obligatoria presente en las cuentas que la compañía, que cotiza en bolsa)\
    \ o su decisión de replicar su taberna favorita de Nueva York dentro de la sede\
    \ de eBay en California a pesar de que la compañía atravesaba una profunda crisis.\n\
    \    \n        \n                                            \n\n\n\n\n\n\n  \
    \  \n                                    \n                                  \
    \                                                                            \
    \                          \n                                                \
    \    \n                                                \n                    \
    \                                                                            \
    \                        \n                                                  \
    \  \n                                                \n                      \
    \                                              \n                            \
    \                        \n                                                \n\
    \                                    \n                \n\n                \n\n\
    \            \n            \n\n            \n            \n                  \
    \          \n            \n                La página web de 'EcommerceBytes',\
    \ con las últimas publicaciones sobre eBay.                            \n    \
    \                                \n            \n                \n        Los\
    \ artículos llegaron a manos de Wenig, que junto con la entonces vicepresidenta\
    \ de Operaciones Globales de eBay, Wendy Jones, y el ex director de Comunicaciones,\
    \ Steven Wymer, ordenaron al equipo de seguridad de la multinacional que “acabara”\
    \ con la publicación de Steiner. “Vamos a aplastar a esta mujer”, escribió Wymer\
    \ a Wenig, en una serie de mensajes revelados por la investigación del Departamento\
    \ de Justicia de EEUU tras la demanda del matrimonio.\n    \n        Para entender\
    \ por qué la cúpula de una de las mayores tecnológicas del mundo reaccionó de\
    \ esta forma, hay que situarse en el contexto corporativo que atravesaba la multinacional.\
    \ En la primavera de 2019, eBay se encontraba bajo la presión de un fondo de inversión\
    \ activista (conocidos por forzar cambios radicales en la gestión, recortes de\
    \ gastos y despidos de altos directivos), coincidiendo con una caída notable de\
    \ los beneficios de la empresa. Al mismo tiempo, el boletín de los Steiner había\
    \ alcanzado los 600.000 lectores y era seguido de cerca por ejecutivos del sector\
    \ del comercio electrónico, lo que llevó a la directiva de la multinacional a\
    \ percibirlo como una amenaza directa.\n    56 millones de dólares\n        Durante\
    \ las tres semanas que duró la campaña de acoso físico, a la que se sumaron decenas\
    \ de ataques contra su publicación en redes sociales, los Steiner no supieron\
    \ quién estaba detrás de todo ello. Sin embargo, el rastro de eBay salió a la\
    \ luz cuando la policía local de Natick (Massachusetts), su lugar de residencia,\
    \ pudo registrar la matrícula de uno de los vehículos que había empezado a seguirlos.\
    \ \n    \n        Se trataba de un coche alquilado con una tarjeta que apuntaba\
    \ a Silicon Valley. En concreto, a la entonces vicepresidenta ejecutiva de Operaciones\
    \ Globales de eBay, Wendy Jones. Fue entonces cuando la operación de intimidación\
    \ salió a la luz.\n    \n        Tanto Jones como Wenig y Wymer han afirmado que\
    \ no conocían los detalles de la campaña que el equipo de seguridad de la compañía\
    \ había desatado contra los Steiner. Sin embargo, han llegado a un acuerdo extrajudicial\
    \ con la pareja por valor de 56 millones de dólares (unos 48 millones de euros).\
    \ eBay abonará 46,15 de ellos y destinará 6 millones adicionales a aportaciones\
    \ benéficas para organizaciones sin ánimo de lucro. Devin Wenig pagará dos millones\
    \ de dólares a los agredidos y aportará otro millón a una organización defensora\
    \ de la libertad de expresión a nombre de Ina Steiner. Jones y Wymer aportarán\
    \ 500.000 y 50.000 dólares respectivamente.\n    \n        \n                \
    \                            \n\n\n\n\n\n\n    \n                            \
    \        \n                                                                  \
    \                                                                      \n    \
    \                                                \n                          \
    \                      \n                                                    \
    \                                                                    \n      \
    \                                              \n                            \
    \                    \n                                                      \
    \              \n                                                    \n      \
    \                                          \n                                \
    \    \n                \n\n                \n\n            \n            \n\n\
    \            \n            \n                            \n            \n    \
    \            El CEO de eBay en el momento de los hechos, Devin Wenig, junto a\
    \ las oficinas de la tecnológica en Silicon Valley.                          \
    \  \n                                    \n            \n                \n  \
    \      Los Steiner han declarado que una de sus líneas rojas fue la inclusión\
    \ de una cláusula de confidencialidad que la tecnológica y sus ex altos ejecutivos\
    \ intentaron añadir al acuerdo. El pacto cierra la vía civil de un caso cuya trayectoria\
    \ penal concluyó en 2021. Entonces los siete miembros del equipo de seguridad\
    \ de eBay imputados se declararon culpables para evitar el juicio y recibieron\
    \ penas de hasta cinco años de prisión.\n    \n        eBay ha afirmado en un\
    \ comunicado que lo ocurrido fue “incorrecto, censurable y nunca debería haber\
    \ sucedido”. “Seguimos expresando nuestras más sinceras disculpas a los Steiner”,\
    \ afirmó la empresa. “Este acuerdo es coherente con nuestro compromiso de indemnizar\
    \ de forma justa a los Steiner y culmina nuestros esfuerzos por corregir la situación”.\n\
    \    \n\n    \n    \n      \n      Seguimos expresando nuestras más sinceras disculpas\
    \ a los Steiner. Este acuerdo es coherente con nuestro compromiso de indemnizarlos\
    \ de forma justa y culmina nuestros esfuerzos por corregir la situación\n    \
    \            \n                        eBay\n                                \
    \  \n          \n\n  \n        La tecnológica afirma que lo ocurrido durante 2019\
    \ “no representa su cultura actual”. Wenig, su máximo responsable en aquel momento,\
    \ renunció a su cargo antes de que la Fiscalía presentara cargos y recibió una\
    \ indemnización de 57 millones de dólares. El ex director ejecutivo de eBay ha\
    \ afirmado tras el acuerdo que “nadie debería haber sido sometido jamás a lo que\
    \ los Steiner soportaron” y que le “entristece especialmente” que ocurriera bajo\
    \ su mandato. Desde 2023 fundó y dirige Symbolic.ai, una plataforma con capacidades\
    \ avanzadas de IA para editores y escritores profesionales en noticias, investigación\
    \ y comunicaciones.\n    \n        “Creemos que este acuerdo transmite un mensaje\
    \ claro: las empresas y sus directivos no pueden incurrir en este tipo de conductas\
    \ indebidas sin enfrentarse a importantes consecuencias”, ha declarado el abogado\
    \ de los Steiner en un comunicado."
