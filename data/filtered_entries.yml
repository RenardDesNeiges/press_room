- title: 'Nétanyahou: Israël n’a pas accepté le plan pour Gaza soutenu par Washington'
  summary: Benyamin Nétanyahou a rencontré lundi le «Conseil de paix» de Donald Trump.
    Les ministres d’extrême droite mettent la pression sur le premier ministre. Une
    réunion du cabinet de sécurité doit se tenir jeudi.
