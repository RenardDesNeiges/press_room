- title: La familia de Robe Iniesta anuncia que la "pesadilla" de su relación con
    Live Nation está "encaminada a llegar pronto a su  final"
  summary: "El exlíder de Extremoduro comenzó antes de su muerte una batalla legal\
    \ contra la famosa productora de conciertos debido a la cancelación de la gira\
    \ de despedida del grupoPedro Pastor cancela su gira por EEUU: “No me han censurado,\
    \ pero han puesto trabas para tener la visa a tiempo”\n        La familia de Robe\
    \ Iniesta ha actualizado sobre la situación de su batalla legal contra la promotora\
    \ Live Nation, una de las empresas más importantes del mundo en cuanto a giras\
    \ de música. Si bien en marzo la Audiencia Provincial de Navarra confirmó que\
    \ la promotora no tenía derecho a reclamar más de cuatro millones de euros al\
    \ exlíder de Extremoduro por la cancelación de la gira de despedida del grupo,\
    \ ahora su círculo más cercano ha alegado a través de una publicación de Instagram\
    \ que “esta pesadilla va encaminada a llegar pronto a su final”.\n    \n     \
    \   “Para abrir este comunicado, ante todo, queremos agradecer el apoyo, el cariño\
    \ y el trabajo de muchísima gente: abogada, asesores, discográfica, compañeros,\
    \ amigos y familia, en la lucha contra Live Nation para que se haga justicia y\
    \ se llegue al fin que se merece”, ha comenzado declarando su entorno, que señala\
    \ que, cuando esta guerra finalice, “se cumplirá lo que Robe más necesitaba y\
    \ deseaba, poner fin por completo a su relación con Live Nation e Iñaki Antón\
    \ (Uoho)”. “Ese era su mayor deseo y luchó mucho por conseguirlo”, destaca la\
    \ familia.\n    \n        La disputa se remonta a la cancelación de la gira de\
    \ despedida de Extremoduro. El tour fue anunciado en 2019 y su inicio estaba previsto\
    \ para mayo de 2020. Con cerca de 400.000 entradas vendidas para 14 conciertos,\
    \ la pandemia obligó a aplazar las actuaciones en varias ocasiones. Esa situación\
    \ terminó provocando un enfrentamiento entre la promotora y Robe Iniesta sobre\
    \ cómo y cuándo debía retomarse la gira.\n    \n        \n                   \
    \                         \n\n\n\n\n\n\n    \n                               \
    \     \n                                                                     \
    \                                                                   \n       \
    \                                             \n                             \
    \                   \n                                                       \
    \                                                                 \n         \
    \                                           \n                               \
    \                 \n                                                         \
    \           \n                                                    \n         \
    \                                       \n                                   \
    \ \n                \n\n                \n\n            \n            \n\n   \
    \         \n            \n                            \n            \n       \
    \         Robe Iniesta, durante un concierto                            \n   \
    \                                 \n            \n                \n        En\
    \ el procedimiento judicial, Live Nation reclamó un total de 4,2 millones de euros:\
    \ 1,3 millones correspondientes a la devolución del anticipo abonado al artista\
    \ y otros 2,9 millones por los presuntos daños y perjuicios derivados de la cancelación.\
    \ Sin embargo, el auto desestimó en marzo las pretensiones de la promotora y concluyó\
    \ que fue esta la que incumplió el acuerdo. \n    \n        Además, la resolución\
    \ señaló que la intención de Robe era celebrar la gira “cuando las condiciones\
    \ lo permitiesen”, pero que esa posibilidad quedó definitivamente descartada cuando,\
    \ el 22 de julio de 2021, Live Nation decidió dar por finalizadas las negociaciones\
    \ y procedió a reembolsar el importe de las entradas a los compradores.\n    \n\
    \        Se trata de un caso que también estuvo marcado por las discrepancias\
    \ dentro de la banda. Iñaki “Uoho” Antón, guitarrista de Extremoduro, respaldó\
    \ la posición de la promotora. No obstante, este hecho no influyó en el sentido\
    \ de la resolución judicial, sino que terminó favoreciéndole. De hecho, esas discrepancias\
    \ desembocaron en un intercambio de comunicados entre ambas partes, en el que\
    \ Live Nation llegó a acusar a Iniesta de difamación.\n    \n        Asimismo,\
    \ la familia ha aprovechado el comunicado para agradecer, “con el corazón en mano”,\
    \ la “paciencia, apoyo y comprensión” que ha mostrado el público “en unos momentos\
    \ tan duros y difíciles para Robe. ”Estamos en camino de lograrlo… Os mantendremos\
    \ informados. Gracias a todos“, ha concluido el texto. De acabar ganando finalmente\
    \ esta batalla contra Live Nation, supondrá una victoria judicial póstuma para\
    \ el cantante, fallecido el pasado 10 de diciembre a los 63 años."
