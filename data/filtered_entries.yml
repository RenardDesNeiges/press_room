- title: 'Ni el ajo ni la guindilla: el método para que las gambas al ajillo mantengan
    todo su sabor'
  summary: "En la aparente simplicidad de esta propuesta culinaria se esconden varios\
    \ secretos que pueden cambiar por completo el resultado finalPesto 'trapanese':\
    \ la versión siciliana con tomate de una salsa imprescindible para tus platos\
    \ de pasta\n\n        Las gambas al ajillo son uno de esos platos que demuestran\
    \ a la perfección cómo la sencillez puede convertirse en toda una experiencia\
    \ gastronómica. Con muy pocos ingredientes —gambas, ajo, aceite de oliva y un\
    \ toque de guindilla— esta receta ha conseguido posicionarse en un lugar privilegiado\
    \ en las barras y mesas españolas. Su secreto no está solo en la calidad del producto,\
    \ que es muy importante, sino en una técnica precisa que permite que cada aroma\
    \ quede integrado sin tapar el sabor del marisco.\n    \n        Aunque su origen\
    \ exacto no está documentado, las gambas al ajillo guardan una estrecha relación\
    \ con la tradición de las tabernas madrileñas, donde se popularizaron especialmente\
    \ durante el siglo XX. La capital hizo de esta elaboración una de sus tapas más\
    \ reconocibles, junto a otros clásicos de la cocina castiza como los callos, el\
    \ bocadillo de calamares, los entresijos o las gallinejas.\n    \n        Cada\
    \ uno de los componentes de esta sencilla tapa desempeña un papel fundamental.\
    \ Las gambas son el elemento principal y su sabor marcará el resultado final;\
    \ mientras que el ajo y la guindilla aportan un aroma característico y un toque\
    \ picante, con el aceite como hilo conductor para integrar todos los ingredientes.\
    \ \n    \n        Pero la elaboración de este plato no se limita a freír los elementos\
    \ que lo componen. Hay que ser minucioso con el proceso para conseguir un bocado\
    \ que una intensidad y equilibrio. En la aparente simplicidad de esta propuesta\
    \ culinaria se esconden varios secretos que pueden cambiar por completo el resultado\
    \ final:\n    \n                    \n                                    La elección\
    \ del recipiente es una de las claves. Tradicionalmente, las gambas al ajillo\
    \ se han presentado en recipientes como las cazuelas de barro o las sartenes de\
    \ hierro. Las sartenes de este material permiten alcanzar temperaturas muy elevadas\
    \ al fuego manteniendo estable el calor al incorporar las gambas. Además, facilitan\
    \ una distribución uniforme de la temperatura, algo fundamental para conseguir\
    \ una cocción rápida y evitar que el aceite pierda fuerza.\n                 \
    \                   El tiempo de cocción de la gamba debe ser preciso. Este crustáceo\
    \ tiene una carne muy delicada que pierde su jugosidad al cocinarla demasiado.\
    \ Un exceso de tiempo al fuego provoca que la textura se vuelva más seca, por\
    \ lo que requiere una cocción rápida.\n                                    Las\
    \ cabezas concentran gran parte del sabor. Para elevar esta receta de nivel, es\
    \ recomendable dorar las cabezas para extraer sus jugos antes de cocinar la gamba.\
    \ Al presionarlas ligeramente, liberan todos sus aromas y el aceite los absorbe,\
    \ creando una base mucho más intensa con todo el sabor del marisco.\n        \
    \                            La guindilla también requiere equilibrio. Su función\
    \ es aportar intensidad y un ligero toque picante, pero la cantidad utilizada\
    \ es determinante. Si nos excedemos, podemos hacer que el picante eclipse los\
    \ matices de la gamba, el ajo y el aceite.\n                            \n   \
    \         \n        \n                                            \n\n\n\n\n\n\
    \n    \n                                    \n                               \
    \                                                                            \
    \                             \n                                             \
    \       \n                                                \n                 \
    \                                                                            \
    \                           \n                                               \
    \     \n                                                \n                   \
    \                                                 \n                         \
    \                           \n                                               \
    \ \n                                    \n                \n\n               \
    \ \n\n            \n            \n\n            \n            \n             \
    \               \n            \n                Las gambas al ajillo con una de\
    \ las tapas más populares en bares y restaurantes españoles                  \
    \          \n                                    \n            \n            \
    \    \n        Para preparar unas gambas al ajillo llenas de sabor, habrá que\
    \ tener en cuenta además el orden, los tiempos y la forma de tratar los ingredientes.\
    \ Toma nota de la receta paso a paso. Necesitaremos los siguientes ingredientes\
    \ para seis personas: \n    \n                    \n                         \
    \           800 gramos de gambas frescas \n                                  \
    \  6 dientes de ajo \n                                    100 mililitros de aceite\
    \ de oliva virgen extra\n                                    2 guindillas\n  \
    \                                  Perejil \n                                \
    \    Sal \n                            \n            \n        Con todos los ingredientes\
    \ a mano, vamos a seguir estos pasos para conseguir en casa unas gambas al ajillo\
    \ llenas de sabor:\n    \n                    \n                             \
    \       Comenzamos con la preparación del ingrediente principal: la gamba. En\
    \ primer lugar, retiramos las cabezas con un corte limpio con ayuda de un cuchillo\
    \ o tirando suavemente, pero con firmeza. Debemos hacerlo una por una. Una vez\
    \ hayamos separado ambas partes, las colocamos en dos recipientes diferentes.\
    \ Cogemos la parte del cuerpo y la cola, las pelamos y les extraemos el intestino.\
    \ Para ello, con ayuda de un palillo o una brocheta, pinchamos con delicadeza\
    \ en el centro del lomo y hacemos un pequeño movimiento de palanca. Cuando asome\
    \ el hilo negro, solo tendremos que tirar de él con cuidado para extraerlo por\
    \ completo sin dificultad. Tras esto las volvemos a reservar en el cuenco. \n\
    \                                    Una vez tengamos el ingrediente principal\
    \ listo, vamos a preparar el resto. Cogemos una cabeza de ajo, extraemos y pelamos\
    \ seis de sus dientes. Dependiendo de si queremos que la receta tenga un matiz\
    \ más picante, trocearemos las guindillas o las  añadiremos enteras. \n      \
    \                              Ponemos la sartén o la cazuela al fuego, vertemos\
    \ el aceite y añadimos los dientes de ajo y las guindillas. Es esencial que el\
    \ aceite absorba todos los matices y aromas, evitando que los ajos se quemen porque\
    \ amargarán el resultado y podrían arruinar la receta.\n                     \
    \               Seguidamente, vertemos las cabezas de las gambas que cocinaremos\
    \ hasta que extraigan sus jugos. Una vez hayamos infusionado el aceite, las retiramos.\n\
    \                                    Por último, cocinamos las gambas un minuto\
    \ por cada lado. Tras adquirir un color rosado opaco apagamos el fuego y vertemos\
    \ el resultado en un cuenco, a poder ser de cerámica para que retenga el calor.\
    \ Una vez emplatadas, pica el perejil para añadirlo por encima con una pizca de\
    \ sal. Debemos servir la receta con el aceite hirviendo. Este final es otro secreto\
    \ de unas buenas gambas al ajillo: llevarlas a la mesa todavía chisporroteando.\
    \ El calor termina de potenciar los aromas del ajo, la guindilla y el perejil,\
    \ mantiene el cuerpo del crustáceo jugoso y convierte cada bocado en una experiencia\
    \ gastronómica intensa."
