- title: El PSOE pide paralizar el proceso de selección de otro alto directivo en
    Cantur "a dedo y por la puerta de atrás"
  summary: "El Gobierno de Cantabria no da explicaciones pero el Partido Popular defiende\
    \ que no se crea ningún puesto ni aumenta el gasto públicoAntecedentes - La empresa\
    \ pública Cantur crea otro puesto de alta dirección y da seis días para que se\
    \ presenten candidatos\n        El PSOE de Cantabria ha pedido la paralización\
    \ del proceso para crear un puesto de alta dirección en Cantur “a dedo y por la\
    \ puerta de atrás”. “Una convocatoria de una plaza de alta dirección convocada\
    \ el 31 de julio, con solo seis días para presentarse y que no exige ni titulación\
    \ ni ninguna experiencia ni en recursos humanos ni en dirección de empresas es\
    \ una plaza que tiene nombre y apellidos”, ha denunciado la portavoz de la Comisión\
    \ Ejecutiva Autonómica, Ainoa Quiñones.\n    \n        “La falta de transparencia\
    \ es el primer signo de quienes quieren crear una red clientelar por la puerta\
    \ de atrás”, ha reprochado. \n    \n        La empresa pública Cantur dependiente\
    \ de la Consejería de Turismo del Gobierno de Cantabria ha publicado una convocatoria\
    \ de selección de empleo para contratar un director efectivo de Operaciones y\
    \ Talento, un perfil de alta dirección de nueva creación que se suma al organigrama\
    \ cuyas funciones coinciden en su mayoría con las que en teoría ya realiza la\
    \ directora, Inés Mier. Para optar a la plaza solo hay un plazo de seis días y\
    \ no se pide ninguna titulación.\n    \n        Para Quiñones, “el Gobierno del\
    \ Partido Popular vuelve a demostrar que no tiene ningún interés en gobernar para\
    \ mejorar la vida de los cántabros, recortando permanentemente los servicios públicos\
    \ mientras engorda de cargos públicos a dedo su organigrama”.\n    \n        “Las\
    \ prioridades de Buruaga y el PP no son las prioridades de Cantabria”, ha criticado\
    \ la portavoz de los socialistas cántabros, que ha considerado que Cantur “ya\
    \ acumula en tres años demasiados escándalos, destituciones y cambios de personal\
    \ para seguir ahondando en el deterioro de esta empresa pública”.\n    \n    \
    \    Para Quiñones, “Cantur se ha convertido para el PP en el canal desde donde\
    \ colocar a todos sus amiguetes y la convocatoria de esta plaza en pleno verano,\
    \ sin margen para presentarse y con unos criterios de selección tan poco rigurosos\
    \ es una muestra más de ello”.\n    \n        Para los socialistas cántabros,\
    \ “este turbio proceso para crear una plaza innecesaria en Cantur exige explicaciones\
    \ en el Parlamento y la retirada del procedimiento”.\n    \n         “Si el PP\
    \ no quiere manchar el nombre de Cantur y seguir deteriorando el buen nombre de\
    \ una empresa pública referente para el sector turístico regional lo único que\
    \ puede hacer es paralizar este despropósito de proceso de selección a dedo”,\
    \ ha señalado.\n    \n        Por último, Ainoa Quiñones ha afirmado que el Gobierno\
    \ del PP “no puede permitirse un escándalo más”. “Están dinamitando el buen nombre\
    \ de las instituciones y empresas públicas de esta tierra con sus políticas caciquiles”,\
    \ ha concluido.\n    Silencio del gobierno, defensa del PP\n        “El PSOE vuelve\
    \ a mentir: no se crea ningún puesto nuevo en Cantur, ni aumenta el gasto público”,\
    \ ha respondido el diputado autonómico del Partido Popular, Alejandro Liz.\n \
    \   \n        El portavoz de Turismo ha explicado que la convocatoria pública\
    \ para cubrir la dirección ejecutiva de Operaciones y Talento no corresponde a\
    \ la creación de un nuevo cargo “sino a la adaptación del puesto que hasta ahora\
    \ ocupaba la dirección de Recursos Humanos”. Por tanto, ha dicho, “se actualiza\
    \ su denominación y se amplían sus funciones para dar respuesta a los grandes\
    \ proyectos estratégicos que la Consejería de Cultura, Turismo y Deporte ya está\
    \ desarrollando”.\n    \n        El portavoz de Turismo también ha desmentido\
    \ que esta reorganización tenga impacto económico. “Es rotundamente falso que\
    \ suponga un incremento del gasto público. No se crea ninguna plaza nueva y, por\
    \ tanto, no existe ningún aumento de la masa salarial”, ha subrayado."
