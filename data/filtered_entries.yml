- title: Profitant du commerce mondial, le trafic de «narcobananes» prospère
  summary: En pleine expansion en Europe, le narcotrafic profite aussi du commerce
    transatlantique des bananes pour se développer. Le sujet s’est fait plus saillant
    ces dernières années avec la mise en cause par la presse d’une entreprise familiale
    du président de l’Équateur, Daniel Noboa.
  media: https://static.mediapart.fr/etmagine/default/files/2026/07/20/260720-img-4-profitant-du-commerce-mondial-le-trafic-de-narcobananes-prospere.jpg
