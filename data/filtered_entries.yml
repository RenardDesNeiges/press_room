- title: Los heridos por las cargas policiales de la protesta contra la turistificación
    en Balears inician acciones legales contra los agentes
  summary: "Un total de 25 personas denuncian haber sufrido lesiones durante la intervención\
    \ policial. La organización Alerta Solidària plantea además denunciar a los mandos\
    \ policiales por un presunto delito contra el ejercicio del derecho fundamental\
    \ de manifestaciónMiles de personas convierten Palma en un clamor contra la turistificación\
    \ y la crisis de la vivienda: “Mallorca llegó al límite”\n\n        Un total de\
    \ 25 personas se han puesto en contacto con la entidad Alerta Solidària y la plataforma\
    \ Menys Turisme, Més Vida con el objetivo de interponer denuncia por las lesiones\
    \ sufridas durante las cargas de la Policía Nacional al término de la multitudinaria\
    \ manifestación contra la turistificación celebrada el pasado 26 de julio en Palma.\
    \ \n    \n        Así lo han anunciado este martes en rueda de prensa el portavoz\
    \ de Menys Turisme, Més Vida, Jaume Pujol, y el representante de Alerta Solidària,\
    \ Àlvar Hervalejo, quienes han explicado que, de la totalidad de afectados, 16\
    \ necesitaron asistencia médica, la mayoría por hematomas y contusiones en distintas\
    \ partes del cuerpo. Dos de los heridos, según las entidades, sufrieron lesiones\
    \ de mayor gravedad: uno de ellos requirió seis puntos de sutura tras sufrir una\
    \ fractura craneal y recibió el alta al día siguiente, mientras que el otro permaneció\
    \ hospitalizado durante dos días al detectársele una hemorragia interna, por lo\
    \ que quedó ingresado en observación con pronóstico reservado.\n    \n       \
    \ Entre los lesionados figura también un fotoperiodista que cubría la protesta\
    \ y que sufrió una brecha en la cabeza tras recibir el impacto de una defensa\
    \ policial, un episodio que está siendo objeto de una investigación interna abierta\
    \ por la propia Policía Nacional.\n    \n        A partir de los partes médicos\
    \ emitidos por hospitales y centros sanitarios, Alerta Solidària ha comenzado\
    \ ya a estudiar cada uno de los casos y a preparar las correspondientes denuncias,\
    \ tanto a nivel individual como a través de una posible acción judicial conjunta.\
    \ Para ello, la entidad está recopilando informes médicos, grabaciones y material\
    \ audiovisual de las cargas con el objetivo de identificar a los agentes que intervinieron\
    \ en el operativo y dirigir contra ellos las correspondientes acciones legales,\
    \ según ha explicado Hervalejo.\n    \n        En paralelo, está analizando las\
    \ numerosas fotografías y vídeos registrados durante la actuación policial con\
    \ el objetivo de identificar al mayor número posible de agentes, atribuirles las\
    \ actuaciones concretas que consideran lesivas y aportar esa información a los\
    \ juzgados. En los casos que consideran más graves, especialmente los de las dos\
    \ personas con fracturas craneales, estudian presentar querellas penales.\n  \
    \  \n        Además de las acciones dirigidas contra los agentes que participaron\
    \ en las cargas, Alerta Solidària plantea denunciar a los mandos policiales por\
    \ un presunto delito contra el ejercicio del derecho fundamental de manifestación,\
    \ previsto en el artículo 540 del Código Penal. La organización considera que\
    \ la actuación policial pudo vulnerar este derecho y reclama que se investigue\
    \ la cadena de mando y las órdenes impartidas durante el dispositivo.\n    \n\
    \        Durante la comparecencia, las entidades han trasladado un mensaje de\
    \ apoyo a todas las personas afectadas por la intervención policial, tanto a quienes\
    \ sufrieron lesiones físicas como a quienes presenciaron las cargas. “No os dejaremos\
    \ solos”, han subrayado, antes de reiterar su exigencia de que se asuman responsabilidades\
    \ políticas. En este sentido, han vuelto a reclamar la dimisión del delegado del\
    \ Gobierno en Balears, Alfonso Rodríguez, y han exigido explicaciones sobre la\
    \ cadena de mando y las decisiones que, a su juicio, desembocaron en unos desórdenes\
    \ públicos que “no existían antes de la actuación policial”.\n    \n        Los\
    \ colectivos lanzado, asimismo, un mensaje de cara a la movilización convocada\
    \ este sábado en Sóller, uno de los más golpeados por la masificación turística\
    \ y por la crisis de la vivienda en Mallorca. Bajo el lema 'Sóller, al límit',\
    \ Menys Turisme, Més Vida y el Moviment Jove de Sóller quieren denunciar a través\
    \ de esta movilización la “degradación” que, a su juicio, está provocando la turistificación\
    \ de la localidad.\n    \n         En este sentido, el portavoz de Menys Turisme,\
    \ Més Vida ha pedido expresamente que “los agentes uniformados que provocaron\
    \ los episodios de violencia” durante la manifestación de Palma no formen parte\
    \ del dispositivo, al tiempo que ha asegurado que el movimiento no renunciará\
    \ a seguir movilizándose. “No dejaremos que la violencia policial coaccione un\
    \ movimiento social y político que tiene razón, que tiene legitimidad y que es\
    \ mayoritario en la isla. Lo que nos da miedo es no hacer nada para revertir los\
    \ efectos desastrosos del turismo masivo; vuestra represión no nos detendrá”,\
    \ ha sentenciado."
