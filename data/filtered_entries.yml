- title: 'Trump encuentra (para su sorpresa) la horma de su zapato en Irán: unos líderes
    tan tozudos como él'
  summary: "El presidente de EEUU se limita a lamentar lo que considera una \"increíble\
    \ hipocresía\" de Teherán mientras se enfrenta a la complicada tarea de encontrar\
    \ una base sólida para negociarTrump asegura que este lunes reanudará el diálogo\
    \ con Irán pero Teherán dice que solo habla con Omán sobre Ormuz\n        Donald\
    \ Trump siempre ha mantenido una frágil relación con la verdad. Fue su mentor,\
    \ el abogado neoyorquino Roy Cohn, quien le enseñó a proclamar siempre la victoria\
    \ y jamás admitir la derrota cuando era un joven magnate inmobiliario. Desafortunadamente\
    \ para Trump, en Irán el presidente estadounidense ha encontrado un oponente tan\
    \ cabezota como él.\n    \n        Mientras Trump afirmaba que esta semana comenzarían\
    \ nuevas negociaciones con Teherán, Irán demostraba que también puede reavivar\
    \ el conflicto lanzando misiles balísticos contra bases estadounidenses en la\
    \ región y manteniendo un control absoluto sobre el estrecho de Ormuz, lo que\
    \ le permite tomar la iniciativa en el estancado proceso de paz. Y el tiempo apremia\
    \ para Trump, ya que se acerca una crisis energética global y unas complicadas\
    \ elecciones de mitad de mandato para él y su partido republicano.\n    \n   \
    \     Sin embargo, tan pronto como Trump anunció su último intento de alcanzar\
    \ un acuerdo de paz, Irán lo negó y el presidente estadounidense volvió a enfurecerse.\
    \ “¡Los líderes de Irán son increíblemente hipócritas!”, publicó en su cuenta\
    \ de  Truth Social, donde aseguró que Irán había suplicado una reunión y que las\
    \ conversaciones ya habían comenzado. “Nada llega a Irán a menos que nosotros\
    \ queramos, y nada llegará a menos que se logre un acuerdo o una rendición total”.\n\
    \    \n        Desde el inicio de la guerra, Trump ha asegurado en numerosas ocasiones\
    \ que un acuerdo definitivo con Irán es inminente, y su último anuncio de que\
    \ las nuevas negociaciones pueden culminar en un acuerdo de paz en cuestión de\
    \ días evidencia la desesperación de su Administración por reabrir el estrecho\
    \ y encontrar una salida a la crisis. Tras prometer un golpe contundente a Irán,\
    \ Trump dio un giro radical el domingo y afirmó que las conversaciones continuarían\
    \ y que se había acordado el “perímetro de un acuerdo” para la apertura del estrecho\
    \ de Ormuz y la “desnuclearización de Irán”.\n    \n\n    \n    \n      \n   \
    \   La afirmación de Trump de que nuevas negociaciones podrían culminar en un\
    \ acuerdo de paz evidencia la desesperación de su administración por reabrir el\
    \ estrecho y encontrar una salida a la crisis\n          \n\n  \n        Para\
    \ su desgracia, los iraníes no comparten esta opinión de Trump. En un comunicado\
    \ emitido el lunes, un portavoz del Ministerio de Asuntos Exteriores iraní negó\
    \ que se estuvieran llevando a cabo negociaciones de paz. “Actualmente, no estamos\
    \ negociando con Estados Unidos”, declaró Esmaeil Baqaei. “Nuestras negociaciones\
    \ son con Omán para asegurar el paso por el estrecho de Ormuz”.\n    \n      \
    \  Esas conversaciones podrían resultar en un acuerdo. Pero no implicaría que\
    \ el estrecho de Ormuz recupere su estatus anterior a la guerra, añadió Baqaei,\
    \ lo que, en la práctica, mantendrá esta vía marítima como un tema de disputa\
    \ política en el futuro. “Debemos garantizar que el estrecho de Ormuz no pueda\
    \ ser utilizado indebidamente por quienes han cometido agresiones contra Irán”,\
    \ declaró el portavoz del Ministerio de Exteriores.\n    \n        Aparentemente,\
    \ poco ha cambiado desde la última ronda de negociaciones. Irán sigue teniendo\
    \ la capacidad de cerrar el estrecho de Ormuz e impedir el tráfico marítimo —incluido\
    \ el de una quinta parte del suministro mundial de petróleo— a través de esta\
    \ crucial vía marítima. Estados Unidos sigue teniendo la capacidad de infligir\
    \ ataques devastadores a Irán —a pesar de la alerta por la escasez de municiones\
    \ clave que podrían ser necesarias para una guerra contra rivales de mayor entidad\
    \ como China—, pero carece de objetivos significativos que puedan obligar a Irán\
    \ a cambiar su política.\n    Tres treguas fracasadas\n        La Administración\
    \ Trump ha manifestado su deseo de poner fin desde abril al conflicto que inició,\
    \ y desde entonces se han alcanzado y han fracasado tres altos el fuego. A poco\
    \ más de tres meses de las elecciones de mitad de mandato en Estados Unidos, en\
    \ las que se prevé que los republicanos pierdan la Cámara de Representantes e\
    \ incluso puede que el Senado, una nueva encuesta de Reuters/Ipsos publicada la\
    \ semana pasada revela que menos de un tercio de los estadounidenses apoya la\
    \ guerra en Irán, y el 69% cree que Trump no ha explicado con claridad los objetivos\
    \ de la intervención militar estadounidense en Irán.\n    \n\n    \n    \n   \
    \   \n      Para Teherán, la imprevisibilidad estratégica se ha convertido en\
    \ una nueva arma en una guerra que, paradójicamente, ha fortalecido su posición\
    \ negociadora\n          \n\n  \n        Para Teherán, la imprevisibilidad estratégica\
    \ se ha convertido en una nueva arma en una guerra que, paradójicamente, ha fortalecido\
    \ su posición negociadora, otorgándole nuevas herramientas para frenar el suministro\
    \ mundial de petróleo y atacar a los aliados regionales de Estados Unidos en el\
    \ Golfo. \n    \n        Irán ha llegado a la conclusión de que su mejor estrategia\
    \ es “maximizar el daño que puede causar a Estados Unidos y sus socios en la región”,\
    \ explica Alex Vatanka, investigador sénior del Instituto de Oriente Medio y experto\
    \ en seguridad de Oriente Medio, especializado en Irán, en el podcast del propio\
    \ organismo la semana pasada. Según Vatanka, Trump “aún no está preparado para\
    \ un acuerdo con Irán, al menos no para un acuerdo que beneficie a los iraníes”.\n\
    \    \n        Irán también se enfrenta a una presión constante debido al bloqueo\
    \ estadounidense, que en la práctica paraliza el comercio exterior.\n    \n  \
    \      “La cúpula iraní ha llegado a un punto en el que considera que seguir de\
    \ brazos cruzados y mantener una sucesión de conversaciones diplomáticas no es\
    \ el mejor camino”, añadió. “Están intentando generar un cambio para llamar la\
    \ atención de Trump y ver si pueden obtener un resultado diferente”."
