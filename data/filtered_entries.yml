- title: 'El yen da alas a Honda: dispara un 129% su beneficio pese a vender menos
    coches'
  summary: "El fabricante deja atrás las pérdidas por el ajuste de sus planes en vehículos\
    \ eléctricos y mejora sus previsiones para el año tras ganar 2.500 millones de\
    \ euros en el último trimestre gracias al efecto favorable del cambio de la moneda\
    \ japonesaToyota gana un 75,6% más gracias a los 'regalos' de Trump\n        Honda\
    \ ha vuelto a los beneficios con fuerza. El fabricante japonés obtuvo un beneficio\
    \ neto de 450.915 millones de yenes (unos 2.500 millones de euros) entre abril\
    \ y junio, primer trimestre de su ejercicio fiscal 2026-2027, lo que supone un\
    \ incremento del 129,3% respecto al mismo periodo del año anterior, impulsado\
    \ principalmente por la depreciación del yen y la desaparición de los costes extraordinarios\
    \ ligados a la revisión de su estrategia de electrificación. Honda sigue la estela\
    \ de otros fabricantes japoneses, que se han beneficiado del cambio a favor de\
    \ las divisas.\n    \n        La mejora de las cuentas llega a pesar de que Honda\
    \ vendió menos automóviles. Las ventas mundiales de coches descendieron un 6,3%,\
    \ hasta 786.000 unidades, lastradas por el desplome del mercado chino, donde las\
    \ entregas cayeron en torno a 75.000 vehículos, mientras Norteamérica logró compensar\
    \ parcialmente ese retroceso con un ligero crecimiento.\n    \n        El beneficio\
    \ operativo registró un aumento de más del doble, al alcanzar los 530.767 millones\
    \ de yenes (unos 2.900 millones de euros), un 117,4% más que un año antes y muy\
    \ por encima de las previsiones del mercado. Los ingresos, por su parte, crecieron\
    \ un 13,5%, hasta 6,06 billones de yenes (33.330 millones de euros).\n    De las\
    \ pérdidas al beneficio\n        La fortaleza del dólar frente al yen fue uno\
    \ de los principales motores de los resultados. Honda elevó el impacto positivo\
    \ de las divisas sobre su beneficio operativo hasta 90.800 millones de yenes en\
    \ el trimestre y ha revisado su hipótesis de tipo de cambio para el conjunto del\
    \ ejercicio desde 145 hasta 155 yenes por dólar.\n    \n        La mejora también\
    \ refleja un importante cambio respecto al año pasado. En el mismo trimestre de\
    \ 2025 la compañía había contabilizado pérdidas extraordinarias relacionadas con\
    \ la revisión de su estrategia de electrificación, que finalmente no se han repetido\
    \ este ejercicio. De hecho, Honda confirmó que entre abril y junio no registró\
    \ pérdidas vinculadas a ese proceso de reestructuración, que el pasado ejercicio\
    \ provocó un fuerte deterioro de sus resultados.\n    \n        En el negocio\
    \ de automóviles, el beneficio operativo ascendió a 192.100 millones de yenes,\
    \ frente a los 92.300 millones ajustados del año anterior. Sin embargo, la compañía\
    \ reconoce que el negocio sigue sufriendo en China, donde la intensa competencia\
    \ de los fabricantes locales continúa erosionando las ventas, mientras Norteamérica\
    \ mantiene una evolución sólida.\n    Mejora las previsiones para todo el ejercicio\n\
    \        A la vista de la evolución del tipo de cambio, Honda elevó un 30% su\
    \ previsión de beneficio operativo para el conjunto del ejercicio, hasta 650.000\
    \ millones de yenes, frente a los 500.000 millones estimados anteriormente. También\
    \ revisó al alza su previsión de beneficio neto, hasta 400.000 millones de yenes,\
    \ y aumentó su objetivo de ingresos hasta 24,15 billones de yenes.\n    \n   \
    \     La compañía, no obstante, mantiene la cautela sobre la segunda mitad del\
    \ año. La dirección advirtió de que persiste la incertidumbre derivada de la situación\
    \ en Oriente Medio, que podría traducirse en mayores costes de las materias primas\
    \ y afectar a la demanda mundial de vehículos, por lo que, más allá del efecto\
    \ del tipo de cambio, no ha modificado el resto de sus hipótesis de negocio.\n\
    \    \n        Estos resultados suponen un importante giro para Honda después\
    \ de cerrar el ejercicio anterior con sus primeros números rojos en décadas, consecuencia\
    \ del elevado coste de la reestructuración de su estrategia de vehículos eléctricos.\
    \ Ahora, el fabricante japonés confía en que la debilidad del yen y la recuperación\
    \ de la rentabilidad le permitan dejar atrás ese episodio, aunque el deterioro\
    \ del mercado chino continúa siendo su principal desafío."
