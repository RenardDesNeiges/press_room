- title: El Banco de España multa con 2,8 millones a BCC-Grupo Cajamar y varios directivos
    por su política de retribuciones
  summary: "La entidad bancaria indica que todos los miembros de su consejo de administración\
    \ han recurrido las sanciones del Banco de España ante la Audiencia NacionalBBVA,\
    \ Santander y Sabadell agitan sus equipos directivos ante el desembarco de la\
    \ IA en su negocio\n        El Banco de España ha impuesto una multa de casi 2,8\
    \ millones de euros a BCC-Grupo Cajamar y a sus cargos de administración y dirección,\
    \ entre ellos, su consejero delegado, Manuel Yebra, por haber incurrido en incumplimientos\
    \ relacionados con las políticas de remuneraciones.\n    \n        Según publica\
    \ este miércoles el Boletín Oficial del Estado (BOE), con fecha 24 de febrero\
    \ de 2025, el Consejo de Gobierno del Banco de España dictó una resolución sancionadora\
    \ por la que finalizó el expediente incoado en mayo de 2024 a BCC-Grupo Cajamar\
    \ y a sus cargos de administración y dirección.\n    \n        Una vez que la\
    \ citada resolución ha adquirido firmeza en vía administrativa y tras haber finalizado\
    \ en vía judicial el incidente cautelar sobre la publicación de las sanciones,\
    \ procede a su publicación en BOE.\n    \n        Así, multa con 2 millones de\
    \ euros a BCC-Grupo Cajamar por incurrir en incumplimientos relacionados con las\
    \ políticas de remuneraciones, en concreto, por no haber considerado al menos\
    \ el 15% de los compromisos por pensiones del colectivo identificado como retribución\
    \ variable “sin que dichos incumplimientos sean especialmente significativos a\
    \ la vista de la importancia de las concretas normas infringidas o la situación\
    \ económico financiera de la entidad”.\n    Sanción de 75.000 para el consejero\
    \ delegado\n        Al consejero delegado de la entidad, Manuel Yebra, le sanciona\
    \ con 75.000 euros; al consejero Bernabé Sánchez, con 55.000 euros; a Luis Rodríguez,\
    \ con otros 55.000 euros; a Marta de Castro Aparicio, con 50.000 euros; a Joan\
    \ Bautista Mir, con otros 50.000 euros; y a María Teresa Vázquez, con otros 50.000\
    \ euros.\n    \n        Los consejeros Antonio Cantón (48.000 euros), Juan Carlos\
    \ Rico (45.000 euros), Antonio José Carranceja (42.000 euros), Ana Núñez Álvarez\
    \ (40.000 euros), Luis Francisco Fernández-Revuelta Pérez (40.000 euros), Rafael\
    \ García Cruz (40.000 euros), José Antonio García (38.000 euros) y Carlos Pedro\
    \ de la Higuera (30.000 euros) también han sido sancionados.\n    \n        Asimismo,\
    \ el Banco de España ha multado a otros consejeros como Hilario Hernández (30.000\
    \ euros), María Amparo Ribera Mataix (25.000 euros), María López Fernández (15.000\
    \ euros), Antonio de Parellada Durán (15.000 euros) y Francisco Javier Rodríguez\
    \ (30.000 euros).\n    \n        Fuentes de la entidad han explicado a EFE que\
    \ BCC y todos los miembros del consejo han recurrido las sanciones del Banco de\
    \ España ante la Audiencia Nacional.\n    \n        La entidad entiende que el\
    \ consejo ha actuado “siempre desde la base de una interpretación correcta de\
    \ la norma que, además, ha estado avalada siempre por expertos independientes\
    \ en política de remuneraciones”."
