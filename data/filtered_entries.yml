- title: 'Albert Rösti, sur les coupes dans l’adaptation des forêts: «Je ne peux pas
    justifier cette décision sur le fond. Ces moyens sont nécessaires»'
  summary: 'Face aux vagues de chaleur, Albert Rösti défend la nécessité d’accélérer
    l’adaptation du pays: le ministre de l’Environnement confirme une nouvelle loi
    CO2, une stratégie nationale pour l’eau et revient sur la coupe de 25 millions
    destinés à adapter les forêtsCanicule, sécheresse, forêts fragilisées: l’été 2026
    donne un avant-goût des défis climatiques auxquels la Suisse doit se confronter.
    Pour Albert Rösti, il faut désormais renforcer les moyens consacrés à l’adaptation,
    sans réduire ceux destinés à la baisse des émissions de gaz à effet de serre.
    Le conseiller fédéral prépare une nouvelle loi CO₂ pour la période 2030-2040.
    Il annonce aussi une stratégie nationale pour mieux coordonner l’utilisation de
    l’eau en période de pénurie. Sur les 25 millions de francs annuels auxquels la
    Confédération a renoncé pour rendre les forêts plus résistantes au changement
    climatique, il reconnaît une situation inconfortable. Entretien.

    Le Temps: L’été 2026 fait tomber des records de températures. La Suisse doit-elle
    désormais changer sa manière de se préparer aux épisodes de chaleur extrême?

    Voir plus'
