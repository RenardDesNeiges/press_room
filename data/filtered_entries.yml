- title: El Gobierno vasco pide que "se agoten todas las vías para que vuelvan con
    sus familias" los menores llegados a Ceuta
  summary: "La consejera Nerea Melgosa reclama que \"cualquier derivación debe acordarse\"\
    \ y realizarse con \"financiación suficiente y todas las garantías\", y recuerda\
    \ que el sistema vasco de protección \"ya trabaja por encima de su capacidad ordinaria\"\
    El PP se enreda con la acogida de menores: dice ahora que “cumplirán la ley” mientras\
    \ varias comunidades en las que gobiernan con Vox se oponen\n        La consejera\
    \ vasca de Bienestar, Juventud y Reto Demográfico, Nerea Melgosa, ha reclamado\
    \ que “se agoten todas las vías para que vuelvan con sus familias” los menores\
    \ llegados a Ceuta. Asimismo, ha recordado que el sistema de protección de Euskadi\
    \ “trabaja ya por encima de su capacidad ordinaria”, y ha demandado que “cualquier\
    \ derivación debe acordarse” con las instituciones vascas, y realizarse “con expedientes\
    \ completos, financiación suficiente y todas las garantías jurídicas y asistenciales”.\n\
    \    \n        En declaraciones a los medios de comunicación en Vitoria, Melgosa\
    \ ha asegurado que le “preocupa” que, ante la crisis en Ceuta por la llegada de\
    \ migrantes, se esté “normalizando lo excepcional, que haya menores lejos de sus\
    \ familias”, informa Europa Press. De este modo, ha considerado que “no parece\
    \ razonable que la primera respuesta sea trasladar a menores a más de mil kilómetros\
    \ de distancia, a lugares donde no tienen ningún arraigo”. “Estamos hablando de\
    \ niños, niñas y adolescentes”, ha insistido la consejera vasca, que ha apelado\
    \ a que, “antes de plantear cualquier derivación, se debería acreditar que efectivamente\
    \ se han agotado todas las vías para localizar a sus familias, valorar una reunificación\
    \ cuando sea posible y garantizar que cada decisión responde al interés superior\
    \ del menor”.\n    \n        En este sentido, ha remarcado que “la primera obligación\
    \ del Estado no es repartir menores”, sino “ejercer plenamente las responsabilidades\
    \ que le corresponden y, por lo tanto, agotar las vías para que vuelvan con sus\
    \ familias”. Nerea Melgosa ha incidido en que Euskadi “lleva años demostrando\
    \ con hechos su compromiso con la protección de la infancia y con una migración\
    \ ordenada, regular y humana”, ya que, según ha defendido, “es la manera más justa\
    \ de tratar este fenómeno”.\n    \n        La consejera ha recordado que el sistema\
    \ vasco de protección “ya trabaja por encima de su capacidad ordinaria”. “Y esa\
    \ realidad no puede ignorarse”, ha emplazado. En esta línea, ha reivindicado que\
    \ “la cooperación entre instituciones exige lealtad, planificación y respeto competencial”\
    \ y, por ello, no puede haber “decisiones unilaterales ni hechos consumados”.\n\
    \    \n        Así, ha demandado que “cualquier derivación debe acordarse con\
    \ el Gobierno vasco y con las Diputaciones Forales, que son quienes asumen la\
    \ tutela, y realizarse con expedientes completos, financiación suficiente y todas\
    \ las garantías jurídicas y asistenciales”.\n    \n        Euskadi, por su parte,\
    \ seguirá “actuando con responsabilidad” porque, en palabras de Nerea Melgosa,\
    \ “proteger a la infancia forma parte de nuestros valores”. “Esa misma responsabilidad\
    \ - es la que nos ha llevado a defender la necesidad de dotarnos de nuevas capacidades\
    \ políticas para gestionar una realidad migratoria cada vez más compleja”, ha\
    \ concluido."
