- title: León es el destino final de un polémico festival de electrónica relacionado
    con el eclipse no autorizado en Segovia y Soria
  summary: "El Iberia Eclipse elige el Parque Natural de Babia, tras ser expulsado\
    \ de Vinuesa, para su evento multitudinario aunque aún no se ha aprobado su celebración\n\
    \nMAPA  - Dónde ver el eclipse solar del 12 de agosto: recorrido y visibilidad\
    \ en cada municipio, minuto a minuto\n        Se puede decir a estas alturas,\
    \ a tan solo unos días, que hay una 'eclipsemanía' en los lugares en los que este\
    \ fenómeno va a ver mejor. Las reservas hoteleras de la franja con mejor visibilidad\
    \ están cerradas desde hace meses. Algunos piensan que el evento del año, quizás,\
    \ se puede hacer un poco más redondo si se le añaden un par de ingredientes: naturaleza\
    \ y música.\n    \n        Ese era el objetivo de dos festivales que, al amparo\
    \ del eclipse, habían presentado sus carteles, con la música techno y djs como\
    \ reclamo: Astral Plane, que se iba a realizar en la estación de esquí de La Pinilla\
    \ en Segovia, e Iberia Eclipse, que había escogido la localidad soriana de Vinuesa\
    \ y su entorno al pantano de la Cuerda del Pozo, como sede. Al final, el rechazo\
    \ de permisos y la oposición de vecinos en Segovia agruparon el evento en uno\
    \ solo en la localidad soriana y, más recientemente, han obligado a hacer las\
    \ maletas hasta León, a Cabrillanes de Babia, en la Reserva de Biosfera del Parque\
    \ de Natural. elDiario.es se ha puesto en contacto con ambos eventos para interesarse\
    \ por su posición, pero no ha recibido respuesta al respecto.\n    Astral Plane,\
    \ de la estación de la Pinilla a juntarse con el de Soria\n        Astral Plane,\
    \ según sus publicaciones en Instagram, se promocionaba como un festival que había\
    \ elegido La Pinilla —en la Sierra de Ayllón— como un enclave con “condiciones\
    \ privilegiadas para observar el eclipse, con una alta probabilidad de cielos\
    \ despejados”. El “momento central”, como lo definían, vendría de la mano del\
    \ dj Kevin Saunderson, “pionero del techno de Detroit”, cuya actuación se alargaría\
    \ durante cuatro horas y coincidiría con el “instante exacto de la totalidad”.\
    \ Además, durante el festival se iba a ofrecer charlas y talleres explicando el\
    \ eclipse.\n    \n        Entre los reclamos, además de los propios djs, el entorno\
    \ y la poca contaminación lumínica de la zona. Los precios originales de los abonos\
    \ generales rondaban los 192,50 euros y las entradas de día entre 66 euros y 77\
    \ euros. También ofrecía servicios de 'glamping' en el festival, dirigido a un\
    \ público internacional.\n    \n        Todo parecía idílico en las redes sociales\
    \ desde mediados de agosto de 2025, pero no tenían los permisos municipales ni\
    \ la organización podía garantizar esta celebración. Colectivos de la zona, como\
    \ la Asociación ‘Salvemos el Pico del Lobo’ se dirigieron en junio de este año\
    \ al Ayuntamiento de Cerezo de Arriba, donde se encuentra la estación, y a la\
    \ Delegación Territorial de la Junta de Castilla y León —que alegó falta de competencias—\
    \ para pedirles que se revisase si contaban con todos los permisos. Además, llevaron\
    \ el caso ante la Fiscalía Provincial de Segovia y la Guardia Civil.\n    \n \
    \       El colectivo advirtió de los riesgos ambientales y de seguridad derivados\
    \ de celebrar un acontecimiento multitudinario durante el eclipse en un lugar\
    \ que no figura entre los puntos oficiales de observación. Definitivamente, el\
    \ propio consistorio anunció en junio que no permitía el evento, mientras la organización\
    \ seguía vendiendo entradas y con la promoción en redes.\n    \n        El Ayuntamiento\
    \ de Cerezo de Arriba comunicó en junio que el evento no se había autorizado.\
    \ A pesar de ello, el festival continuó promocionándose y vendiendo entradas.\n\
    \    Otro festival de 200 artistas\n        Astral Plane anunció el mes pasado\
    \ que cancelaba su evento en La Pinilla y se fusionaba con el de Iberia Eclipse,\
    \ otro festival con una filosofía similar que se iba a realizar en Vinuesa, un\
    \ pequeño pueblo de 900 habitantes junto al embalse más conocido de Soria. “Dos\
    \ festivales fundiéndose bajo un mismo eclipse”, presentaban en sus redes, en\
    \ las que explicaron que las entradas del Astral Plane servirían también para\
    \ el festival de Vinuesa. El evento tendría más duración, del 10 al 14 de agosto,\
    \ y sumaban sus carteles hasta los 200 artistas. \n    \n        La experiencia\
    \ era similar, aunque los precios eran más elevados: parcelas 'premium', para\
    \ autocaravanas a 800 euros o 1.600, suites con camas de madera o electricidad\
    \ entre los 1.800 euros para dos personas, 2.800 euros para seis. Además, se ofrecía\
    \ una conexión directa desde el aeropuerto de Barajas a Vinuesa por 55 euros por\
    \ trayecto. La entrada para los días ascendía a 260 euros, con el camping básico\
    \ incluido. \n    \n        La oferta que proponían era de tres escenarios con\
    \ “identidades musicales claramente diferenciadas”: uno de“ techno toda la noche”,\
    \ otro de “house y breaks al atardecer” y, el último, con “psytrance de día”.\n\
    \    \n        Según la organización, se escogió Vinuesa por su ubicación: el\
    \ eclipse total durará 1:42 minutos y hay poco riesgo de nubes, una baja contaminación\
    \ atmosférica y un entorno de montaña con un pinar y a orillas del pantano de\
    \ la Cuerda del Pozo. El evento lo organizaba Stelzinger GmbH a través de su corporación\
    \ en España Aguzanieves y otros colectivos internacionales con experiencia en\
    \ encuentros en torno a eclipses por todo el planeta, el último en 2024 en Texas.\n\
    \    El caos de otro festival y la falta de permisos hacen que se cancele\n  \
    \      Sin embargo, tampoco esta localización ha triunfado. A mediados de julio\
    \ Vinuesa acogió un festival motero que se saldó con una fallecida, varios robos\
    \ y una sensación de caos, lo que despertó las protestas de vecinos, asociaciones\
    \ locales. Pocos días después se reunieron varias administraciones públicas e\
    \ instituciones para analizar los incumplimientos de este evento —que superó con\
    \ creces el aforo previsto— y el alcalde de Vinuesa ya anunció que no quería repetir\
    \ la experiencia con otro evento masivo como el que parecía ser el Iberia Eclipse.\n\
    \    \n        El Ayuntamiento visontino rechazó la semana pasada que se celebrara\
    \ el festival dados los informes desfavorables de la Junta de Castilla y León\
    \ y la Confederación Hidrográfica del Duero (CHD). Además, tuvo en cuenta el recelo\
    \ de la población local y el miedo a los incendios forestales —este mismo miércoles\
    \ se registró un fuego—, puesto que en la comarca de Pinares Burgos-Soria se encuentra\
    \ el mayor pinar de Europa.\n    \n        En el pleno, la organización del evento\
    \ defendió que contaban con planes de colaboración con el comercio local, las\
    \ instituciones y la mejora ambiental, y que tenían intención de realizar otras\
    \ actividades en el futuro. \n    “Estamos destrozados”\n        La decisión fue\
    \ unánime: no se autorizaba el Iberia Eclipse. “Estamos destrozados”, lamentó\
    \ la organización a través de redes sociales. “Los informes oficiales no recogían\
    \ ninguna objeción técnica a nuestro proyecto. Lo ocurrido en otro festival en\
    \ este paraje, semanas antes del nuestro, pesó demasiado al final. Estaba fuera\
    \ de nuestro control”, publicaron.\n    \n        Sin embargo, el Ejecutivo autonómico\
    \ emitió un informe que recomendaba no realizar ninguna actividad hasta otoño\
    \ debido a la necesidad de restauración, además de la existencia de un alto riesgo\
    \ de incendios.  Tampoco lo recomendaba la CHD, que emitió dictámenes desfavorables\
    \ debido a que la promotora no había aclarado lo “suficiente” su identidad jurídica,\
    \ según expresó la Subdelegación del Gobierno en la provincia.\n    El festival\
    \ pasa a hacer en Babia, en León\n        En este momento, la organización contactó\
    \ con sus clientes, que no llegaban a las 3.000 entradas de aforo que tenían pensado\
    \ para darles opciones de reembolso o la forma en el que “este viaje puede continuar”.\
    \ En concreto, la siguiente parada pasa por la comarca de Babia, en León, aunque\
    \ la propia organización no ha confirmado su ubicación exacta.\n    \n       \
    \ Después de unos días, la organización del Iberia Eclipse anunció que seguían\
    \ adelante. “La Luna no se cancela”, apuntaban en otro comunicado en Instagram.\
    \ “El camino hasta aquí ha cambiado más de lo que jamás imaginamos, pero la razón\
    \ por la que comenzamos este viaje sigue esperándonos en el cielo”.\n    \n  \
    \      En un principio no se fijó la ubicación exacta del festival, aunque sería\
    \ en la provincia de León, lo que ha levantado el recelo de algunos de los asistentes:\
    \ “En un precioso nuevo hogar, a una hora de León, España, la luna pasará frente\
    \ al sol. La luz desaparecerá. El paisaje cambiará. Y estaremos allí, juntos”.\
    \ Días después, acotaron a “las montañas de León” y ya avanzaban que el evento\
    \ sería “más pequeño y sencillo”.\n    Red Natura y Reserva de la Biosfera\n \
    \       En principio, el lugar escogido Cabrillanes de Babia, una localidad del\
    \ Parque Natural de Babia y Luna, un espacio protegido que forma parte de la Red\
    \ Natura 2000 y es considerado por la UNESCO como Reserva de la Biosfera al acoger\
    \ especies protegidas como el oso pardo cantábrico y el lobo ibérico.\n    \n\
    \        Para la celebración en este nuevo sitio, la organización ha parado la\
    \ venta de entradas y espera que el público que no haya reclamado su devolución\
    \ se traslade a este nuevo emplazamiento. Eso sí, justifican en su web que, en\
    \ vez de “rendirse” han preferido “recordar” por qué empezaron y optar por “algo\
    \ más fiel al origen”. \n    \n        El alcalde Cabrillanes, Emilio Martínez,\
    \ ha confirmado a este diario que la organización ha consultado los terrenos disponibles\
    \ en la localidad y que se les ha remitido a remitir una solicitud presentando\
    \ los informes pertinentes y los planes teniendo en cuenta “toda la protección\
    \ que tenemos: Parque Natural, Red Natura 2000,  zona especial protección de aves\
    \ el riesgo de incendio. Con eso, se valorará si se autoriza o no se autoriza”.\n\
    \    \n        De momento, según ha comentado a Martínez, los vecinos del pueblo\
    \ han llamado al regidor para interesarse por el tema. La respuesta de la Alcaldía\
    \ es que van a esperar a ver esos informes, aunque ha asegurado que “a lo mejor\
    \ hasta por el tema de plazos es imposible de cumplir” al quedar solo una semana\
    \ y haber “muchos informes que recabar”.\n    \n        Desde CGT León se ha mostrado\
    \ el rechazo a la celebración del festival por el riesgo de incendios, los riesgos\
    \ para la fauna y flora así como los posibles problemas de seguridad. El sindicato\
    \ ha reclamado a las administraciones que sean “transparentes” cuando se dan permisos\
    \ y se informe a los ciudadanos de las “características del evento, de las empresas\
    \ que están detrás de los festivales y de las medidas de prevención de riesgos\
    \ que se van a implementar”. “Todo esto se debe de hacer con la suficiente antelación\
    \ para permitir el derecho a la ciudadanía de presentar alegaciones y pedir información”,\
    \ han defendido.\n    \n        El Ayuntamiento valorará este jueves la documentación\
    \ que presente la organización del Iberia Eclipse junto a un Cecopi, que ha sido\
    \ convocado en León, para abordar el dispositivo para el día 12 de agosto. Desde\
    \ el consistorio, en un comunicado, han querido mandar un mensaje de “serenidad”\
    \ a los vecinos y “no se adoptará ninguna decisión al margen de la legalidad ni\
    \ se permitirá la celebración de ningún evento que no reúna todas las garantías\
    \ exigidas por la normativa vigente”."
