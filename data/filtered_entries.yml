- title: 'Ceuta: de zombis, invasiones y avalanchas'
  summary: "No vemos personas individuales con nombre e historia propia, sino “migrantes”\
    \ genéricos, miembros de un ser colectivo, anónimos, intercambiables, prescindibles.\
    \ El relato de la “invasión” y la “avalancha” acentúa esa deshumanización\n  \
    \      Guerra Mundial Z: miles de zombies intentan entrar en una fortificada Jerusalén,\
    \ usando sus propios cuerpos para formar una escalera de carne que supere las\
    \ murallas, unos sobre otros como hormigas enfurecidas, hasta llegar arriba y\
    \ caer por el otro lado donde van acumulándose en una montonera informe que facilita\
    \ el paso a los que vienen detrás, sin que los soldados puedan hacer nada por\
    \ frenarlos pues son demasiados y, cuando unos caen, otros caminan sobre sus restos.\n\
    \    \n        ¿Tú también te acordaste de Guerra Mundial Z al ver las imágenes\
    \ de Ceuta? Elon Musk lo hizo, las redes sociales de la ultraderecha mundial lo\
    \ repitieron, todos compartiendo fotogramas y vídeos de la famosa película ¿Y\
    \ nosotros? El problema no es que la extrema derecha proponga un imaginario de\
    \ “zombis”, “invasión” y “avalancha”: el problema es que todos lo tenemos interiorizado,\
    \ y por mucho que nos digamos comprometidos con los derechos humanos, también\
    \ nosotros vemos una masa amorfa de cuerpos anónimos que avanzan como “zombis”,\
    \ “invaden” y caen en “avalancha”.\n    \n        No culpo al cine de zombis,\
    \ que desde sus inicios ha recogido nuestras ansiedades colectivas con su fuerza\
    \ metafórica: ya fueran las tensiones raciales, el miedo a la enfermedad contagiosa\
    \ o ahora las migraciones, el zombi es “el otro” por excelencia, el que amenaza\
    \ nuestra forma de vida, el que puede infectarnos y convertirnos también en otros.\
    \ Desde que además los zombis del cine corren veloces y atacan en grandes grupos\
    \ -frente al zombi lento y tonto de antes-, en el inconsciente colectivo ha quedado\
    \ fijada esa imagen del primer párrafo como representación de nuestros terrores.\n\
    \    \n        A los migrantes siempre los ha deshumanizado el relato político\
    \ y periodístico, y a veces también la ficción, incluso cuando es bienintencionada.\
    \ No vemos personas individuales con nombre e historia propia, sino “migrantes”\
    \ genéricos, miembros de un ser colectivo, anónimos, intercambiables, prescindibles.\
    \ El relato de la “invasión” y la “avalancha” acentúa esa deshumanización: nos\
    \ invaden como plagas incontenibles; caen sobre nosotros en avalancha como piedras\
    \ o como una masa informe e indistinguible.\n    \n        No es solo la ultraderecha\
    \ la que habla de “invasión” y “avalancha”: estos días la prensa, no solo la de\
    \ derecha, presenta a los migrantes como proyectiles humanos, munición en manos\
    \ de gobiernos y mafias, objetos arrojadizos que son lanzados, que hay que detener,\
    \ que se acumulan en las fronteras, que las desbordan, que agujerean vallas, que\
    \ pasan unos sobre otros, que se hunden en el mar y caen rodando por las rocas,\
    \ que ocupan la ciudad, que se dispersan por las calles, que provocan el pánico\
    \ y las persianas bajadas, que luego son enviados de vuelta, que se disuelven\
    \ pero permanecen como amenaza hasta la siguiente ocasión.\n    \n        Nadie\
    \ pondrá nombre ni dará historia al centenar, tal vez más -desconocer la cifra\
    \ exacta es parte de su deshumanización-, que han muerto intentando entrar en\
    \ Ceuta. Son solo parte de una invasión, de una avalancha."
