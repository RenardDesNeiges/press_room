    \                                    \n                \n\n                \n\n\
    \            \n            \n\n            \n            \n                  \
    \          \n            \n                En la imagen, cubierta del tanque en\
    \ el que se ha producido la explosión.                            \n         \
    \                           \n            \n                \n        Hasta el\
    \ lugar se han desplazado efectivos del Consorcio de Emergencias de Gran Canaria,\
    \ la Policía Local de Telde, la Policía Nacional, Protección Civil y recursos\
    \ sanitarios del Servicio de Urgencias Canario (SUC), que trabajan de forma coordinada\
    \ para controlar la situación, atender a los afectados y garantizar la seguridad\
    \ en el entorno.\n    \n        El Ayuntamiento de Telde ha pedido a la ciudadanía\
    \ que evite desplazarse a las inmediaciones del polígono industrial mientras continúan\
    \ las labores de los equipos de intervención, con el fin de no dificultar el acceso\
    \ y la movilidad de los vehículos de emergencia. Asimismo, ha recomendado seguir\
    \ las indicaciones de los cuerpos de seguridad y ha asegurado que continuará informando\
    \ sobre la evolución del incidente conforme se disponga de información oficial."
