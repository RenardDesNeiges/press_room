- title: Un hombre de 82 años de Dos Hermanas, primera víctima mortal por el virus
    del Nilo este año en Andalucía
  summary: "La víctima, con patologías previas, permanecía ingresado en el hospital\
    \ Virgen de Valme tras ser diagnosticado el 27 de julio de meningoencefalitis\
    \ provocada por este virus que transmiten mosquitosCinco nuevos casos de fiebre\
    \ del Nilo Occidental elevan a 17 los contagios en Andalucía, todos en la provincia\
    \ de Sevilla\n        La Consejería de Sanidad ha ha confirmado el fallecimiento\
    \ del hombre diagnosticado de Fiebre del Nilo Occidental (FNO) residente en Dos\
    \ Hermanas que llevaba varios días ingresado. El paciente, de 82 años de edad\
    \ y con patologías previas, permanecía en el hospital Virgen de Valme de Sevilla\
    \ tras ser diagnosticado de meningoencefalitis por virus del Nilo occidental (VNO)\
    \ el pasado 27 de julio. \n    \n        Se trata de la primera víctima mortal\
    \ de este año, después de que en 2025 no se registrara ninguna después de sufrirse\
    \ en 2024 el peor brote de la historia de España con más de 20 fallecidos. El\
    \ problema adquirió tal calibre que derivó en protestas ciudadanas en las zonas\
    \ más cercanas a la marisma, donde suelen abundar más los mosquitos.\n    \n \
    \       En paralelo, las autoridades sanitarias andaluzas también ha confirmado\
    \ un nuevo caso en la localidad sevillana de Aznalcázar, con lo que ya son 17\
    \ los diagnosticados esta temporada, todos en la provincia sevillana. Se trata\
    \ de un caso leve de infección por virus del Nilo occidental (VNO), por lo que\
    \ se ha decretado hasta el 24 de agosto el periodo de declaración como área en\
    \ alerta de esta localidad sevillana. \n    \n        Esta situación de área en\
    \ alerta por circulación del virus del Nilo occidental (VNO) supone intensificar\
    \ las tres vigilancias (entomológica, animal y humana) en la zona, activar las\
    \ acciones de promoción comunitaria y reforzar las acciones de comunicación a\
    \ la ciudadanía a través de farmacias comunitarias y enfermería para que se adopten\
    \ las medidas de protección necesarias frente al VNO.\n    19 municipios en alerta\n\
    \        Actualmente, son 19 los municipios andaluces declarados como área en\
    \ alerta: Torredonjimeno en Jaén; Salobreña en Granada; Fuengirola y Las Lagunas-Mijas\
    \ en Málaga y Almensilla, Aznalcázar, Bollullos de la Mitación, Castilblanco de\
    \ los Arroyos, Coria del Río, Constantina, Dos Hermanas, Gelves, La Puebla del\
    \ Río, Mairena del Aljarafe, Palomares del Río, San Juan de Aznalfarache, Sevilla\
    \ y Villamanrique de la Condesa en la provincia de Sevilla y Lopera (Jaén). Asimismo,\
    \ se detectó circulación viral en Benacazón (Sevilla) y Bujalance (Córdoba), si\
    \ bien el punto de captura se localizó a más de 1,5 km del núcleo urbano, por\
    \ lo que no fue necesaria la declaración de área en alerta.\n    \n        Hasta\
    \ el momento, se han diagnosticado 12 casos leves y cinco neuroinvasivos de fiebre\
    \ del Nilo Occidental este año en Andalucía, concretamente en las localidades\
    \ de Palomares del Río, Villamanrique de la Condesa, La Puebla del Río, Coria\
    \ del Río, Aznalcázar, Sevilla, Bollullos de la Mitación y Dos Hermanas. Asimismo,\
    \ se ha detectado circulación de VNO en dos aves silvestres en Andalucía, de un\
    \ total de 219 analizadas, en una zona alejada de núcleos de población en el Parque\
    \ Nacional de Doñana. Hasta el momento, no se ha detectado circulación del VNO\
    \ en équidos durante la temporada actual.\n    \n        Además, se está detectando\
    \ un incremento progresivo de las densidades, de modo que la última semana se\
    \ ha registrado una densidad abundante de mosquitos hembras transmisoras en La\
    \ Puebla del Río, Coria del Río, Los Palacios y Villafranca, Isla Mayor, Villamanrique\
    \ de la Condesa, Palomares del Río, Almensilla, San Juan de Aznalfarache, Benacazón\
    \ y Aznalcázar, en la provincia de Sevilla y Mollina en la provincia de Málaga.\n\
    \    \n        El Programa de FNO comunicó en marzo a todos los ayuntamientos\
    \ andaluces el nivel de riesgo con el que comenzaban la temporada de alta circulación.\
    \  Actualmente 122 municipios se encuentran en un nivel de riesgo alto: Almería\
    \ 6, Cádiz 18, Córdoba 14, Granada 5, Huelva 15, Jaén 9, Málaga 11 y Sevilla 44.\n\
    \    Recomendaciones\n        La Consejería de Sanidad pide tanto a las administraciones\
    \ competentes como a la ciudadanía adoptar medidas de protección y prevención,\
    \ pensando especialmente en las personas vulnerables, centradas fundamentalmente\
    \ en evitar la picadura del mosquito. Este recordatorio adquiere especial importancia\
    \ en aquellos municipios en los que se ha detectado una elevada presencia del\
    \ mosquito vector durante las últimas semanas.\n    \n        Así, se incide en\
    \ la necesidad de usar repelentes de mosquitos registrados y de uso tópico, cubrir\
    \ la mayor parte del cuerpo con ropa clara y evitar los olores intensos (perfumes,\
    \ jabones aromatizados…) porque atraen a los mosquitos. Asimismo, anima a reforzar\
    \ las medidas domésticas, como instalar mosquiteras, usar insecticidas domésticos/repelentes\
    \ ambientales o apagar las luces si no son necesarias, porque la luz atrae a los\
    \ mosquitos.\n    \n        Otra medida fundamental es evitar generar zonas de\
    \ agua estancada, donde los mosquitos crían sus larvas, por lo que se recomienda\
    \ mantener adecuadamente las albercas, piscinas y lavaderos y vaciar el agua que\
    \ pueda acumularse y pasar desapercibida en jardines, macetas, juguetes o cubos.\n\
    \    \n        En el caso de explotaciones ganaderas, se aconseja, igualmente,\
    \ renovar con frecuencia los bebederos de los animales; evitar el agua de charcos\
    \ en rodadas de vehículos o caminos, fugas de agua por grifos o conducciones rotas,\
    \ abrevaderos con fugas o con poca renovación."
