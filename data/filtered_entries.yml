  EID: 135
- title: 'El PP se enreda con la acogida de menores: dice ahora que "cumplirán la
    ley" mientras varias comunidades en las que gobiernan con Vox se oponen'
  summary: "Alma Ezcurra matiza que el reparto en caso de producirse tendrá que ser\
    \ \"justo y con el Gobierno asumiendo la responsabilidad de sus propios actos\"\
    \ mientras que desde el Ministerio de Infancia recuerdan que las comunidades están\
    \ en cualquier caso obligadas por leyEl Gobierno de Aragón rechazará el reparto\
    \ de menores migrantes tras la crisis de Ceuta\n        El PP se enreda con la\
    \ acogida de los niños y adolescentes que permanecen solos en Ceuta desde el pasado\
    \ jueves. Después de dejar caer que se opondrían, la vicesecretaria de Coordinación\
    \ Sectorial del PP, Alma Ezcurra, ha matizado que sus comunidades “siempre van\
    \ a cumplir la ley”: “El Gobierno, en el reparto anterior, excluyó por razones\
    \ políticas a Catalunya y a País Vasco. El reparto, en caso de producirse, deberá\
    \ ser justo, planificado y con el Gobierno asumiendo la responsabilidad de sus\
    \ propios actos”, ha afirmado Ezcurra en una entrevista en Onda Cero.\n    \n\
    \        Pese a lo señalado por Ezcurra, varios ejecutivos autonómicos en los\
    \ que gobiernan en coalición con Vox han salido ya a anunciar su rechazo, como\
    \ Aragón y Castilla y León. Desde el Ministerio de Juventud e Infancia aseguran\
    \ que las comunidades no pueden negarse a acoger a una parte de los menores tras\
    \ la última reforma de la Ley de Extranjería y manifiestan su tranquilidad.\n\
    \    \n        La dirigente del PP se distancia así de las palabras del secretario\
    \ general del partido, Miguel Tellado, que este martes dejaba caer su negativa\
    \ y mezclaba los menores y los adultos: “El Gobierno es responsable de que, por\
    \ donde han entrado, que vuelvan a salir”. Ezcurra ha priorizado, en cualquier\
    \ caso, otros mecanismos que prevé la ley como “la reagrupación familiar o entregarlos\
    \ a los servicios sociales de su país de origen”.\n    \n        También se ha\
    \ diferenciado de Tellado al distinguir el caso de los menores y no mezclarlo\
    \ con la situación de los adultos: “Los mayores de edad tienen que salir y con\
    \ los menores se tiene que decidir el recurso que más adecuado es para su situación”.\
    \ “La filiación de estas personas es importantísima para la seguridad de estos\
    \ menores cuya integridad también hay que proteger. Es fundamental para proteger\
    \ a los menores que han llegado y a los que ya están en los centros”, ha añadido,\
    \ a la par que ha criticado que se hable ya de la acogida cuando no se sabe la\
    \ cifra total de niños y adolescentes que hay.\n    \n        Los cuatro pactos\
    \ de coalición autonómicos rubricados por PP y Vox recogen de forma expresa el\
    \ compromiso a oponerse “por todos los medios legales, jurídicos y políticos a\
    \ cualquier mecanismo de reparto de inmigrantes ilegales”. El párrafo es el mismo\
    \ en los cuatro documentos. Está encabezado por la frase “No más menores extranjeros\
    \ no acompañados (MENAS)” y luego incorpora lo siguiente: “Rechazo frontal a la\
    \ política inmigratoria del Gobierno central y a la llegada de más inmigrantes\
    \ ilegales, tanto mayores como menores de edad. El Gobierno [de cada comunidad]\
    \ rechazará de forma expresa la política inmigratoria del Gobierno de Pedro Sánchez\
    \ y se opondrá por todos los medios legales, jurídicos y políticos a cualquier\
    \ mecanismo de reparto de inmigrantes ilegales, tanto mayores como menores de\
    \ edad”. \n    \n        Fuentes del Ministerio de Juventud e Infancia han asegurado\
    \ a elDiario.es que, tras la reforma de la Ley de Extranjería aprobada el año\
    \ pasado —después de muchos meses de bloqueo y con el voto en contra de PP y Vox—,\
    \ las comunidades gobernadas por la derecha no tienen la capacidad de negarse\
    \ a acoger a los niños y adolescentes que les correspondan para aliviar la situación\
    \ de Ceuta. Las autonomías sí pueden recurrir cada expediente, pero estas fuentes\
    \ confían en que dichos recursos tan solo retrasen los traslados unos pocos días.\n\
    \    Las ONG exigen garantías contra la devolución de menores\n        “Los niños\
    \ y niñas no acompañados en Ceuta no deberían afrontar un futuro incierto. La\
    \ máxima prioridad en estos momentos es conseguir que estén en un lugar seguro\
    \ y acompañados de personal formado para su atención y acogida”, dice a elDiario.es\
    \ José María Vera, Director Ejecutivo de Unicef España. Al estar el sistema de\
    \ protección saturado, prosigue Vera, se deberían activar de forma inmediata “los\
    \ mecanismos de traslados contemplados en la Ley de Extranjería, para derivarlos\
    \ a centros según sus necesidades y que garanticen una acogida de calidad y servicios\
    \ esenciales”. “Como principio básico, se debe asumir la presunción de minoridad\
    \ de ese niño y niña, evitando que menores solos estén en centros con adultos”,\
    \ indica Vera.\n    \n        Paralelamente, el responsable de Unicef España recuerda\
    \ que se debe realizar un diagnóstico de “vulnerabilidades y de interés superior\
    \ del menor de forma individualizada, con el objetivo de detectar cualquier situación\
    \ de desprotección, como por ejemplo la trata de personas, identificar si los\
    \ menores tienen alguna discapacidad, si son posibles demandantes de asilo y protección\
    \ internacional, o si cuentan con referentes adultos cercanos a los que se pueda\
    \ contactar”. “Y a lo largo de todo el proceso es muy importante escucharlos,\
    \ conocer sus necesidades y expectativas”, apostilla.\n    \n        ONG especializadas\
    \ están manifestando su preocupación por los operativos de traslado de personas\
    \ hacia la frontera con Marruecos para su retorno, incluyendo el uso de camiones.\
    \ “En algunas de ellas pueden apreciarse personas de apariencia muy joven y, según\
    \ testimonios e informaciones recabados sobre el terreno, habría indicios de presencia\
    \ de niños, niñas y adolescentes”, alerta Save the Children, que señala que ha\
    \ recibido información sobre casos particulares de menores que “habrían sido acompañados\
    \ hasta la frontera”. La Cadena Ser informó este lunes de que un niño migrante\
    \ de 12 años estuvo a punto de ser llevado a la frontera, pero la intervención\
    \ de varios periodistas y un mando de la Legión impidió que fuera devuelto. Según\
    \ el mismo medio, el menor caminaba desde la ciudad de Ceuta hacia la frontera\
    \ “obligado por un legionario”, entre lágrimas y repitiendo la frase: “No, Marruecos,\
    \ no. No, Marruecos, no”."
