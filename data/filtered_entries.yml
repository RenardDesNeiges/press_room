- title: 'No era vandalismo, era una chapuza: el desastre del estanque reflectante
    deja en evidencia las obsesiones de Trump'
  summary: "La fiscal general de Washington afirma que los daños del estanque son\
    \ consecuencia de una reforma \"defectuosa\" y retira los cargos contra los \"\
    vándalos\" a los que Trump culpó de haber estropeado la pintura y contaminado\
    \ las aguas\n\nOPINIÓN - Trump y la metáfora del estanque, por Guillermo Fesser\n\
    \n        Donald Trump quiere cimentar su legado político con obras faraónicas\
    \ y enmarcarlo con remates dorados en toda la capital. Sin embargo, esas aspiraciones\
    \ de grandeza se han visto empañadas por la fallida reforma de la piscina reflectante\
    \ del Lincoln Memorial de Washington. El estanque se ha convertido en una especie\
    \ de charca triste y medio vacía que, paradójicamente, refleja las políticas erráticas\
    \ de esta Administración. Un fiasco que el mandatario atribuyó al vandalismo de\
    \ presuntos opositores a él, pero que ahora queda claro que se trató de un trabajo\
    \ “chapucero”. \n    \n        La decisión de remodelar el estanque reflectante\
    \ nacía del capricho del presidente de equipararla con la que tiene en su mansión\
    \ de Mar-a-Lago, en Florida. Trump quiso recubrir con una capa de pintura azul\
    \ –“azul de la bandera estadounidense”– un elemento del patrimonio histórico de\
    \ Estados Unidos para que luciera mejor de cara a la celebración del 250 aniversario\
    \ del país el pasado 4 de julio. La pintura, que inicialmente debía costar unos\
    \ dos millones de dólares, ha acabado costando más de 16 millones, a causa de\
    \ los problemas que ha acarreado la obra.\n    \n        Inmediatamente, Trump\
    \ achacó esos problemas a supuestos “vándalos”, quienes eran los presuntos causantes\
    \ de que a principios de junio el agua del estanque se infestara de algas: el\
    \ episodio irritó al mandatario y se convirtió en una metáfora indeseada de su\
    \ presidencia. \n    \n        Para intentar eliminar las algas, se envió al Servicio\
    \ de Parques Nacionales para matar las bacterias que alimentaban la planta. Los\
    \ trabajadores federales acudieron y vertieron a mano litros de peróxido de hidrógeno,\
    \ mientras agentes de la Guardia Nacional custodiaban el perímetro. Todavía se\
    \ puede ver en las calles de la capital algún póster desteñido que refleja aquella\
    \ competición: “Alga 1 - Trump 0”.  \n    La Justicia retira las acusaciones\n\
    \        El alga, sin embargo, no fue el único elemento disruptor. Entre el agua\
    \ verdosa empezaron a flotar trozos de la pintura azul con la que se había cubierto\
    \ el fondo. David Carter Hearn, antiguo piragüista olímpico, fue arrestado por\
    \ tocar uno de esos pedazos de pintura e imputado por “destruir una propiedad\
    \ tasada en 1.000 dólares o más”. La acusación podía costarle hasta la cárcel\
    \ al exdeportista, ya que se trataba de un delito grave. \n    \n        Hearn\
    \ había declarado que metió la mano en el estanque y tocado brevemente un trozo\
    \ que aún estaba adherido al borde. Sus abogados calificaron lo sucedido de “indignante”.\
    \ \n    \n        Hearn fue el caso más sonado, pero no el único. Otras tres personas\
    \ también fueron acusadas de delitos menores en relación con los daños supuestamente\
    \ causados al estanque reflectante. Según los registros judiciales, se observó\
    \ a los acusados despegar y arrancar trozos de pintura. Fue en ese momento cuando\
    \ el presidente escribió en Truth Social que los daños habían sido provocados\
    \ por unos “vándalos” que supuestamente habían hecho un corte de “170 metros con\
    \ un cuchillo o cuchillas de afeitar”.\n    \n        Trump escribió esa acusación\
    \ el 23 de junio, a pesar de que ya existía un informe anterior del Servicio de\
    \ Parques Nacionales que indicaba la existencia de desperfectos en el estanque.\
    \ Según los documentos gubernamentales revelados por el periódico The New York\
    \ Times, aunque los trabajadores federales encontraron dos cortes en secciones\
    \ de espuma entre las juntas de dilatación de la piscina, estos no estaban directamente\
    \ relacionados con el revestimiento de color azul ni con las algas.\n    \n  \
    \      Ahora, un mes después de que la Administración emprendiera acciones legales\
    \ contra los curiosos que se acercaron al estanque y que se atrevieron a meter\
    \ una mano en el agua, la fiscal general de Washington, Jeannie Pirro, ha retirado\
    \ las acusaciones contra todos ellos. \n    El Gobierno ocultó las causas reales\n\
    \        El viernes pasado, Pirro solicitó la desestimación del cargo contra Hearn,\
    \ porque el Departamento de Interior había informado incorrectamente al equipo\
    \ sobre el origen de los daños de la piscina. La fiscal general y aliada de Trump\
    \ aseguró que la pintura azul se había empezado a pelar a los dos días de finalizar\
    \ las obras y que Interior ocultó la información a la Fiscalía, diciendo que “casi\
    \ todos los daños” habían sido causados por vándalos.\n    \n        Pirro afirmó\
    \ que factores como la lluvia, el viento y las demoras en la obtención del sellador\
    \ “provocaron un trabajo apresurado y chapucero”, que no se corrigió antes de\
    \ que se volviera a llenar de agua a principios de junio. A raíz de la retirada\
    \ de los cargos contra el atleta olímpico, las otras tres personas imputadas también\
    \ solicitaron que se revisaran sus casos y, finalmente, esta semana se han desestimado\
    \ las acusaciones.\n    \n        La decisión de Pirro –que ha afirmado públicamente\
    \ que el Gobierno emitió declaraciones falsas sobre los daños de la piscina– ha\
    \ provocado la ira del republicano. El presidente escribió el viernes en Truth\
    \ Social que discrepa “totalmente” con la decisión de la fiscal. “¿En qué estaba\
    \ pensando? Para mí, fue un caso puro de vandalismo”, aseguró. \n    \n      \
    \  Este lunes, iba un paso más allá y cargaba contra Pirro, diciendo que se “ha\
    \ plegado como un paraguas” en medio de la tormenta. Horas después de criticarla,\
    \ el magnate se reunió con ella en la Casa Blanca en medio del runrún de una posible\
    \ destitución."
