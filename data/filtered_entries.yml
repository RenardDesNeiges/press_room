- title: Qué hay detrás de la embestida de Meloni contra España por la crisis de Ceuta
  summary: "Los acontecimientos de Ceuta han servido a la líder ultra para relanzar\
    \ propuestas contra la migración como su polémico 'Modelo Albania' y para recuperar\
    \ fuerza de cara a los comicios de 2027 en Italia bajo la presión de un nuevo\
    \ rival aún más ultraMeloni asegura que la suspensión de Schengen con España es\
    \ “extraordinaria” y necesaria para “salvaguardar la seguridad nacional”\n   \
    \     Si hay una líder política que estos años buscó erigirse en referente antimigración\
    \ en Europa, esta es Giorgia Meloni. El Gobierno de la ultraderechista italiana\
    \ no ha dejado escapar la oportunidad que le ha brindado la llegada irregular\
    \ de decenas de miles de personas a Ceuta para volver a poner sobre la mesa sus\
    \ propuestas contra quienes intentan migrar a territorio europeo.\n    \n    \
    \    Lo sucedido en España ha copado titulares en Italia y la primera ministra\
    \ ha aprovechado el impacto internacional de la entrada de migrantes en la ciudad\
    \ autónoma para relanzar un plan de deportación a terceros países similar al conocido\
    \ como 'Modelo Albania' y emprender una ofensiva contra el modelo de Pedro Sánchez\
    \ que sitúa a Meloni en primera línea de la batalla migratoria en Europa.\n  \
    \  \n        Según analistas, críticos y fuerzas opositoras, esto le ha servido\
    \ para ganar fuerza en el debate político italiano y marcar perfil propio ante\
    \ el presidente español, visto en Italia como paladín del progresismo y gran némesis\
    \ ideológico de Meloni. En un contexto europeo donde las tesis antimigratorias\
    \ imperan, la primera ministra busca capitalizar la situación para recuperar protagonismo\
    \ en un asunto en el que había perdido peso.\n    \n\n    \n    \n      \n   \
    \   Es una forma oportunista e insensata de abrir una crisis diplomática con otro\
    \ Estado de la UE\n                \n                        Laura Boldrini\n\
    \                                        — diputada del opositor Partido Demócrata\n\
    \                      \n          \n\n  \n        La ofensiva de Meloni ha desatado\
    \ una crisis diplomática entre Italia y España, la más dura de los últimos años,\
    \ con la suspensión del tratado Schengen de libre circulación con España, un paso\
    \ visto como propagandístico por detractores de Meloni. Según alegan, la reacción\
    \ de la primera ministra obedece a sus intereses políticos propios, en un momento\
    \ de debilidad interna tras perder consensos y popularidad este año, mientras\
    \ las elecciones generales de 2027 se acercan y podría quedarse sin mayoría para\
    \ seguir en el poder, según varios sondeos.\n    \n        “La crisis de Ceuta\
    \ ha sido manipulada con la única finalidad de atacar a Sánchez. Resulta preocupante\
    \ que algunos países europeos hayan instrumentalizado lo sucedido en vez de mostrar\
    \ solidaridad con un socio europeo que se enfrentó a una emergencia”, dice a elDiario.es\
    \ Laura Boldrini, diputada del Partido Demócrata (el principal de la oposición)\
    \ y expresidenta del Parlamento italiano. Boldrini considera la suspensión del\
    \ tratado Schengen con España como “una forma oportunista e insensata de abrir\
    \ una crisis diplomática con otro Estado de la UE”.\n    Meloni actúa frente a\
    \ un rival más ultra\n        Para Luigi Quercetti, analista político con lazos\
    \ con la formación progresista +Europa, “Meloni hizo un juego de propaganda sucia\
    \ contra Sánchez porque tiene un color político diferente”, así como intereses\
    \ electorales e ideológicos distintos a los del presidente español. “En vez de\
    \ ofrecer solidaridad y ayuda humanitaria, cerró fronteras”, y actuó como lo hubieran\
    \ hecho Donald Trump o Elon Musk. “La crisis de Ceuta fue aprovechada por todo\
    \ el universo MAGA y Meloni se tiró de cabeza a la polémica porque es parte de\
    \ este entorno”, señala Quercetti.\n    \n        La primera ministra italiana\
    \ también endurece su discurso ultra por la competencia de Roberto Vannacci, veterano\
    \ militar y nuevo líder de ultraderecha supremacista italiano que podría arrebatarle\
    \ votos. Además, con una Italia ya metida en plena carrera electoral, Meloni busca\
    \ proyectarse de nuevo a nivel europeo como estandarte de una estrategia de traslado\
    \ forzoso y retención de migrantes en centros cerrados en terceros países, una\
    \ iniciativa que su Gobierno activó en Albania, aunque ha resultado ser un fracaso\
    \ tras varios varapalos judiciales.\n    \n\n    \n    \n      \n      La crisis\
    \ de Ceuta fue aprovechada por todo el universo MAGA y Meloni se tiró de cabeza\
    \ a la polémica porque es parte de este entorno\n                \n          \
    \              Luigi Quercetti\n                                        — analista\
    \ político\n                      \n          \n\n  \n        A pesar de que fue\
    \ uno de los proyectos estrella de Meloni, los dos centros de internamiento de\
    \ migrantes creados por Italia en suelo albanés están casi vacíos desde su apertura.\
    \ A ello se suma la imposibilidad del Gobierno italiano de parar en seco la llegada\
    \ de migrantes a través del Mediterráneo o de deportar a una gran cantidad de\
    \ personas en situación irregular, mientras Vannacci presiona apelando a la expulsión\
    \ masiva de extranjeros.\n    Ceuta, caldo de cultivo ideal \n        Pero Meloni\
    \ no se rinde y ha encontrado el caldo de cultivo ideal en la crisis de Ceuta.\
    \ No sólo ha relanzado sus estrategias antimigración que estos años fueron precursoras\
    \ en Europa, sino que ha movilizado a muchos gobiernos de derecha y centroderecha\
    \ que no ven con buenos ojos las políticas migratorias de España y su regularización\
    \ de migrantes.\n    \n        Lo sucedido en Ceuta “brindó la oportunidad a Meloni\
    \ de mostrar cómo sus ideas y proyectos son parte de una visión política a largo\
    \ plazo” y “le dio un empujón para retomar protagonismo en el tema migratorio”,\
    \ argumenta a elDiario.es Giorgia Bulli, experta en ultraderecha y docente en\
    \ la Universidad de Estudios de Florencia. De esta forma, explica Bulli, Meloni\
    \ reivindica la vigencia de su modelo ante la presión de Vannacci, pero también\
    \ ante la postura más centrista de la oposición italiana.\n    \n        Según\
    \ Muhammad Dihani, refugiado saharaui residente en Roma y activista por los derechos\
    \ humanos vinculado a Amnistía Internacional, desde Italia “ha habido varios ataques\
    \ contra España” por Ceuta. “Uno es contra la política migratoria del Gobierno\
    \ de Sánchez y otro, muy grave, contra el Tribunal Supremo” de España, que en\
    \ julio consideró ilegales las “devoluciones en caliente” de los migrantes interceptados\
    \ en alta mar cuando intentan acceder a nado a Ceuta y Melilla. \n    \n\n   \
    \ \n    \n      \n      Ceuta brindó la oportunidad a Meloni de mostrar cómo sus\
    \ ideas y proyectos son parte de una visión política a largo plazo\n         \
    \       \n                        Giorgia Bulli\n                            \
    \            — experta en ultraderecha\n                      \n          \n\n\
    \  \n        El fallo del Supremo fue citado en la carta que Meloni presentó con\
    \ su homóloga danesa, Mette Frederiksen, con el apoyo de otros 20 Gobiernos europeos,\
    \ para pedir una reunión extraordinaria de ministros de Interior de la UE. “La\
    \ sentencia del Tribunal Supremo español fue usada para desatar el ataque y abusar\
    \ de nuestro sistema de migración y asilo”, escribieron en la misiva, en la que\
    \ pidieron “reforzar las fronteras exteriores, combatir la inmigración irregular,\
    \ luchar contra los traficantes de seres humanos, hacer más efectivos los retornos\
    \ y eliminar todo factor que pueda incentivar nuevos ingresos ilegales”.\n   \
    \ \n        En el texto también criticaron la reciente regularización de migrantes\
    \ en España, vinculándolo a un supuesto 'efecto llamada', algo que resaltó la\
    \ semana pasada el ministro de Exteriores italiano, Antonio Tajani, en un mensaje\
    \ de X que aumentó aún más las tensiones con España. \n    \n        En una entrevista\
    \ este martes con el periódico Il Corriere della Sera, el también viceprimer ministro\
    \ italiano reiteró sus críticas: “España está regularizando 500.000 extranjeros\
    \ indocumentados sin haber compartido esta decisión con sus socios europeos, esto\
    \ no está bien”. Y ha lanzado una advertencia: “Lo ocurrido en Ceuta no es un\
    \ hecho aislado, marca un riesgo para toda la Unión y tenemos derecho a exigir\
    \ medidas adicionales, aclaraciones y medidas preventivas para asegurar que no\
    \ se repita”.\n    \n        El comisario europeo de Interior y Migraciones, Magnus\
    \ Brunner, ha negado este martes que haya una relación entre la regularización\
    \ de migrantes y la entrada de personas migrantes en Ceuta. Las personas que cruzaron\
    \ la semana pasada a la ciudad autónoma no pueden acogerse al procedimiento extraordinario,\
    \ cuyo plazo de presentación de solicitudes cerró hace un mes y que exigía, entre\
    \ otros requisitos, haber entrado antes del 1 de enero de 2026 y haber vivido\
    \ en España de manera continuada al menos cinco meses.\n    Italia reivindica\
    \ el 'Modelo Albania'\n        En la reunión de ministros de Interior celebrada\
    \ este martes, el Ejecutivo de Meloni planteó una propuesta que busca reproducir\
    \ en cierta medida su 'Modelo Albania'. Roma quiere promover centros de detención\
    \ de migrantes en terceros países, fuera de la UE, con financiación y coordinación\
    \ comunitaria.\n    \n        Con un esquema similar al de Albania, en esas instalaciones\
    \ se gestionaría la tramitación de asilo y eventual deportación de migrantes que\
    \ hayan intentado entrar irregularmente a la UE. Entre los países que estarían\
    \ abiertos a acoger los centros, destaca Uganda, aunque también suenan Libia,\
    \ Túnez, Mauritania, Senegal o Ghana.\n    \n        “Ha llegado el momento de\
    \ adoptar nuevos modelos de centros para la gestión externa de los procedimientos\
    \ de asilo y las repatriaciones a terceros países seguros, superando los antiguos\
    \ tabúes ideológicos del pasado”, ha dicho este martes ante sus homólogos europeos\
    \ el titular de Interior italiano, Matteo Piantedosi. En un gesto que parecía\
    \ buscar rebajar las tensiones con Madrid, Piantedosi ha expresado “la sincera\
    \ solidaridad de Italia con el Gobierno español”.\n    \n\n    \n    \n      \n\
    \      Ha llegado el momento de adoptar nuevos modelos de centros para la gestión\
    \ externa de los procedimientos de asilo y las repatriaciones a terceros países\
    \ seguros, superando los antiguos tabúes ideológicos del pasado\n            \
    \    \n                        Matteo Piantedosi\n                           \
    \             — ministro italiano de Interior\n                      \n      \
    \    \n\n  \n        Pese a que el futuro de los centros albaneses sigue pendiente\
    \ de una resolución del Tribunal de Justicia de la UE, el ministro ha destacado\
    \ que Italia “fue pionera” de ese plan. “Los procesos fronterizos acelerados y\
    \ la repatriación directa a instalaciones en terceros países seguros son el elemento\
    \ disuasorio más eficaz contra la trata de personas y los flujos migratorios irregulares”,\
    \ ha afirmado Piantedosi.\n    \n        La semana pasada, en sus primeras reacciones\
    \ a lo ocurrido en Ceuta, la primera ministra ultra no se solidarizó con España,\
    \ sino que resaltó los supuestos peligros de la migración irregular, que vinculó\
    \ a la criminalidad. “Las imágenes que llegan de Ceuta son impactantes y muestran,\
    \ una vez más, que la inmigración clandestina fuera de control supone una amenaza\
    \ concreta para la seguridad de las fronteras europeas”, señaló en X el pasado\
    \ jueves.\n    \n        Un día después, anunció la suspensión del espacio Schengen\
    \ con España. “Defender las fronteras significa defender la seguridad de los ciudadanos,\
    \ combatir la migración irregular y golpear redes criminales que trafican con\
    \ seres humanos”, alegó, al ordenar la imposición de controles en puertos y aeropuertos\
    \ durante el mes de agosto. \n    \n        Una fuente del Ministerio de Interior\
    \ de Italia asegura a elDiario.es que, hasta el momento, esos controles “se hacen\
    \ aleatoriamente, sin afectar a ciudadanos españoles o en tránsito desde España\
    \ con documentos europeos”.\n    \n        Sin embargo, muchos resaltan que no\
    \ era necesario adoptar esa medida. “La entrada irregular en Ceuta no confiere\
    \ derecho alguno a permanecer en España, ni a viajar a la península o circular\
    \ por Europa”, aclaró el Ministerio de Exteriores español, mientras que Meloni\
    \ no lo mencionó explícitamente en sus declaraciones beligerantes sobre Ceuta.\n\
    \    \n        “Para Meloni, explotar la cuestión migratoria es fácil, resulta\
    \ conveniente a nivel electoral”, afirma Bulli. Según la docente y experta en\
    \ ultraderecha, ahora mismo Sánchez es el blanco perfecto para los ataques de\
    \ Italia “porque justo él se expuso mucho en este ámbito”."
