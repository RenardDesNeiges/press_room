- title: La excepcional escultura de Miguel Ángel que no se encuentra en Italia y
    que fue robada por Napoleón y Hitler
  summary: "Tanto Napoleón como Hitler la quisieron para sus proyectos truncados de\
    \ museos nacionalesEl museo de Roma que Napoleón intentó vaciar y es una de las\
    \ pinacotecas italianas más visitadas\n\n        En sus 88 años de vida, el artista\
    \ Miguel Ángel apenas vio salir de Italia muchas de sus obras, por eso la que\
    \ es seguramente la escultura más famosa de Brujas, la ‘Virgen con el Niño’ o\
    \ ‘Madonna’, es una rara excepción en la historia del arte.\n    \n        Una\
    \ escultura de mármol que se inspiró en la Piedad y que se encuentra en la iglesia\
    \ de Nuestra Señora de Brujas, en el norte de Bélgica, gracias a que fue rescatada\
    \ después de la Segunda Guerra Mundial tras ser robada por Hitler.\n    La ‘Madonna’\
    \ de Miguel Ángel que no existiría sin la Piedad\n        La ‘Virgen con Niño’\
    \ de la Iglesia de Nuestra Señora de Brujas es una de las obras de arte más conocidas\
    \ de la ciudad belga, por el hecho de ser obra de Miguel Ángel y una de las pocas\
    \ esculturas del artista que salieron de Italia en vida, además de que guarda\
    \ una interesante historia detrás.\n    \n        Fue encargada por el comerciante\
    \ flamenco Jean Mouscron dos años después de que Miguel Ángel creara La Piedad,\
    \ en la que muchos ven cierta similitud. Elaborada con mármol de Carrara y de\
    \ 128 centímetros, estaba pensada para ser ubicada en el lugar de su entierro\
    \ y el de su familia.\n    \n        Jean Mouscron y su hermano eran comerciantes\
    \ internacionales de sábanas inglesas y solían visitar Florencia con mucha frecuencia,\
    \ y donde pudieron coincidir con el hermano de Miguel Ángel, que también se dedicaba\
    \ en la ciudad al sector textil. Al tratarse de una obra renacentista, era entonces\
    \ muy moderna para Flandes y eso hizo que inspirara a artistas locales. La obra\
    \ costó 100 ducados, y redactó un documento en el que estipulaba que no debía\
    \ moverse de su ubicación en la mencionada iglesia de Brujas. Un hecho, sin embargo,\
    \ que no se ha respetado siempre.\n    La escultura que robaron Napoleón y Hitler\n\
    \        Y es que, en el siglo XVIII, Napoleón se apropió de la escultura de Miguel\
    \ Ángel para el proyecto de su Museo Nacional de París en la ubicación donde se\
    \ encuentra actualmente el Louvre. Después de la derrota en la batalla de Waterloo\
    \ en 1815, se devolvió a Brujas.\n    \n        Pero la ‘Madonna’ de Brujas volvería\
    \ a salir de la ciudad belga cuando Hitler se encaprichó de ella. La quería también\
    \ para un proyecto museístico, el ‘Museo del Führer’, que no se realizó, pero\
    \ que hizo que desaparecieran centenares de obras de arte durante la Segunda Guerra\
    \ Mundial.\n    \n        La ‘Madonna’ de Brujas estaría varios años desaparecida\
    \ hasta que fue encontrada por los ‘Monuments Men’, de los que hizo película Hollywood,\
    \ que eran un grupo de soldados estadounidenses que se encargaban de recuperar\
    \ obras robadas por los nazis. En concreto, la escultura de Miguel Ángel fue hallada\
    \ en las minas de sal de Altaussee en Austria, un complejo subterráneo donde se\
    \ habían escondido miles de obras."
