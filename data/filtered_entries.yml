- title: Infantino ofrece a Marruecos la final del Mundial 2030 para ganarse su apoyo
    en plena crisis de la FIFA, según The Times
  summary: "El medio británico apunta a que el presidente de la FIFA buscaría ganarse\
    \ el apoyo de la Federación marroquí para un cuarto mandato, en plena crisis tras\
    \ su intento de privatizar la competición y en medio de acusaciones de \"chantaje\"\
    Jordania acusa a la FIFA de “chantaje” para forzar el apoyo a la reelección de\
    \ Infantino como presidente\n\n        El presidente de la FIFA, Gianni Infantino,\
    \ ha ofrecido a Marruecos celebrar la final del próximo Mundial 2030, que organiza\
    \ junto a España y Portugal. La propuesta, según publica el periódico The Times,\
    \ busca que el país africano, uno de los aliados de Infantino, le apoyo en su\
    \ reelección como máximo mandatario del fútbol internacional, en un momento de\
    \ plena crisis, tras la retirada de apoyo de varios países que le habían dado\
    \ previamente su respaldo.\n    \n        La noticia llega en un momento de tensión\
    \ y justo cuando Sumar ha registrado una proposición no de ley para instar al\
    \ Ejecutivo —del que forma parte— a solicitar a la FIFA “una revisión y evalución\
    \ específica del actual modelo de organización conjunta” del próximo Mundial para\
    \ que esta no se comparta con Marruecos, tras la crisis de Ceuta en la que han\
    \ muerto, al menos, 141 personas tratando de cruzar la frontera. \n    \n    \
    \    El movimiento de Infantino de ofrecer la final del Mundial a Marruecos se\
    \ enmarca en una estrategia de recabar apoyos para su reelección, cuando está\
    \ perdiendo progresivamente el respaldo de países que habían enviado cartas para\
    \ apoyar su continuidad en el cargo para un cuarto mandanto. Las elecciones se\
    \ celebrarán el próximo mes de marzo. \n    \n        El periódico The Guardian\
    \ avanzaba a principios de esta semana que las federaciones europeas irían retirando\
    \ su apoyo al presidente de la FIFA escalonadamente. Una informació que, por el\
    \ momento, han ido confirmando los movimientos de Gales, Inglaterra, Finlandia\
    \ y Serbia. Se espera que más federaciones europeas sigan sus pasos en los próximos\
    \ días, mientras que varias naciones de la CONCACAF —la confederación de Norteamérica,\
    \ Centroamérica y el Caribe— también están considerando seriamente retirar su\
    \ apoyo.\n    \n        Este mismo miércoles, el presidente de la federación jornada,\
    \ el príncipe Ali, publicó un comunicado en su cuenta de X en el que acusaba al\
    \ equipo de Infantino de “chantaje”: “Durante el Mundial, se me comunicó verbalmente\
    \ que, si apoyaba a Infantino, eso contribuiría en gran medida a ayudar a nuestra\
    \ Federación de Fútbol”, señala, lo que “equivale a un chantaje”. \n    \n   \
    \     Infantino ha ido perdiendo apoyos tras su plan para privatizar el Mundial,\
    \ del que tuvo que retractarse y del que reniega su número dos, el secretario\
    \ general de la FIFA, Mattias Grafström, quien en un email dirijo a sus empleados\
    \ y conocido recientemente calificó la iniciativa como “una serie de acontecimientos\
    \ tristes y censurables. \n    \n        Por su parte, el exentrenador del Arsenal,\
    \ Arsène Wenger, que ahora ocupa el cargo de director de desarrollo global de\
    \ la FIFA, afirmó que la retirada del proyecto era “absolutamente necesaria e\
    \ incuestionable”."
