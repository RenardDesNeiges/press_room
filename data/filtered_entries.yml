- title: 'Ayuso contra Ayuso: cómo ha cambiado su discurso sobre el ático de la Comunidad
    de Madrid en una semana'
  summary: "La líder madrileña justificó la necesidad del inmueble para llevar a cabo\
    \ \"reuniones\" durante las obras en la sede de la Puerta del Sol, pero ahora\
    \ sostiene que \"lo mejor desde el primer minuto es venderlo”\nAyuso defiende\
    \ que el ático comprado por la Comunidad de Madrid no era para uso personal: “Sería\
    \ muy poco inteligente”\n\n        De los argumentos que utilizó hace una semana\
    \ la presidenta de la Comunidad de Madrid, Isabel Díaz Ayuso, para defender la\
    \ compra de un ático de lujo en Chamberí por parte de la Comunidad de Madrid ya\
    \ queda muy poco. Si en aquel momento justificó que era necesario para llevar\
    \ a cabo “reuniones” durante las obras en la sede del Ejecutivo en la Puerta del\
    \ Sol, ahora ha pasado a defender la pertinencia de venderlo y asegurar que “no\
    \ se entendería” que el dinero se dedicara a otra cosa que no sea la reconstrucción\
    \ tras los incendios.\n    “Lo mejor desde el primer minuto es venderlo”\n   \
    \     29 de julio. La dirigente madrileña defendió la compra del inmueble para\
    \ la mudanza temporal por una “reforma integral” de la sede de la Puerta del Sol\
    \ por “daños estructurales”. “Buscar un lugar donde temporalmente se puedan recibir\
    \ reuniones me parece que es lo suyo”, insistió, y enmarcó la polémica en la existencia\
    \ de una campaña de “desprestigio” de los medios de comunicación en su contra.\n\
    \    \n        “Están a ver si se me echa la gente encima en un momento en el\
    \ que la gente ha perdido sus casas. Se ha obrado de mala fe”. Un día después,\
    \ el ejecutivo autonómico anunció su decisión de volver a vender el inmueble,\
    \ adquirido en abril, para que el dinero de esa potencial operación se dedicase\
    \ a la reconstrucción de las zonas afectadas por la oleada de incendios.\n   \
    \ \n        5 de agosto. Hoy, en cambio, Ayuso ha defendido que desde su gobierno\
    \ cada vez hay menos “gasto público y menos organismos” y “todo aquello que ahora\
    \ mismo no es necesario se pone a la venta”. “En este caso, creo que lo mejor\
    \ es desde el primer minuto dejarlo ahí, venderlo y aprovechar tanto ese recurso\
    \ como el de los inmuebles de Gran Vía [otra propiedad de Planifica Madrid a la\
    \ venta] para destinarlo en este momento a una necesidad como es esta. Creo que\
    \ no se entendería que se gastara o se empleara en otra cuestión. Ese es el motivo\
    \ por el que tomamos esa decisión”, ha argumentado ahora.\n    \n        Lo que\
    \ no ha aclarado es dónde trabajarán finalmente, dado que las obras en la sede\
    \ de la Presidencia comienzan, según la baronesa del PP, en otoño. Tampoco se\
    \ ha referido a las dificultades de Planifica Madrid para enajenar el inmueble\
    \ mucho más grande que tienen en la Gran Vía, a diez minutos a pie de la Puerta\
    \ del Sol. \n    \n        Sí ha mencionado, de forma velada, la venta de la vivienda\
    \ en la que convive con su pareja, Alberto González Amador, por más del doble\
    \ del precio por el que lo compró en 2022, cuando ya mantenía una relación con\
    \ la dirigente madrileña. “Entiendo que se hilen puntos porque se han dado dos\
    \ circunstancias a la vez y suena muy bien para intentar hacer daño (...) Sería\
    \ muy poco inteligente que, a estas alturas de mi vida política, en la Comunidad\
    \ de Madrid me buscaran una casa de la que además no me puedo esconder”. \n  \
    \  Una semana después, no sabe nada de la compra\n        En la semana que ha\
    \ pasado entre su primera comparecencia y la de este miércoles, Ayuso no ha podido\
    \ recabar más datos de la compra que, según han publicado El País y La Sexta,\
    \ supuso el pago de 6,3 millones. \n    \n        29 de julio. Hace siete días\
    \ se quejó de que no se contase “todo lo que se ha vendido” por parte de Planifica\
    \ Madrid “para comprar este u otros inmuebles”. “Me consta que ha habido venta\
    \ de otros muchos”, dijo. También defendió que no le “compete” a ella dar las\
    \ explicaciones por el uso de las oficinas y la compra de un ático porque no era\
    \ una vivienda para uso personal: “Yo no cuento lo que compra o vende Planifica\
    \ Madrid”.\n    \n        5 de agosto. “No tengo la menor idea porque no es mi\
    \ competencia”. En los siete días de goteo constante de nuevos detalles de la\
    \ operación en los medios de comunicación, la presidenta de Madrid no se ha interesado\
    \ la letra pequeña de la compra. O, al menos, eso es lo que ha dicho hoy públicamente:\
    \ “Les tengo que remitir a la Consejería de Presidencia porque es quien tiene\
    \ no solo la información detallada, sino los canales de comunicación a tal efecto”.\
    \ \n    \n        La empresa pública que adquirió el inmueble, Planifica Madrid,\
    \ depende de Presidencia, pero desde este organismo no ofrecen el expediente de\
    \ la compra. Ayuso tampoco ha aclarado tampoco por qué se adquirió un inmueble\
    \ que solo tiene licencia para uso residencial."
  media: https://static.eldiario.es/clip/088a8ce5-74d5-40bb-bf91-c08a6654121c_16-9-discover-aspect-ratio_default_0_x3182y677.jpg
