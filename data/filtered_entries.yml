- title: La Sociedad Cántabra de Escritores nombra socia de honor a Matilde de la
    Torre cuyos restos mortales llegaron en marzo desde el exilio mexicano
  summary: "Un reconocimiento que reivindica la figura de una mujer de sólidas convicciones\
    \ progresistas que ejerció una firme defensa de la libertad, los derechos sociales\
    \ y de la mujer junto a la recuperación del folklore tradicional Antecedentes\
    \ - La diputada republicana Matilde de la Torre vuelve del exilio: el coro que\
    \ fundó hace cien años impulsa el regreso de sus restos desde México\n       \
    \ La Sociedad Cántabra de Escritores ha concedido la distinción de Socia de Honor,\
    \ a título póstumo, a la escritora, política e intelectual cántabra Matilde de\
    \ la Torre en homenaje a su relevante trayectoria cultural en Cantabria. Un reconocimiento\
    \ que reivindica la figura de una mujer de sólidas convicciones progresistas que\
    \ ejerció una firme defensa de la libertad, los derechos sociales y de la mujer\
    \ junto a la recuperación y promoción del folklore y del cancionero tradicional\
    \ -otra de las facetas de su legado- “elementos que tanto distinguen a la comarca\
    \ de Cabezón de la Sal y al conjunto de Cantabria”, subraya la asociación. \n\
    \    \n        En opinión de este colectivo, Matilde de la Torre sigue siendo\
    \ “un referente de memoria, identidad y divulgación cultural”. Precisamente hace\
    \ unos meses, en marzo, las cenizas de la escritora y política socialista Matilde\
    \ de la Torre (1884-1946) regresan del prolongado y amargo exilio de la dictadura\
    \ a su 'Villacaciques' natal, apodo irónico que acuñó para la burguesía local\
    \ que boicoteó su academia de enseñanza y el coro campesino que inspiró. \n  \
    \  \n        Después de 79 años enterrada en el olvido del panteón español de\
    \ la Ciudad de México, el grupo de danzas Virgen del Campo de su pueblo, Cabezón\
    \ de la Sal (Cantabria), tomó la iniciativa de cumplir el último deseo de la diputada\
    \ republicana: descansar en su tierra. De hecho, sus restos y los de su hermano\
    \ Carlos regresaron del exilio y ya están enterrados en Cantabria después de 80\
    \ años de su fallecimiento. \n    Viernes 7 de agosto, el acto de entrega\n  \
    \      El acto de entrega de esta distinción se celebrará el próximo viernes,\
    \ 7 de agosto, a las 19:30 horas, en la Casa de Cultura Conde de San Diego, en\
    \ Cabezón de la Sal. La ceremonia contará con la presencia de autoridades, representantes\
    \ de la Sociedad Cántabra de Escritores y personas vinculadas al ámbito cultural,\
    \ en un encuentro de homenaje y reconocimiento a la figura de Matilde de la Torre\
    \ Gutiérrez. \n    Biografía de Matilde de la Torre\n        Matilde de la Torre\
    \ (Cabezón de la Sal, 1884, México, 1946) destacó sobre todo por su labor docente,\
    \ pedagógica y como estudiosa de la música, la danza y el folclore. La política\
    \ cántabra fue una de las nueve mujeres ocuparon un escaño durante la República\
    \ junto a Dolores Ibárruri, Clara Campoamor, Margarita Nelken, Victoria Kent,\
    \ María Lejárraga, Francisca Bohigas, Veneranda García Manzano y Julia Álvarez\
    \ Resano.\n    \n        Fundó la Academia Torre, siguiendo los principios de\
    \ la Institución libre de enseñanza, en el jardín de su propia casa junto a su\
    \ prima y maestra Consuelo Berges. Aspiraba a que las mujeres tuvieran la misma\
    \ educación que los hombres. \n    \n        Escritora comprometida de progresistas,\
    \ fue conferenciante y escritora de artículos periodísticos. Impulsó las casas\
    \ campesinas y fue además una gran estudiosa del folclore y fundó un grupo de\
    \ danzas y el Coro Voces Cántabras.\n    \n        En 1931 se afilió al Partido\
    \ Socialista y fue elegida diputada en las Cortes Generales por Asturias (1933-1939)\
    \ y ejerció como directora de Comercio y Política Arancelaria del Gobierno de\
    \ la II República (1936-1937). Tras la Guerra Civil se exilió, primero en Francia\
    \ y después en México, donde murió el 19 de marzo de 1946 a los 62 años. Allí,\
    \ con su hermano, fue acogida por el Hospital Español, una entidad de beneficencia.\n\
    \    \n        Sus restos descansaban en el Panteón Español de Ciudad de México,\
    \ de donde ha sido recientemente exhumada para regresar al cementerio de Cabezón\
    \ de la Sal donde se ha levantado un monolito en su memoria."
