- title: Una asociación se querella contra Pérez Llorca y la Federación de Fútbol
    por el regalo de la entrada a la final del Mundial
  summary: "La asociación Transparencia en el Deporte, que ya denunció a Luis Rubiales,\
    \ cree que puede darse un delito de cohecho y pide que declaren como testigos\
    \ el secretario autonómico de Comunicación, Vicente Ordaz, y el alcalde de La\
    \ Nucía y diputado provincial en Alicante, Bernabé Cano, quienes también viajaron\
    \ a la final del MundialQué sabemos, y qué no, de la escapada de Pérez Llorca\
    \ a la final del Mundial en Nueva York\n\n        La Asociación Transparencia\
    \ y Democracia en el Deporte presenta una querella en el Tribunal Superior de\
    \ Justicia (TSJ) contra el presidente de la Generalitat Valenciana, Juanfran Pérez\
    \ Llorca, y la Real Federación Española de Fútbol (RFEF), por el viaje del dirigente\
    \ valenciano a la final del Mundial. \n    \n        La asociación que preside\
    \ Miguel Ángel Galán, que ya denunció al expresidente de la RFEF Luis Rubiales,\
    \ ha registrado la querella en el TSJ valenciano y apunta a un delito de cohecho\
    \ pasivo impropio y un delito de cohecho activo por la invitación al presidente\
    \ valenciano al partido en Nueva York. \n    \n        El presidente de la Generalitat\
    \ Valenciana apuntó en un vídeo publicado en sus redes sociales que el viaje lo\
    \ costeó “de su bolsillo”, sin hacer mención a la entrada ni a su acompañante,\
    \ su secretario autonómico de Comunicación. Es precisamente la entrada el objeto\
    \ central de la querella. \n    \n        Fuentes de Presidencia explicaron el\
    \ día en el que tomó el vuelo que había sido invitado por la Federación, y fuentes\
    \ de la Federación apuntaron a elDiario.es que había pedido comprar la entrada\
    \ y se optó por invitarle. La RFEF, entidad privada, contaba con un número de\
    \ entradas de la FIFA a su disposición, para venta o invitaciones, que no comportan\
    \ coste para la entidad. A la final han asistido numerosas autoridades y personalidades\
    \ de distinta índole. El dirigente popular no ha dado más explicaciones sobre\
    \ el viaje, del que no consta información en el Portal de Transparencia. PSPV,\
    \ Compromís y Sumar han pedido documentación por diferentes cauces parlamentarios,\
    \ registrando preguntas en el Congreso y en las Corts Valencianes.\n    \n   \
    \     La asociación presenta la querella tras realizar varios requerimientos de\
    \ documentación a la Generalitat Valenciana y a la RFEF sobre los protocolos de\
    \ invitación. Señala que el precio de las entradas en la web de la Federación\
    \ para la final era de entre 4.185 y 8.680 dólares, aunque con un sistema de “precio\
    \ dinámico”. Las entradas de última hora dispararon su precio en otros portales,\
    \ alcanzando varias decenas de miles de euros, según informaron distintos medios.\
    \ \n    \n        Considera la querella que hay indicios de que una “ventaja patrimonial\
    \ pudo ser ofrecida y admitida en consideración al cargo o función del receptor”.\
    \ “El extremo que la instrucción ha de determinar es si la ventaja le fue atribuida\
    \ en consideración a su cargo o función” y considera que existen indicios como\
    \ “el carácter privado del viaje, la ausencia de criterio general” o “el valor\
    \ de la localidad muy superior a los usos de cortesía, el cauce singular de obtención\
    \ y la falta de declaración del obsequio”.\n    \n        Asimismo, recoge que\
    \ en los presupuestos de la Generalitat hay dos partidas para la Federación, que\
    \ suman 90.000 euros. También apunta que el presidente valenciano y el de la RFEF\
    \ han participado en actos juntos, donde este último ha trasladado su apoyo a\
    \ las acciones de Valencia como una de las sedes del próximo mundial, algo que\
    \ debe determinar la FIFA. \n    \n        La asociación considera que la secuencia\
    \ temporal es relevante y exige esclarecer “si la ventaja guardó relación con\
    \ decisiones propias del cargo”. Estas líneas presupuestarias son habituales en\
    \ las cuentas de todas las comunidades autónomas, que prevén ayudas al deporte\
    \ profesional y a la celebración de torneos, además de a las federaciones territoriales.\
    \ El principal ingreso de la RFEF son los derechos audiovisuales y patrocinios,\
    \ que suponen más de la mitad en sus presupuestos, que contemplan 400 millones\
    \ de euros en ingresos.\n    \n        La querella aporta en la documentación\
    \ una copia de una invitación protocolaria a un presidente de club de fútbol de\
    \ primera división. Considera que la cuestión penalmente relevante “no es la mera\
    \ existencia de un protocolo general de hospitalidad, sino determinar si D. Juan\
    \ Francisco Pérez Llorca fue destinatario de la invitación descrita; si fue seleccionado\
    \ de manera nominativa; quién promovió, remitió o facilitó su inclusión; si aceptó\
    \ la oferta; si remitió datos para la tramitación del viaje; si se reservaron\
    \ plazas, billetes, estancias o entradas a su nombre o al de terceros; y si llegó\
    \ a disfrutar de cualquiera de las prestaciones”. También “si la eventual invitación\
    \ se ajustó a criterios objetivos, generales, previamente definidos y aplicados\
    \ de forma homogénea, o si respondió a una gestión individualizada vinculada a\
    \ la posición institucional del destinatario o a relaciones personales”. La querella\
    \ se dirige contra la jefa de gabinete de la RFEF, a quien la entidad acusa de\
    \ asesorar al presidente valenciano.\n    \n        El documento se hace eco de\
    \ las consideraciones del portavoz del PSPV en las Corts, que apuntó a una contradicción\
    \ en el discurso de Pérez Llorca: si viajó como particular o como representante\
    \ institucional. El dirigente valenciano y su alto cargo deberían declarar el\
    \ regalo en el portal de transparencia, como marca la ley autonómica y el código\
    \ de buen gobierno. Este compromiso ético refleja además que los altos cargos\
    \ no deben aceptar regalos que sobrepasen los usos y las costumbres de cortesía,\
    \ y han de ser reflejados en el Portal.\n    \n        La asociación pide que\
    \ se citen como testigos al presidente de la RFEF, Rafael Louzán; al secretario\
    \ autonómico de Comunicación de la Generalitat, Vicente Ordaz, y al alcalde de\
    \ La Nucía, Bernabé Cano, amigo de Pérez Llorca que también viajó a las semifinales\
    \ y la final del Mundial."
