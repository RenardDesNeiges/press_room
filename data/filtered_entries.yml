- title: 'El vicepresidente andaluz de Vox rechaza acoger a niños migrantes de Ceuta
    ante el silencio de Moreno: "Así lo pactamos"'
  summary: "Ni el presidente andaluz, de vacaciones, ni la consejería de Presidencia\
    \ ni la de Política Social e Igualdad, que tiene la competencia en menores, responde\
    \ a la petición de reparto de niños tras la crisis migratoria, mientras Manuel\
    \ Gavira anuncia que Andalucía, \"como el resto de gobiernos donde esté Vox\"\
    , se opondrá a un futuro reparto: \"Así lo pactamos\"El PP se enreda con la acogida\
    \ de menores: dice ahora que “cumplirán la ley” mientras varias comunidades en\
    \ las que gobiernan con Vox se oponen\n\n        El Gobierno andaluz ha dejado\
    \ pasar las horas sin responder oficialmente a la solicitud del reparto de menores\
    \ migrantes llegados de forma irregular a Ceuta, en la crisis humanitaria provocada\
    \ por la entrada masiva de 70.000 personas en territorio español. \n    \n   \
    \     El presidente Juanma Moreno “está de vacaciones” y ni la Consejería de Presidencia\
    \ ni la de Política Social e Igualdad, que tiene las competencias sobre menores,\
    \ han respondido a este periódico si la Junta de Andalucía acogerá a una parte\
    \ de esos niños -en torno a un millar, según los datos del presidente ceutí, el\
    \ popular Juan Jesús Vivas-, después de que el número dos del PP nacional, Miguel\
    \ Tellado, anunciase el miércoles que ninguna comunidad gobernada por el PP los\
    \ aceptaría.\n    \n        La primera respuesta oficial del Gobierno andaluz\
    \ a la crisis humanitaria de Ceuta -con 80 fallecidos por el momento- ha sido\
    \ la del vicepresidente segundo de la Junta y líder regional de Vox, Manuel Gavira,\
    \ anunciando que Andalucía “se va a oponer” a un futuro reparto obligatorio de\
    \ menores migrantes no acompañados llegados a Ceuta. “Andalucía, como el resto\
    \ de gobiernos donde esté Vox, se va a oponer a todo reparto de menas que plantee\
    \ el Gobierno de Sánchez. Así lo hemos pactado”, ha escrito en su cuenta de la\
    \ red social X. \n    \n        El también consejero de Turismo, Justicia, Desregulación\
    \ y Administración Local se ha remitido al pacto de Gobierno PP-Vox firmado hace\
    \ poco más de un mes, que sirvió para investir presidente a Moreno, y que recoge\
    \ literalmente “No más MENA”, y un rechazo frontal al reparto de menores migrantes\
    \ entre las comunidades autónomas, algo que provocó la ruptura de los gobiernos\
    \ de coalición PP-Vox en 2024. \n    \n        Entonces, la acogida de niños era\
    \ voluntaria para los gobiernos regionales, en virtud de un principio de solidaridad\
    \ que tensionó (y terminó por romper) los ejecutivos de la derecha y la ultraderecha\
    \ (Aragón, Extremadura, Castilla y León y Comunidad Valenciana). El Gobierno de\
    \ Pedro Sánchez aprobó un Real Decreto en la primavera de 2025 haciendo “obligatorio”\
    \ ese reparto entre comunidades, atendiendo siempre a la capacidad y el volumen\
    \ de menores que ya gestionaba cada comunidad.\n    \n        El Ejecutivo ceutí,\
    \ del PP, apoyó ese Real Decreto e instó a la solidaridad de sus compañeros de\
    \ partido, presidentes autonómicos. Moreno, entonces con mayoría absoluta, defendió\
    \ en el Parlamento andaluz el acogimiento de esos niños por razones “humanitarias”\
    \ y por el cumplimiento de la ley. Las elecciones andaluzas del 17 de mayo le\
    \ arrebataron esa mayoría absoluta y, poco más de un mes después, selló un pacto\
    \ de Gobierno con Vox que recogía todas sus cláusulas antiinmigrante, desde la\
    \ “prioridad nacional” hasta el veto explícito a acoger menores extranjeros.\n\
    \    \n        El punto 12 de ese acuerdo, firmado por Moreno Bonilla y el propio\
    \ Gavira, recoge el “rechazo frontal a la llegada de más inmigrantes ilegales,\
    \ tanto mayores como menores de edad, a Andalucía”. “Se opondrá por todos los\
    \ medios legales, jurídicos y políticos a cualquier mecanismo de reparto de inmigrantes\
    \ ilegales, tanto mayores como menores de edad”, añade el documento.\n    \n \
    \       El vicepresidente andaluz considera que lo ocurrido en Ceuta es “una invasión”.\
    \ “Quienes cruzaron la frontera ilegalmente donde tienen que estar es de vuelta\
    \ en Marruecos”, ha escrito Gavira, que ha añadido: “Y, si son menores, con sus\
    \ padres”.\n    \n        Por su parte, Alejandro Hernández, exportavoz de Vox\
    \ en el parlamento andaluz y actual delegado de Justicia del Gobierno en Córdoba,\
    \ se ha preguntado en un mensaje en redes sociales “qué razones humanitarias nos\
    \ obligan a hacernos cargo” de los menores. “¿Hay guerra en Marruecos? ¿Hay hambruna\
    \ en Marruecos? ¿Hay alguna catástrofe natural en Marruecos? ”, ha reiterado Hernández,\
    \ que igualmente ha acusado a Rabat de no querer asumir su responsabilidad con\
    \ los menores cuando “se va a gastar 600 millones de euros en construir un estadio\
    \ de fútbol para albergar la final de un mundial”.\n    \n        Antes del anuncio\
    \ de Gavira, los gobiernos de Aragón, Extremadura o Castilla y León –en los que\
    \ el PP gobierna en coalición con la extrema derecha– ya habían anunciado que\
    \ se opondrían a ese futuro reparto. Aragón ha anunciado que pondrá “todos los\
    \ instrumentos legales, jurídicos y políticos” a su alcance para ello. La vicepresidencia\
    \ primera de Castilla y León, en manos de Vox, ha asegurado que se opondrá “frontalmente”.\
    \ \n    \n        El secretario general del PP, Miguel Tellado, ha dicho que esta\
    \ es una crisis de “seguridad nacional” y no una cuestión migratoria. Aunque el\
    \ Partido Popular ha estado defendiendo el no acogimiento de los menores, su vicesecretaria\
    \ de Coordinación Sectorial ha matizado que sus comunidades “siempre van a cumplir\
    \ la ley”. \n    \n        Fuentes del Ministerio de Juventud e Infancia han asegurado\
    \ a elDiario.es que, tras la reforma de la Ley de Extranjería aprobada el año\
    \ pasado —después de muchos meses de bloqueo y con el voto en contra de PP y Vox—,\
    \ las comunidades gobernadas por la derecha no tienen la capacidad de negarse\
    \ a acoger a los niños y adolescentes que les correspondan para aliviar la situación\
    \ de Ceuta. Las autonomías sí pueden recurrir cada expediente, pero estas fuentes\
    \ confían en que dichos recursos tan solo retrasen los traslados unos pocos días.\n\
    \    \n        Las autoridades ceutíes calculan que hay un millar de menores extranjeros\
    \ que necesitarán atención, aunque se prevé que la cifra aumente, puesto que muchos\
    \ todavía estaban “en barriadas y calles” y no se han incorporado al sistema de\
    \ protección."
