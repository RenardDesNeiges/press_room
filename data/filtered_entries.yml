- title: SpaceX pierde más de 5.000 millones mientras Elon Musk promete más gasto
    en IA y centros de datos espaciales
  summary: "La compañía supera las previsiones de ingresos de los analistas en sus\
    \ primeras cuentas trimestrales pero cae en bolsa por sus anuncios de inversiones\
    \ masivas en IAZuckerberg y Musk empiezan a alquilar sus chips y revelan una nueva\
    \ grieta en la burbuja de la IA\n        SpaceX ha publicado sus primeras cuentas\
    \ trimestrales tras protagonizar en junio la mayor salida la bolsa de la historia\
    \ y, como aquella operación, los resultados han sido mixtos. Por un lado, la compañía\
    \ de cohetes y satélites de Elon Musk ha comunicado unos ingresos muy por encima\
    \ de los esperados, llegando a los 7.800 millones de dólares (unos 6.750 millones\
    \ de euros), un 92% más que entre abril y junio de 2025. \n    \n        Sin embargo,\
    \ sus inversiones masivas en infraestructura de IA, unidas a sus pérdidas netas\
    \ de 5.488 millones de dólares en el primer semestre de 2026, un 257% más interanual,\
    \ han sembrado la desconfianza entre los inversores. Sus acciones han caído casi\
    \ un 8% en las operaciones posteriores el cierre de mercado de Wall Street hasta\
    \ los 115 dólares por título, por debajo de los 135 con los que arrancaron su\
    \ cotización en el parquet hace dos meses.\n    \n        La empresa ha comunicado\
    \ que su esfuerzo inversor en IA alcanzó los 15.800 millones de dólares entre\
    \ abril y junio, cifra que duplica lo destinado en el trimestre previo. Además,\
    \ ha avanzado que en el próximo período pretende escalarlo hasta los 18.400 millones\
    \ de dólares (unos 16.000 millones de euros) en un momento en el que los inversores\
    \ han comenzado a penalizar estos enormes despliegues de capital y empiezan a\
    \ exigir retornos para ellos.\n    \n        “Estamos construyendo capacidad de\
    \ cómputo de IA a escala más rápido que nadie”, ha presumido Musk en la llamada\
    \ con los inversores posterior a la comunicación de resultados. Pese a ello, buena\
    \ parte del negocio que está haciendo SpaceX a partir de esos chips consiste en\
    \ alquilarlos a otros laboratorios de IA y no en explotarlos por sí misma.\n \
    \   \n        Gracias a esos acuerdos, principalmente con Anthropic y Google,\
    \ los ingresos de su división de IA llegaron a los 2.560 millones de dólares,\
    \ el triple que en el trimestre anterior. Actualmente, los centros de datos de\
    \ SpaceX tienen unos 2 gigavatios de potencia instalada, pero Musk confía en llegar\
    \ a los 10 para finales de 2027. Incluso en las previsiones más optimistas del\
    \ magnate, los centros de datos de la tecnológica consumirán para entonces tanta\
    \ energía como toda la ciudad de Nueva York.\n    \n        SpaceX asegura en\
    \ sus cuentas que podría alcanzar los 100.000 millones de dólares de ingresos\
    \ al año este 2026 y que la computación en la nube será el foco principal de ello,\
    \ gracias a esta infraestructura de IA.\n    Starlink es el verdadero motor del\
    \ negocio\n        Como ya anticiparon los documentos previos a su salida a bolsa,\
    \ Starlink, la división de Internet por satélite, es la que más beneficios reporta\
    \ al grupo. Los ingresos de este negocio han aumentado un 66% hasta los 4.300\
    \ millones de dólares, tras alcanzar los 12 millones de suscriptores. “No es descabellado\
    \ que en algún momento Starlink proporcione la mayoría del internet del mundo.\
    \ No es como en un futuro infinito. Es en menos de 10 años”, pronostica el magnate.\n\
    \    \n        Con todo, fiel a su estilo al frente de sus otras empresas como\
    \ Tesla, Musk ha preferido centrar sus intervenciones en los negocios futuros\
    \ y los avances tecnológicos que en los negocios reales que SpaceX tiene hoy.\
    \ En este sentido, ha asegurado que pretende que su idea de llevar centros de\
    \ datos al espacio arranque próximamente, a pesar de que numerosos expertos dudan\
    \ de que sea posible llevarlo a cabo. “Esto no es algo lejano ni del futuro. Esperamos\
    \ comenzar a lanzarlos el próximo año”, ha afirmado: “Suena a ciencia ficción\
    \ ahora mismo, pero va a pasar”."
