- title: El Gobierno de Almeida aprueba el plan para crear el mayor centro comercial
    de Madrid, que negoció Cospedal
  summary: "La última Junta de Gobierno da luz verde inicial al megaproyecto deValdebebas,\
    \ un acuerdo del que no se informó en la rueda de prensa posterior. El periodo\
    \ de información pública llegará en pleno mes de agosto. Detrás del proyecto se\
    \ encuentra la empresa del millonario murciano Tomás OlivoAlmeida negocia la apertura\
    \ del mayor centro comercial de Madrid con una promotora representada por Cospedal\n\
    \        El centro comercial más grande de la ciudad de Madrid, con hasta 400.000\
    \ metros cuadrados de superficie construida, acaba de obtener el visto bueno del\
    \ Gobierno de Almeida. La última reunión del alcalde con sus delegados dio luz\
    \ verde al plan para abrir una enorme infraestructura sobre cuatro de las parcelas\
    \ sin construir de Valdebebas.\n    \n        El acuerdo no fue comunicado en\
    \ la rueda de prensa posterior a la Junta de Gobierno, aunque formaba parte del\
    \ listado de decisiones previas a las vacaciones, según ha podido comprobar Somos\
    \ Madrid. De esta forma, el planeamiento saldrá a información pública en agosto,\
    \ un mes en el que tradicionalmente cumplen este periodo obligatorio de transparencia\
    \ los proyectos más polémicos.\n    \n        Lo que el área de Urbanismo, Medio\
    \ Ambiente y Movilidad ha aprobado es un plan especial para las parcelas 166-A1,\
    \ 166-A2, 166-C y ZV-019 de Valdebebas. Las tres primeras corresponden a los terrenos\
    \ donde se situarán los dos edificios del centro comercial y la cuarta el parque\
    \ municipal sobre el que se establecerán dos espectaculares conexiones en altura.\n\
    \    \n        El proyecto está promovido por General de Galerías Comerciales\
    \ SA, una empresa que posee más de una decena de centros comerciales a lo largo\
    \ de la geografía nacional y cuyo dueño, Tomás Olivo, se ha colocado como una\
    \ de las fortunas más grandes de España al ser ubicado en la sexta posición en\
    \ la última lista Forbes. El nombre de este empresario murciano saltó a la palestra\
    \ en Madrid el pasado mes de mayo, al conocerse que había comprado también el\
    \ icónico Edificio Telefónica de Gran Vía.\n    \n        Lo que Olivo quiere\
    \ levantar en el distrito de Hortaleza es el proyecto Valdebebas Shopping, donde\
    \ hizo una inversión inicial de 55 millones de euros en el año 2020 para la compra\
    \ de los terrenos. Contará con los citados 400.000 metros cuadrados de extensión,\
    \ de los que 120.000 serán de alquiler comercial, para dar cabida a unas 280 firmas.\n\
    \    \n        El Ayuntamiento de Madrid ha negociado durante meses los flecos\
    \ de este proyecto, debido a que las pasarelas proyectadas para unir las parcelas\
    \ privadas atravesarían el cielo de un parque público. Por ello era necesario\
    \ un plan especial que ahora ha sido aprobado por el consistorio.\n    Negociaciones\
    \ con Cospedal\n        Entre las reuniones para negociar estos detalles destacó\
    \ una por la presencia de la que fuera secretaria general del Partido Popular\
    \ entre los años 2008 y 2018, María Dolores de Cospedal. La exdirigente del PP\
    \ representó como abogada a la empresa de Tomás Olivo en uno de sus encuentros\
    \ con cargos municipales, celebrado en diciembre el año 2024. Por parte del Ayuntamiento\
    \ de Madrid solo acudió la subdirectora general de Planeamiento, Eva Torres. En\
    \ el encuentro también estuvieron el director de Chapman Taylor España, compañía\
    \ que ha diseñado el centro comercial y el jefe de operaciones de la auditora\
    \ Opciona Gestión y Proyectos.\n    \n        Los detalles de cómo será el centro\
    \ comercial no se conocen todavía. El proyecto inicial lo desveló hace más de\
    \ un año la cuenta de X @HilosValdebebas, aunque está por ver si ha sido modificado\
    \ en algún punto para obtener el visto bueno municipal.\n    \n        Valdebebas\
    \ Shopping obtendrá el permiso municipal pocas semanas después de que la Comunidad\
    \ de Madrid le facilitara una importante ventaja: la llegada del transporte público\
    \ hasta sus puertas. La Consejería de Transportes ya tiene cerrada la reserva\
    \ del espacio para una estación de Metro a sus puertas, que formará parte de la\
    \ ampliación definitiva de la línea 11 desde Mar de Cristal. La estación no será\
    \ inmediatamente construida, pero la apertura del centro comercial dentro de unos\
    \ años podría venir acompañada de esta construcción.\n    \n        El nuevo negocio\
    \ de Tomás Olivo abrirá en una de las zonas de la capital por las que más apuestan\
    \ las administraciones públicas: estará situado enfrente del aeropuerto de Barajas,\
    \ en el extremo oriental de Valdebebas, el barrio que también acogerá el circuito\
    \ de Fórmula 1 dentro de poco más de un mes o el distrito tecnológico que prepara\
    \ el Real Madrid. El plan especial de este último proyecto también fue aprobado\
    \ en la Junta de Gobierno del pasado jueves.\n    \n    \n            \n     \
    \           \n    \nApoya el trabajo periodístico de Somos Madrid\n  Esta información\
    \ ha podido salir a la luz gracias a las personas que apoyan la edición local\
