- title: La España progresista en una UE retrógrada
  summary: "El problema gravísimo es que, ante una acción exterior contra España,\
    \ las derechas europeas -con gran enfásis de las locales- han reaccionado contra\
    \ el gobierno de nuestro país que no es de su cuerda ideológica y no comparte\
    \ sus “valores” tan degradantes\n        “Debajo de la alfombra aparece un suelo\
    \ corroído que no va a mejorar remendándola para taparlo. Occidente puede correr\
    \ la misma suerte  de otros imperios extinguidos, dejando un vacío bajo la palabra\
    \ Europa”.  (José Luis Sampedro (Reacciona 2011)    \n    \n        Los ministros\
    \ de la UE, reunidos en videoconferencia a instancias de España, han acordado\
    \ templar las hostilidades surgidas por la crisis de Ceuta. En un comunicado acordado\
    \ por unanimidad “valoran los rápidos y eficaces esfuerzos de las autoridades\
    \ españolas para responder a la situación”. Y mantienen “la necesidad de seguir\
    \ luchando sin descanso contra las redes de tráfico de migrantes”, reforzar los\
    \ retornos o “fortalecer” las fronteras de la UE, dentro de los tópicos al uso.\
    \ El español Grande-Marlaska se ha dado por satisfecho. Una notable recogida de\
    \ velas o un impasse cuyo desarrollo falta por ver. \n    \n        Un misil ha\
    \ dado de lleno en los cimientos de la Unión Europea, sin embargo. Ha quedado\
    \ claro que, si este club nunca fue un modelo de equilibrios y contrapesos, ahora\
    \ priman más que nunca lo que ellos mismo llaman “intereses electorales nacionales”.\
    \ ¿Y cuáles son? Racismo, ultraderecha rayando -y a veces entrando- en el fascismo,\
    \ desigualdad, egoísmo profundo, poco o nada de solucionar los problemas de los\
    \ ciudadanos, y con un marcado intento por manipular a la opinión pública que\
    \ les sustenta. Aún les sustenta. El problema gravísimo es que, ante una acción\
    \ exterior contra España, las derechas europeas -incluidas con gran énfasis las\
    \ españolas- han reaccionado contra el gobierno de nuestro país que no es de su\
    \ cuerda ideológica y no comparte sus “valores” tan degradantes. Maticemos, por\
    \ supuesto, que el gobierno que preside Sánchez es progresista dentro de los parámetos\
    \ actuales. Siempre se puede pedir más, pero para como anda el patio, les provoca\
    \ ampollas. \n    \n         A la par que todo este trance sucedía, por cierto,\
    \ juristas alemanes se doblaban en número, hasta llegar a más de mil, para pedir\
    \ que se prohíba al partido ultra Alternativa Por Alemania. Los demócratas alemanes,\
    \ como los españoles, saben el peligro que representan los fascismos. Inmenso,\
    \ fatídico. Fue la propia UE la que les dejó entrar hasta la cocina de las instituciones\
    \ tras irse instalando en los diversos países en una cuidada estrategia. Al venir\
    \ acompañada de la manipulación mediática, subvencionada, ha cosechado un éxito\
    \ creciente. En España los fuimos viendo jaleados en programas varios, también\
    \ en aumento ahora.  \n    \n        Donald Trump, paradigma de la corrupción\
    \ presidencial, mueve los hilos con Netanyahu, sin ningún disimulo. Congresistas\
    \ estadounidenses denuncian el plan -dotado con profusión de fondos- para “devolver”\
    \ a Marruecos Ceuta, Melilla y el Sáhara Occidental -que por cierto tiene en buena\
    \ parte colonizado-. Con la connivencia, por supuesto, del rey de Marruecos, ese\
    \ multimillonario que vive en París mientras su pueblo padece una precariedad\
    \ intolerable. \n    \n        elDiario.es ha documentado estos días datos clave\
    \ de cuanto está ocurriendo.  Sinteticemos algunos básicos.  \n    \n        -“Las\
    \ relaciones de España con Marruecos y Argelia son un juego complicado de suma\
    \ cero. El apoyo a las tesis de Rabat hizo que Argelia pusiera fin a su colaboración\
    \ con España. Ahora hay motivos para sospechar que el viaje de Sánchez a Argel\
    \ y los acuerdos alcanzados han provocado la respuesta marroquí que hemos visto\
    \ en Ceuta”. \n    \n        -Marruecos está armándose hasta los dientes en un\
    \ momento en que las tensiones con la vecina Argelia no han hecho más que aumentar.\
    \ Marruecos es el mayor comprador de armamento a EEUU en África.\n    \n     \
    \    -Rabat está cortejando el Banco Mundial y el Banco de Exportaciones e Importaciones\
    \ de EEUU (Exim Bank) para financiar un gaseoducto de 26.000 millones de dólares\
    \ que discurriría a lo largo de la costa africana. El gasoducto, de 6.800 kilómetros,\
    \ prevé conectar los yacimientos de gas de Nigeria, Senegal y Mauritania, antes\
    \ de unirse al gasoducto Magreb-Europa, que ya une Marruecos con España. En la\
    \ previsión el circuito pasaría por los territorios del Sáhara Occidental, que\
    \ reclama Marruecos.\n    \n        -Marruecos tiene el 70% de las reservas mundiales\
    \ de roca fosfórica, pero solo extrae y aporta menos del 15% de la demanda global.\
    \ La roca fosfórica es clave tanto para la producción de fertilizantes como para\
    \ la producción de las baterías para los coches eléctricos. \n    \n        Que\
    \ frente a todo esto, la UE y la mayoría de sus países se haya comportando como\
    \ lo han hecho contra España es incalificable. Egoísta, torpe y cobarde.  Dinamarca,\
    \ a la que defendimos de la voracidad rapiñadora de Trump, va a ¡reinstaurar el\
    \ servicio militar obligatorio! para defender Groenlandia, en lugar de buscar\
    \ apoyos reales en la UE. Algo y mucho falla aquí.  \n    \n        Y luego está\
    \ la derecha española. Repugnante su alineación con sus correligionarios ultras\
    \ europeos, con su dios Trump, con Netanyahu y quien haga falta para trincar la\
    \ Moncloa a cualquier precio. Insoportables, las barbaridades que están soltando\
    \ en medios y redes. Qué manera de vituperar al presidente Sánchez para su audiencia\
    \ de odiadores y dummies. Claro que faltan puntos por aclarar. Por ejemplo, qué\
    \ opinan el PP y Vox de la pretendida anexión de Ceuta y Melilla a Marrueco. El\
    \ partido de la Dana, de los incendios, de la pandemia en Madrid (por no remontarse\
    \ a las hazañas de Aznar), no puede permitirse desde una mínima decencia, lanzar\
    \ a sus altos cargos a decir que Sánchez “no estuvo a la altura con la pandemia,\
    \ ni con la riada de Valencia, ni con los incendios, ni con la crisis de Ceuta”.\
    \ Ni tiene derecho a vacaciones a pesar de lo delgado y demacrado que aparece\
    \ por el intenso trasiego de esta temporada. El Rey sí, y nos dan detalle de su\
    \ ocio veraniego. Sin pudor alguno todo esto.\n    \n         Por el contrario,\
    \ hay un movimiento internacional, con nombres potentes, de apoyo a Sánchez, escandalizados\
    \ de la respuesta europea que probablemente ha influido en la recogida de velas\
    \ de este martes. De los palurdos de aquí ni se enteran bien es verdad, aunque\
    \ nosotros, los ciudadanos sí los suframos. \n    \n        Este hombre que -si\
    \ les soy sincera no me daba esa impresión inicial- devino en una especie de héroe\
    \ imprevisto quien, metido en este torbellino, tira hacia adelante a ver qué salva\
    \ de la ruina que nos preparan. La que se hace realidad en algunos territorios\
    \ donde la ultraderecha se sienta ya, con el PP, en los gobiernos. La terrible\
    \ situación internacional no puede hacernos olvidar en qué se plasma esa conjunción.\
    \ El gobierno de Moreno Bonilla, por ejemplo, cede a Vox el servicio para valorar\
    \ a víctimas de violencia de género que los de Abascal pedían “depurar” por su\
    \ “sesgo ideológico”. Esto es colocar a las víctimas frente a un verdugo con más\
    \ poder aún que su agresor. Es incalificable. \n    \n        No olvidemos tampoco\
    \ a las víctimas marroquíes usadas como proyectiles humanos en una guerra que\
    \ no les compete. Hay que entender de una vez que todos los esfuerzos serán pocos\
    \ para revertir la situación creada.  También, de ser posible que no es nada fácil,\
    \ de  la Unión Europea cuyo profundo deterioro va a dañar a todos sus miembros.\n\
    \    \n        Quizás necesitemos. como punto de partida ante estos poderes hegemónicos\
    \ que nos hunden, lo que concluía José Luis Sampedro en aquel Reacciona de 2011:\
    \  “Todo ocaso ofrece una ocasión”. Solo es necesario “unirse y acordar que a\
    \ una banda boguen hacia delante, mientras en la otra cíen hacia atrás y el barco\
    \ girará en redondo, poniendo proa hacia un desarrollo humano”."
