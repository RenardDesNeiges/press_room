- title: Sumar plantea que España no comparta la organización del Mundial de fútbol
    de 2030 con Marruecos
  summary: "El ala minoritaria del Gobierno registra una proposición no de ley para\
    \ instar al Ejecutivo a solicitar a la FIFA, la Real Federación Española de Fútbol\
    \ y el Gobierno de Portugal “una revisión y evaluación específica del actual modelo\
    \ de organización conjunta” del Mundial de fútbol del año 2030 en el que serían\
    \ anfitriones la Península Ibérica y el país norteafricanoUn diputado de Sumar\
    \ rechaza celebrar el Mundial con Marruecos: “El deporte debe servir para construir\
    \ paz”\n\n        El ala minoritaria del Gobierno sigue mostrando con Marruecos\
    \ un perfil más duro que el elegido por el PSOE tras la crisis migratoria de Ceuta\
    \ de la semana pasada. Este miércoles, el grupo parlamentario en el Congreso de\
    \ la coalición —y, más en particular, IU, que se integra en él— registró una proposición\
    \ no de ley para instar al Ejecutivo a solicitar a la FIFA, la Real Federación\
    \ Española de Fútbol y el Gobierno de Portugal “una revisión y evaluación específica\
    \ del actual modelo de organización conjunta” del Mundial de fútbol del año 2030,\
    \ del que España, Portugal y Marruecos serán anfitriones. Esa revisión, plantea\
    \ Sumar, debe conllevar “la posibilidad de revisar o retirar la condición de anfitrión”\
    \ a alguno de los países. \n    \n        “La Copa Mundial de la FIFA trasciende\
    \ ampliamente la celebración de una competición deportiva”, puesto que “su organización\
    \ moviliza recursos públicos, compromete garantías estatales, condiciona inversiones\
    \ e infraestructuras y proyecta internacionalmente a los países anfitriones”,\
    \ argumenta Sumar. “Esa dimensión obliga a exigir a quienes participan en su organización\
    \ un respeto efectivo y continuado de los derechos humanos, de la legalidad internacional\
    \ y de los principios democráticos que deben regir la actuación de los poderes\
    \ públicos”, sostiene igualmente la formación, que recuerda que “el Gobierno no\
    \ es un espectador ajeno a este proceso” porque “coordina la acción pública, las\
    \ garantías, la seguridad, las infraestructuras, las inversiones y la relación\
    \ con los demás países organizadores”. \n    \n        Sumar recuerda que el episodio\
    \ de la semana pasada en Ceuta es tan solo el último episodio de un conflicto\
    \ con España en el cual “sus jóvenes, empujados al mar por la falta de oportunidades,\
    \ la desigualdad y la desesperación, son las primeras víctimas”. “La cooperación\
    \ migratoria no puede funcionar como una llave que se abre o se cierra en función\
    \ de intereses diplomáticos”, y el Mundial de fútbol no puede servir para tapar\
    \ “las decisiones y responsabilidades de un Gobierno y una monarquía que no pueden\
    \ obtener el prestigio, los beneficios económicos y la legitimación internacional”\
    \ que supone organizar este evento “mientras persistan dudas tan graves sobre\
    \ el uso político de vidas humanas”, plantea el partido. \n    \n        “El futbol\
    \ no puede servir para blanquearlo todo. España debe promover una revisión formal\
    \ del modelo de organización de 2030. Si la FIFA rechazara esa revisión, el Gobierno\
    \ deberá hacer transparentes las alternativas existentes y actuar de manera coherente\
    \ con los principios democráticos y de derechos humanos que sustentan nuestra\
    \ acción exterior”, zanja Sumar."
