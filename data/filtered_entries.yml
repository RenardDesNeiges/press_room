- title: El Ejército de EEUU se queda sin ideas en la guerra contra Irán y pide propuestas
    "creativas para castigarlo"
  summary: "El Comando Central del Ejército de Estados Unidos, encargado de librar\
    \ la guerra iniciada por Donald Trump contra Irán, ha pedido a analistas militares\
    \ que envíen sugerencias para buscar nuevas formas de \"presionar y castigar\"\
    \ a la República Islámica, según han revelado fuentes a la CNNLos estadounidenses\
    \ sufren las consecuencias de la guerra en Irán: “Lo ha echado todo a perder”\n\
    \        “Estamos buscando nuevas formas creativas y no convencionales de presionar\
    \ y castigar a Irán”. Ese fue el escueto y poco habitual email que mandó un oficial\
    \ de Inteligencia del Comando Central del Ejército de Estados Unidos (CENTCOM)\
    \ la semana pasada a un amplio grupo de analistas militares.\n    \n        El\
    \ mensaje ha sido confirmado esta semana por dos fuentes a la cadena de televisión\
    \ estadounidense CNN, que también ha preguntado a oficiales militares, los cuales\
    \ señalaron que no es común este tipo de consultas a múltiples personas por correo\
    \ electrónico. \n    \n        Según la CNN, el oficial del CENTCOM inició esa\
    \ “tormenta de ideas” por correo electrónico para ver si a alguna persona se le\
    \ ocurría una estrategia mejor a la que ha adoptado hasta ahora el Ejército estadounidense\
    \ en la guerra contra Irán, que se está dilatando mucho más de lo previsto, sin\
    \ que se vislumbre una salida clara a corto plazo. La segunda fuente indicó que\
    \ el CENTCOM está “evaluando todas las opciones” y reconoció la necesidad de replantear\
    \ la estrategia. \n    \n        Un portavoz del CENTCOM, Timothy Hawkins, dijo\
    \ en un comunicado que el comando estadounidense “tiene un largo historial de\
    \ pensar y trabajar de forma innovadora” y que el almirante Brad Cooper, jefe\
    \ del CENTCOM, consulta los miembros del equipo, “independientemente de su rango,\
    \ para alcanzar los niveles más altos posibles de desempeño operativo”. Oficialmente,\
    \ el CENTCOM no ha confirmado el envío del email, pero algunas entidades parece\
    \ que sí lo han recibido.\n    \n        El think tank Foro de Oriente Medio –totalmente\
    \ alineado con las tesis de la Administración Trump– ha hecho una publicación\
    \ en X dando a entender que ya ha enviado sus sugerencias al CENTCOM."
