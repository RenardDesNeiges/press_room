- title: La Fiscalía pide investigar a Vito Quiles por presunta estafa al recaudar
    donaciones que irían a su cuenta personal
  summary: "La denuncia parte de la asociación Facua, que alerta sobre fondos en teoría\
    \ para niños víctimas de la Dana de Valencia y becas para jóvenes que \"en realidad\
    \ van a parar a la cuenta bancaria de Quiles\"Rubén Sánchez pide para Vito Quiles\
    \ nueve años de cárcel por acusarle de pederasta, proxeneta y líder mafioso\n\
    \        La Fiscalía de Sevilla ha presentado una denuncia ante el Decanato de\
    \ la Sección de Instrucción del Tribunal de Instancia de Sevilla contra el agitador\
    \ ultra Vito Quiles para iniciar una investigación por un presunto delito de estafa.\
    \ El origen de este nuevo caso estaría en la recaudación de donaciones para niños\
    \ víctimas de la Dana de Valencia y becas para jóvenes.\n    \n        El escrito,\
    \ consultado por Europa Press y fechado el pasado 23 de julio, responde a una\
    \ denuncia inicial de la asociación Facua-Consumidores en Acción, presentada tres\
    \ días antes, en la que señalaba un posible delito de estafa, apropiación indebida\
    \ y falsedad documental por parte del comunicador.\n    \n        Según Facua,\
    \ el 1 de enero de 2025, Quiles “comenzó a pedir dinero desde su canal de Telegram\
    \ para repartir juguetes y obsequios a niños de los municipios afectados por la\
    \ Dana en la Comunidad Valenciana”. Unas donaciones que “iban a parar a la misma\
    \ cuenta bancaria en la que desde julio de 2022 venía ingresando dinero de sus\
    \ seguidores para financiar sus propias actividades”.\n    Confusión en las cuentas\n\
    \        “En los últimos cuatro años, el agitador ha solicitado donaciones desde\
    \ el citado canal en más de una veintena de ocasiones, en todos los casos con\
    \ destino a su cuenta y sin que nunca pida que el donante especifique el motivo\
    \ y destino de la donación”, ha asegurado Facua por medio de su portavoz, Rubén\
    \ Sánchez.\n    \n        Asimismo, la entidad indica que Quiles, “a través de\
    \ la web de su nuevo medio, Combativos, viene captando donaciones desde el pasado\
    \ junio con el reclamo de que irán destinadas tanto a financiar la publicación\
    \ de sus contenidos como a becas para jóvenes, sin aclarar cómo determinará que\
    \ cantidades irán para una y otra finalidad”.\n    \n        Ante esta situación,\
    \ la Fiscalía ha afirmado que “el hecho de que las donaciones se deban ingresar\
    \ en la misma cuenta destinada a la autofinanciación del titular, hace que quien\
    \ haya realizado tales donaciones, vea frustrado su buen propósito al quedar diluida\
    \ su donación en el montante del resto de cantidades”.\n    “A la cuenta bancaria\
    \ de Quiles”\n        “Ciertamente, por el mismo mecanismo utilizado para la obtención\
    \ de tales cantidades, se hace difícil conocer las cuantías en las que se ha lucrado\
    \ haciéndose preciso la averiguación de los hechos y de las cuantías defraudadas”,\
    \ ha añadido el escrito.\n    \n        “Entendemos que no se trataría de iniciar\
    \ una investigación que pueda entenderse meramente prospectiva, pues en este caso\
    \ no iría dirigida a desvelar si existe o no delito, sino que por el denunciante\
    \ se aportan datos inequívocos de que se realizan acciones por parte del denunciado\
    \ que pudieran ser delictivas”, ha señalado.\n    \n        Facua ha subrayado\
    \ que “desveló que esa sociedad no estaba dada de alta en el Registro Mercantil\
    \ y que el dinero en realidad iba a parar a la cuenta bancaria de Quiles”.\n \
    \   \n        No es la primera causa impulsada por Facua contra Quiles, el secretario\
    \ general de la entidad, Rubén Sánchez, solicitó el pasado mes de abril nueve\
    \ años de prisión para el periodista por tres delitos continuados de calumnias\
    \ con agravantes de odio ideológico. Asimismo, desde Facua han indicado que el\
    \ comunicador “está investigado en otro procedimiento por estafa tras una denuncia\
    \ de Renfe por acceder a sus trenes sin el billete correspondiente”."
