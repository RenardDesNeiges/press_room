- title: Muere John Douglas, cantante de la banda escocesa Trashcan Sinatras, a los
    63 años
  summary: "El también guitarrista del grupo ha fallecido tras una breve enfermedad,\
    \ \"con sus canciones llenando la habitación\", solo tres días después de publicar\
    \ 'Ever The Optimist', su primer disco en una década\nLa familia de Robe Iniesta\
    \ anuncia que la “pesadilla” de su relación con Live Nation está “encaminada a\
    \ llegar pronto a su final”\n        John Douglas, guitarrista y vocalista de\
    \ la banda escocesa de indie rock Trashcan Sinatras, ha fallecido a los 63 años\
    \ este lunes 3 de agosto tras una haber sufrido una enfermedad. El propio grupo\
    \ ha confirmado el fallecimiento a través de un comunicado en sus redes sociales:\
    \ “Hemos perdido a nuestro querido amigo y hermano John en paz, rodeado de sus\
    \ seres queridos y con sus canciones llenando la habitación”, así se despedían\
    \ sus compañeros de banda Stephen, Davy, Paul y Frank.\n    \n        La noticia\
    \ llega apenas tres días después de que la formación lanzara su último disco Ever\
    \ The Optimist, que se convierte en su trabajo de despedida. Este lanzamiento\
    \ ha sido el primer álbum de estudio publicado por el grupo tras diez años de\
    \ parón, dejando tras de sí un legado musical impecable. Douglas había publicado\
    \ su primer disco en solitario en 2023, al que había seguido una intensa gira\
    \ con la banda en 2024.\n    \n        La banda nació en 1986 en Irvine (Escocia),\
    \ rápidamente llamó la atención del sello Go! Discs a finales de los ochenta.\
    \ Su debut oficial llegó en 1990 con Cake, un disco considerado obra de culto\
    \ gracias a temas inolvidables como Obscurity Knocks, Only Tongue Can Tell o Circling\
    \ The Circumference.\n    \n        Definidos por un sonido de gitarras elegante,\
    \ armonías vocales y letras escritas con ingenio, Trashcan Sinatras se convirtieron\
    \ en un referente del pop británico.\n    \n        Aunque nunca alcanzaron un\
    \ éxito entre las masas, la técnica y sensibilidad para crear melodías los llevaron\
    \ a ser comparados con referentes del calibre de The Smiths o Aztec Camera, compartiendo\
    \ reconocimiento con otros grupos escoceses de su generación, como The Orchids,\
    \ The Delgados o Belle and Sebastian."
