- title: ERC abre un expediente a su candidato en Girona por un audio filtrado en
    el que carga contra sus compañeros
  summary: "En una grabación publicada por una cuenta de extrema derecha, Marc Puigtió\
    \ asegura que su intención en ERC es \"echarlos a todos\" y \"quedarse\" el partido,\
    \ un mensaje por el que el político ha pedido perdónJunts rompe el tripartito\
    \ independentista en Girona y deja en minoría a CUP y ERC\n        ERC ha abierto\
    \ este miércoles un expediente a su candidato en Girona, Marc Puigtió, a raíz\
    \ de unos audios publicados en las redes sociales en las que el político carga\
    \ contra sus compañeros en la formación municipal, de quienes asegura que desea\
    \ “echarlos a todos” y “quedarse” con el partido. Puigtió ha reconocido la autoría\
    \ de los mensajes, desvelados en una cuenta de Instagram vinculada a Vox, y ha\
    \ pedido perdón en una carta enviada a la militancia.\n    \n        La polémica\
    \ comenzó cuando la cuenta Girona Perduda publicó un vídeo que contenía varios\
    \ audios que reflejaban una conversación entre Puigtió y Travis Gómez, la persona\
    \ que gestiona el perfil de Instagram vinculado a Vox y muy crítico con la izquierda\
    \ local. “Yo te fui muy sincero y te dije cuál era mi intención con Esquerra.\
    \ Mi intención era echarlos fuera a todos y quedarme Esquerra, y después poder\
    \ utilizar sus recursos electorales”, se escucha decir al candidato republicano\
    \ a la alcaldía de la ciudad.\n    \n        En el audio Puigtió promete al influencer\
    \ poderle información sobre el partido y, como muestra, revela que uno de sus\
    \ compañeros de partido estaría dedicándose a gestionar una guardería “mientras\
    \ está de baja en el Ayuntamiento”.\n    \n        El candidato de ERC asegura\
    \ además que su intención de formar Moviment Gironí, la plataforma electoral aliada\
    \ de los republicanos, es “formar un proyecto nuevo”, desvinculado de su partido\
    \ pero aprovechando sus derechos electorales. “Me tienen que pagar la fiesta”,\
    \ asegura. Una pretensión que Puigtió admite que ha provocado el enfado entre\
    \ las bases republicanas. “Por eso tengo a toda la gente de Esquerra enfadada.\
    \ Porque estoy yo liderando el proyecto, un proyecto nuevo, y no quiero ninguno\
    \ de los que están ahora”, resume.\n    \n        En la carta enviada, Puigtió\
    \ pide disculpas por las “expresiones y planteamientos que no son adecuados” y\
    \ lamentan que hayan causado “malestar, decepción o desconfianza”. El candidato,\
    \ sin embargo, se disculpa asegurando que el audio filtrado no corresponde a una\
    \ sola conversación completa, sino que está formado por fragmentos editados de\
    \ diferentes días, lo que podría trasladar una impresión diferente de la intención\
    \ original.\n    \n        Después de que el diario El Món se hiciera eco del\
    \ audio, ERC ha optado por abrir una investigación. En un comunicado, el partido\
    \ asegura que, de acuerdo con la ejecutiva local de Girona, “el responsable de\
    \ cumplimiento de la formación ha decidido abrir de oficio un expediente para\
    \ analizar los hechos y determinar, en su caso, las responsabilidades correspondientes”.\n\
    \    \n        Según indican, “el procedimiento se seguirá con todas las garantías\
    \ establecidas y respetando los derechos de las personas afectadas”. ERC rechaza\
    \ hacer valoraciones o declaraciones sobre el caso.\n    \n        La asamblea\
    \ local de ERC designó el pasado mes de junio a Puigtió como candidato a la alcaldía\
    \ de Girona, una sesión en la que también se avaló concurrir junto a Moviment\
    \ Gironí, la plataforma encabezada por el propio candidato. Puigtió es considerado\
    \ el hombre de Oriol Junqueras en la capital gerundense y había recibido críticas,\
    \ sobre todo, de los sectores opuestos a la actual dirección de ERC."
