    \                \n                                    \n                \n\n\
    \                \n\n            \n            \n\n            \n            \n\
    \                            \n            \n                Bernabé Cano, realizando\
    \ los tests a los jugadores del CF la Nucía.                            \n   \
    \                                 \n            \n                Investigación\
    \ por la vacunación\n        En 2021, cuando la pandemia de Covid iba camino de\
    \ cumplir su primer año en España y se comenzaron a suministrar las primeras dosis\
    \ de la vacuna, el alcalde y su consejero de Sanidad se saltaron los protocolos\
    \ y se vacunaron en un centro privado. En concreto, el 6 de enero asistieron a\
    \ un centro Savia, marca residencial de mayores del grupo Blasco-Cotino, y recibieron\
    \ la primera dosis. El PP local lo justificó alegando que es médico en la sanidad\
    \ privada y ejercía como médico del Club de Fútbol de La Nucía así como del Sporting\
    \ Fútbol Sala de La Nucía. “Tiene ficha de federado y es, por tanto, un médico\
    \ recocido por la Federación”, señalaron. La oposición denunció que no constaba\
    \ que tuviera la compatibilidad para ejercer en la sanidad privada, dado que lleva\
    \ en excedencia más de 20 años en la pública. Posteriormente, el club de fútbol\
    \ local divulgó a través de sus redes sociales imágenes de sus jugadores haciéndose\
    \ tests de antígenos de Covid-19 a cargo de Cano. \n    \n        El juzgado de\
    \ instrucción de La Vila Joiosa abrió un procedimiento abreviado para investigar\
    \ si se había dado prevaricación, pero la Audiencia de Alicante lo archivó en\
    \ 2022, al no ver indicios de delito.\n    Deuda municipal disparada\n       \
    \ Según los datos del Ministerio de Hacienda, el consistorio ha duplicado su deuda\
    \ en un año. Ha pasado de deber 20,4 millones de euros al cierre de 2024 a 38,3\
    \ en 2025, siendo el consistorio que más incrementa sus deberes en un ejercicio.\
    \ En 2025 aprobó un presupuesto de 33 millones de euros, actualmente prorrogado.\
    \ En 2022 el ayuntamiento fue condenado a pagar 9 millones de euros a la promotora\
    \ del PAI de l'Algar, anulado por los tribunales, más otros 4 en intereses de\
    \ demora."
