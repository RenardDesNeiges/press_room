- title: Hallan una fosa común con restos de al menos cinco víctimas de la Guerra
    Civil entre Almoharín y Miajadas, en Cáceres
  summary: "Los trabajos para localizar y exhumar a 22 víctimas de la Guerra Civil\
    \ y de la represión franquista han permitido localizar una fosa común entre los\
    \ municipios cacereños de Almoharín y Miajadas, en la que se han hallado restos\
    \ de al menos cinco personas, algunas de ellas con evidencias compatibles con\
    \ una muerte violenta\nLa III Marcha ‘Columna de los 8000’ se celebrará el 20\
    \ de septiembre contra el “negacionismo” del franquismo\n        Aunque se buscaba\
    \ a 22 personas, al menos 5 ya han sido localizadas en una fosa que se encuentra\
    \ junto al río Búrdalo, en el antiguo trazado de la actual carretera EX-206 y\
    \ en las inmediaciones de la ermita de San Bartolomé, conocida popularmente como\
    \ ‘El Santo’, según ha informado este miércoles la Diputación de Cáceres.\n  \
    \  \n        La intervención combina la investigación documental, los testimonios\
    \ de familiares y vecinos y la excavación arqueológica para localizar a doce vecinos\
    \ de Miajadas que fueron sacados de la localidad el 27 de agosto de 1936 y a diez\
    \ vecinos de Almoharín fusilados el 27 de noviembre de ese mismo año.\n    \n\
    \        La codirectora del proyecto, Ana María Rabazo, ha explicado que inicialmente\
    \ fueron detenidas catorce personas de Miajadas, aunque dos lograron escapar tras\
    \ saltar del camión en el que eran trasladadas.\n    \n        Asimismo, ha señalado\
    \ que los testimonios recopilados durante la investigación han permitido revisar\
    \ la hipótesis inicial, que situaba los cuerpos en el cementerio de Almoharín,\
    \ y ubicar el lugar de los hechos en las inmediaciones de la ermita de San Bartolomé,\
    \ donde finalmente se ha localizado la fosa.\n    \n        Los trabajos están\
    \ siendo desarrollados por la empresa Fotex y un equipo especializado dirigido\
    \ por las codirectoras Ana María Rabazo y Laura Gutiérrez, que se encargará de\
    \ documentar los hallazgos y avanzar en la identificación de las víctimas.\n \
    \   \n        La excavación continuará hasta el próximo 21 de agosto y, durante\
    \ este periodo, se celebrará una jornada de puertas abiertas para dar a conocer\
    \ a la ciudadanía los primeros resultados de la intervención.\n    \n        Este\
    \ proyecto está coordinado por el Servicio de Memoria Histórica y Democrática\
    \ de la Diputación de Cáceres y forma parte de una subvención de 100.000 euros\
    \ concedida por la Secretaría de Estado de Memoria Democrática para investigar\
    \ y localizar fosas en los municipios de Villamesías y Almoharín.\n    \n    \
    \    Durante una visita a la excavación, el presidente de la Diputación de Cáceres,\
    \ Miguel Ángel Morales, ha asegurado que la institución mantendrá su apoyo económico\
    \ a estas actuaciones e incrementará la partida presupuestaria destinada a los\
    \ trabajos de memoria democrática hasta el final de la legislatura.\n    \n  \
    \      “Queremos encontrar los restos de todas las personas e identificar a los\
    \ asesinados por el franquismo”, ha afirmado Morales, quien ha defendido el derecho\
    \ de las familias a conocer la verdad sobre lo ocurrido y a recuperar los restos\
    \ de sus allegados."
