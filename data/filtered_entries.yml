- title: La «primaire à 15 euros» divise un peu plus le PS
  summary: Le montant défini pour participer à la désignation du candidat social-démocrate
    génère de vives tensions au sein du parti à la rose. Les 15 euros envisagés sont
    jugés prohibitifs par le camp Faure qui accuse le camp Glucksmann de vouloir verrouiller
    le corps électoral à son avantage.
  media: https://static.mediapart.fr/etmagine/default/files/2026/08/05/260805-img-la-primaire-15-euros-remet-une-piece-dans-la-machine-baffes-socialiste.jpg
  url: https://www.mediapart.fr/journal/politique/050826/la-primaire-15-euros-divise-un-peu-plus-le-ps
  date: '2026-08-05T16:21:23+00:00'
  lang: FR
  author: Pauline Graulle
  source: Mediapart
  EID: 1
- title: Dans le Michigan, la gauche progressiste renforce ses positions avant les
    midterms
  summary: Dans une circonscription aux portes de Detroit, Abdul el-Sayed a créé la
    surprise en l’emportant face à une rivale centriste, lors des primaires tenues
    mardi 4 août pour les prochaines élections de mi-mandat à l’automne. William Lawrence,
    engagé dans la lutte contre le dérèglement climatique, est lui aussi sorti vainqueur.
  media: https://static.mediapart.fr/etmagine/default/files/2026/08/05/260805-img-dans-le-michigan-la-gauche-progressiste-renforce-ses-positions-avant-les-midterms.jpg
