- title: La préfecture de police de Paris sommée de revoir le fonctionnement de son
    infirmerie psychiatrique
  summary: Le Conseil d’État a donné raison aux associations qui dénonçaient des atteintes
    aux droits fondamentaux des patients, hospitalisés sans leur consentement et soumis
    à des mesures drastiques au nom de l’impératif sécuritaire.
