- title: Yo soy más racista que tú
  summary: "Si el referente político de Vox es el modelo impulsado por Trump, basado\
    \ en deportaciones masivas, redadas y una exhibición constante de la fuerza frente\
    \ a la inmigración irregular, ¿hasta dónde estaría dispuesto a acompañarle el\
    \ PP para conservar una mayoría parlamentaria?\n        Hay imágenes que retratan\
    \ una crisis. Y hay otras que retratan una época. Las de miles de personas intentando\
    \ alcanzar Ceuta hablan, por supuesto, del fracaso del modelo migratorio europeo.\
    \ Pero, sobre todo, revelan otra realidad: la competición política, en España\
    \ y en la Unión Europea (UE), por demostrar quién es más duro con quienes intentan\
    \ cruzar sus límites territoriales. La discusión ya no gira solo en torno a cómo\
    \ gestionar la llegada de personas. Gira, sobre todo, alrededor de quién promete\
    \ más expulsiones.\n    \n        No estamos ante una excepción. La externalización\
    \ del control fronterizo ha convertido a terceros países en guardianes del perímetro\
    \ sur. A cambio de financiación, cooperación o respaldo diplomático, Estados como\
    \ Marruecos o Turquía contienen los flujos migratorios. Ahí reside una de las\
    \ grandes debilidades del modelo europeo: quien controla ese grifo también dispone\
    \ de una poderosa herramienta de presión geopolítica. Ocurrió en el río Evros,\
    \ cuando Turquía empujó a miles de personas hacia Grecia en 2020 para presionar\
    \ a Bruselas. Volvió a suceder en 2021, cuando el régimen de Aleksandr Lukashenko\
    \ facilitó la llegada de ciudadanos de Oriente Próximo y los condujo hasta Polonia,\
    \ Lituania y Letonia como parte de una estrategia de guerra híbrida. Ese mismo\
    \ año, Marruecos permitió la entrada de unas 10.000 personas para castigar a España\
    \ tras la acogida hospitalaria del líder del Frente Polisario, Brahim Ghali. La\
    \ Eurocámara respondió entonces condenando el uso de seres humanos como arma de\
    \ presión política. \n    \n        Las personas dejan así de ser sujetos de derechos\
    \ para convertirse en munición humana, en piezas de ajedrez de la negociación\
    \ entre Estados. Después pasan a desempeñar un segundo papel: el de recurso electoral.\
    \ El guion se repite en Lampedusa, Grecia, Polonia o Ceuta. Primero llegan las\
    \ imágenes; luego, los bulos; por último, las promesas de mano dura.\n    \n \
    \       Los acontecimientos de estos días ilustran con claridad esa dinámica.\
    \ Jordan Bardella culpó a Sánchez de haber “abierto las puertas de Europa”. Meloni\
    \ elevó el tono hasta plantear la suspensión de Schengen respecto a España y Finlandia\
    \ respaldó esa posición, pese a que Ceuta ni siquiera forma parte de ese espacio\
    \ de libre circulación. En Alemania, la presión de AfD vuelve a empujar el debate\
    \ migratorio hacia posiciones cada vez más extremas. Ninguna de esas reacciones\
    \ puede ni debe entenderse al margen de los calendarios electorales que afrontan\
    \ varios países europeos este año.\n    \n        España tampoco escapó a esa\
    \ lógica. El diputado de Vox José María Figaredo llegó a reclamar que había que\
    \ “cazar” a quienes habían entrado en Ceuta. Santiago Abascal habló de “invasión”,\
    \ vinculó la llegada de personas con la delincuencia, la inseguridad y el deterioro\
    \ de los servicios públicos, canceló su viaje a Colombia para desplazarse a la\
    \ ciudad autónoma y convirtió la frontera en el eje de su ofensiva política. Al\
    \ mismo tiempo, Alvise Pérez y miembros de Núcleo Nacional acudieron a Ceuta para\
    \ disputar a Vox el monopolio del discurso racista.\n    \n        Nada de ello\
    \ responde a la improvisación. Forma parte de una estrategia conocida: convertir\
    \ una crisis fronteriza en una oportunidad política. El miedo moviliza, la xenofobia\
    \ cohesiona y convertir a la persona migrante en enemigo interno continúa siendo\
    \ uno de los principales reclamos ideológicos de la constelación ultra. Partiendo\
    \ de ahí, la rivalidad ya solo consiste en demostrar quién propone el programa\
    \ más intransigente y emplea el lenguaje más agresivo.\n    \n        Pero el\
    \ verdadero problema no es Vox. De Vox nadie puede decir que oculte su proyecto.\
    \ Lo preocupante es un PP que ha dejado de combatir los marcos de la extrema derecha\
    \ para hacerlos suyos. Lejos quedan los aplausos a las palabras de León XIV cuando\
    \ recordó que “la dignidad humana no tiene pasaporte ni pierde valor al cruzar\
    \ una frontera”. Bastó lo ocurrido en Ceuta para que ese consenso desapareciera.\
    \ La movilidad humana dejó de abordarse como un fenómeno complejo, que exige cooperación\
    \ internacional y respeto a los derechos humanos, para convertirse en un instrumento\
    \ de confrontación partidista.\n    \n        Cuando la derecha tradicional acepta\
    \ el marco que fija la derecha radical, deja de discutir las soluciones y termina,\
    \ no solo reforzando el relato de quien marca el debate, sino extremándolo todavía\
    \ más, porque del extremismo vociferará más, utilizará descalificaciones más gruesas\
    \ y medidas todavía más inhumanas. Por ejemplo, elevando al nivel del discurso\
    \ político lo que hasta entonces solo había tenido carta de naturaleza en las\
    \ calles: cazar al inmigrante. Como en Torre Pacheco hace exactamente un año.\
    \ También ocurrió con la Agenda 2030 y con las políticas climáticas. Ahora sucede\
    \ con la inmigración, el clímax de las políticas de deshumanización, porque en\
    \ este caso hablamos –o deberíamos– de seres humanos. \n    \n        La pregunta\
    \ más importante no es qué dice hoy la oposición, sino qué ocurrirá cuando gobierne.\
    \ Porque Marruecos seguirá ahí y seguirá haciendo lo mismo: utilizará geopolíticamente\
    \ los flujos migratorios. Ningún Ejecutivo español será inmune a episodios como\
    \ el de Ceuta. \n    \n        ¿A quién culparán entonces? \n    \n        Gobernar\
    \ exige algo más difícil que señalar responsables: obliga a gestionar problemas\
    \ para los que no existen soluciones simples. Además, obliga a responder otra\
    \ pregunta. Si el referente político de Vox es el modelo impulsado por Trump,\
    \ basado en deportaciones masivas, redadas y una exhibición constante de la fuerza\
    \ frente a la inmigración irregular, ¿hasta dónde estaría dispuesto a acompañarle\
    \ el PP para conservar una mayoría parlamentaria? Los acuerdos autonómicos ofrecen\
    \ algunas pistas, porque el PP ha aceptado el principio de “prioridad nacional”\
    \ o las restricciones a organizaciones sociales que atienden a personas en situación\
    \ irregular. Cesión tras cesión, el espacio político del PP se desplaza hacia\
    \ la derecha radical.\n    \n        Ese es el verdadero riesgo. Ningún Estado\
    \ está a salvo de que un tercer país utilice la migración como instrumento de\
    \ presión. La diferencia reside en cómo se responde a esas situaciones: desde\
    \ la gestión, la cooperación europea y el respeto al Estado de derecho o desde\
    \ el miedo, la búsqueda de culpables y la competición por demostrar quién es más\
    \ implacable. Pero entonces la política solo consistirá en demostrar quién puede\
    \ gritar con más fuerza: yo soy más racista que tú."
