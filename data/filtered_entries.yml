- title: Au Brésil, Flávio Bolsonaro, sur les traces de son père
  summary: Le fils aîné de l’ex-président brésilien, assigné à résidence pour tentative
    de coup d’État, s’est lancé comme candidat à la présidentielle pour prendre sa
    relève. S’il dispose d’une base solide à trois mois du scrutin, sa candidature
    a du mal à convaincre ses alliés.
  media: https://static.mediapart.fr/etmagine/default/files/2026/08/05/260805-img-au-bresil-flavio-bolsonaro-sur-les-traces-de-son-pere.jpg
