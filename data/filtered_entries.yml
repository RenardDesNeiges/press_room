- title: 'Dónde ver el eclipse solar del 12 de agosto: cinco escapadas de ida y vuelta
    con vistas privilegiadas'
  summary: "Desde un cabo frente al mar hasta un puerto de montaña o un paisaje casi\
    \ desértico, estos cinco destinos reúnen las condiciones ideales para disfrutar\
    \ del eclipse total de sol sin alejarte demasiado de la ciudad\nMAPA | Dónde ver\
    \ el eclipse solar del 12 de agosto: recorrido y visibilidad en cada municipio,\
    \ minuto a minuto\n        El próximo 12 de agosto no será una tarde cualquiera.\
    \ España se convertirá en uno de los mejores lugares del mundo para contemplar\
    \ el esperadísimo eclipse total de sol que tanto da que hablar estos días, un\
    \ fenómeno excepcional que atraerá a miles de personas dispuestas a recorrer unos\
    \ cuantos kilómetros con tal de vivir ese pequeño espacio de tiempo en el que\
    \ el día se transforma en noche. \n    \n        Pero para disfrutarlo de verdad\
    \ no basta con estar dentro de la franja de totalidad. También hay que elegir\
    \ bien el lugar desde el que verlo. Como el eclipse alcanzará su punto álgido\
    \ poco antes de la puesta de sol, en torno a las 20:30 h, con pequeñas variaciones\
    \ según la ubicación, será imprescindible buscar un horizonte completamente despejado\
    \ hacia el oeste, sin montañas, edificios o bosques que oculten los últimos momentos\
    \ del día.\n    \n        Precisamente por eso, esa tarde habrá mucho movimiento\
    \ en las carreteras. Los puntos más conocidos para observar el eclipse recibirán\
    \ una gran afluencia de visitantes, pero incluso lugares menos populares podrían\
    \ llenarse antes de lo previsto. La recomendación es clara: llegar con varias\
    \ horas de antelación, asumir que habrá tráfico y no confiarse porque el destino\
    \ parezca poco frecuentado. Por tanto, además de unas gafas homologadas para ver\
    \ el eclipse, en la mochila deberemos meter también grandes dosis de paciencia.\n\
    \    \n        Para quienes prefieran disfrutar de la experiencia sin embarcarse\
    \ en un gran viaje, hemos seleccionado cinco escapadas de ida y vuelta desde Madrid,\
    \ Oviedo, Gijón, Santander, Pamplona, A Coruña y Lugo. Lugares que, además de\
    \ ser buenas opciones para contemplar el eclipse con un horizonte despejado, merecen\
    \ la visita por el paisaje, el entorno o los planes que permiten completar un\
    \ día muy especial.\n    \n        \n                                        \
    \    \n\n\n\n\n\n\n    \n                                    \n              \
    \                                                                            \
    \                                              \n                            \
    \                        \n                                                \n\
    \                                                                            \
    \                                            \n                              \
    \                      \n                                                \n  \
    \                                                                  \n        \
    \                                            \n                              \
    \                  \n                                    \n                \n\n\
    \                \n\n            \n            \n\n            \n            \n\
    \                            \n            \n                Las Bardenas Reales,\
    \ en Navarra.                            \n                                  \
    \  \n            \n                Bardenas Reales, desde Pamplona\n        Si\
    \ hubiera que diseñar sobre un mapa un lugar perfecto para contemplar un eclipse\
    \ al atardecer, probablemente se parecería bastante a las Bardenas Reales. Este\
    \ inmenso paisaje semidesértico, situado a poco más de una hora de Pamplona, reúne\
    \ tres ventajas difíciles de igualar: un horizonte de prácticamente 360º, la ausencia\
    \ de grandes relieves que oculten el sol y una amplia red de pistas que permite\
    \ repartir a los visitantes por distintos puntos, reduciendo la sensación de masificación.\n\
    \    \n        Pero las Bardenas son mucho más que un buen observatorio astronómico.\
    \ Declaradas Reserva de la Biosfera, sus más de 42.000 hectáreas esconden un paisaje\
    \ moldeado durante miles de años por el viento y el agua, donde destacan formaciones\
    \ tan conocidas como Castildetierra. Recorrer alguna de las rutas autorizadas\
    \ antes de que empiece el eclipse es una buena forma de completar la excursión,\
    \ siempre respetando las normas del espacio protegido y evitando salir de los\
    \ caminos señalizados. \n    Mirador del Puerto de la Puebla, desde Madrid\n \
    \       Aunque muchos aficionados tienen la vista puesta en la Sierra de Guadarrama,\
    \ existen alternativas mucho más tranquilas para disfrutar del eclipse. Una de\
    \ ellas es el Mirador del Puerto de la Puebla, en la Sierra Norte de Madrid, una\
    \ de las pocas zonas de la comunidad donde el eclipse será total. Situado aproximadamente\
    \ a una hora y media de la capital, ofrece una panorámica muy abierta hacia el\
    \ oeste y apenas tiene vegetación alta que pueda entorpecer la visión del sol\
    \ cuando esté cerca de ocultarse. Eso sí, como el aparcamiento es reducido, conviene\
    \ llegar con mucha antelación.\n    \n        Si el mirador termina llenándose,\
    \ tampoco será necesario dar media vuelta. Toda esta zona de la Sierra Norte cuenta\
    \ con otros altos y puertos desde los que también se puede seguir el eclipse en\
    \ buenas condiciones, como Somosierra, Navafría o Peña Quemada. Además, la escapada\
    \ permite descubrir algunos de los pueblos más agradables de la comarca, como\
    \ Puebla de la Sierra o La Hiruela, dos destinos perfectos para completar la experiencia.\
    \ \n    \n        \n                                            \n\n\n\n\n\n\n\
    \    \n                                    \n                                \
    \                                                                            \
    \                            \n                                              \
    \      \n                                                \n                  \
    \                                                                            \
    \                          \n                                                \
    \    \n                                                \n                    \
    \                                                \n                          \
    \                          \n                                                \n\
    \                                    \n                \n\n                \n\n\
    \            \n            \n\n            \n            \n                  \
    \          \n            \n                Mirador del Puerto de la Puebla, en\
    \ Madrid.                            \n                                    \n\
    \            \n                Cabo Vidio, desde Oviedo o Gijón\n        Cuando\
    \ el eclipse coincide con el atardecer, pocos escenarios ofrecen tantas garantías\
    \ como el mar. Cabo Vidio, a unos 50 minutos de Oviedo y unos 45 de Gijón, mira\
    \ directamente al Cantábrico y proporciona un horizonte completamente limpio hacia\
    \ el oeste, sin montañas que oculten los últimos rayos de sol. Además, aunque\
    \ sus acantilados son cada vez más conocidos, sigue siendo un lugar menos concurrido\
    \ que otros puntos emblemáticos de la costa asturiana. El propio faro o el cercano\
    \ mirador del Sablón son dos excelentes opciones para instalarse con tiempo y\
    \ disfrutar del espectáculo.\n    \n        La excursión merece la pena incluso\
    \ si no hubiera eclipse. Los acantilados, que superan en algunos puntos los 90\
    \ metros de altura, ofrecen algunas de las vistas más impresionantes del litoral\
    \ asturiano, mientras que un sencillo paseo permite recorrer los alrededores del\
    \ faro y acercarse a varios miradores naturales desde los que contemplar la costa.\
    \ Conviene extremar la precaución, ya que en algunas zonas no existen vallas de\
    \ protección, especialmente si se viaja con niños. Y, si sobra algo de tiempo,\
    \ Cudillero queda a apenas unos minutos en coche. \n    Mirador del Monte Cincho,\
    \ desde Santander\n        Muchos visitantes pensarán automáticamente en Santillana\
    \ del Mar para pasar la tarde del eclipse. Sin embargo, quienes busquen mejores\
    \ vistas y algo más de tranquilidad tienen una alternativa muy interesante a apenas\
    \ 40 minutos de Santander. El Mirador del Monte Cincho domina el terreno desde\
    \ una posición elevada, con un horizonte despejado hacia el mar que resulta ideal\
    \ para seguir el ocaso. Si aun así prefieres asegurarte un horizonte completamente\
    \ limpio, siempre queda la opción de acercarse al cercano y colorido Faro de Ajo.\n\
    \    \n        El acceso al Mirador del Monte Cincho requiere caminar unos dos\
    \ kilómetros por una pista forestal de subida moderada, un pequeño esfuerzo que\
    \ ayuda a mantener este lugar lejos de las grandes aglomeraciones. Desde lo más\
    \ alto del mirador, ya por encima de las copas de los árboles, la panorámica de\
    \ 360º nos deja marismas, playas, montañas y mar abierto, en un entorno muy poco\
    \ alterado. No hay servicios ni fuentes, así que conviene llevar agua, algo de\
    \ comida y calzado cómodo para afrontar la caminata sin prisas. \n    \n     \
    \   \n                                            \n\n\n\n\n\n\n    \n       \
