- title: La Guardia Civil investiga por maltrato animal a dos hombres por disparar
    a un toro en Gátova durante los 'bous al carrer'
  summary: "El instituto armado investiga al director del festejo taurino en el municipio\
    \ valenciano por ordenar a un vecino, cazador, que disparara al animal, que había\
    \ escapado del recinto, pese a que el Seprona le advirtió que no estaba autorizado\
    \  Fallece un joven de 21 años por una cogida de una vaca en los 'bous al carrer'\
    \ del municipio castellonense de Tírig\n\n        La Guardia Civil investiga a\
    \ dos hombres por abatir con un rifle de caza a un toro fugado de unos festejos\
    \ en Gátova (Valencia). El Instituto armado investiga por maltrato animal al director\
    \ de los festejos taurinos y a un vecino de la localidad, que es cazador, al que\
    \ el responsable habría ordenado disparar al animal, que se había escapado con\
    \ otras reses del recinto donde celebraban los 'bous al carrer'. Se acusa al director\
    \ del festejo de prevaricación y al cazador de maltrato animal. El Ayuntamiento\
    \ de Gátova informó de que el animal había sido “capturado”, no abatido.\n   \
    \ \n        Según informa la Guardia Civil en un comunicado, los hechos ocurrieron\
    \ el pasado 18 de julio, cuando las reses bravas quebraron el recinto de seguridad\
    \ y salieron libres por el municipio. Se desplegó entonces un  dispositivo de\
    \ localización y control coordinado por aire y tierra en el que participaron patrullas\
    \ de Seguridad Ciudadana de la comarca, componentes del Seprona y la Unidad Aérea\
    \ de Valencia. Durante el operativo de búsqueda, los agentes informaron formalmente\
    \ a la autoridad local, en su calidad de Director del Festejo, sobre sus responsabilidades\
    \ legales, urgiendo la emisión de alertas públicas de riesgo y la notificación\
    \ a los servicios de emergencias. Asimismo, explica la Guardia Civil, los agentes\
    \  le advirtieron expresamente de que el uso de armas de fuego para este tipo\
    \ de contingencias “tiene carácter absolutamente excepcional, requiriendo imperativamente\
    \ autorizaciones gubernativas expresas y el cumplimiento estricto de las medidas\
    \ de seguridad”.\n    \n        A pesar de las advertencias, durante la madrugada\
    \ del 19 de julio el responsable del festejo, “omitió los cauces legalmente reglamentados\
    \ y dio una instrucción verbal directa a un vecino de la localidad, aficionado\
    \ a la caza, para la neutralización del toro mediante el uso de un arma de fuego”.\
    \ A las cuatro de la mañana, en las inmediaciones de una urbanización cercana\
    \ al núcleo urbano, el cazador habría disparado contra el animal empleando un\
    \ rifle de caza. \n    \n        Tras recibir un primer impacto, la res se desplazó\
    \ varios metros hasta quedar estática, momento en el que se le efectuó un segundo\
    \ disparo que le causó la muerte instantánea, apunta la Guardia Civil. Las pesquisas\
    \ desarrolladas determinaron que la orden se dictó careciendo de la competencia\
    \ legal requerida y sin la preceptiva cobertura o autorización de las autoridades\
    \ gubernativas. \n    \n        El Equipo de Investigación del Seprona de la Comandancia\
    \ de la Guardia Civil de Valencia ha asumido las diligencias, que han sido remitidas\
    \ a la Fiscalía provincial de Medio Ambiente de Valencia, encargada de los casos\
    \ de maltrato animal. Los hombres están investigados pero no han sido detenidos."
