- title: 'Ukraine: des frappes russes font 15 morts à Kyiv et dans ses environs'
  summary: L’armée russe a tiré dans la nuit 115 drones et 28 missiles à haute vitesse,
    notamment balistiques. L’Ukraine n’a pas pu abattre un seul missile russe lors
    de cette attaque meurtrière, a indiqué l’armée de l’air.
  media: https://static.mediapart.fr/etmagine/default/files/2026/08/05/260805-img-ukraine-des-frappes-russes-font-15-morts-kyiv-et-dans-ses-environs.jpg
