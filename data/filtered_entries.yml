- title: El Plan Auto+ arranca con incidencias técnicas que bloquean solicitudes de
    ayudas a coches eléctricos
  summary: "El Ministerio de Industria afirma que trabaja para solucionar los fallos\
    \ detectados, que incluyen el bloqueo de acceso mediante el certificado Cl@ve\
    \ o la ausencia de algunos modelos y marcas en el listado de coches eléctricos\
    \ con derecho a la subvenciónYa se pueden pedir las ayudas de hasta 4.500 euros\
    \ para coches eléctricos: cómo funcionan y cómo solicitarlas\n        El estreno\
    \ de la página web para pedir las ayudas del Plan Auto+ no ha sido el esperado.\
    \ O quizá sí. La apertura este martes, en plenas vacaciones de agosto, de la plataforma\
    \ para solicitar las subvenciones a la compra de vehículos eléctricos e híbridos\
    \ ha estado marcada por problemas técnicos que han impedido a numerosos usuarios\
    \ completar o incluso iniciar el trámite. Los fallos han desatado las críticas\
    \ de afectados, que mostraban su ansiedad ante el temor al agotamiento de los\
    \ fondos, que se distribuyen por orden de registro de las solicitudes. \n    \n\
    \        Desde primera hora de la mañana, particulares que intentaban solicitar\
    \ las subvenciones de la Línea 1 del Plan Auto+, dotada con 350 millones de euros\
    \ para la compra de vehículos eléctricos e híbridos enchufables, denunciaron fallos\
    \ de acceso. Inicialmente, los problemas tenían relación con la avalancha de usuarios\
    \ que querían acceder la web, lo que acabó saturando. Los mensajes de error de\
    \ conexión o de servidor eran la respuesta más habitual justo cuando se abrió\
    \ la plataforma, a las 10 de la mañana. \n    \n        Pero los problemas de\
    \ acceso continuaron durante todo el día con diferente intensidad y afectaron\
    \ especialmente a los que querían entrar en la plataforma utilizando el sistema\
    \ Cl@ve Móvil o Permanente. Tal como pudo comprobar Movilidad+Auto de elDiario,es,\
    \ los intentos de acceder mediante diferentes navegadores, en modo incógnito o\
    \ borrando la memoria caché acaban siempre con el mismo mensaje: “Se ha producido\
    \ un error al obtener los datos de Cl@ve”. En cambio, el acceso sí fue posible,\
    \ aunque no fácil, mediante los sistemas físicos de autenticación instalados en\
    \ el ordenador, el eDNI y el certificado electrónico.\n    \n        A ello se\
    \ sumó un problema también relevante: numerosos fabricantes y modelos con derecho\
    \ a las ayudas no aparecían en el formulario de solicitud. También se detectaron\
    \ errores en modelos concretos. El Tesla Model 3, el coche eléctrico más matriculado\
    \ en España en los siete primeros meses del año, no figuraba inicialmente entre\
    \ las opciones seleccionables, mientras que sí aparecía el Tesla Model Y Juniper\
    \ fabricado en Berlín.\n    Corrección de errores\n        La incidencia estaba\
    \ relacionada con la denominada “Lista Blanca”, el registro de vehículos cuyos\
    \ fabricantes acreditan producción total o parcial en la Unión Europea para optar\
    \ al complemento industrial de las ayudas. Sin embargo, la normativa del programa\
    \ no exige que un vehículo figure en esa lista para poder solicitar la subvención\
    \ básica, por lo que el funcionamiento inicial del formulario impedía avanzar\
    \ en casos en los que sí debería haber sido posible continuar con la solicitud.\n\
    \    \n        A media tarde, la plataforma comenzó a incorporar buena parte de\
    \ las marcas que inicialmente no figuraban en el listado, aunque persistían incidencias\
    \ de acceso relacionadas con la identificación electrónica. Fuentes del Ministerio\
    \ de Industria y Turismo consultadas por este periódico reconocieron que se habían\
    \ detectado incidencias técnicas y aseguraron que se estaba trabajando para corregirlas\
    \ a lo largo de la jornada.\n    \n        El nuevo programa de ayudas, anunciado\
    \ por el Gobierno en diciembre de 2025, pero puesto en marcha nueve meses después,\
    \ permite solicitar subvenciones para todos los vehículos adquiridos desde el\
    \ 1 de enero de 2026 gracias a su carácter retroactivo. La principal preocupación\
    \ del sector reside en que las ayudas se conceden por riguroso orden de presentación\
    \ hasta agotar el presupuesto disponible. De ahí que cualquier incidencia informática\
    \ pueda traducirse en una pérdida de posiciones para los compradores afectados.\n\
    \    \n        El lanzamiento del Plan Auto+ llegaba con una importante demanda\
    \ acumulada tras varios meses de espera. El programa sustituye al anterior sistema\
    \ de ayudas del Moves que tramitaban las autonomías con plazos de hasta dos años\
    \ para el pago. El nuevo plan está diseñado mediante una gestión centralizada\
    \ por parte del Ministerio de Industria, con el objetivo de agilizar la concesión\
    \ de las subvenciones.\n    \n        No obstante, el ministro de Industria y\
    \ Turismo, Jordi Hereu, restó importancia a ese escenario durante la presentación\
    \ de las bases reguladoras al señalar que el Ejecutivo no prevé que los fondos\
    \ se agoten de forma inminente. \n    Hasta 4.500 euros para turismos\n      \
    \  El Plan Auto+ establece ayudas variables en función del precio del vehículo,\
    \ su tecnología y el grado de fabricación europea. En el caso de los particulares,\
    \ las subvenciones pueden alcanzar los 4.500 euros para turismos eléctricos, hasta\
    \ 5.000 euros para vehículos comerciales ligeros, 1.500 euros para cuadriciclos\
    \ eléctricos y 1.100 euros para motocicletas. El programa también incorpora un\
    \ descuento obligatorio mínimo de 1.000 euros que deben aplicar fabricantes o\
    \ concesionarios en la venta del vehículo.\n    \n        Tras la apertura de\
    \ la línea destinada a particulares, el Ministerio prevé activar después del verano\
    \ una segunda convocatoria dirigida a autónomos y empresas, con ayudas que podrán\
    \ alcanzar los 6.000 euros para turismos y los 7.500 euros para vehículos comerciales."
