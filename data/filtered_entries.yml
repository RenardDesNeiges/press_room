- title: 'A menos de dos horas de Barcelona: el pueblo de alta montaña que parece
    haberse detenido en el tiempo en plenos Pirineos'
  summary: "Las calles empinadas y las casas de piedra definen el casco histórico,\
    \ conectado con la Vall de Núria mediante un tren cremallera inaugurado en 1931A\
    \ menos de media hora de Jaca: el pueblo medieval a las puertas del Pirineo aragonés\
    \ para ver el eclipse solar del 12 de agosto\n        En el norte del Ripollès,\
    \ dentro de la provincia de Girona, Queralbs se encuentra en una ladera de la\
    \ Vall de Ribes, a unos 1.230 metros de altitud. Desde Barcelona, el recorrido\
    \ por carretera hasta el municipio puede hacerse en menos de dos horas, por lo\
    \ que la localidad resulta una opción relativamente cercana para conocer el Pirineo\
    \ sin afrontar un viaje excesivamente largo. Su ubicación, rodeada de montañas,\
    \ influye tanto en el paisaje como en la distribución del casco urbano.\n    \n\
    \        El municipio conserva el aspecto habitual de muchas poblaciones pirenaicas.\
    \ Sus calles son estrechas, tienen pendientes pronunciadas y discurren entre edificios\
    \ construidos principalmente con piedra. Los tejados de pizarra oscura y los balcones\
    \ de madera completan una arquitectura adaptada durante generaciones a las condiciones\
    \ de la zona. La combinación de estos materiales y el reducido tamaño del núcleo\
    \ permiten recorrerlo con comodidad a pie y reconocer con facilidad su trazado\
    \ tradicional.\n    \n        Queralbs cuenta con unos 170 habitantes y se sitúa\
    \ junto a los cursos de los ríos Freser y Núria, que bajan hacia el fondo del\
    \ valle. En sus alrededores se encuentran montañas como el Puigmal, el Balandrau\
    \ y el Torreneules. Esta ubicación hace que la visita no se limite al patrimonio\
    \ del casco, ya que el pueblo también sirve como punto de partida para conocer\
    \ espacios de alta montaña y llegar hasta la Vall de Núria por medio del tren\
    \ cremallera.\n    Un casco de piedra adaptado a la pendiente\n        Recorrer\
    \ Queralbs exige ir despacio. El desnivel se nota desde las primeras calles, donde\
    \ hay escaleras, pequeños cruces y pasos estrechos entre las casas. El trazado\
    \ no sigue una cuadrícula regular, sino que las vías se adaptan a la ladera y\
    \ comunican las distintas alturas del núcleo. Esta distribución responde a un\
    \ terreno con pocas zonas llanas y sigue siendo una de las características más\
    \ visibles de la localidad.\n    \n        \n                                \
    \            \n\n\n\n\n\n\n    \n                                    \n      \
    \                                                                            \
    \                                                      \n                    \
    \                                \n                                          \
    \      \n                                                                    \
    \                                                    \n                      \
    \                              \n                                            \
    \    \n                                                                    \n\
    \                                                    \n                      \
    \                          \n                                    \n          \
    \      \n\n                \n\n            \n            \n\n            \n  \
    \          \n                            \n            \n                Calles\
    \ de Queralbs.                            \n                                 \
    \   \n            \n                \n        Las viviendas presentan una estructura\
    \ parecida, aunque no todas tienen el mismo tamaño ni la misma distribución. La\
    \ piedra predomina en los muros exteriores, mientras que la pizarra se utiliza\
    \ en muchas cubiertas. En las puertas, ventanas y balcones todavía se mantienen\
    \ algunos elementos de madera que conservan el aspecto tradicional. El interés\
    \ no está solo en edificios concretos, sino en la continuidad de las construcciones\
    \ y en su relación con las calles del núcleo urbano.\n    \n        Las dimensiones\
    \ reducidas del pueblo permiten recorrer el centro sin necesidad de seguir una\
    \ ruta complicada. Las cuestas forman parte del paseo y ofrecen puntos desde los\
    \ que observar el entorno y las montañas cercanas. Al mismo tiempo, la ausencia\
    \ de grandes avenidas o edificios de mucho volumen mantiene la estructura de un\
    \ núcleo pequeño, donde el espacio urbano continúa adaptado al relieve.\n    Sant\
    \ Jaume y el patrimonio románico\n        Uno de los principales lugares de interés\
    \ es la iglesia de Sant Jaume, un templo románico situado dentro del casco urbano.\
    \ El edificio permite conocer una parte importante de la historia local y forma\
    \ parte de cualquier recorrido por el pueblo. Su elemento más conocido es el pórtico,\
    \ una de las partes más reconocibles del conjunto religioso.  \n    \n       \
    \ La iglesia se integra en el entramado urbano y no queda separada del resto de\
    \ las viviendas. Esta cercanía permite incorporarla de forma sencilla al recorrido,\
    \ sin necesidad de salir del centro. Su arquitectura introduce una referencia\
    \ distinta a la de las casas tradicionales y ayuda a comprender la continuidad\
    \ del asentamiento a lo largo de los siglos.\n    \n        \n               \
    \                             \n\n\n\n\n\n\n    \n                           \
    \         \n                                                                 \
    \                                                                       \n   \
    \                                                 \n                         \
    \                       \n                                                   \
    \                                                                     \n     \
    \                                               \n                           \
    \                     \n                                                     \
    \               \n                                                    \n     \
    \                                           \n                               \
    \     \n                \n\n                \n\n            \n            \n\n\
    \            \n            \n                            \n            \n    \
    \            Iglesia de Sant Jaume.                            \n            \
    \                        \n            \n                \n        El patrimonio\
    \ románico se suma a una arquitectura popular que ha conservado buena parte de\
    \ sus materiales y formas. El valor de Queralbs no depende únicamente de un monumento,\
    \ sino del conjunto formado por las casas, las calles con pendiente y los elementos\
    \ históricos que todavía forman parte de la vida cotidiana del municipio.\n  \
    \  El tren cremallera y la entrada a la Vall de Núria\n        La estación del\
    \ tren cremallera es también uno de los puntos principales de Queralbs. La línea,\
    \ inaugurada en 1931, une el pueblo con la Vall de Núria y permite superar el\
    \ desnivel hasta uno de los espacios más conocidos del Pirineo oriental. El ferrocarril\
    \ se ha convertido en la principal forma de acceso al valle para quienes no hacen\
    \ el recorrido caminando.\n    \n        Desde la estación de Queralbs, el tren\
    \ sube entre montañas hasta alcanzar el santuario y el entorno de Núria. El trayecto\
    \ también forma parte de la visita, ya que atraviesa una zona a la que la carretera\
    \ no llega. Queralbs funciona de esta manera como enlace entre la Vall de Ribes\
    \ y un espacio situado a mayor altitud, frecuentado por senderistas y visitantes.\n\
    \    \n        Los ríos Freser y Núria también influyen en el paisaje del término\
    \ municipal. Ambos cursos descienden con fuerza por el terreno y atraviesan una\
    \ zona de montaña rodeada por cumbres que superan ampliamente la altura del casco\
    \ urbano. El Puigmal, el Balandrau y el Torreneules forman parte de ese entorno\
    \ y sitúan al pueblo dentro de un espacio marcado por la alta montaña."
