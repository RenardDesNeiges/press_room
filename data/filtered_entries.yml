- title: La Audiencia rebaja las pretensiones del exjuez Alba de meter en la cárcel
    22 años al periodista Carlos Sosa
  summary: "Retira el delito de odio y la agravante de “ánimo de lucro” y devuelve\
    \ la causa, abierta en 2022, a un juzgado de lo Penal de MadridLa Fiscalía pide\
    \ la absolución del periodista Carlos Sosa por la querella del exjuez corrupto\
    \ Salvador Alba\n\n        La Audiencia Provincial de Madrid ha rebajado drásticamente\
    \ las pretensiones del exjuez corrupto Salvador Alba Mesa de meter 22 años en\
    \ la cárcel al periodista Carlos Sosa, director de Canarias Ahora. En un auto\
    \ dado a conocer este lunes, la Sección Cuarta ha decidido retirar uno de los\
    \ delitos imputados al periodista, el de odio, así como la agravante de “ánimo\
    \ de lucro”, y devolver la causa a un juzgado de lo Penal para que fije fecha\
    \ y celebre juicio oral.\n    \n        Carlos Sosa fue procesado por un juzgado\
    \ de Madrid por la publicación en Canarias Ahora de las noticias referidas a la\
    \ conspiración que desplegó el exjuez corrupto contra la magistrada Victoria Rosell\
    \ cuando fue candidata de Podemos al Congreso de los Diputados en 2015 en la misma\
    \ circunscripción electoral, Las Palmas, que José Manuel Soria, del Partido Popular.\
    \ Alba fue condenado a seis años y medio de prisión y a 18 de inhabilitación por\
    \ prevaricación, cohecho y falsedad en documento oficial. Actualmente, se encuentra\
    \ cumpliendo la condena en régimen de tercer grado ejerciendo como asesor legal\
    \ en el despacho de su abogado, Jorge Rodríguez, exdirigente del PP canario.\n\
    \    \n        Salvador Alba y su esposa, la letrada de la Administración de Justicia\
    \ Teresa Lorenzo Establier, interpusieron en 2022 una querella en Madrid contra\
    \ Carlos Sosa, Victoria Rosell, Ignacio Escolar, director de elDiario.es, y varios\
    \ periodistas de Canarias Ahora por los delitos de revelación de secretos, odio\
    \ y acoso, con la agravante de “ánimo de lucro”, por entender que el periódico\
    \ se había enriquecido con la publicación de aquellas noticias. La jueza titular\
    \ de Instrucción 27, María de los Ángelez Vázquez Martín, decidió imputar sólo\
    \ a Carlos Sosa y, a pesar de la continua petición de sobreseimiento por parte\
    \ de la Fiscalía, procesarlo y enviarlo a juicio asumiendo las pretensiones de\
    \ la acusación.\n    \n        La causa recayó en el Juzgado de lo Penal 11 de\
    \ Madrid, cuyo titular argumentó que la acusación particular imputaba un subtipo\
    \ agravado de revelación de secretos que contempla penas en abstracto de hasta\
    \ siete años y medio de prisión, lo que superaría su límite competencial de cinco\
    \ años. La Sección Segunda de la Audiencia Provincial asumió inicialmente esa\
    \ postura en noviembre de 2025 y repartió la causa, que recayó en la Sección Cuarta,\
    \ que ahora ha revisado a fondo los presupuestos fácticos y ha decidido rechazarla\
    \ y devolverla al juzgado de origen.\n    Ni ánimo de lucro ni odio\n        En\
    \ el auto de la Sección Cuarta, de la que ha sido ponente la magistrada Elena\
    \ Perales Guilló, se sostiene como tesis principal que el objeto del procedimiento\
    \ debe quedar estrictamente constreñido a los hechos validados en el auto de transformación\
    \ en procedimiento abreviado dictado en el juzgado de instrucción, por lo que\
    \ quedarían sin efecto las calificaciones penales agravadas con las que la acusación\
    \ particular pretendía mantener el caso en la Audiencia Provincial. Una de las\
    \ excusas esgrimidas era la existencia de un fin lucrativo por parte del periodista\
    \ y su periódico en la revelación de secretos que se le atribuye. El tribunal\
    \ ha desmontado este argumento con una fundamentación garantista sobre la libertad\
    \ de información.\n    \n        Los magistrados recuerdan, en este sentido, que\
    \ el ánimo de lucro penal exige una “intención directa de lucro ilícito” como\
    \ motor de la conducta, y remarcan que esto no puede confundirse con el simple\
    \ hecho de que una actividad pueda generar ingresos, “como en el caso de una publicación\
    \ periodística”. Para la sala, vincular los ingresos colaterales de un medio de\
    \ comunicación con la agravante penal carece de lógica jurídica.\n    \n     \
    \   Pero, además, la Audiencia destaca un defecto procesal insubsanable: la acusación\
    \ particular introdujo esta modalidad agravada “carente del necesario respaldo\
    \ fáctico”. Ni el relato de hechos de la propia acusación ni el auto de transformación\
    \ dictado por la jueza instructora mencionan jamás que la conducta del investigado\
    \ estuviera guiada por un fin económico.\n    \n        La Sección Cuarta aplica\
    \ el mismo criterio respecto a la acusación por un delito de odio sostenido por\
    \ los querellantes para mantener las competencias en la Audiencia Provincial debido\
    \ a las penas asociadas de inhabilitación profesional.\n    \n        Aunque la\
    \ acusación particular sí detalló en su escrito que las publicaciones en Canarias\
    \ Ahora de los actos protagonizados por Alba generaron reacciones hostiles en\
    \ redes sociales, el tribunal determina que este relato “se aparta también de\
    \ los contornos del auto de procedimiento abreviado” dictado por la instructora.\
    \ Esta delimitó exclusivamente el caso a la obtención y publicación inconsentida\
    \ de datos de la vida privada que, a su entender, generaron perjuicios personales\
    \ y profesionales a los querellantes. La acusación fundamentaba este delito en\
    \ una noticia en la que se explicaba que Teresa Lorenzo ejercía como secretaria\
    \ judicial en un juzgado de Violencia sobre la Mujer al tiempo que entraba a formar\
    \ parte de la directiva de Vox en la provincia de Las Palmas.\n    \n        “De\
    \ ninguna forma esos hechos punibles incluyen una referencia a que la conducta\
    \ del investigado pudiera fomentar, promover o incitar directa o indirectamente\
    \ al odio o la violencia por razón de su ideología”, concluye taxativamente el\
    \ auto judicial.\n    \n        La Audiencia Provincial fundamenta su decisión\
    \ invocando la jurisprudencia del Tribunal Supremo sobre las garantías esenciales\
    \ del proceso penal y recuerda que el auto de transformación es la “manifestación\
    \ jurisdiccional del control sobre el alcance que puede tener la acusación”.\n\
    \    \n        Por eso, en el auto se advierte de que las partes acusadoras están\
    \ obligadas a acomodar estrictamente sus pretensiones a la base fáctica autorizada\
    \ por el juez instructor. “Esa es la garantía jurisdiccional esencial de todo\
    \ proceso penal en una sociedad democrática: nadie puede ser acusador sobre un\
    \ hecho si antes una instancia tercera, es decir el poder jurisdiccional, no lo\
    \ autoriza”, subraya la resolución. Al no haber recurrido la acusación en su momento\
    \ el auto de la instructora para ampliar los hechos, no pueden ahora mutar el\
    \ proceso mediante calificaciones artificiales.\n    \n        Salvador Alba Mesa\
    \ y su esposa, Teresa Lorenzo Establier, son juristas.\n    \n        La causa\
    \ regresará ahora al Juzgado de lo Penal 11 de Madrid para la celebración de juicio\
    \ oral. La acusación, que inicialmente pide una condena de 22 años de prisión\
    \ y 422.000 euros de indemnización, tendrá que acomodar sus pretensiones. La Fiscalía\
    \ pide la absolución del periodista."
