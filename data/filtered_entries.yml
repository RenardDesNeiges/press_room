- title: Laura et Valérie Dittli, deux sœurs à la tête de l’Etat mais aux destins
    diamétralement opposés
  summary: 'Deux sœurs, deux conseillères d’Etat, deux cantons. Les parcours de Laura
    et Valérie Dittli fascinent autant par leurs étonnantes similitudes que par la
    manière dont ils ont fini par diverger. Les deux élues racontent leur enfance,
    leur engagement et les chemins qui les ont conduites jusqu’aux plus hautes fonctions
    politiquesLoin de l’agitation qui secoue la politique vaudoise depuis des mois,
    Valérie et Laura Dittli ont choisi la quiétude des rives du lac de Zoug pour nous
    accueillir. Face à l’eau, les deux sœurs conseillères d’Etat prennent place côte
    à côte. Avant même que la conversation ne commence, un geste de tendresse trahit
    leur complicité: Valérie replace une mèche de cheveux de son aînée. L’une est
    vêtue de beige, l’autre de blanc. Les teintes se répondent. Sous une chaleur estivale,
    elles commandent une grande carafe d’eau gazeuse, des glaçons et quelques rondelles
    de citron.Ce lundi 6 juillet 2026 marque le début des vacances de Valérie. Laura,
    elle, travaille encore quelques jours avant de pouvoir souffler. La veille, les
    deux sœurs ont profité de ce rendez-vous organisé par Le Temps pour partager un
    dîner avec leur frère et leurs parents dans leur village natal d’Oberägeri. Agées
    de 33 et 35 ans, la Vaudoise et la Zougoise constituent une singularité au sein
    de leur famille. «Notre grand-père avait bien une carte au PDC, l’ancien Parti
    démocrate-chrétien, mais nous sommes les premières à nous être autant investies
    en politique et à exercer des fonctions dirigeantes», relève Laura. Elle s’étonne
    d’ailleurs que les médias décrivent parfois les Dittli comme une grande dynastie
    démocrate-chrétienne, alors que, selon elle, rien ne prédestinait sa famille à
    une telle trajectoire.Voir plus'
  media: null
  url: https://www.letemps.ch/articles/laura-et-valerie-dittli-deux-soeurs-a-la-tete-de-l-etat-mais-aux-destins-diametralement-opposes
  date: '2026-08-05T17:32:09+00:00'
  lang: FR
  author: Raphaël Jotterand
  source: Le Temps
  EID: 104
- title: Moscou sermonne le Conseil fédéral et s’immisce dans la campagne sur la neutralité
  summary: La porte-parole du Ministère russe des affaires étrangères, Maria Zakharova,
    publie sur Telegram un réquisitoire contre la conception de la neutralité d’Ignazio
    Cassis. Elle prend à témoin les auteurs de l’initiative sur la neutralité pour
    dénoncer son «abandon» par la Suisse officielle et tire un parallèle avec la période
    nazieVoilà une ingérence inédite dans l’histoire récente de la démocratie directe.
    Vendredi dernier, la veille de la Fête nationale, la porte-parole du Ministère
    russe des affaires étrangères, Maria Zakharova, publiait sur son compte Telegram
    un texte fustigeant la neutralité «à géométrie variable» qu’appliquerait Ignazio
    Cassis tout en apportant son soutien à l’initiative de Christoph Blocher pour
    une neutralité «intégrale». Le jour même, son propos est repris en résumé par
    le média Russia Today, l’un des principaux relais de la propagande du Kremlin,
    dans ses versions française et allemande. Censuré dans l’Union européenne, celui-ci
    est accessible en Suisse. La Neue Zürcher Zeitung (NZZ) en proposait mardi une
    traduction intégrale, à titre «exceptionnel», pour «permettre ainsi aux lecteurs
    de se forger leur propre opinion».Qu’y a-t-il de nouveau? Vladimir Poutine considère
    que la Suisse n’est plus neutre depuis la décision du Conseil fédéral – quelques
    jours après l’invasion de l’Ukraine par la Russie en février 2022 – de reprendre
    de «manière autonome» les sanctions de l’Union européenne. Ce que la Suisse a
    fait, presque intégralement, jusqu’au 20e paquet, le plus récent. Moscou l’a depuis
    lors placée sur la liste des pays «inamicaux». Ses représentants, y compris en
    Suisse, répètent depuis quatre ans que la Suisse n’est plus neutre. C’est d’ailleurs
    en réaction aux affirmations de Moscou que Christoph Blocher s’est décidé à l’été
    2022 à rédiger le texte de son initiative, au nom du comité Pro Suisse, avec le
    soutien de l’UDC.Voir plus
  media: null
  url: https://www.letemps.ch/articles/moscou-sermonne-le-conseil-federal-et-s-immisce-dans-la-campagne-sur-la-neutralite
  date: '2026-08-05T17:13:59+00:00'
  lang: FR
  author: Frédéric Koller
  source: Le Temps
  EID: 105
- title: Le parquet de Bâle-Ville ouvre une enquête pénale après l’épidémie de légionellose
  summary: 'Le Ministère public de Bâle-Ville a ouvert une procédure pénale pour homicide
    par négligence dans le cadre de l’épidémie de légionellose. Deux nouveaux cas
    ont été recensés mercredi. Au total, 28 cas d’infections ont été recensés, dont
    un décèsMercredi soir, le Ministère public de Bâle-Ville a annoncé ouvrir une
    procédure pénale pour homicide par négligence dans le cadre de l’épidémie de légionellose.
    Une personne est décédée des suites de cette infection.Le parquet a ouvert une
    enquête d’office sur la base des informations disponibles à ce jour, et la police
    judiciaire mène des investigations. En raison de la procédure en cours, aucune
    autre information ne peut être communiquée.

    Deux nouveaux cas recensés dans le canton de Bâle-Ville

    Dans le canton de Bâle-Ville, deux nouveaux cas liés à une infection à Legionella
    ont été recensés mercredi. Selon le département cantonal de la santé, l’une des
    personnes infectées a dû être hospitalisée.Le nombre total de cas d’infection
    par la bactérie Legionella pneumophila liés à la récente épidémie à Bâle s’élève
    ainsi à 28 mercredi à 11h00, a indiqué le Département cantonal de la santé à Keystone-ATS.
    Actuellement, six personnes sont encore hospitalisées. Une personne, qui était
    encore soignée en soins intensifs mardi après-midi, a entre-temps pu quitter ce
    service.La source d’infection la plus probable serait deux tours de refroidissement
    situées sur le toit du siège social de Manor, dans la Rebgasse, à Kleinbasel.
    Celles-ci ont été mises hors-service et font actuellement l’objet d’une enquête.

    Lire aussi: Flambée de légionellose à Bâle: le point sur ces bactéries


    Une association lance un appel aux exploitants

    L’Association suisse pour l’hygiène de l’air et de l’eau (Schweizerischer Verein
    für Luft- und Wasserhygiene) a lancé un appel aux exploitants d’installations
    de refroidissement par évaporation. Ceux-ci sont responsables du fonctionnement
    hygiéniquement sûr de leurs installations, a indiqué l’association mercredi.Selon
    l’état actuel des connaissances, les installations de refroidissement par évaporation
    correctement conçues et entretenues ne présentent aucun risque pour la santé.Il
    faut toutefois que les responsabilités soient clairement définies, que le personnel
    soit qualifié et que les règles techniques reconnues soient systématiquement respectées,
    a-t-elle ajouté.'
