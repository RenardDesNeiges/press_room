- title: '«C’est pas chez vous ici, monsieur» : en Vendée, Gabriel Attal dénonce les
    occupations illégales des gens du voyage'
  summary: Poursuivant sa tournée d’été, l’ex-Premier ministre a réaffirmé ce mardi
    4 août sa volonté de lutter contre les installations illégales d’une partie des
    membres de la communauté. Une offensive soutenue par certains, face à une population
    qui se dit inquiète de sa «mise à l’écart de la société».
