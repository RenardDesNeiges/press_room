- title: Al menos 17 muertos y 44 heridos en ataques nocturnos de Rusia sobre Kiev
  summary: "Esta ofensiva  se produce después de que el pasado martes el presidente\
    \ ucraniano, Volodímir Zelenski, anunciara nuevas operaciones contra territorio\
    \ rusoPor qué Ucrania se está ensañando en su campaña de ataques con Wildberries,\
    \ el 'Amazon ruso'\n\n        Al menos 17 personas han muerto y 44 han resultado\
    \ heridas en ataques nocturnos de Rusia contra la región de Kiev, informó este\
    \ miércoles el Servicio Estatal de Emergencias ucraniano. Esta ofensiva se produce\
    \ después de que el pasado martes el presidente ucraniano, Volodímir Zelenski,\
    \ anunciara nuevas operaciones contra territorio ruso, después de la campaña de\
    \ 40 días que comenzó el pasado 25 de junio y registró exitosos ataques contra\
    \ centros logísticos y refinerías.\n    \n        Hasta ahora, se ha informado\
    \ de 44 personas heridas en el masivo ataque ruso contra Kiev y la región de Kiev.\
    \ Otras 17 personas, trágicamente, murieron. Mis condolencias a sus familias y\
    \ seres queridos. Fue un ataque devastador“, ha escrito en redes sociales el presidente\
    \ ucraniano. Según el dirigente, Rusia lanzó en esta ofensiva 24 misiles balísticos,\
    \ 4 misiles Zircon/Oniks y otros 115 drones.\n    \n        “Los principales objetivos\
    \ del ataque fueron instalaciones de almacenes pertenecientes a empresas civiles.\
    \ También hubo ataques contra infraestructura y una estación de tren. Estas instalaciones\
    \ no tenían nada que ver con la guerra: una empresa cervecera, almacenes de materiales\
    \ de construcción y instalaciones logísticas civiles”, ha acusado Zelenski a Rusia.\n\
    \    \n        Por último, el presidente ucraniano ha asegurado que “los interceptores\
    \ de misiles balísticos podrían haber salvado las vidas de los fallecidos”, por\
    \ lo que ha urgido a los aliados europeos a evitar “retrasos en el suministro”\
    \ y a tener “voluntad” para proporcionar este tipo de aparatos, ya que su falta\
    \ “conduce directamente a bajas horrorosas y destrucción”. “Una parte significativa\
    \ de la producción de misiles balísticos de Rusia aún no está bajo sanciones.\
    \ Incluso ahora. Se necesitan nuevos pasos: del G7, la Unión Europea y todos los\
    \ que apoyan la protección de la vida”, ha zanjado.\n    \n        Actualmente,\
    \ las unidades del Servicio Estatal de Emergencias (SES) trabajan en cuatro localidades\
    \ del distrito de Brovary, dos del distrito de Buchanan y una del distrito de\
    \ Fastiv.\n    \n        En el distrito de Brovary se han producido incendios\
    \ de “gran magnitud” en almacenes de la ciudad de Brovary, y los pueblos de Velyka\
    \ Dymerka, Kvitneve y Peremoga.\n    \n        En el distrito de Buchanan, se\
    \ está extinguiendo el incendio de un almacén en la aldea de Chayky. En la aldea\
    \ de Sofiivska Borshchahivka, se apagó un incendio en las instalaciones de una\
    \ empresa de logística.\n    \n        Los ataques ucranianos redujeron en julio\
    \ la capacidad de refinado en este país (3,6 millones de barriles diarios) a los\
    \ niveles de 2002, según medios económicos."
