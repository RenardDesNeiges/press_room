- title: Un muerto y dos heridos de gravedad tras la explosión de un tanque de combustible
    en un polígono de Telde
  summary: "El Ayuntamiento de Telde ha pedido a la ciudadanía que evite desplazarse\
    \ a las inmediaciones mientras continúan las labores de los equipos de intervención\n\
    \        La explosión de un tanque de combustible en el polígono industrial de\
    \ Salinetas, en Telde (Gran Canaria), ocurrida sobre las 12.09 horas de este miércoles,\
    \ ha dejado un muerto y dos personas heridas de gravedad, según las primeras informaciones\
    \ facilitadas por la Policía Nacional a Canarias Ahora.\n    \n        Fuentes\
    \ policiales han señalado que el accidente se ha saldado con tres trabajadores,\
    \ uno de ellos fallecido mientras desempeñaba las labores propias de su trabajo\
    \ en las instalaciones de DISA, en el polígono industrial de Salinetas. Las circunstancias\
    \ del suceso y el alcance definitivo de las víctimas continúan siendo objeto de\
    \ investigación. El alcalde de Telde, Juan Antonio Peña, ha afirmado a Radio Televisión\
    \ Canaria que estas personas“ estaban realizando un trabajo vertical y algo ocurrió,\
    \ que se generó una explosión que se escuchó con contundencia en la zona de Salinetas\
    \ y Melenara”.\n    \n        Peña destaca además que el fallecido pertenecía\
    \ a una familia “humilde, sencilla y profundamente respetada por quienes la conocen”,\
    \ una circunstancia que ha multiplicado la consternación entre vecinos, amigos\
    \ y allegados. También quiso extender su apoyo a los dos trabajadores que permanecen\
    \ hospitalizados en estado grave como consecuencia del accidente, trasladándoles,\
    \ en nombre de toda la ciudad, sus mejores deseos para una pronta y completa recuperación.\n\
    \    \n        \n                                            \n\n\n\n\n\n\n  \
    \  \n                                    \n                                  \
