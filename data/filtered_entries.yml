    \     Un operario arrastra el cuerpo de un ciervo mediante una cadena sujeta a\
    \ su pata trasera a través de una zona de paso del matadero.                \
    \            \n                                    \n            \n          \
    \      Procedían de El Pardo\n        Las grabaciones fueron captadas el 5 de\
    \ marzo de 2025 en el interior del matadero de Vicente de Lucas, en Segovia (Castilla\
    \ y León) de forma anónima y enviadas a finales de octubre a Igualdad Animal.\
    \ Fuentes de la organización detallaron que fueron sacrificados más de 200 ciervos\
    \ que procedían del Monte de El Pardo, área natural protegida al noroeste de Madrid,\
    \ y que gestiona Patrimonio Nacional, organismo adscrito a Presidencia del Gobierno.\
    \ “Los animales fueron capturados vivos, mutilados en sus cuernos y trasladados\
    \ al matadero”, señaló la organización animalista a este diario. Antes del sacrificio\
    \ de más de 200 cérvidos, “más de cinco ya habían muerto dentro de las instalaciones,\
    \ posiblemente a causa del estrés y el miedo provocados por el confinamiento”,\
    \ añadieron.\n    \n        El Monte de El Pardo es un espacio protegido de alto\
    \ valor, considerado como uno de los mejor conservados de Europa. Situado al noroeste\
    \ de Madrid, cuenta con una superficie de 15.821 hectáreas, y fue declarado Zona\
    \ de Especial Conservación para las Aves (ZEPA), dentro de la Red Natura 2000.\
    \ La caza está prohibida en este espacio y los controles de población de ciervos\
    \ se realizan “mediante capturas y traslado a mataderos autorizados”, aunque con\
    \ “carácter estacional”, especifica Salud Pública de Castilla y León, principalmente\
    \ durante los meses de diciembre, febrero y agosto, según la documentación consultada\
    \ por este diario.\n    \n        \n                                         \
    \   \n\n\n\n\n\n\n    \n                                    \n               \
