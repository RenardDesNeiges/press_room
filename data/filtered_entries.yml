- title: El pez más grande del mundo deja de esconder su forma de alimentarse gracias
    a cámaras instaladas sobre su cuerpo
  summary: "Alimentación oceánica - Los registros mostraron descensos, ascensos y\
    \ recorridos cerca del fondo marino, además de persecuciones de kril que cuestionan\
    \ la idea de una alimentación casi exclusiva en superficie\n        Las cámaras\
    \ sujetas a la aleta dorsal de diez tiburones ballena han mostrado que estos peces\
    \ pasan buena parte de sus horas alimentándose bajo el agua mediante maniobras\
    \ que apenas habían sido observadas. El equipo obtuvo más de 22 horas de grabación\
    \ en el arrecife de Ningaloo, en Australia Occidental, y siguió a los animales\
    \ desde su propia perspectiva mientras descendían, avanzaban con la boca abierta\
    \ o recorrían zonas próximas al lecho marino.\n    Las cámaras revelan cómo comen\
    \ los tiburones ballena bajo el agua\n        Los dispositivos reunían imágenes\
    \ y datos de movimiento, de modo que cada secuencia permitía asociar una conducta\
    \ con la profundidad, la velocidad y la posición del animal. Los investigadores\
    \ colocaron las etiquetas mientras nadaban junto a los ejemplares y las fijaron\
    \ en la parte superior de la aleta dorsal. Tras un periodo programado de 24 horas,\
    \ la pinza se soltaba y el equipo podía recuperar la cámara sin dejar ningún elemento\
    \ adherido al tiburón.\n    \n        Las grabaciones mostraron que la alimentación\
    \ se extendía desde la superficie hasta los 70 metros de profundidad registrados\
    \ en la zona de estudio. Algunos ejemplares descendían casi sin esfuerzo con la\
    \ boca abierta, mientras otros perseguían bancos de kril cerca de la superficie\
    \ con movimientos mucho más intensos. También aparecieron ascensos con la boca\
    \ abierta y desplazamientos muy próximos al fondo, conductas que amplían la imagen\
    \ tradicional de una especie asociada sobre todo a la alimentación superficial.\n\
    \    \n        A partir de esas imágenes y de la revisión de 106 publicaciones\
    \ científicas, el equipo reunió el catálogo más amplio elaborado hasta ahora sobre\
    \ el comportamiento del tiburón ballena. La investigación, publicada en Marine\
    \ Biology, distinguió 36 conductas diferentes, de las que 12 estaban relacionadas\
    \ con la alimentación. Seis de esas formas de buscar comida no habían sido registradas\
    \ antes, según la información difundida por Live Science.\n    Los tiburones adaptan\
    \ su esfuerzo según la cantidad de presas\n        La mayor parte del tiempo analizado\
    \ correspondió a seis estrategias de bajo esfuerzo, un patrón que apunta a una\
    \ búsqueda prolongada en aguas con poca concentración de presas. Cuando los tiburones\
    \ encontraban una acumulación de kril, modificaban su forma de nadar y pasaban\
    \ a una alimentación activa. Esa flexibilidad puede ayudar a entender cómo una\
    \ especie que alcanza hasta 18 metros de longitud subsiste con organismos diminutos\
    \ en mares tropicales pobres en nutrientes.\n    \n        La variedad registrada\
    \ supera la descrita en otros grandes animales filtradores, entre ellos los tiburones\
    \ peregrinos y varias especies de ballenas. El repertorio permite ajustar el gasto\
    \ de energía a la cantidad de alimento disponible, una capacidad especialmente\
    \ útil cuando las presas aparecen repartidas de manera irregular y obligan a recorrer\
    \ distintas capas del agua antes de localizar concentraciones aprovechables.\n\
    \    \n        Un estudio publicado en 2020 ya había calculado que los tiburones\
    \ ballena podían dedicar hasta el 20% del día a alimentarse a distintas profundidades,\
    \ frente a menos del 1% en la superficie. Aquella estimación sugería que buena\
    \ parte de su actividad quedaba fuera del alcance de barcos, aviones y buceadores,\
    \ aunque los registros de movimiento no permitían identificar con precisión qué\
    \ hacían los animales durante cada inmersión.\n    La investigación todavía necesita\
    \ comprobar otros escenarios\n        La nueva investigación cubre esa carencia\
    \ al asociar cada desplazamiento con imágenes, aunque todavía deja fuera las inmersiones\
    \ más profundas, donde la luz desaparece y las cámaras convencionales dejan de\
    \ grabar. Philip Motta, profesor emérito de Biología en la Universidad del Sur\
    \ de Florida y ajeno al estudio, consideró que los vídeos aportan información\
    \ “muy valiosa” sobre la variedad de conductas alimentarias de la especie.\n \
    \   \n        El trabajo se limita a una agrupación costera de ejemplares juveniles\
    \ en Ningaloo, por lo que sus resultados no describen todo el comportamiento mundial\
    \ del tiburón ballena. La colocación de cámaras en otros puntos de reunión permitiría\
    \ comprobar si las mismas estrategias aparecen en poblaciones adultas, en otros\
    \ océanos o durante descensos mucho mayores. Esa ampliación permitirá conocer\
    \ cómo responde una especie amenazada cuando el cambio climático vuelve menos\
    \ previsibles las zonas donde encuentra alimento."
