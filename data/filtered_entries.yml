- title: 'El nuevo gran proyecto de Henry Cavill: protagonizará y producirá adaptaciones
    de una famosa franquicia de ciencia ficción'
  summary: "El actor ha mencionado en varias ocasiones ser fan del juego y que ya\
    \ tuvo interés de llevarlo al cine y a la pequeña pantallaLa decisión de Netflix\
    \ sobre Henry Cavill y ‘The Witcher’ que ha enfurecido a los fans de la serie:\
    \ “Como si nunca existieron”\n        El actor británico Henry Cavill estaría\
    \ inmerso en la adaptación en formato de serie animada de una franquicia de ciencia\
    \ ficción, en la que también participa en su versión real, junto a Amazon MGM\
    \ Studios para la plataforma Prime Video, según informa Variety.\n    \n     \
    \   En este sentido, se trata de una serie de animación de ‘Warhammer 40k’, en\
    \ la que Henry Cavill sería una de las personas en cabeza, y que formaría parte\
    \ de la antología animada ‘Secret Level’, siendo una especie de ‘spin-off’ del\
    \ episodio que ya apareció en ella.\n    \n        No son muchos detalles los\
    \ que se conocen en este momento al respecto de este proyecto, aunque una de las\
    \ cosas que ha trascendido es su trama, que se trataría de una historia expandida\
    \ enfocada en Vigías de la Muerte, conocidos como ‘Deathwatch’ y que son el cuerpo\
    \ de Marines Espaciales más letal.\n    Henry Cavill también protagonizará la\
    \ película relacionada\n        Este proyecto tiene lugar en paralelo a otro en\
    \ el que también está involucrado Henry Cavill, pues será el protagonista de la\
    \ película de ‘live-action’ que se prepara sobre este universo, siendo también\
    \ productor ejecutivo. Este lleva más tiempo en desarrollo y no se conoce mucho\
    \ sobre él.\n    \n        En el caso de la serie animada sí se sabe, por ejemplo,\
    \ algunas de las personas detrás, como es el caso de Tim Miller, fundador de Blur\
    \ Studio y responsable de la antología ‘Secret Level’, y que será productor junto\
    \ a Cavill. Dave Wilson será el creador y director junto al guionista John Orloff,\
    \ que participó en la escritura de la aclamada ‘Band of Brothers’ de HBO.\n  \
    \  \n        Cabe tener en cuenta que Dave Wilson ya dirigió el episodio de ‘Secret\
    \ Level’ que se hizo sobre ‘Warhammer 40k’, por lo que ya conoce la franquicia\
    \ y cómo es llevarla a la pantalla. Y es que participó ya en la mencionada antología,\
    \ lanzada a finales de 2024 en la plataforma Prime Video. \n    \n    \n     \
    \               \n                            \n\n\n\n\n            \n       \
    \ Fue concretamente en el quinto capítulo, que fue a su vez uno de los mejor recibidos\
    \ por el público, y que ya tuvo animación a cargo del mismo estudio, Blur Studio,\
    \ que va a participar en la serie. Un proyecto en el que tampoco extraña la participación\
    \ de Henry Cavill, que ha mencionado en varias ocasiones ser fan del juego y que\
    \ ya tuvo interés de llevarlo al cine y a la pequeña pantalla.\n    Los orígenes\
    \ de ‘Warhammer 40k’\n        La franquicia de ciencia ficción ‘Warhammer’ nació\
    \ como un juego de mesa de guerra a finales de la década de 1980, con figuras\
    \ en miniatura que los jugadores se encargaban de armar y pintar, siendo un formato\
    \ que todavía sigue vigente y que tiene todavía una amplia base de fans. Pero\
    \ a su vez, luego dio el salto a la industria de los videojuegos, con varias adaptaciones,\
    \ entre ellas la saga dentro del universo, ‘Space Marine’"
