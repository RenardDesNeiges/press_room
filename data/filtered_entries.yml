- title: La imagen más nítida de la superficie del Sol nos acerca como nunca a la
    predicción de las tormentas solares
  summary: "Los datos obtenidos por el telescopio solar más grande del mundo, en Hawái,\
    \ podrían cambiar la forma en que entendemos los mecanismos físicos que impulsan\
    \ la actividad solar y sus impactos en la vida en la TierraMAPA | Dónde ver el\
    \ eclipse solar del 12 de agosto: recorrido y visibilidad en cada municipio, minuto\
    \ a minuto\n\n        Un equipo de investigadores acaba de obtener las imágenes\
    \ más nítidas de la fotosfera solar y han descubierto algunos detalles que podrían\
    \ ayudar a explicar la actividad explosiva que provoca las temidas tormentas solares.\
    \ Mediante imágenes tomadas por el telescopio solar más grande del mundo —el DKIST,\
    \ situado en Hawái—, los científicos han revelado cómo se comportan los pequeños\
    \ vórtices de plasma en las fronteras magnéticas de nuestra estrella, una de las\
    \ claves para entender su comportamiento.\n    \n        Los detalles se ofrecen\
    \ en un artículo publicado este miércoles en la revista Nature por el equipo de\
    \ David Kuridze y Friedrich Woeger, en el que describen cómo el telescopio DKIST\
    \ ha conseguido arañar el límite de lo invisible al alcanzar una resolución espacial\
    \ sin precedentes de 19 kilómetros. Gracias a esta capacidad, los investigadores\
    \ han identificado vórtices magnéticos individuales con dimensiones de entre 25\
    \ y 170 kilómetros, separados entre sí por una distancia media de unos 65 kilómetros.\
    \ Estos ovillos magnéticos son el embrión de las potentes llamaradas que emite\
    \ el Sol y hasta ahora sus escalas métricas eran absolutamente inaccesibles para\
    \ cualquier instrumento astronómico.\n    \n        Lo que los autores han identificado\
    \ es la firma de la inestabilidad de Kelvin-Helmholtz en la superficie del Sol,\
    \ un fenómeno que aparece cuando dos capas de un fluido se desplazan a distinta\
    \ velocidad, formando características ondas en espiral, como las que se observan\
    \ en la atmósfera de Júpiter o en las nubes de los sistemas meteorológicos terrestres.\
    \ Esta turbulencia magnética podría ser una razón clave por la que la atmósfera\
    \ exterior del Sol alcanza temperaturas tan elevadas y por la que la energía se\
    \ acumula y se desplaza por él. Y el mecanismo alimenta las erupciones y eyecciones\
    \ solares que pueden alcanzar la Tierra y afectar a los satélites, las redes eléctricas\
    \ y otras tecnologías.\n    Detalles a escala ultrafina\n        Para conseguir\
    \ las imágenes no bastó con la imponente estructura del telescopio de Maui. El\
    \ sistema utilizó la tecnología alemana FastCam, capaz de capturar hasta 740 imágenes\
    \ por segundo, integrada con un sistema de óptica adaptativa funcionando al límite\
    \ de la difracción. Esta combinación extrema de hardware y técnicas de reconstrucción\
    \ de imagen hizo posible captar los vórtices solares con total nitidez. “Creemos\
    \ que el descubrimiento de la inestabilidad de Kelvin-Helmholtz en la fotosfera\
    \ solar, respaldado por el análisis de simulaciones numéricas, es un gran paso\
    \ adelante en nuestra comprensión de la dinámica y evolución del plasma solar\
    \ y estelar, y servirá de base para futuros descubrimientos”, asegura David Boboltz,\
    \ director adjunto del Observatorio Solar Nacional.\n    \n    \n            \
    \        \n                            \n\n\n\n\n            \n        “La inestabilidad\
    \ de Kelvin-Helmholtz es probablemente un mecanismo que contribuye al calentamiento\
    \ de la atmósfera exterior y es parte de la solución al enigma de larga data de\
    \ por qué las estrellas tienen una corona caliente de un millón de grados Kelvin”,\
    \ señala Thomas Rimmele, del Observatorio Solar Nacional. Para comprender el clima\
    \ espacial dinámico que afecta a la Tierra, tenemos que ver los procesos a pequeña\
    \ escala que lo impulsan, apunta Jacqueline Keane, directora de Programa de la\
    \ NSF para el Observatorio Solar Nacional. “Durante décadas, ver estos vórtices\
    \ a escalas tan diminutas fue imposible”, destaca. “Ahora, el Telescopio Solar\
    \ Inouye de la NSF ha revelado estos detalles de escala ultrafina por primera\
    \ vez, haciendo posibles descubrimientos que antes estaban fuera de nuestro alcance”.\
    \  \n    Un paso hacia la predicción\n        Para Valentín Martínez Pillet, director\
    \ del Instituto de Astrofísica de Canarias (IAC) y experto en física solar, el\
    \ resultado establece un nuevo referente en el estudio de la interacción entre\
    \ zonas de diferente magnetización en el Sol y puede ser un salto enorme para\
    \ entender los mecanismos íntimos que dan pie a las tormentas solares. “Se trata\
    \ de saber cuál es la microfísica de los procesos magnéticos para predecir las\
    \ tormentas geomagnéticas, que son procesos macrofísicos”, explica a elDiario.es.\
    \ \n    \n        Las tormentas solares, recuerda Martínez Pillet, y las expulsiones\
    \ de masa coronal son procesos a escalas grandes, similares al tamaño del sol,\
    \ pero empiezan todos a partir de procesos a pequeña escala que todavía no entendemos.\
    \ “Con estas herramientas vamos a poder descubrir todos estos procesos microfísicos\
    \ que, cuando tengamos una visión completa de todos ellos, seremos capaces de\
    \ predecir las tormentas solares y la meteorología espacial con una precisión\
    \ similar a la precisión que tenemos con la meteorología terrestre”, señala. “Aunque\
    \ creo que necesitamos 50 años para dar este paso”.\n    \n        Héctor Socas,\
    \ astrofísico y director de la Fundación del Telescopio Solar Europeo, considera\
    \ que este trabajo es muy importante porque ofrece una explicación a cómo el campo\
    \ magnético de la superficie solar consigue acumular energía y transportarla luego\
    \ hacia arriba para calentar la corona o provocar erupciones y tormentas solares.\
    \ “Si hay una constante en toda la astrofísica es que cada vez que miramos al\
    \ cielo con un telescopio más grande descubrimos cosas nuevas”, señala. “Y el\
    \ Sol no es una excepción. DKIST ha descubierto la existencia de pequeños remolinos\
    \ que se aglomeran en torno a las estructuras magnéticas, que podrían jugar un\
    \ papel importante en la acumulación y transporte de energía hacia la corona”.\
    \ Estas observaciones revelan que la inestabilidad de Kelvin-Helmholtz está presente\
    \ por doquier en torno a las estructuras magnéticas, resume, y podría ser responsable\
    \ de que el campo magnético se enrede, acumulando energía que podría alimentar\
    \ las tormentas solares."
