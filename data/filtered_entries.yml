    \                            \n            \n                Vista de varios ciervos\
    \ amontonados en el área de sacrificio mientras un trabajador realiza labores\
    \ de manejo entre los cuerpos.                            \n                 \
    \                   \n            \n                Igualdad Animal exigió el\
    \ cierre cautelar\n        Igualdad Animal presentó una denuncia ante las autoridades\
    \ de la Junta de Castilla y León el 22 de diciembre de 2025. En ella, la entidad\
    \ animalista reclamó que se llevaran a cabo “medidas de corrección, seguridad\
    \ o control que impidan la continuidad en la producción del daño” y que, en su\
    \ defecto, se estudiara el “cese o interrupción de la actividad”, con la posible\
    \ clausura del establecimiento, así como la retirada de la autorización administrativa.\n\
    \    \n        Asimismo, solicitaron la verificación del “cumplimiento del matadero\
    \ de la obligación de disponer de un Sistema de Videovigilancia del Bienestar\
    \ de los Animales”, según lo previsto en el Real Decreto 695/2022. Esta normativa,\
    \ que regula específicamente esta cuestión, indica en su artículo 1 que este real\
    \ decreto “tiene por objeto establecer, con carácter básico, los requisitos para\
    \ la instalación y funcionamiento de un Sistema de Videovigilancia del Bienestar\
    \ de los Animales en los mataderos del territorio español, para la realización\
    \ de controles relativos a la normativa sobre bienestar de los animales, a fin\
    \ de garantizar su cumplimiento por los operadores de los mataderos y su personal”.\n\
    \    \n        En su solicitud, Mulá sostuvo que esta videovigilancia debe incluir\
    \ “todas las áreas donde se encuentren animales vivos” y que se debe comprobar\
    \ “la existencia de un procedimiento normalizado de trabajo que registre los incumplimientos\
    \ detectados y las medidas adoptadas, conservando dichos registros”, como establece\
    \ la ley.\n    \n        En este sentido, Igualdad Animal insiste en que sigue\
    \ siendo imprescindible “esclarecer cómo pudieron producirse las irregularidades\
    \ denunciadas en un establecimiento autorizado, sometido a controles oficiales\
    \ y obligado a contar con sistemas de videovigilancia, sin que estos hechos fueran\
    \ detectados previamente”. Por ello, la organización animalista reclama “conocer\
    \ el funcionamiento real de estos mecanismos y su capacidad para prevenir y detectar\
    \ incumplimientos de la normativa de bienestar animal”."
