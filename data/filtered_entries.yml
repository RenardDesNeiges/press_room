- title: El exceso de calor y las lluvias de primavera fuerzan la vendimia de Rioja
    más adelantada de la historia
  summary: "El calor de verano y las lluvias de la primavera aceleran el ciclo del\
    \ viñedo y obliga a Alfaro y Aldeanueva de Ebro a iniciar la recogida de madrugada\
    \ en la primera semana de agosto, la vendimia más adelantada de la historiaPlan\
    \ especial para la vendimia 2026: Rioja despliega una treintena de técnicos y\
    \ abre un buzón confidencial para los viticultores\n\n        La vendimia más\
    \ adelantada de la historia para la Denominación de Origen Calificada Rioja va\
    \ a comenzar la primera semana de agosto. Como suele ser habitual, La Rioja Baja\
    \ es la que marca el inicio. Antes de que salga el sol este jueves, la bodega\
    \ familiar Ilurce, en Alfaro, y la Cooperativa Viñedos de Aldeanueva de Ebro,\
    \ empezarán a cortar uvas en varias fincas de tempranillo blanco. “El récord hasta\
    \ ahora estaba en el 10 de agosto, hace dos años, y este año arrancamos el 6.\
    \ Como siga esto así, vamos a seguir batiendo récords en los próximos años, lamentablemente”,\
    \ apunta Abel Torres, director de la cooperativa de Aldeanueva de Ebro mientras\
    \ ultima los preparativos. \n    \n        La bodega de Alfaro había presentado\
    \ solicitud en el Consejo Regulador para empezar, sin fecha determinada a la espera\
    \ de los últimos análisis. “Ayer cuando salimos a muestrear, vimos una pequeña\
    \ ralentización de la maduración respecto al muestreo anterior, que fue el viernes,\
    \ por lo que decidimos esperar a ver la evolución. Después de los muestreos de\
    \ hoy, creemos que la uva ya está preparada”, señala Víctor Escudero, el responsable\
    \ de enología. Así, habían marcado el comienzo de la vendimia este miércoles 5\
    \ de agosto en torno a las 04:00 horas en una finca de 2,4 hectáreas de tempranillo\
    \ blanco, donde esperan recoger unos 20.000 kilos de uva. Finalmente, un problema\
    \ en una máquina lo ha retrasado al jueves, el mismo día que empieza en Aldeanueva.\n\
    \    \n    \n                    \n                            \n\n\n\n\n    \
    \        Las lluvias de primavera y el calor aceleran la uva\n        La vid ha\
    \ tenido un ciclo temprano este año desde el inicio, desde la floración, por lo\
    \ que se estima que va a acabar con un adelanto de en torno a unos 10-12 días.\
    \ “Tuvimos un invierno y un principio de primavera fresco y lluvioso y a partir\
    \ de San Isidro, a partir del 15 de mayo, el tiempo se ha hecho extremadamente\
    \ seco y caluroso y con la humedad que había en el suelo, la planta ha ido a más\
    \ velocidad”, explica Abel Torres sobre los motivos principales de la aceleración\
    \ de la maduración de la uva y el adelanto de la vendimia. A ello suma los últimos\
    \ días de calor intenso, aunque con prudencia: “Esto no es tan determinante porque\
    \ la planta se para cuando tiene mucho calor y se pone un poco en modo supervivencia,\
    \ el tamaño de la baya se hace más pequeño y frena un poco el inicio del ciclo”.\
    \ \n    \n        Por su parte, Víctor Escudero, de Bodegas y Viñedos Ilurce,\
    \ alude como causa principal al verano muy caluroso: “Si a este calor le sumamos\
    \ que igual llevamos dos meses, por lo menos en Alfaro, sin que caiga una gota\
    \ de agua, pues hace que todo avance y que, además, las plantas estén sufriendo\
    \ mucho. Entonces, la necesidad de la uva de cortarla. Creemos que si esperamos\
    \ algún día más, no nos va a aportar nada, sino que quizás nos perjudique”. Su\
    \ bodega será la que estrene la vendimia más adelantada de la historia en el cuarto\
    \ año en que elaboran su propio tempranillo blanco. \n    \n        \n       \
    \                                     \n\n\n\n\n\n\n    \n                   \
    \                 \n                                                         \
    \                                                                            \
    \   \n                                                    \n                 \
    \                               \n                                           \
    \                                                                            \
    \ \n                                                    \n                   \
    \                             \n                                             \
    \                       \n                                                   \
    \ \n                                                \n                       \
    \             \n                \n\n                \n\n            \n       \
    \     \n\n            \n            \n                            \n         \
    \   \n                Comienzo de la vendimia en la localidad riojana de Aldeanueva\
    \ de Ebro.                            \n                                    \n\
    \            \n                \n        En ambos casos, será esta variedad la\
    \ que abra la vendimia y primera en entrar a las bodegas. Y esto también es determinante\
    \ para el adelanto, pues es una variedad con un ciclo más corto y que, además,\
    \ es relativamente nueva en Rioja, pues fue aprobada por el Consejo Regulador\
    \ en 2007.  “Es una variedad, al menos en esta zona, con una maduración muy rápida,\
    \ le cuesta muy poquito coger grados. El primer muestreo que hicimos fue el 24\
    \ de julio”, apunta Escudero, de Ilurce. “Esta variedad necesita vendimiarse ya\
    \ porque no queremos que sobremadure, que coja un grado alcohólico más elevado\
    \ –ahora estamos en torno a 12,5 grados– y pierda frescura y acidez. Lo más importante\
    \ ahora es mantener la fruta”, añade Abel Torres, de la Cooperativa de Aldeanueva.\
    \ \n    Vendimia de noche \n        También por este motivo, las primeras vendimias\
    \ de Rioja se realizan por la noche. A las 04:00 horas en Alfaro y entre las 06:00\
    \ y las 10:00 horas, en Aldeanueva para, como explica el director de la cooperativa,\
    \ “recibir la uva más fresca en la bodega y evitar oxidaciones que provocan la\
    \ luz y la temperatura”. El responsable de Ilurce alude a que aprovechan la bajada\
    \ de temperaturas de la noche, y “es mejor para la elaboración de vino después”.\
    \ \n    \n        Es habitual que la Cooperativa de Aldeanueva de Ebro sea la\
    \ encargada de inaugurar la vendimia de Rioja. “Nosotros tenemos 3.000 hectáreas\
    \ de viñedos, tenemos mucha masa vegetal y, por lógica, tenemos viñedos más y\
    \ menos avanzados”. No obstante, van a comenzar con una cantidad razonable, pues\
    \ prevén recoger en torno a 200.000 kilos en varias fincas, unas diez o doce.\
    \ Y, después, continuarán sin parar: “Vamos a coger todo lo más temprano este\
    \ jueves y no sé si abriremos el viernes o a partir del lunes, sin parar blanco\
    \ y en diez-quince días empezaremos con algunos tintos tempranos. La semana que\
    \ viene cogeremos todo el tempranillo blanco y empezaremos a coger viura y verdejo”.\
    \ El resto de bodegas ya se fijan en ellos: “Vernos empezar es motivo de nerviosismo\
    \ para mucha gente, estos días recibo muchas llamadas y consultas de compañeros”.\
    \ En Ilurce en Alfaro aseguran no fijarse en las fechas de los demás y, al tener\
    \ una producción pequeña, las que mandan son las uvas: “Simplemente, hemos ido\
    \ guiándonos por nuestras uvas e intentando hacer las cosas de la mejor manera\
    \ para nosotros luego poder sacar con esas uvas el vino que a nosotros nos interesa”.\n\
    \    \n        \n                                            \n\n\n\n\n\n\n  \
    \  \n                                    \n                                  \
    \                                                                            \
    \                          \n                                                \
    \    \n                                                \n                    \
    \                                                                            \
    \                        \n                                                  \
    \  \n                                                \n                      \
    \                                              \n                            \
    \                        \n                                                \n\
    \                                    \n                \n\n                \n\n\
    \            \n            \n\n            \n            \n                  \
    \          \n            \n                Tempranillo blanco de Viñedos de Aldeanueva\
    \ a punto de recogerse                            \n                         \
    \           \n            \n                \n        Las expectativas para esta\
    \ campaña son buenas. “Con el tiempo seco ha habido muy pocas enfermedades, a\
    \ fecha de hoy la uva está espectacular, pero necesitamos que llueva algo y termine\
    \ el ciclo en temperaturas más moderadas, tanto de día como de noche, eso sería\
    \ lo ideal”, pide Abel Torres. De cumplir el tiempo los deseos meteorológicos,\
    \ habrá una cosecha de muy buena calidad, pero si continúan las olas de calor\
    \ o llueve de forma masiva, podría haber problemas. “La calidad se juega en agosto\
    \ y septiembre, ahora tenemos un grano más pequeñito porque ha sufrido más al\
    \ tener temperaturas altas con estas olas de calor y ahora queremos, especialmente\
    \ en tintos, que la uva madure más lenta, que vengan temperaturas de noche frías\
    \ y diurnas no elevadas”, explica el director de la cooperativa sobre la campaña,\
    \ que esperan alcance una producción normal-baja en cuanto a cantidad frente a\
    \ lo “extremadamente baja” que fue la anterior. “Va a ser una cosecha relativamente\
    \ corta pero nada que ver con la cosecha del año pasado que fue una catástrofe”.\n\
    \    \n        El director de Viñedos de Aldeanueva prevé que los inicios cada\
    \ vez más adelantados de la vendimia sean la tónica habitual en Rioja, como está\
    \ pasando con otros cultivos, como la pera, por ejemplo, también bastante asentada\
    \ en La Rioja Baja. Las cada vez altas temperaturas provocadas por el cambio climático\
    \ aceleran la maduración de las uvas, que piden recogerse cada vez más pronto.\
    \ Por su parte, Víctor Escudero, de Ilurce, es presente: “Yo solo puedo hablar\
    \ de lo que estoy observando y viendo ahora; parece que sí viene cada vez más\
    \ adelantada, aunque creo que esto son ciclos”. En el campo y en la agricultura,\
    \ el resultado de cada cosecha es incierto y el tiempo es probablemente el factor\
    \ más importante, por lo que el actual tiempo con fenómenos extremos empieza a\
    \ dibujar un nuevo paradigma. Tanto que Rioja empieza a recoger ya las uvas de\
    \ la vendimia más adelantada de su historia."
