- title: 'La última noche de las Trece Rosas antes de ser fusiladas: "Se vistieron
    ayudadas por las demás, nuestras manos temblaban"'
  summary: "Frente a los estereotipos y el 'mito martirial' sobre las jóvenes ejecutadas\
    \ hace 87 años, el historiador Fernando Hernández Holgado recupera la \"memoria\
    \ subterránea\" de las testigos, que fue transmitida en las celdas de forma oral\
    \ a través de los detalles más intimos y reveladores del momentoLa trama civil\
    \ y militar detrás del golpe de Estado de 1936 que no iba a liderar Franco: “Todo\
    \ está ya en marcha”\n\n        Sobre las 12 y media de la noche vieron la puerta\
    \ abrirse lentamente. Envuelta en una capa azul marino, una de las funcionarias\
    \ de la cárcel de Ventas (Madrid), la prisión de mujeres más poblada de la España\
    \ franquista, entró a la galería de menores para pronunciar los nombres de Martina\
    \ Barroso, Victoria Muñoz y Ana López Gallego. Las tres presas sabían lo que significaba:\
    \ las iban a sacar al amanecer para fusilarlas en la tapia del cementerio del\
    \ Este junto a 43 hombres y otras diez mujeres. Este grupo de mujeres pasaría\
    \ a la historia como las Trece Rosas.\n    \n        Las militantes de las Juventudes\
    \ Socialistas Unificadas (JSU), ejecutadas el 5 de agosto de 1939, han inspirado\
    \ decenas de libros, películas y obras de teatro, pero antes estuvieron sus compañeras\
    \ de celda y aquellas presas que mantuvieron vivo su recuerdo. Todo un tapiz de\
    \ voces que sobrevivió dentro de las cárceles durante décadas, desafiando el silencio\
    \ impuesto por la dictadura franquista y que permite 87 años después acercarse\
    \ a los detalles más íntimos y reveladores de aquella última noche.\n    \n  \
    \      Son momentos muy gráficos, como el relatado por la comunista Carmen Machado,\
    \ que estaba presente en aquel instante y que relataría la reacción de Ana López\
    \ Gallego, conocida como Anita. “Se dio cuenta rápidamente de que venían a por\
    \ ellas, se puso en pie y dijo: 'No, no llame a las otras, ya las llamo yo'. Y\
    \ ella misma despertó al resto. De estas dos compañeras, a una de ellas hacía\
    \ muy pocos días que le habían fusilado a un hermano y recuerdo que lo único que\
    \ dijo fue '¡Pobrecilla, mi madre!'”.\n    \n        Se refería a Victoria Muñoz,\
    \ otra de las Trece Rosas, cuyo hermano Gregorio había sido asesinado. La miembro\
    \ del Partido Comunista (PCE) y enfermera durante la Guerra Civil, Josefina Amalia\
    \ Villa, también fue testigo directo de la saca y corroboraría la misma escena.\
    \ De los momentos antes de salir, contó que las tres jóvenes “se vistieron ayudadas\
    \ por las demás; nuestras manos temblaban mucho más que las suyas” y recordó que\
    \ Anita, al terminar, les hizo una pregunta a las compañeras “con voz serena y\
    \ un poco baja”: “¿Llevo las medias derechas?”, les interrogó. “Le dijimos que\
    \ sí, pero ¿quién las miró? Las abrazamos una y otra vez. ¡Qué horrible mezcla\
    \ de gritos y silencio! Todo parecía muerto”. \n    \n        Estas palabras de\
    \ Josefina Amalia las recogió otra expresa de Ventas, Tomasa Cuevas, que publicó\
    \ en los 80 los testimonios de mujeres que pasaron por las cárceles franquistas.\
    \ En su relato, la comunista recuerda a Martina como una muchacha de “hermoso\
    \ pelo rizado y tez descolorida” y narra cómo, la noche del 5 de agosto, mientras\
    \ toda la sala se fue acostando, Anita “siguió cosiendo con algunas compañeras\
    \ a su lado”. Dijo que esperaría porque no quería que la encontraran dormida cuando\
    \ fueran a buscarla. Las sacas de los días previos se habían producido antes de\
    \ las 11, por lo que cuando llegaron las 12.30, decidió dormirse. “Creo que está\
    \ noche me puedo acostar”, dijo Anita muy poco tiempo antes de que la funcionaria\
    \ apareciera en el umbral.\n    \n        Si hoy podemos acceder al relato de\
    \ aquellos momentos es gracias a las huellas que dejaron escritas durante la Transición\
    \ varias militantes antifranquistas, pero antes existió lo que el historiador\
    \ Fernando Hernández Holgado llama una “memoria subterránea” que fue transmitiéndose\
    \ entre las testigos directas o indirectas del hecho. “Fue un relato colectivo\
    \ de múltiples voces que recordaron en común y fueron elaborando y macerando durante\
    \ años, en condiciones hostiles. Solo a partir de 1978 se fue fijando en textos\
    \ escritos”, explica en el artículo Mitos y memorias. Una arqueología del mito\
    \ martirial y de las memorias subterráneas de las 'Trece Rosas', recién publicado\
    \ en la revista Pasado y Presente.\n    \n        \n                         \
    \                   \n\n\n\n\n\n\n    \n                                    \n\
    \                                                                            \
    \                                                            \n              \
    \                                      \n                                    \
    \            \n                                                              \
    \                                                          \n                \
    \                                    \n                                      \
    \          \n                                                                \
    \    \n                                                    \n                \
    \                                \n                                    \n    \
    \            \n\n                \n\n            \n            \n\n          \
    \  \n            \n                            \n            \n              \
    \  Flores en el Monumento a las Trece Rosas en el cementerio de La Almudena. \
    \                           \n                                    \n         \
    \   \n                \n        El historiador sigue el rastro de esa “memoria\
    \ interior” de la prisión que fue, durante mucho tiempo, oral y femenina. “Fue\
    \ allí, en aquella cárcel, donde empezó a gestarse un primer relato colectivo\
    \ de aquella primera comunidad de presas políticas” frente al “peligroso” ecosistema\
    \ franquista de aquellos años. La clave de su supervivencia pudo estar en “el\
    \ fuerte sentido de comunidad” de esa primera generación de presas políticas de\
    \ la dictadura ante los sucesos traumáticos que vivieron. “Su identidad, el sentido\
    \ identitario de sus vidas y de sus luchas dependía en buena medida de recordar\
    \ y hacerlo con fidelidad a lo vivido en carne propia y en la de sus compañeros”,\
    \ afirma. \n    “Como si fueran escolares haciendo sus deberes”\n        Siete\
    \ de las Trece Rosas no llegaban a la mayoría de edad legal establecida entonces\
    \ de los 21 años y sus edades oscilaban entre los 18 y 29. Por eso, sus compañeras\
    \ se refirieron a ellas como “las menores”. Tres estaban en una misma sala de\
    \ Ventas —la cárcel que llegó a retener a 5.000 presas a pesar de estar concebida\
    \ para 500—, mientras que el resto se encontraban diseminadas en pasillos, galerías\
    \ y sótanos. Además de Anita, Martina y Victoria, las Trece Rosas eran Virtudes\
    \ González, Luisa Rodríguez, Adelina García, Julia Conesa, Dionisia Manzanero,\
    \ Elena Gil, Joaquina López, Carmen Barrero, Pilar Bueno y Blanca Brisac.\n  \
    \  \n        Las jóvenes habían sido condenadas a muerte por un delito de adhesión\
    \ a la rebelión. Su sentencia, considerada ejemplarizante, se dictó en un contexto\
    \ de recrudecimiento de la represión tras el asesinato del comandante de la Guardia\
    \ Civil Isaac Gabaldón, un crimen en el que ninguna participó a pesar de las declaraciones\
    \ que en 2019 hizo el exconcejal de Vox en Madrid, Ortega Smith, a las que acusó\
    \ falsamente de “torturar, violar y asesinar vilmente”. En cada uno de sus expedientes,\
    \ una cruz azul perfilada en rojo marcaba su destino. Era la señal con la que\
    \ la cárcel de Ventas identificaba las condenas a la pena máxima, impuesta a 80\
    \ mujeres procedentes de esa prisión entre el final de la Guerra Civil y 1943.\n\
    \    \n        \n                                            \n\n\n\n\n\n\n  \
    \  \n                                    \n                                  \
    \                                                                            \
    \                          \n                                                \
    \    \n                                                \n                    \
    \                                                                            \
    \                        \n                                                  \
    \  \n                                                \n                      \
    \                                              \n                            \
    \                        \n                                                \n\
    \                                    \n                \n\n                \n\n\
    \            \n            \n\n            \n            \n                  \
    \          \n            \n                Expediente de Pilar Bueno, una de las\
    \ Trece Rosas.                            \n                                 \
    \   \n            \n                \n        Previamente a ser ejecutadas, las\
    \ presas solían escribir sus cartas de despedida a sus familias desde la capilla,\
    \ algo que también hicieron las Trece Rosas. Hernández Holgado recupera en su\
    \ artículo el relato de la militante comunista Soledad Real, que a pesar de ser\
    \ encarcelada cuatro años después, transmitió el recuerdo de la enfermera socialista\
    \ María Lacrampe. Ella sí estuvo con las jóvenes aquella noche en la capilla y\
    \ evocó la imagen de las mujeres escribiendo sus últimas misivas desde la cárcel\
    \ “como si fueran escolares haciendo sus deberes”. \n    \n        A través del\
    \ tiempo viajaron no solo los testimonios, sino objetos clandestinos vinculados\
    \ a la ejecución de las Trece Rosas. Entre ellos, el poema de la maestra Rafaela\
    \ González Quesada, conocida como Rafita, titulado 'Cuando mueren las estrellas',\
    \ que nombró por primera vez al grupo de jóvenes como las Trece Rosas y que fue\
    \ escrito la misma noche del 5 de agosto de 1939. Según recuerda Hernández Holgado,\
    \ Rafita era hermana del escultor Juan Cristóbal, que llevó el poema a París mientras\
    \ su hermana seguía en prisión. Allí, una de las hijas de la física Marie Curie\
    \ llegó a promover una campaña de protesta por los fusilamientos masivos que se\
    \ habían producido en el mes de agosto en España.\n    El “mito martirial” del\
    \ exilio\n        Es precisamente en este salto al exterior donde, según describe\
    \ Hernández Holgado, se gestó el “mito martirial del exilio” que también aborda\
    \ en su artículo y que contrapone a la “memoria subterránea”. El historiador explica\
    \ que el fusilamiento llegó a los medios escritos del exilio comunista con siete\
    \ años de retraso, en 1946, y sin citar ningún nombre propio, en un momento en\
    \ el que apenas se construían referentes femeninas y sí muchos hombres ocupaban\
    \ ese lugar. Tiempo después, fueron nombradas algunas de ellas, aunque con errores\
    \ en sus nombres.\n    \n        A partir de entonces fue construyéndose el mito\
    \ de las Trece Rosas en el exterior gracias, en parte, a los datos fragmentados\
    \ que algunas presas como Mercedes Núñez lograron transmitir, mujeres que aunque\
    \ no coincidieron con ellas, sí estuvieron en Ventas unos años después. El objetivo,\
    \ según describe el historiador, era “ser funcional”, es decir, servir para la\
    \ movilización política contra la dictadura, estableciendo una especie de “deuda\
    \ moral” hacia las “mártires”. Fernández Holgado lo llama “mito martirial”, construido\
    \ a través de estereotipos y destacando elementos como la inocencia, el sacrificio,\
    \ la valentía o la exageración de su juventud —se llegó a afirmar que alguna tenía\
    \ 16 años—.\n    \n        Frente a esta distancia física y temporal, el historiador\
    \ destaca la realidad íntima de las celdas en las que las represaliadas custodiaron\
    \ los recuerdos. Fue el caso de la comunista Juana Corzo, que guardó en secreto\
    \ el bordado que Dionisia, una de las jóvenes fusiladas, confeccionó antes de\
    \ ser ejecutada. Según algunos testimonios, la conocida como Juanita pudo despedirse\
    \ de las 13 jóvenes y llegó a resaltar de ellas su “gran valor y enorme dignidad”.\
    \ La antifranquista conservó clandestinamente el bordado durante tres décadas\
    \ de dictadura hasta que en 1977 se lo entregó a Dolores Ibárruri, Pasionaria,\
    \ a su vuelta del exilio."
