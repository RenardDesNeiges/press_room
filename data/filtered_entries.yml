- title: Un memorando oculto revela el plan de la Marina británica para convertir
    barcos en armas químicas durante la Guerra de 1812
  summary: "Conflictos navales - El temor de que el enemigo copiara el arma pesó tanto\
    \ como su capacidad destructiva, y esa preocupación llevó a la cúpula británica\
    \ a esconder durante décadas un proyecto concebido para asfixiar tripulaciones\
    \ estadounidenses\n        Una condena por fraude bursátil impidió que Thomas\
    \ Cochrane cruzara el Atlántico al mando del HMS Tonnant, cuando su proyecto de\
    \ ataque con gases podía pasar de los despachos a la guerra. El oficial de la\
    \ Royal Navy había sido designado capitán de bandera de su tío, el vicealmirante\
    \ Alexander Cochrane, jefe naval británico en Norteamérica, y debía preparar personalmente\
    \ un arma cuyo funcionamiento dominaba.\n    \n        El memorando de 23 páginas\
    \ que ha revelado ese episodio fue localizado por Peter Moore, historiador y biógrafo\
    \ de Cochrane, en los National Records of Scotland. El documento, titulado Statement\
    \ of Claims, fue redactado en 1844 por el secretario del marino y contiene añadidos\
    \ manuscritos atribuidos al comandante.\n    Thomas Cochrane ideó un arma tras\
    \ observar unas minas sicilianas\n        La idea había surgido en Sicilia en\
    \ 1811, cuando Cochrane observó los gases nocivos generados por las minas de azufre\
    \ y pensó que podían atravesar defensas costeras. Su propuesta consistía en cargar\
    \ barcos con azufre y materiales inflamables para enviarlos hacia una flota o\
    \ una posición litoral, donde serían incendiados con el propósito de debilitar\
    \ o expulsar a sus defensores. Moore, que dedicó tres años a estudiar al oficial,\
    \ explicó que “algo hizo clic en la cabeza de Cochrane y comprendió que aquel\
    \ gas podía utilizarse como arma de guerra”.\n    \n        Cochrane presentó\
    \ el método en 1812 ante un comité secreto formado por altos responsables militares\
    \ y miembros de la familia real, entre ellos el duque de York y el príncipe regente,\
    \ que después sería Jorge IV. Los integrantes consideraron que el ataque podía\
    \ resultar muy difícil de frenar, aunque temieron que otras potencias lo aplicaran\
    \ contra las colonias británicas. El propio oficial dejó escrita su obediencia\
    \ tras ser llamado a Carlton House: “Obedecí”.\n    \n        La guerra contra\
    \ Estados Unidos acercó el proyecto a una aplicación real, porque Alexander Cochrane\
    \ pensaba recurrir a él cuando las circunstancias fueran favorables. El memorando\
    \ no identifica un objetivo definitivo y menciona Nueva York junto a Baltimore,\
    \ mientras que otros indicios han llevado a considerar Nueva Orleans. Ninguna\
    \ orden conservada confirma que una de esas ciudades hubiera sido seleccionada.\n\
    \    \n        \n                                            \n\n\n\n\n\n\n  \
    \  \n                                    \n                                  \
    \                                                                            \
    \                          \n                                                \
    \    \n                                                \n                    \
    \                                                                            \
    \                        \n                                                  \
    \  \n                                                \n                      \
    \                                              \n                            \
    \                        \n                                                \n\
    \                                    \n                \n\n                \n\n\
    \            \n            \n\n            \n            \n                  \
    \          \n            \n                La condena dictada en Londres impidió\
    \ que Thomas Cochrane viajara con la flota                            \n     \
    \                               \n            \n                \n        El plan\
    \ quedó paralizado en 1814, cuando Cochrane fue condenado por un fraude en la\
    \ Bolsa de Londres relacionado con el falso anuncio de la muerte de Napoleón,\
    \ que provocó una subida de las acciones. La sentencia lo apartó del Parlamento\
    \ y del servicio naval en Norteamérica, por lo que nunca llegó a incorporarse\
    \ a la flota. Gran Bretaña incendió después Washington y la Casa Blanca, aunque\
    \ sufrió una derrota en Nueva Orleans antes del final de la guerra, a comienzos\
    \ de 1815.\n    \n        Cochrane atribuyó a aquella condena el fracaso de su\
    \ estrategia y defendió que el desenlace habría cambiado si hubiera conservado\
    \ el mando. En su memorando escribió: “Estoy plenamente convencido de que, si\
    \ mis planes no hubieran sido frustrados de forma tan cruel e injusta por una\
    \ acusación falsa, el resultado de la última guerra americana habría sido muy\
    \ diferente”. Después ayudó a organizar las armadas revolucionarias de Chile y\
    \ Brasil, recibió el indulto en 1832 y murió en 1860 con rango de almirante.\n\
    \    Los precedentes obligan a matizar el alcance del hallazgo\n        La consideración\
    \ del proyecto como primer ataque químico de la historia exige matices, porque\
    \ existen precedentes anteriores al siglo XIX. Simon James, arqueólogo y autor\
    \ de un estudio publicado en el American Journal of Archaeology, documentó que\
    \ tropas persas sasánidas quemaron azufre y betún hacia el año 256 en un túnel\
    \ de asedio de Dura-Europos, en la actual Siria, para incapacitar a soldados romanos.\
    \ La propuesta de Cochrane habría sido uno de los primeros ataques navales modernos\
    \ con gas a gran escala.\n    \n        La Organisation for the Prohibition of\
    \ Chemical Weapons sitúa el inicio de la guerra química masiva moderna en el ataque\
    \ alemán con cloro cerca de Ypres, el 22 de abril de 1915, más de un siglo después\
    \ del proyecto británico. \n    \n        El hallazgo llegará a las librerías\
    \ con A Dangerous Game: Thomas Cochrane’s Life on the Edge, la biografía de 640\
    \ páginas que Chatto & Windus publicará el 3 de septiembre de 2026 y que estudiará\
    \ sus carreras naval y política, además de la influencia que ejerció sobre el\
    \ Jack Aubrey creado por Patrick O’Brian."
