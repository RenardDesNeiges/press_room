- title: Irán anuncia un acuerdo con Omán para una nueva ruta de navegación por el
    estrecho de Ormuz
  summary: "Ambos países ribereños del estrecho han mantenido negociaciones en los\
    \ últimos días que, según Teherán, se ha centrado en definir rutas seguras de\
    \ entrada y salida para los buques que garanticen tanto los derechos soberanos\
    \ como las necesidades de seguridad nacional de ambos Trump asegura que este lunes\
    \ reanudará el diálogo con Irán pero Teherán dice que solo habla con Omán sobre\
    \ Ormuz\n        Irán ha anunciado que ha alcanzado un acuerdo con Omán para trazar\
    \ una nueva ruta de navegación por el estrecho de Ormuz, después de varios días\
    \ de negociaciones entre los dos países que comparten las aguas de esta estratégica\
    \ vía. Sin embargo, Estados Unidos no está incluido en el acuerdo y aún no se\
    \ ha pronunciado.\n    \n        El portavoz del Ministerio iraní de Exteriores,\
    \ Ismail Bagaei, ha dicho en un comunicado: “Las coordenadas geográficas de la\
    \ ruta propuesta han sido acordadas por ambas partes y, si determinadas terceras\
    \ partes no obstaculizan el proceso, la declaración conjunta que recoge los principales\
    \ puntos del entendimiento se encuentra en su fase final de revisión y redacción”.\n\
    \    \n        Bagaei ha advertido de que el acuerdo no garantiza automáticamente\
    \ la seguridad de la navegación por el estrecho: “Los factores que hacen inseguro\
    \ el estrecho de Ormuz aún persisten, en particular el bloqueo naval y otras acciones\
    \ agresivas y amenazantes contra Irán y sus intereses por parte de Estados Unidos”,\
    \ ha detallado.\n    \n        En la noche del martes, Bagaei había dicho que\
    \ “Irán trabaja en cooperación con Omán para elaborar los mecanismos necesarios\
    \ que regulen la futura gestión del tránsito marítimo en este estratégico paso”.\
    \ Bagaei explicó que las conversaciones mantenidas entre los dos países ribereños\
    \ del estrecho se estaban centrando en definir rutas seguras de entrada y salida\
    \ para los buques que garanticen tanto los derechos soberanos como las necesidades\
    \ de seguridad nacional de Irán y Omán.\n    \n        Anteriormente, el presidente\
    \ de Estados Unidos, Donald Trump, advirtió a Irán de que sufrirá “un golpe muy\
    \ duro” si vuelve a retirarse de las negociaciones para alcanzar un acuerdo que\
    \ impida que Teherán desarrolle armas nucleares. “No tengo otra opción. No pueden\
    \ tener un arma nuclear. Es muy sencillo”, afirmó Trump en una entrevista con\
    \ la cadena Fox News desde su campo de golf en Los Ángeles.\n    \n        El\
    \ mandatario estadounidense afirmó el lunes que los contactos con Teherán representan\
    \ la “última oportunidad” para que Irán firme un “buen” acuerdo, aunque fuentes\
    \ diplomáticas iraníes negaron que haya negociaciones directas con Washington\
    \ y señalaron que los contactos se centraban con Omán.\n    \n        El secretario\
    \ del Tesoro estadounidense, Scott Bessent, adelantó el martes que EEUU e Irán\
    \ podrían alcanzar un acuerdo inminente para reabrir el tránsito de embarcaciones\
    \ comerciales por el estrecho de Ormuz.\n    \n        Trump dijo que suspendió\
    \ el fin de semana un ataque contra Irán para dar margen a las negociaciones,\
    \ que, según anunció, comenzarían el lunes, extremo que Teherán negó. El mandatario\
    \ acusó después a Irán de actuar de forma “hipócrita” por negar la existencia\
    \ de esas supuestas conversaciones y advirtió a la República Islámica de que era\
    \ su “última oportunidad para firmar un buen acuerdo”.\n    \n        Con información\
    \ de EFE"
