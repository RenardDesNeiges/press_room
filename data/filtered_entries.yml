- title: La Audiencia Nacional pregunta a la Guardia Civil si recibió alguna alerta
    previa sobre la posible llegada de miles de personas a Ceuta
  summary: "La jueza también solicita que se le informe del dispositivo desplegado\
    \ en el territorio y los datos que consten sobre las personas fallecidas en el\
    \ marQué hay detrás de la embestida de Meloni contra España por la crisis de Ceuta\n\
    \n        La jueza de la Audiencia Nacional que ha abierto diligencias previas\
    \ sobre la entrada de decenas de miles de personas en Ceuta ha pedido a la Guardia\
    \ Civil que le aclare si recibió “alguna información en los días previos” que\
    \ “hubiese podido alertar” sobre lo que iba a ocurrir.\n    \n        En un auto\
    \ fechado el 4 de agosto, la titular del Juzgado Central de Instrucción 3, María\
    \ Tardón, también solicita que se le informe del dispositivo desarrollado por\
    \ los distintos efectivos de Guardia Civil desplegados en el territorio, particularmente\
    \ en lo relativo a las operaciones de rescate de las personas que se hayan localizado\
    \ en las aguas territoriales españolas. Además, en el caso de personas fallecidas,\
    \ si constara la causa y la data de la muerte y, en el caso de las personas supervivientes,\
    \ su identidad y datos de localización que se hubiesen podido recabar.\n    \n\
    \        En el marco de esas pesquisas previas, la jueza ya solicitó este lunes\
    \ a la Comisaría General de Extranjería y Fronteras de la Policía Nacional un\
    \ informe para averiguar si se trató de “una acción concertada o dirigida por\
    \ alguna organización o grupo criminal”.  Una vez recibido este informe, la magistrada\
    \ decidirá si es competente para asumir la investigación penal tras una denuncia\
    \ del partido político Iustitia Europa.\n    \n        En los últimos días, los\
    \ ministerios de Interior y de Defensa han protagonizado un choque por el reparto\
    \ de responsabilidades en la falta de anticipación a los movimientos que se produjeron\
    \ en Marruecos los días previos a que cruzaran la frontera ceutí decenas de miles\
    \ de personas. El ministro del Interior, Fernando Grande-Marlaska, respondió este\
    \ martes que mantenía su “confianza” en los servicios de Inteligencia españoles\
    \ pero insistió en que “no hubo ningún informe ni aviso de que nada parecido a\
    \ lo acontecido pudiera pasar”."
