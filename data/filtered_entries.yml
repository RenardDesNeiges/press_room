- title: 'El sueño de Faten, la futbolista marroquí que perdió la vida en el cruce
    a Ceuta: "Quería ir a Europa"'
  summary: "La joven, que jugaba en el club Maghreb Atlético Tetuán, murió cuando\
    \ intentaba alcanzar a nado la costa española el jueves, en una tragedia que se\
    \ ha cobrado decenas de vidas. elDiario.es habla con su madre, su equipo y sus\
    \ amigos en la ciudad que la vio crecerLa falta de horizonte que empuja el éxodo\
    \ de los jóvenes en Marruecos: “Mi hermano no encontraba trabajo”\n        La\
    \ casa de Faten Ben Omar El Azizi está repleta de mujeres: primas, tías, amigas\
    \ y Jamilla, una madre con unos ojos cargados de dolor. No hay ni una esquina\
    \ de este hogar en la ciudad de Tetuán, a menos de 35 kilómetros de Castillejos,\
    \ que no recuerde a la joven.\n    \n        Algunos lo hacen desde la alegría,\
    \ como su primo pequeño, que sonríe mientras muestra la última fotografía de la\
    \ joven de 26 años. “Jugaban juntos al fútbol”, explica la madre de Faten a elDiario.es.\
    \ Sus vecinas, que aguardan en una esquina del salón de su casa, tienen un rostro\
    \ apagado. La joven, que jugaba al fútbol en el club Maghreb Atlético Tetuán,\
    \ perdió la vida el pasado jueves cuando intentaba alcanzar a nado la costa de\
    \ Ceuta en busca de un futuro mejor, en una tragedia que se ha cobrado cerca de\
    \ 90 vidas, según las autoridades españolas. \n    \n        Enfrente del salón,\
    \ hay una pequeña habitación vacía: no hay cama, escritorio ni siquiera objetos\
    \ personales. El silencio emana de esas cuatro paredes, que también son un recuerdo.\
    \ “Esta iba a ser su habitación. Nos pidió que ya quería dormir sola, sin sus\
    \ dos hermanos. La estábamos preparando y hasta entonces, ella prefería dormir\
    \ aquí”, cuenta, mientras señala el sofá sobre el que ocurre esta entrevista.\n\
    \    \n        Faten creció en Tetuán. Admiraba a todos los grandes futbolistas,\
    \ tanto marroquíes como internacionales. Jamilla cuenta que era una chica alegre,\
    \ que tenía buenas amigas y a una madre que la quería por encima de todas las\
    \ cosas. “Lo juro por Dios”, sentencia. \n    \n        \n                   \
    \                         \n\n\n\n\n\n\n    \n                               \
    \     \n                                                                     \
    \                                                                   \n       \
    \                                             \n                             \
    \                   \n                                                       \
    \                                                                 \n         \
    \                                           \n                               \
    \                 \n                                                         \
    \           \n                                                    \n         \
    \                                       \n                                   \
    \ \n                \n\n                \n\n            \n            \n\n   \
    \         \n            \n                            \n            \n       \
    \         En la imagen, la futbolista Faten Ben Omar El Azizi.               \
    \             \n                                    \n            \n         \
    \       \n        “Yo sabía que mi hija quería ir a Europa, lo estaba intentando\
    \ a través de su pasión, el fútbol. Jugaba desde los siete años”, lamenta. “Tiene\
    \ que quedar claro: no he enviado a mi hija a cruzar la frontera. ¿Tú crees que\
    \ todas las madres que lloramos su pérdida o desaparición han mandado sus hijas\
    \ a morir? Faten no solo era mi hija, también era mi amiga”. \n    “Soñaba con\
    \ seguir entrenando”\n        Jamilla trabajó muchos años como porteadora en la\
    \ aduana entre Ceuta y Castillejos. Su única fuente de ingresos se truncó cuando\
    \ en 2020 las autoridades marroquíes cerraron el paso de mercancías por el Tarajal\
    \ para reducir el comercio informal y la situación de vulnerabilidad de mujeres\
    \ como Jamilla. “No teníamos nada y Faten soñaba con seguir entrenando y formándose\
    \ en su deporte, pero no nos lo podíamos permitir. En Marruecos, si no tienes\
    \ dinero, no te puedes dedicar profesionalmente nunca al fútbol”, explica. “A\
    \ ella solo le pagaban algo cuando ganaban algún partido. Si perdían, nada. Le\
    \ ponía muy triste”, añade.  \n    \n\n    \n    \n      \n      Tiene que quedar\
    \ claro: no he enviado a mi hija a cruzar la frontera. ¿Tú crees que todas las\
    \ madres que lloramos su pérdida o desaparición han mandado sus hijas a morir?\
    \ Faten no solo era mi hija, también era mi amiga\n                \n        \
    \                Jamilla\n                                        — Madre de Faten\n\
    \                      \n          \n\n  \n        Todo eso cambió el mismo día\
    \ que Faten murió en el mar. Su madre cuenta que desconocía que la joven estaba\
    \ tramitando el visado para España desde el consulado de Tánger y recibió una\
    \ llamada por la mañana. “¿Es usted Faten Ben Omar El Azizi?”, preguntaban al\
    \ otro lado de la línea telefónica. “No, soy su madre”, contestó Jamilla. “A su\
    \ hija le han concedido el visado”, contestó. “Tiene que venir a Tánger con su\
    \ documento de identidad”. Jamilla desconoce exactamente cómo tramitó el visado.\
    \ \n    \n        La búsqueda fue angustiosa. “Nadie me ayudó a encontrar ni traer\
    \ el cuerpo de mi hija. Vino un chico a casa preguntando si Faten llevaba un chándal\
    \ y me dijo que se había golpeado la cabeza intentando cruzar a Ceuta, pero yo\
    \ ya sabía que había muerto. Lo sentía”, explica. Después de la noticia, el joven\
    \ les explicó que tenían que ir a Rincón. Nada. En Tetuán tampoco había noticias\
    \ sobre su hija. Desde la 22:00 de la noche del viernes hasta las 08:00 de la\
    \ mañana del sábado no dejaron de buscarla ni un momento, según su testimonio.\
    \ \n    \n        \n                                            \n\n\n\n\n\n\n\
    \    \n                                    \n                                \
    \                                                                            \
    \                            \n                                              \
    \      \n                                                \n                  \
    \                                                                            \
    \                          \n                                                \
    \    \n                                                \n                    \
    \                                                \n                          \
    \                          \n                                                \n\
    \                                    \n                \n\n                \n\n\
    \            \n            \n\n            \n            \n                  \
    \          \n            \n                Las compañeras de equipo y el entrenador\
    \ de Faten, Oumar.                            \n                             \
    \       \n            \n                \n        “En Castillejos, mi hermana\
    \ pidió que abrieran las puertas para comprobar si estaba allí. Entonces les preguntaron\
    \ si mi hija llevaba una cadena con corazones. Yo no quise entrar. No quería grabar\
    \ esa imagen en mi memoria”, cuenta. “Fue mi hermana la que entró. Ahí encontró\
    \ a la amada de mi corazón, a mi niña Faten”, añade la madre. Explica que presentaba\
    \ golpes en el rostro y que murió ahogada. \n    \n        La historia migratoria\
    \ de la familia no se reduce a la joven Faten. “Todos los hermanos se han ido\
    \ a Ceuta. El mayor de los tres sí que ha podido hablar conmigo por teléfono.\
    \ Él cruzó andando por la frontera. De la pequeña no sabemos nada, pero sabía\
    \ nadar. Tiene 14 años”, explica mientras enseña una fotografía de la menor, que\
    \ cuelga con un marco en una de las paredes de la casa. \n    \n        “Mi marido\
    \ falleció cuando Faten tenía 12 años y ahora estoy sola sin mis hijos”, apunta.\
    \ En ese momento, la casa está abarrotada, pero Jamilla a lo que teme es al futuro.\
    \ “No puedo vivir sin ellos”, añade. Baja la cabeza y desbloquea su teléfono móvil.\
    \ Una foto de Faten jugando al futbol, otra de la joven comiendo con sus amigas\
    \ y una tercera sentada en las escaleras que suben desde la calle hasta la primera\
    \ planta de su casa. \n    “Una buena compañera”\n        La muerte de la joven\
    \ circuló en redes sociales y en la prensa cuando el Maghreb Atlético Tetuán,\
    \ su club, la confirmó. Oumar, el entrenador, está sentado en el bordillo rodeado\
    \ de una decena de jóvenes, de entre 15 y 26 años. Son las compañeras del equipo\
    \ de fútbol donde jugó Faten en la liga regional hasta que falleció. \n    \n\
    \        Una de ellas está sentada en el banquillo mientras que el resto comienzan\
    \ el entrenamiento. Tiene 16 años y, aunque se llevaba diez años de diferencia\
    \ con Faten, compartían risas y pases de fútbol. “Entrenamos dos días a la semana,\
    \ los martes y los jueves. A veces aquí y, otras veces, en la playa”, cuenta,\
    \ mientras señala el campo fútbol rodeado de vallas. \n    \n        Oumar recuerda\
    \ a Faten como “una buena compañera con un marcado espíritu futbolístico”. Explica\
    \ que siempre mantuvo una actitud positiva dentro del grupo y que la querían mucho\
    \ en el equipo. Cuando mira a las chicas, dice: “Lo están pasando mal. Muchas\
    \ no han podido venir a entrenar porque vieron el cuerpo de Faten durante el entierro\
    \ y están afectadas”. \n    \n\n    \n    \n      \n      Éramos como hermanas,\
    \ lo compartíamos todo, hasta la comida y el dinero. Ella venía a trabajar con\
    \ nosotros cuatro días a la semana. Lo pasábamos bien y siempre me hablaba del\
    \ fútbol. Era muy importante para ella\n                \n                   \
    \     Malika\n                                        — Amiga de Faten\n     \
    \                 \n          \n\n  \n        Dos de las jóvenes del equipo también\
    \ cruzaron a Ceuta, aunque ambas han vuelto a una cancha de fútbol donde hoy,\
    \ y hasta dentro de mucho tiempo, ruedan el balón en memoria de Faten. \n    Rayhan\
    \ en memoria de Faten\n        Además de jugar al fútbol, la joven llevaba desde\
    \ los 14 años trabajando para llevar dinero a casa. Al salir del portal del edificio\
    \ de su vivienda, el cementerio más antiguo de Tetuán se extiende por las faldas\
    \ del monte Dersa. Entre las tumbas, dos jóvenes, Malika y Youssef cargan, en\
    \ una mano con garrafas de plástico repletas de agua y, con la otra, un puñado\
    \ de rayhan o hierbas aromáticas que representan la bendición en contextos religiosos\
    \ musulmanes. Faten trabajó con los dos limpiando tumbas y vendiendo ramilletes.\n\
    \    \n        \n                                            \n\n\n\n\n\n\n  \
    \  \n                                    \n                                  \
    \                                                                            \
    \                          \n                                                \
    \    \n                                                \n                    \
    \                                                                            \
    \                        \n                                                  \
    \  \n                                                \n                      \
    \                                              \n                            \
    \                        \n                                                \n\
    \                                    \n                \n\n                \n\n\
    \            \n            \n\n            \n            \n                  \
    \          \n            \n                Malika, amiga de Faten, en el cementerio.\
    \ A la derecha, la tumba de la joven.                            \n          \
    \                          \n            \n                \n        Durante los\
    \ cuatro años que trabajaron juntos, compartieron la vida en medio de la muerte.\
    \ Malika es una joven de Ouarzazate que es huérfana de ambos padres y decidió\
    \ trasladarse a Tetuán para buscar trabajo. La joven rompe a llorar al hablar\
    \ de Faten. “Éramos como hermanas, lo compartíamos todo, hasta la comida y el\
    \ dinero. Ella venía a trabajar con nosotros cuatro días a la semana. Lo pasábamos\
    \ bien y siempre me hablaba del fútbol. Era muy importante para ella”, explica\
    \ entre lágrimas. \n    \n        La tumba de Faten yace en este enclave de la\
    \ ciudad y, aunque el color blanco de la misma todavía brilla, Malika decide volver\
    \ a tirar agua sobre la superficie. Recoge un trozo de tela del suelo y la extiende\
    \ por las baldosas. En el centro, han sembrado rayhan, el mismo que ella vendía.\
    \ También las riega, para seguir honrando su memoria. “La siento cerca, me la\
    \ imagino subiendo la colina hacia aquí”, dice."
