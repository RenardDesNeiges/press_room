- title: Brasil retira a su embajador de Argentina tras los insultos contra Lula por
    los que Milei no pedirá disculpas
  summary: "La decisión responde a los reiterados agravios del mandatario argentino\
    \ contra el presidente brasileño. El canciller de la Casa Rosada lamentó que la\
    \ relación se redujo a nivel de encargado de negocios y afirmó que el ultraderechista\
    \ no pedirá perdónMilei abre una crisis diplomática con Brasil tras insultar a\
    \ Lula en un acto con el hijo de Bolsonaro: “Basura socialista”\n\n        El\
    \ presidente brasileño, Luiz Inácio Lula da Silva, retiró a su embajador en Buenos\
    \ Aires y redujo la representación diplomática al nivel de encargado de negocios.\
    \ La decisión marca el punto de máxima fricción en décadas en la relación bilateral\
    \ y responde a los insultos que le propinó el mandatario argentino, Javier Milei,\
    \ en las últimas apariciones públicas.\n    \n        El embajador argentino en\
    \ Brasil, Daniel Raimondi, recibió la segunda nota de protesta formal en menos\
    \ de dos semanas y en ella le expusieron las razones de la sanción diplomática.\
    \ Su homólogo brasileño en Buenos Aires, Julio Bitelli, quien fue llamado a consultas\
    \ por la Cancillería de su país el 26 de julio, no regresará a la capital argentina\
    \ hasta nuevo aviso mientras continúen las agresiones de Milei.\n    \n      \
    \  Milei había participado en San Pablo del acto de lanzamiento de la candidatura\
    \ presidencial de Flávio Bolsonaro el 25 de julio, ocasión en la que tildó de\
    \ “ladrón” y “basura socialista” a Lula da Silva. La intención de ese viaje había\
    \ sido la de reunirse con Jair Bolsonaro, quien cumple prisión domiciliaria por\
    \ encabezar un intento de golpe de Estado contra Lula una semana después de que\
    \ asumiera su tercer mandato, pero el juez del máximo tribunal de Brasil, Alexandre\
    \ de Moraes, se lo impidió. Por eso Milei también fue ofensivo con el magistrado,\
    \ llamándolo “basura calva”. \n    \n        Cuando a Lula le preguntaron qué\
    \ opinaba de las declaraciones de Milei en su propio país, el brasileño dijo con\
    \ ironía que no sabía quién era ese “tipo” y luego las calificó de “disparate”.\
    \ Pero los hilos se movieron a nivel de Cancillería, que llegó a considerar que\
    \ sería necesario demorar el regreso de Bitelli a Argentina.\n    \n        Los\
    \ agravios continuaron desde Buenos Aires. En sus apariciones mediáticas de este\
    \ domingo y martes, el mandatario argentino dijo que llama “presidiario” al líder\
    \ del Partido de los Trabajadores porque, según él, quedó libre por “un error\
    \ administrativo”. Lula da Silva recuperó la libertad en noviembre de 2019  tras\
    \ 580 días de detención, y también recuperó sus derechos políticos gracias a un\
    \ fallo del máximo tribunal que determinó que el juez Sergio Moro había actuado\
    \ con parcialidad al condenarlo. \n    \n        En un programa de televisión,\
    \ Milei volvió a acusar a Brasil de haber supuestamente financiado una “campaña\
    \ antiargentina” en redes sociales durante el Mundial, en la que incluyó también\
    \ a México y al Partido Demócrata de Estados Unidos. No presentó ninguna prueba\
    \ que lo sustente.\n    \n        En Brasilia, remarcaron que el mandatario argentino\
    \ no ratificó sus epítetos de “ladrón” y “corrupto” contra Lula da Silva solo\
    \ una vez, sino que lo hizo cuatro veces durante su entrevista a LN+.\n    “Dos\
    \ intentos de intervenir en la campaña”\n        El intelectual brasileño Emir\
    \ Sader señala a elDiario.es que este episodio tiene puntos de contacto con la\
    \ decisión del gobierno de EEUU de cancelar la visa de la embajadora de Brasil\
    \ en Washington, Maria Luiza Viotti. “Brasil al principio tuvo una posición de\
    \ cautela tras el viaje de Milei a San Pablo y su apoyo a la candidatura de Bolsonaro.\
    \ Pero el Ministerio de Exteriores ha publicado una respuesta dura al gobierno\
    \ de Donald Trump, luego de que retirara la visa de la embajadora de Brasil, amenazando\
    \ con medidas de respuesta también en el plano económico. En ese marco es que\
    \ Lula reacciona también en contra de las reiteradas declaraciones de Milei, ya\
    \ que se interpretan como dos intentos de invervenir en la campaña electoral”.\n\
    \    \n        Lula da Silva cuando este domingo formalizó su candidatura para\
    \ las elecciones presidenciales del 4 de octubre dijo, a modo de mensaje al gobierno\
    \ de Trump: “Quiero estar preparado para que nadie invada este país para llevarse\
    \ a este presidente (en alusión a la captura de Maduro en Venezuela). Quiero estar\
    \ preparado para la paz, no para la guerra. No quiero que nadie se atreva a subestimarnos”.\n\
    \    \n        Para Sader, “ambos gobiernos [de EEUU y de Argentina] son aliados\
    \ cercanos que ven en la política exterior brasileña un obstáculo para la visión\
    \ de la extrema derecha en el mundo actual”.\n    Milei no pedirá disculpas\n\
    \        El Gobierno argentino no sólo no reconoció su falta en los insultos de\
    \ Milei a Lula, sino que culpó a Brasil en un comunicado de la Cancillería. El\
    \ titular de la cartera, Pablo Quirno, dijo haber tomado nota de la “decisión\
    \ unilateral” y lamentó que Brasil “continúe aislándose del resto de la región\
    \ por motivos puramente ideológicos”. El canciller afirmó que las relaciones entre\
    \ los Estados “deben basarse en los intereses permanentes de sus pueblos y no\
    \ en las necesidades políticas o personales de los gobiernos de turno”. \n   \
    \ \n        En la rueda de prensa de este miércoles, convocada para hablar sobre\
    \ la visita del Papa León XIV en noviembre, Quirno dijo que no habrá un pedido\
    \ de disculpas del Gobierno argentino  –postura alejada de la principios de la\
    \ fe católica–. Tampoco habrá una acción diplomática en respuesta a lo que haga\
    \ Brasil. Y agregó: “La región está cambiando la dirección y nosotros eso lo celebramos,\
    \ y esperamos que también suceda en Brasil”. El canciller adelantó que tienen\
    \ planeado realizar una reunión de presidentes de derecha en Buenos Aires, aún\
    \ sin fecha precisa."
