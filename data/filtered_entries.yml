- title: Dans le Michigan, la gauche progressiste renforce ses positions avant les
    midterms
  summary: Dans une circonscription aux portes de Detroit, Abdul el-Sayed a créé la
    surprise en l’emportant face à une rivale centriste, lors des primaires tenues
    mardi 4 août pour les prochaines élections de mi-mandat à l’automne. William Lawrence,
    engagé dans la lutte contre le dérèglement climatique, est lui aussi sorti vainqueur.
  media: https://static.mediapart.fr/etmagine/default/files/2026/08/05/260805-img-dans-le-michigan-la-gauche-progressiste-renforce-ses-positions-avant-les-midterms.jpg
  url: https://www.mediapart.fr/journal/international/050826/dans-le-michigan-la-gauche-progressiste-renforce-ses-positions-avant-les-midterms
  date: '2026-08-05T16:11:56+00:00'
  lang: FR
  author: François Bougon
  source: Mediapart
  EID: 1
- title: 'Affaire Jean Pormanove: prison avec sursis pour les influenceurs Naruto
    et Safine, bannis six mois de Kick'
  summary: Le tribunal correctionnel de Nice a condamné Owen C. et Safine H., mercredi
    5 août, à de la prison avec sursis et à six mois de «bannissement numérique» pour
    des violences sur la chaîne de streaming «JeanPormanove», sur laquelle le streameur
    Raphaël Graven est décédé en direct en août 2025.
  media: https://static.mediapart.fr/etmagine/default/files/2026/07/06/260706-img-proces-jp.jpg
  url: https://www.mediapart.fr/journal/france/050826/affaire-jean-pormanove-prison-avec-sursis-pour-les-influenceurs-naruto-et-safine-bannis-six-mois-de-kick
  date: '2026-08-05T14:45:45+00:00'
  lang: FR
  author: Marie Turcan
  source: Mediapart
