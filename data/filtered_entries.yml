- title: Las tormentas vuelven a amenazar el noreste en una jornada con calor intenso
    en gran parte del país
  summary: "Canarias volverá a rozar los 40 grados mientras persisten las noches tropicales\
    \ en el MediterráneoCanarias registra el séptimo julio más cálido desde 1961,\
    \ marcado por tres episodios de calor\n\n        El calor continuará siendo protagonista\
    \ este miércoles en buena parte de España, con temperaturas superiores a los 35\
    \ grados en amplias zonas de la mitad sur y este peninsulares, Baleares y Canarias.\
    \ Aunque el tiempo seguirá siendo estable en la mayor parte del país, la Agencia\
    \ Estatal de Meteorología (Aemet) advierte de la llegada de chubascos y tormentas\
    \ localmente fuertes, que podrán ir acompañados de granizo durante la tarde en\
    \ áreas del cuadrante nordeste.\n    \n        Las tormentas afectarán principalmente\
    \ a la Ibérica sur y los Pirineos orientales, donde podrán alcanzar mayor intensidad.\
    \ Además, el interior norte de Castellón permanecerá en aviso amarillo por precipitaciones\
    \ que podrían acumular hasta 20 litros por metro cuadrado en una hora, además\
    \ de tormentas con granizo y rachas muy fuertes de viento.\n    \n        La estabilidad\
    \ seguirá dominando en la mayor parte del territorio nacional, con cielos poco\
    \ nubosos o despejados. Solo el norte de Galicia y el área cantábrica mantendrán\
    \ cielos nubosos o cubiertos, con precipitaciones débiles y dispersas. Durante\
    \ las primeras horas del día también habrá nubes bajas en otros puntos del norte,\
    \ en el litoral mediterráneo y en el bajo Ebro, aunque se irán disipando a medid\
    \ que avance la mañana.\n    Tormentas de tarde y calor persistente\n        La\
    \ nubosidad de evolución volverá a desarrollarse durante la tarde en el interior\
    \ del tercio oriental, las montañas del centro y norte peninsular y Mallorca.\
    \ Será entonces cuando aumente la probabilidad de chubascos y tormentas en las\
    \ zonas montañosas del cuadrante nordeste y en la isla balear, con especial atención\
    \ a la Ibérica sur y los Pirineos orientales, donde podrían ser localmente fuertes.\n\
    \    \n        En la Comunitat Valenciana, la Aemet mantiene además avisos por\
    \ altas temperaturas. A partir del mediodía estarán activos por 38 grados en el\
    \ litoral sur de Alicante y el interior sur de Valencia, por 37 grados en el interior\
    \ norte valenciano y por 36 grados en el litoral de Valencia, coincidiendo con\
    \ las horas de mayor insolación.\n    \n        Las temperaturas máximas subirán\
    \ en la vertiente atlántica y en el nordeste de Cataluña, mientras que descenderán\
    \ en otras regiones mediterráneas, el Cantábrico, el alto Ebro y Canarias. Aun\
    \ así, los termómetros volverán a superar los 35 grados en buena parte de las\
    \ mitades sur y este peninsulares, así como en Baleares y Canarias, donde continuará\
    \ el episodio de calor intenso.\n    \n        Las mínimas apenas experimentarán\
    \ cambios, por lo que continuarán las noches tropicales en amplias zonas del sureste\
    \ peninsular y Baleares, con los termómetros sin bajar de los 20 grados. En puntos\
    \ del litoral mediterráneo y en Canarias las temperaturas nocturnas permanecerán\
    \ por encima de los 25 grados, mientras que en algunas zonas del archipiélago\
    \ incluso podrían no descender de los 30 grados, especialmente en las áreas más\
    \ expuestas al calor.\n    \n        En Canarias continuará soplando el alisio,\
    \ como estos últimos días, con intervalos fuertes y rachas muy fuertes. En el\
    \ sur peninsular predominará el viento moderado de componente oeste, aunque irá\
    \ perdiendo intensidad en el entorno de Alborán. En el resto del país el viento\
    \ será, en general, flojo, con predominio de la componente este en el Levante,\
    \ del norte en la cornisa cantábrica y Baleares y del oeste en el resto de la\
    \ Península."
