- title: ¿Cuándo nos cuentan toda la verdad del ático?
  summary: "La culpa de las suspicacias en torno a la compra del ático por la Comunidad\
    \ de Madrid no es de quienes pretenden “destruirla”, como dice Ayuso con su proverbial\
    \ victimismo, sino del secretismo que su gobierno ha impuesto en el asunto. La\
    \ madre de todos los interrogantes sigue, por supuesto, sin responderse: ¿cuál\
    \ era el plan?Tú no puedes pagar el alquiler, pero le ibas a comprar un pisazo\
    \ a Ayuso\n        La presidenta de la Comunidad de Madrid, Isabel Díaz Ayuso,\
    \ y su jefe de gabinete, Miguel Ángel Rodríguez, están muy preocupados por los\
    \ últimos sucesos de Ceuta. O para ser más exactos, por la estrategia diabólica\
    \ del presidente Sánchez para destruir España. Vale, es comprensible la inquietud,\
    \ pero, ¿y el ático? \n    \n        La crisis migratoria que ha vivido en los\
    \ últimos días la ciudad autónoma ha caído de perlas a la derecha y la extrema\
    \ derecha. Lo más complicado ha pasado, con el regreso de la inmensa mayoría de\
    \ los 72.000 (nuevo dato de Interior) que habían atravesado la frontera por mar\
    \ y tierra. Ahora viene la etapa de preguntas y respuestas, porque el Gobierno\
    \ tiene mucho que explicar sobre lo ocurrido. Pero justamente Ayuso y Rodríguez\
    \ no están para hacer preguntas, sino para dar respuestas. Y no sobre Ceuta, sino\
    \ sobre el ático de 450 metros cuadrados con doscientos de terraza que una empresa\
    \ pública dependiente de la Comunidad compró supuestamente para que viviera la\
    \ presidenta mientras se realizaran unas obras de rehabilitación de la Real Casa\
    \ de Correos, sede de la Presidencia regional.\n    \n        Una semana después\
    \ de que El País desvelara que la Comunidad había comprado el famoso piso como\
    \ “oficina” temporal, los entresijos de la operación siguen siendo un misterio.\
    \ Se sabe que lo compró la empresa pública Planifica Madrid, que se encarga de\
    \ la gestión de suelo y oficinas propias del gobierno autonómico. Que lo vendió\
    \ una inmobiliaria de la Moraleja especializada en viviendas de lujo. Que el ático\
    \ queda justo enfrente del edificio donde vive la madre de Auso. Que su novio,\
    \ Alberto González Amador, ha puesto en venta el piso en el mismo barrio de Chamberí\
    \ donde vive la pareja. Y se sabe que, al verse pillada por la información periodística,\
    \ Ayuso emprendió una huida adelante que evidencia su forma abusiva de entender\
    \ el poder y el desprecio a los controles públicos con que ha ejercido hasta ahora\
    \ el cargo.\n    \n        Lo primero que hizo fue defender la adquisición del\
    \ inmueble. Cuando los medios, incluso alguno conservador, le hizo ver que carecía\
    \ de cualquier racionalidad comprar un ático a un precio astronómico para que\
    \ fuera una oficina provisional, más aún en un edificio residencial donde no se\
    \ pueden instalar oficinas, anunció que se venderían ese y otros inmuebles de\
    \ la Comunidad para sufragar la reparación de las tierras arrasadas por los incendios\
    \ de finales de julio. Y ahí la tenemos, hablando un día sí y otro también de\
    \ la Sierra Oeste madrileña. Es, por cierto, lo que debería hacer como presidenta\
    \ ante la catástrofe medioambiental, pero no para intentar lavar la operación\
    \ del ático sublimando el destino que piensa ahora dar al dinero de su forzada\
    \ venta.\n    \n        Por lo demás, nada se sabe de esa operación. Todo sigue\
    \ envuelto en un manto de misterio. No se conoce ninguna explicación motivada\
    \ para realizar esa compra, teniendo la Comunidad otros inmuebles donde se pudo\
    \ instalar temporalmente la presidenta. No se conocen los detalles de las obras\
    \ de la sede del Gobierno regional con las que intentaron justificar la adquisición\
    \ del ático. No se conoce resolución alguna que cambie ahora el destino de la\
    \ polémica inversión inmobiliaria y derive esa partida –¿es esto legal?– a un\
    \ plan de recuperación de territorios quemados. Cualquier resto de transparencia\
    \ que aún pudiera sobrevivir en el Gobierno madrileño ha saltado por los aires\
    \ en este caso.\n    \n        Y la madre de todos los interrogantes sigue, por\
    \ supuesto, sin responderse: ¿cuál era el plan? ¿Hubo beneficiados con la operación?\
    \ ¿Tenía Ayuso la posibilidad de seguir habitando el ático tras el fin de su mandato?\
    \ Del mismo modo que ha decidido súbitamente su venta para un programa de recuperación\
    \ por los incendios, ¿podía, con el mismo sigilo con que se compró el ático a\
    \ un particular con una cláusula de confidencialidad, venderse a otro particular\
    \ con cualquier otro motivo y con la misma discreción? Muchos se hacen estas y\
    \ otras preguntas, y la culpa de las suspicacias no es de quienes pretenden “destruirla”,\
    \ como dice Ayuso con su proverbial victimismo, sino del secretismo que su Gobierno\
    \ ha impuesto en el asunto. El arma infalible para destruir sospechas es la transparencia.\
    \ Que es también lo que en este momento  falta con respecto al gasto de su reciente\
    \ viaje a México, del que solo han trascendido los 600 euros que costó la reserva\
    \ de la sala de autoridades de Barajas.\n    \n        Existe cierto feeling entre\
    \ los ayusólogos de que estamos asistiendo a un fin de etapa. De que lo del ático\
    \ no es un lío más en la maraña de escándalos que acumula la presidenta. Que es\
    \ la guinda, la gota que ha colmado el vaso de su conducta altanera y desafiante.\
    \ Pero la mayoría de los expertos no atribuyen su muerte política anunciada a\
    \ una consecuencia del escándalo en sí, sino a su supuesta caída en desgracia\
    \ dentro del PP, aunque desde Génova hagan aspavientos de unidad. Según esta versión,\
    \ alguien del entorno de Feijóo habría filtrado el caso para cortarle las alas\
    \ ante un eventual desafío por el liderazgo nacional del partido. \n    \n   \
    \     No sé cuánto de cierto y cuánto de ficción hay en tales elucubraciones.\
    \ Lo único que cabe esperar es que, antes de que se desentrañen los intríngulis\
    \ políticos, podamos saber la historia completa del ático."
