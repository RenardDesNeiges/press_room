- title: 'A hora y media de València: el mirador elevado sobre el mar que ofrecerá
    una de las mejores vistas del eclipse del 12 de agosto'
  summary: "Alcossebre se prepara para el hito solar del 12 de agosto desde la ermita\
    \ de Santa Lucía, un horizonte sin contaminación lumínica en plena franja de totalidadMAPA\
    \ | Dónde ver el eclipse solar del 12 de agosto: recorrido y visibilidad en cada\
    \ municipio, minuto a minuto\n        A tan solo una hora y media de València,\
    \ donde la costa mediterránea se encuentra de frente con la naturaleza salvaje\
    \ del Parque Natural de la Sierra de Irta, se esconde uno de los balcones naturales\
    \ más privilegiados de la Comunitat Valenciana. Situada en Alcossebre (Castellón),\
    \ la ermita de Santa Lucía y San Benet se alza sobre un cerro a más de 300 metros\
    \ sobre el nivel del mar, ofreciendo un horizonte marino infinito y limpio de\
    \ contaminación lumínica. Una ubicación estratégica que promete convertirse en\
    \ un mirador de excepción para contemplar el eclipse solar total del próximo 12\
    \ de agosto de 2026, convirtiendo el espectáculo astronómico en una experiencia\
    \ visual sencillamente inolvidable.\n    \n        El próximo 12 de agosto tendrá\
    \ lugar uno de los acontecimientos astronómicos más esperados del siglo: un eclipse\
    \ solar total. Durante este hito, la Luna se interpondrá entre la Tierra y el\
    \ Sol, cubriendo el disco solar por completo durante unos instantes y transformando\
    \ a pleno día la costa mediterránea en un crepúsculo inesperado.\n    \n     \
    \   \n                                            \n\n\n\n\n\n\n    \n       \
    \                             \n                                             \
    \                                                                            \
    \               \n                                                    \n     \
    \                                           \n                               \
    \                                                                            \
    \             \n                                                    \n       \
    \                                         \n                                 \
    \                                   \n                                       \
    \             \n                                                \n           \
    \                         \n                \n\n                \n\n         \
    \   \n            \n\n            \n            \n                           \
    \ \n            \n                En 1905, Alcalà de Xivert ya se convirtió en\
    \ el centro de atención científica internacional al acoger a expediciones de astrónomos\
    \ de todo el mundo para documentar el eclipse solar de aquel año             \
    \               \n                                    \n            \n       \
    \         \n        Alcalà de Xivert y Alcossebre se encuentran en plena franja\
    \ de totalidad, por lo que el fenómeno podrá contemplarse en toda su magnitud.\
    \ Para disfrutar de esta experiencia única de forma cómoda, segura y sin imprevistos\
    \ de última hora, es fundamental planificar la jornada siguiendo estas recomendaciones\
    \ clave:\n    \n                    \n                                    Comprueba\
    \ la visibilidad con antelación: el eclipse total tendrá lugar el 12 de agosto\
    \ y transformará el día en un crepúsculo inesperado. Al estar en la franja de\
    \ totalidad, el municipio ofrece ubicaciones idóneas como las playas de Alcossebre\
    \ (con vistas despejadas al mar) y puntos elevados con baja contaminación lumínica.\
    \ Puedes verificar la cobertura exacta en el mapa oficial del IGN antes de desplazarte.\n\
    \                                    Ten en cuenta las restricciones de tráfico\
    \ en la Sierra de Irta: el acceso de vehículos privados al Parque Natural estará\
    \ completamente cortado durante la jornada. No será posible subir en coche a miradores\
    \ clave como la ermita de Santa Lucía o el castillo de Xivert, por lo que se recomienda\
    \ planificar trayectos a pie o en transporte público autorizado.\n           \
    \                         Infórmate en los puntos de atención al ciudadano: si\
    \ necesitas asesoramiento sobre la observación segura o quieres resolver dudas\
    \ logísticas, acude al Espai d'Oci de Alcossebre el viernes 7 de agosto, entre\
    \ las 17:00 h y las 19:00 h.\n                                    Planifica tus\
    \ desplazamientos con 24-48 horas de antelación: para evitar atascos masivos,\
    \ accesos saturados o la falta de aparcamiento, llega a la localidad con al menos\
    \ un día de margen. Un desplazamiento de última hora el propio 12 de agosto podría\
    \ hacer que te quedes atrapado en la carretera y te pierdas los breves minutos\
    \ de la fase de totalidad.\n                                    Evita el uso del\
    \ coche el día del eclipse: procura no realizar desplazamientos innecesarios en\
    \ vehículo por el interior de la localidad durante la jornada del evento, priorizando\
    \ moverte a pie por las zonas costeras.\n                                    Utiliza\
    \ solo protección ocular homologada: usa exclusivamente gafas con certificación\
    \ ISO 12312-2 para eclipses solares. Nunca mires al Sol directamente ni utilices\
    \ gafas de sol tradicionales, radiografías o cristales ahumados, ya que pueden\
    \ provocar daños oculares irreversibles.\n                                   \
    \ Supervisa en todo momento a los menores: asegúrate de que los niños utilicen\
    \ las gafas de protección de forma correcta durante todo el proceso de observación\
    \ previa y posterior al eclipse total.\n                                    Disfruta\
    \ de las actividades previas de astroturismo: para calentar motores, el municipio\
    \ organiza el programa gratuito “Alcossebre bajo las estrellas” (del 10 al 12\
    \ de julio y del 6 al 7 de agosto), con talleres, marcha nocturna, planetario\
    \ móvil y observaciones astronómicas.\n                            \n        \
    \    El precedente histórico: la expedición de 1905\n        Esta pasión por el\
    \ cielo tiene raíces profundas. En 1905, Alcalà de Xivert ya se convirtió en el\
    \ centro de atención científica internacional al acoger a expediciones de astrónomos\
    \ de todo el mundo para documentar el eclipse solar de aquel año. Para rememorar\
    \ aquella hazaña 121 años después, la localidad ofrece la ruta teatralizada “121\
    \ años del año del eclipse solar”, un recorrido de un kilómetro desde la plaza\
    \ de l’Església que permite revivir cómo se descubrieron los misterios del cosmos\
    \ a principios del siglo XX.\n    \n        Este año, Alcalà de Xivert y Alcossebre\
    \ no se han limitado a preparar la logística del gran día; han diseñado una ambiciosa\
    \ propuesta de divulgación científica y ocio pensada para desestacionalizar el\
    \ turismo y acercar la astronomía a todos los públicos. Un esfuerzo que ha sido\
    \ reconocido oficialmente por la Fundación Starlight, que ha distinguido al Ayuntamiento\
    \ de Alcalà-Alcossebre y al Cámping Ribamar por su firme compromiso con la protección\
    \ del cielo nocturno y el desarrollo del astroturismo sostenible.\n    \n    \
    \    Como previa al eclipse solar total, el municipio despliega un intenso programa\
    \ gratuito de actividades divulgativas que incluye observaciones con telescopio,\
    \ talleres familiares y propuestas culturales únicas.\n    \n        Durante los\
    \ días previos al evento (con una programación especial concentrada del 6 al 7\
    \ de agosto), vecinos y visitantes podrán disfrutar de una agenda astronómica\
    \ idónea para todas las edades:\n    \n                    \n                \
    \                    Astropoesía al anochecer: el jueves 6 de agosto (21:30 h),\
    \ la emblemática ermita de Santa Lucía acogerá un recital poético donde se repartirán\
    \ poemarios entre los asistentes en un marco inigualable.\n                  \
    \                  Observaciones nocturnas con telescopio: sesiones guiadas de\
    \ observación estelar el jueves 6 de agosto en la ermita de Santa Lucía (22:30\
    \ h) y el viernes 7 de agosto en las instalaciones del Camping Ribamar (22:30\
    \ h).\n                                    Talleres y planetario infantil: el\
    \ viernes 7 de agosto, el Camping Ribamar acogerá talleres matinales de astronomía\
    \ (11:00 h), mientras que el Espai d'Oci de Alcossebre instalará un planetario\
    \ móvil en horario de tarde (16:00 h a 18:45 h, con pases de 30 minutos) enfocado\
    \ a los más pequeños.\n                                    Marcha nocturna bajo\
    \ el cielo estrellado: el viernes 7 de agosto (21:00 h) arrancará desde la Tourist\
    \ Info de Alcossebre la ruta guiada “Camina bajo las estrellas”, un recorrido\
    \ nocturno bordeando el litoral."
