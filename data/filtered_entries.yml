- title: PP y Vox quieren cambiar el nombre del auditorio Nelson Mandela de Sonseca
    para dedicarlo a los Reyes Católicos
  summary: "El PSOE anuncia que irá a los tribunales si no se revierte una decisión\
    \ que incumple el Reglamento del Pleno municipal incurriendo en un presunto delito\
    \ de prevaricación administrativa. El PP tacha a PSOE e IU de \"actitud antidemocrática\"\
    , anuncia un nuevo pleno y recuerda que los grupos ahora en la oposición hicieron\
    \ lo mismo en 2014. Vox permanece callado\n        El Auditorio Municipal del\
    \ municipio toledano de Sonseca pasará de llevar el nombre del Premio Nobel de\
    \ la Paz Nelson Mandela, a llamarse Auditorio Reyes Católicos, salvo que la decisión\
    \ se revierta. \n    \n        El cambio se planteaba en el último pleno municipal,\
    \ a propuesta del equipo de Gobierno que conforman PP y Vox, con el rechazo del\
    \ Grupo Municipal Socialista que cree que “no responde a un reconocimiento de\
    \ la historia o del patrimonio local, sino que es una decisión de carácter ideológico”.\
    \ También lo rechaza IU.\n    \n        El PSOE se ha dirigido a la alcaldesa,\
    \ la 'popular' Victoria Martín de San Pablo, y le pide que “rectifique” la medida,\
    \ al no contar con el preceptivo respaldo necesario en el Pleno. Advierte el grupo\
    \ municipal socialista que, de no dar marcha atrás, acudirá a los tribunales.\
    \ \n    \n        Los socialistas recuerdan que el Reglamento Municipal de Honores\
    \ y Distinciones establece un procedimiento específico para modificar la denominación\
    \ de edificios o espacios públicos. Dicho procedimiento exige una “mayoría cualificada”\
    \ para su aprobación. \n    \n        Entienden que los hechos “podrían ser constitutivos\
    \ de un posible delito de prevaricación administrativa, previsto en el artículo\
    \ 404 del Código Penal, si finalmente se acreditara que se dictó una resolución\
    \ arbitraria siendo plenamente consciente de su ilegalidad”. \n    \n        En\
    \ su opinión, “lo que no puede hacer un alcalde es cambiar las reglas del juego\
    \ democrático cuando el resultado no le favorece. Si para conseguir un acuerdo\
    \ es necesario incumplir el Reglamento municipal y alterar el procedimiento establecido,\
    \ ya no estamos ante una simple discrepancia política, sino ante unos hechos de\
    \ enorme gravedad que deben ser esclarecidos y, en su caso, depurados por los\
    \ tribunales”, concluyen los socialistas.\n    La “advertencia” de la Secretaría\
    \ del Ayuntamiento\n        En el Pleno donde se aprobó la medida, no estuvieron\
    \ varios concejales del PSOE. Tampoco comparecieron los concejales de IU, quienes\
    \ en un comunicado previo explicaron que la razón era, precisamente, no debatir\
    \ ni facilitar la aprobación del cambio de nombre. “La propuesta está basada en\
    \ el odio, el sectarismo, el revanchismo y la mediocridad”, aseguran, además de\
    \ no tener intención “de reconocer el legado histórico de los Reyes Católicos\
    \ o su relación con Sonseca”. De hecho, ya existe una avenida principal que lleva\
    \ su nombre. \n    \n        “La secretaria municipal advirtio durante la propia\
    \ sesión, que no se alcanzaba la mayoría exigida por el Reglamento para proceder\
    \ a la votación del cambio de nombre”, añaden desde el PSOE.\n    \n\n    \n \
    \   \n      \n      La propuesta está basada en el odio, el sectarismo, el revanchismo\
    \ y la mediocridad\n                \n                        IU Sonseca\n   \
    \                               \n          \n\n  \n        Y es que, dicen, “la\
    \ normativa municipal establece que, en primer lugar, debe intentarse la aprobación\
    \ por unanimidad de los 17 concejales de la Corporación. En caso de no alcanzarse,\
    \ únicamente puede celebrarse una segunda votación si están presentes, al menos,\
    \ 12 concejales y el acuerdo obtiene un mínimo de nueve votos favorables”.\n \
    \   \n        El PSOE remarca que, pese a esa advertencia, “la alcaldesa, de manera\
    \ antidemocrática y pueril, decidió modificar sobre la marcha la tramitación del\
    \ asunto, transformando la propuesta de Alcaldía en una moción de urgencia que\
    \ fue sometida a una votación distinta a la prevista en el Reglamento de Honores\
    \ y Distinciones”. \n    \n        El nombre salió adelante con los votos favorables\
    \ de los concejales del Partido Popular y de VOX.\n    \n\n    \n    \n      \n\
    \      La alcaldesa, de manera antidemocrática y pueril, decidió modificar sobre\
    \ la marcha la tramitación del asunto, transformando la propuesta de Alcaldía\
    \ en una moción de urgencia que fue sometida a una votación distinta a la prevista\
    \ en el Reglamento de Honores y Distinciones\n                \n             \
    \           PSOE Sonseca\n                                  \n          \n\n \
    \ \n        Los socialistas creen que la actuación del equipo de gobierno tuvo\
    \ “presuntamente como única finalidad eludir deliberadamente las mayorías reforzadas\
    \ exigidas por la normativa municipal, alterando el procedimiento legalmente establecido\
    \ para conseguir la aprobación del cambio de denominación”.\n    El PP habla de\
    \ “preocupante actitud antidemocrática” de PSOE e IU\n        Desde el PP dice\
    \ que PSOE e IU tuvieron una  “premeditada y concertada estrategia” de no acudir\
    \ al Pleno municipal “ para que la votación fuera válida”, en un comunicado. Dan\
    \ por hecho que el acuerdo no lo fue, pero acusan a la oposición de “intentar\
    \ pervertir la mayoría absoluta que ostentan PP y Vox” , con una “manifiesta y\
    \ preocupante actitud antidemocrática”.\n    \n        Les tachan también de “ruin\
    \ y lamentable actitud” y justifican que tienen la mayoría absoluta (nueve concejales\
    \ de un total de 17) y creen que con esa “mayoría cualificada” anuncian que “en\
    \ cualquier momento” se llevará la propuesta de nuevo a Pleno.  \n    \n     \
    \   Justifican el cambio recordando que la propuesta ya se llevó a otro pleno\
    \ municipal en 2024. “En aquel entonces no hubo acuerdo, desmintiendo así que\
    \ sea una imposición política de otro partido como afirma el PSOE” y de paso asegura\
    \ que “imposiciones y cesiones las suyas a IU durante los últimos 25 años”.\n\
    \    \n        Vox no se ha pronunciado al respecto, al menos no por la misma\
    \ vía que lo han hecho el resto de grupos municipales (a través de las redes sociales),\
    \ con un intercambio de comunicados.\n    \n        El PP afea también que el\
    \ nombre del Auditorio Nelson Mandela se aprobó en 2014 en un gobierno de coalición\
    \ del PSOE e IU y que se hizo a través “de una de una simple moción del Grupo\
    \ Municipal de IU, cuya propuesta recoge una sola línea, sin ningún tipo de procedimiento\
    \ administrativo y sin tener en cuenta el reglamento de honores y distinciones\
    \ de la Villa de Sonseca” .\n    \n\n    \n    \n      \n      En 2024 el nombre\
    \ de Nelson Mandela salió de una de una simple moción del Grupo Municipal de IU,\
    \ cuya propuesta recoge una sola línea, sin ningún tipo de procedimiento administrativo\
    \ y sin tener en cuenta el reglamento de honores y distinciones de la Villa de\
    \ Sonseca\n                \n                        PP Sonseca\n            \
    \                      \n          \n\n  \n        Ellos también dicen que “fue\
    \ una designación absolutamente ideológica ya que dicha figura no tiene ninguna\
    \ relación con Sonseca ni con su historia, como exige este reglamento”. \n   \
    \ Piden la nulidad del pleno y la dimisión de la alcaldesa \n        Mientras\
    \ tanto, el Grupo Socialista ha anunciado que solicitará que el próximo Pleno\
    \ declare la nulidad de pleno derecho del acuerdo por el que se aprobó el cambio\
    \ de nombre, al considerar que fue adoptado prescindiendo del procedimiento previsto\
    \ en el Reglamento Municipal de Honores y Distinciones.\n    \n        Los socialistas\
    \ consideran que, “con independencia de las responsabilidades jurídicas que puedan\
    \ derivarse de estos hechos, la alcaldesa debería presentar su dimisión de manera\
    \ inmediata”. Argumentan en su petición el hecho de que haya “quebrantado la confianza\
    \ que debe presidir el ejercicio de la máxima responsabilidad institucional del\
    \ Ayuntamiento”."
