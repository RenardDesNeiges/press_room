- title: A Besançon, le musée de la Résistance et de la Déportation face à une recrudescence
    de saluts nazis
  summary: Deux personnes ont été interpellées et placées en garde à vue, lundi 3 août,
    après avoir tendu leur bras devant un drapeau du IIIe Reich exposé dans l’établissement.
    Selon la direction, ces actes font partie d’un phénomène en expansion.
