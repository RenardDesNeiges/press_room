- title: 'El verano de los "iPad kids": cuando los niños se quedan solos en casa y
    la única alternativa es la pantalla'
  summary: "La falta de conciliación y la escasez de recursos hacen que muchos niños,\
    \ niñas y adolescentes pasen largas jornadas solos en casa con la pantalla como\
    \ única compañía; las expertas alertan de que el uso de este tipo de términos\
    \ aligera e individualiza un problema que es estructuralUna educadora, sobre la\
    \ conciliación en verano: “Uno de los mayores errores es intentar que hagan un\
    \ horario laboral”\n        Unos 120.000 niños, niñas y adolescentes de seis a\
    \ 13 años pasan muchas horas del día solas y solos en casa, con poco acompañamiento\
    \ de personas adultas, según cálculos de la ONG Educo. En verano, muchos de ellos\
    \ encuentran en las pantallas –tabletas, ordenadores, móviles y videoconsolas–\
    \ la única alternativa de ocio y compañía. Las altas temperaturas, las largas\
    \ jornadas de sus padres o la imposibilidad de salir a la calle sin un adulto\
    \ les condenan a pasar el día solos en casa, sin la posibilidad de asistir a campamentos\
    \ o actividades deportivas. De ahí que se les llame “iPad kids” (niños iPad o\
    \ niños tableta) o “screenagers” (adolescentes pantalla).\n    \n        “Estos\
    \ términos hay que usarlos con mucho cuidado. Son etiquetas o eufemismos que suenan\
    \ simpáticos, pero que individualizan un problema que muchas veces es estructural:\
    \ familias sin conciliación real, sin recursos para campamentos, sin apoyo comunitario,\
    \ o directamente en situación de vulnerabilidad”, denuncia Diana Jiménez, psicóloga\
    \ especializada en infancia e integrante de FABA. \n    \n        Una de esas\
    \ madres es Marbelys. Tiene dos niños que este verano han tenido que quedarse\
    \ en casa por falta de recursos. “Si por ellos fuera, estarían pegados a la televisión\
    \ todo el día, desde las nueve que se levantan hasta las diez que se acuestan.\
    \ Hasta se pelean por verla”, reconoce. Por falta de recursos, ha tenido que elegir\
    \ a cuál de ellos enviar a actividades puntualmente, y le ha tocado al menor poder\
    \ escaparse de vez en cuando, por lo que el mayor pasa gran parte del día solo.\
    \ “Él no quiere quedarse en casa, le gustaría más irse a un campamento o a la\
    \ piscina con sus amigos. Yo no tengo vacaciones, trabajo todo el día y no puedo\
    \ pagar por esas actividades”, explica Marbelys, que reconoce que no le gusta\
    \ la situación en la que están. “¿Pero qué puedo hacer? No me quedan alternativas”,\
    \ lamenta. \n    \n\n    \n    \n      \n      Estos términos hay que usarlos\
    \ con mucho cuidado. Son etiquetas o eufemismos que suenan simpáticos pero que\
    \ individualizan un problema que muchas veces es estructural\n               \
    \ \n                        Diana Jiménez\n                                  \
    \      — psicóloga especializada en infancia\n                      \n       \
    \   \n\n  \n        A esos 120.000 niños, niñas y adolescentes que se pasan horas\
    \ del día en casa sin compañía se les llamó en su momento “niños de la llave”,\
    \ porque tenían las llaves de su casa y se iban solos del colegio al domicilio,\
    \ preparándose la merienda, la cena y haciendo los deberes sin ayuda. Ahora se\
    \ les añade la sobreexposición a las pantallas, especialmente en verano: “Más\
    \ del 40% de madres y padres destaca que los niños y niñas de seis a 13 años están\
    \ delante de las pantallas más o mucho más tiempo que durante el resto del año”,\
    \ señala el informe de Educo, y añade: “Con los efectos que eso conlleva en su\
    \ salud: problemas de peso, salud visual y salud mental, como ansiedad, estrés,\
    \ síntomas depresivos o problemas de sueño”. \n    \n        Guiomar Todó, directora\
    \ adjunta de la ONG, matiza que no se trata de “demonizar las pantallas”, sino\
    \ de señalar su uso abusivo, sobre todo cuando se hace porque no hay alternativas:\
    \ “Pasar todo el verano delante de las pantallas es perder la oportunidad de disfrutar\
    \ de un tiempo libre que no se tiene durante el curso escolar para jugar, relacionarse,\
    \ ir a campamentos, descubrir la naturaleza o, simplemente, aburrirse”, asegura.\n\
    \    \n\n    \n    \n      \n      Él [su hijo mayor] no quiere quedarse en casa,\
    \ le gustaría más irse a un campamento o a la piscina con sus amigos. Yo no tengo\
    \ vacaciones, trabajo todo el día y no puedo pagar por esas actividades\n    \
    \            \n                        Marbelys\n                            \
    \            — madre de dos hijos\n                      \n          \n\n  \n\
    \        “En España, uno de cada tres niños, niñas y adolescentes no puede irse\
    \ de vacaciones ni una semana al año”, continúa Guiomar Todó. “Cuando los ingresos\
    \ son justos y dan para poco más que para pagar el alquiler, la comida y las facturas,\
    \ las vacaciones desaparecen de la ecuación. Conocemos casos de niños y niñas\
    \ de tan solo nueve años que se quedan jugando a la consola y scrolleando en las\
    \ redes sociales hasta bien entrada la madrugada”, señala la directiva de Educo.\n\
    \    \n        En esa situación estaban hace unos años los padres de Lorenzo,\
    \ hoy un adulto joven que se reconoce en el término de screenager. “Fui adolescente\
    \ en la pandemia, con todo lo que eso conlleva: me pasé muchísimas horas del confinamiento\
    \ pegado a la Play. Y luego no supe o no pude salirme de ahí. La mayoría de mis\
    \ veranos los pasé viendo series, jugando a videojuegos y luego con el iPad o\
    \ el móvil. Mis padres trabajaban mucho, nunca estaban en casa, no podían permitirse\
    \ unas vacaciones. Y yo no tenía amigos para hacer planes o, si me los ofrecían,\
    \ prefería quedarme en casa jugando online”, recuerda. \n    Un problema estructural\n\
    \        Su caso no es ni mucho menos aislado. La psicóloga Diana Jiménez aporta\
    \ más datos a la ecuación: “El 92% de los menores de nivel socioeconómico alto\
    \ participa en actividades extraescolares frente al 66% de nivel bajo, y casi\
    \ ocho de cada diez niños de familias con rentas bajas se quedan fuera de las\
    \ actividades de verano, muchas de las cuales además garantizan su alimentación”,\
    \ denuncia. Por eso ella señala que no se trata de un problema de “elección familiar”,\
    \ sino de estructura y recursos. “Cuando no hay red —ni económica, ni de conciliación,\
    \ ni comunitaria— la pantalla no es un capricho, es la opción que queda”, asegura.\
    \ Y añade que con este tipo de términos eufemísticos en inglés se fija la atención\
    \ donde no se debe: “Poner el foco en el niño enganchado o en el mal padre que\
    \ le da la tableta nos permite mirar hacia otro lado y no preguntarnos por qué\
    \ esa familia no tenía otra alternativa. Antes de juzgar el resultado, hay que\
    \ entender la causa. Y casi siempre la causa no es falta de amor ni de buena voluntad,\
    \ es falta de recursos, tiempo o red de apoyo”, dice.\n    \n        Coincide\
    \ en su análisis Cristina Castellanos, doctora en Economía, experta en conciliación\
    \ y políticas públicas y profesora en la UNED. “En verano los niños y niñas están\
    \ cansados, necesitan hacer otras actividades. Especialmente en entornos de mucho\
    \ calor, todos y todas deberían tener acceso a actividades deportivas en entornos\
    \ frescos, con piscinas o juegos de agua. Al no poder permitírselo, muchas familias\
    \ vulnerables acaban teniendo menos oportunidades para conciliar”, explica. También\
    \ ella denuncia que los términos como iPad kids o screenagers pueden servir de\
    \ eufemismo para esconder problemas estructurales. “Ponen el foco en el niño o\
    \ niña y no en la infraestructura. Hay una falta de medidas por la conciliación,\
    \ una falta de legislación y una falta de medios para los progenitores. Por eso\
    \ hay que corresponsabilizar al Estado y a la sociedad, para que no se deje sin\
    \ instrumentos a los progenitores que tienen muchos menos recursos para la protección\
    \ de sus hijos e hijas”, asegura la experta.\n    \n\n    \n    \n      \n   \
    \   En España, uno de cada tres niños, niñas y adolescentes no puede irse de vacaciones\
    \ ni una semana al año\n                \n                        Guiomar Todó\n\
    \                                        — directora adjunta de la ONG Educo\n\
    \                      \n          \n\n  \n        También Diana Jiménez cree\
    \ que hay que garantizar un acceso universal a actividades de verano. “No es un\
    \ lujo educativo, es una cuestión de salud pública y de equidad. La clave es tener\
    \ en cuenta el aporte positivo de la actividad al aire libre, en grupo, y accesible\
    \ a los menores independientemente de su nivel socioeconómico”, propone.\n   \
    \ \n        Un vacío que tratan de paliar desde organizaciones como Educo: “Colaboramos\
    \ con organizaciones e iniciativas dedicadas a la formación a progenitores y tutores\
    \ sobre el uso saludable y las oportunidades de ecosistema digital, así como sobre\
    \ la sobreexposición a las mismas y sus efectos”, aseguran desde la ONG. También\
    \ organizan un sistema de becas de verano para familias vulnerables que cubren\
    \ actividades y comedor. \n    \n        Gracias a estas ayudas, la familia de\
    \ Marbelys ha podido enviar a su hijo pequeño a un campamento. “Es una ayuda de\
    \ diez para mí, nos permite que al menos algunos días pueda hacer actividades\
    \ diferentes”, cuenta esta madre. Desde Educo defienden así su programa. “Las\
    \ actividades de ocio educativo en verano permiten que los niños y niñas puedan\
    \ disfrutar de las vacaciones. Y no deberían ser un lujo solo reservado a quien\
    \ pueda pagarlas. Todos tendrían que poder disfrutarlas, especialmente aquellos\
    \ y aquellas que se encuentran en situaciones de vulnerabilidad. Son una oportunidad\
    \ única de acceso a experiencias culturales, naturaleza y ocio que de otro modo\
    \ no tendrían”, reivindican."
