    \                              \n                \n\n                \n\n    \
    \        \n            \n\n            \n            \n                      \
    \      \n            \n                Agentes de la Guardia Civil, este miércoles,\
    \ delante del cuartel de Llanes donde ha ocurrido el crimen.                 \
    \           \n                                    \n            \n           \
    \     La investigación\n        La Delegación del Gobierno contra la Violencia\
    \ de Género ha empezado a “recabar datos” sobre el crimen. Una vez que se confirme\
    \ oficialmente que la muerte de Laura C.V. responde a un asesinato por violencia\
    \ machista, se convertiría en la víctima mortal número 34  en lo que va de año,\
    \ 1.375 desde 2003. \n    Concentración de repulsa\n        La Delegación del\
    \ Gobierno, el Principado de Asturias y el Ayuntamiento de Llanes han emitido\
    \ una declaración institucional convocando a la ciudadanía a participar mañana,\
    \ jueves día 6, en una concentración de repulsa por este asesinato que tendrá\
    \ lugar a las 18.30 horas, delante del consistorio llanisco.\n    \n        A\
    \ continuación reproducimos íntegramente esta declaración institucional:\n   \
    \ \n        “Ante el asesinato machista perpetrado en Llanes contra Laura, de\
    \ 50 años de edad, queremos manifestar nuestra más enérgica condena y rechazo,\
    \ así como nuestro apoyo y cercanía hacia el entorno de la víctima, poniendo a\
    \ su disposición los recursos psicológicos, jurídicos, sanitarios, de protección\
    \ y de acogida que requiera”.\n    La respuesta institucional\n        “En este\
    \ sentido, desde el momento que se ha tenido noticia sobre el caso, las tres administraciones\
    \ hemos trabajado de forma coordinada la respuesta institucional y la atención\
    \ a su familia y entorno”.\n    \n        “La violencia machista es una grave\
    \ vulneración de los Derechos Humanos ante la que nadie puede ser indiferente.\
    \ Desde la Delegación del Gobierno de España en el Principado de Asturias, el\
    \ Gobierno del Principado de Asturias y el Ayuntamiento de Llanes reiteramos nuestra\
    \ más absoluta condena y profunda consternación, al tiempo que queremos transmitir\
    \ a la sociedad asturiana la necesidad de un compromiso colectivo para acabar\
    \ con este tipo de violencia”. \n    Recursos contra la violencia machista\n \
    \       “Por ello -continúa la declaración institucional- hacemos un llamamiento\
    \ a toda la ciudadanía para que se sume a la concentración de condena y rechazo\
    \ a este asesinato machista que tendrá lugar mañana jueves 6 de agosto a las 18:30\
    \ horas ante el Ayuntamiento de Llanes”. \n    \n        La declaración conjunta\
    \ concluye recordando que el número de teléfono 016 de atención a mujeres víctimas\
    \ de violencia de género, está disponible todos los días del año las 24 horas\
    \ del día. Así como por vía WhatsApp en el 600 000 016 o escribir al correo 016-online@igualdad.gob.es."
