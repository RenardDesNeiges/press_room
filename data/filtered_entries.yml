- title: 'Ayuso defiende que el ático comprado por la Comunidad de Madrid no era para
    uso personal: "Sería muy poco inteligente"'
  summary: "La presidenta regional carga contra quienes intentan \"mezclar\" la compra\
    \ del ático de lujo por parte de su gobierno con la puesta en venta de los dos\
    \ áticos de su pareja, Alberto González Amador, incluido el inmueble en el que\
    \ viven ambos: \"Se han dado dos circunstancias a la vez\"El Gobierno de Ayuso\
    \ compró el ático de Chamberí por 6,3 millones de euros\n\n        Isabel Díaz\
    \ Ayuso insiste en que el polémico ático de lujo comprado por la Comunidad de\
    \ Madrid a través de Planifica Madrid no era para uso personal. “Sería muy poco\
    \ inteligente”, ha asegurado la presidenta autonómica este miércoles en una rueda\
    \ de prensa ante las preguntas de los periodistas. “Si hubiera querido tener una\
    \ vivienda para mí he tardado un poquito, siete años, como tantos ministros que\
    \ de los que no sabemos nada”, ha asegurado irónicamente. \n    \n        Ante\
    \ el intento de la prensa de confirmar si, tal y como adelantaba laSexta y confirmaba\
    \ el martes El País de fuentes cercanas a la operación, finalmente el inmueble\
    \ se compró por 6,3 millones, de los cuales un 3% se los habría llevado la inmobiliaria\
    \ como comisión por la venta, la presidenta ha remitido en varias ocasiones a\
    \ la consejería de Presidencia, de la que depende Planifica Madrid: “Es quien\
    \ tiene la información detallada”, ha asegurado, a pesar de que desde este organismo\
    \ no ofrecen el expediente de la compra. \n    \n        Una vez saltó la polémica\
    \ la semana pasada después de la adquisición del inmueble el pasado mes de abril,\
    \ el Gobierno de Ayuso rectificó y anunció que finalmente venderían el ático,\
    \ situado muy próximo a la vivienda familiar de la presidenta autonómica, y que\
    \ destinarían el montante a la reconstrucción por los incendios. La polémica compra\
    \ no aparece reflejado en Transparencia y la presidenta ha evitado responder a\
    \ la pregunta de la prensa de si hay más inmuebles en la misma situación: “Planifica\
    \ Madrid compra y vende inmuebles en numerosas ocasiones”, se ha limitado a responder.\
    \ \n    \n        Planifica Madrid es una sociedad mercantil de la Administración\
    \ madrileña que se ha encargado de la operación y que exigió confidencialidad\
    \ al vendedor antes incluso de visitar el ático, que, según alegó el Gobierno\
    \ autonómico, iba a ser utilizado para “reuniones” debido a unas obras que se\
    \ iban a realizar en la Real Casa de Correos, la sede de la presidencia regional.\
    \ Unas obras que, según las primeras informaciones, iban a comenzar este mismo\
    \ verano y de las que no se disponen detalles como las licitaciones. \n    \n\
    \        “He visto ahí la intención de mezclar dónde vivo con dónde vamos a trabajar\
    \ estos meses porque las obras empezarán en otoño”, ha asegurado la presidenta\
    \ autonómica durante la rueda de prensa, que no estaba registrada en la agenda\
    \ oficial. \n    “Se han dado dos circunstancias a la vez”\n        La presidenta\
    \ de la Comunidad de Madrid se ha referido veladamente a que en medio de la polémica,\
    \ su pareja, Alberto González Amador, puso a la venta el piso en el que vive con\
    \ la presidenta, el ático que compró en 2022 cuando ya mantenía una relación con\
    \ la baronesa del PP y cuya compra realizó después de cobrar una comisión de dos\
    \ millones de euros por la intermediación en la compraventa de mascarillas en\
    \ la pandemia del coronavirus. No solo ese piso, también el ático ubicado en la\
    \ planta inmediatamente superior. \n    \n        “Yo entiendo que se hilen puntos\
    \ porque se han dado dos circunstancias a la vez”, ha continuado Ayuso en su comparecencia,\
    \ que ha deslizado que esto se produce porque intentan “hacer daño”. “Teniendo\
    \ en cuenta que sufrago mis gastos, mis vacaciones, mi sueldo congelado”, ha seguido,\
    \ “sería poco inteligente”, ha asegurado, alegando que los vecinos la verían al\
    \ entrar y salir de esa casa. “Entiendo que casen los relatos porque queda muy\
    \ bien”."
  media: https://static.eldiario.es/clip/5a20c175-65bc-4d50-b107-d5c3f8aa3261_16-9-discover-aspect-ratio_default_0_x683y245.jpg
  url: https://www.eldiario.es/madrid/ayuso-defiende-atico-comprado-comunidad-madrid-no-personal-seria-inteligente_1_13429836.html
  date: '2026-08-05T12:08:04+00:00'
  lang: ES
  author: África Gelardo Arrebola
