- title: Las grandes petroleras obtienen 93.000 millones de dólares de beneficios
    en medio de la guerra de Irán
  summary: "Las ganancias extraordinarias durante tres meses gracias al conflicto\
    \ en Oriente Próximo reavivan los llamamientos para que las empresas que \"se\
    \ enriquecen a costa del sufrimiento humano\" paguen por los daños medioambientalesMás\
    \ leña al fuego: por qué las grandes petroleras obtienen enormes beneficios mientras\
    \ el mundo se calienta peligrosamente\n        Ocho de las mayores petroleras\
    \ acumularon beneficios de más de 90.000 millones de dólares (80.000 millones\
    \ de euros) en solo tres meses, mientras el conflicto con Irán disparaba los precios\
    \ de la energía y la crisis climática, agravada por las emisiones, provocaba olas\
    \ de calor mortales.\n    \n        Estos beneficios extraordinarios derivados\
    \ de la guerra han reavivado los llamamientos para que las grandes petroleras\
    \ y gasísticas, como Saudi Aramco y BP, paguen por el daño medioambiental causado\
    \ al “sacar provecho del sufrimiento humano” y financien una rápida transición\
    \ hacia las energías renovables.\n    \n        Un análisis de The Guardian revela\
    \ que las ocho productoras petroleras que cotizan en bolsa obtuvieron casi 93.000\
    \ millones de dólares en los tres meses hasta finales de junio —el primer trimestre\
    \ fiscal completo después de que la guerra de Estados Unidos e Israel contra Irán\
    \ provocara un repunte de los precios mundiales del petróleo hasta máximos superiores\
    \ a los 126 dólares por barril—, como puede verse en el siguiente gráfico, que\
    \ recoge la evolución del crudo Brent.\n    \n        \n                     \
    \                       \n\n\n\n\n\n\n    \n                                 \
    \   \n                                                                       \
    \                                                                 \n         \
    \                                           \n                               \
    \                 \n                                                         \
    \                                                               \n           \
    \                                         \n                                 \
    \               \n                                                           \
    \         \n                                                    \n           \
    \                                     \n                                    \n\
    \                \n\n                \n\n            \n            \n\n      \
    \      \n            \n            \n                \n        Las empresas han\
    \ aprovechado la mayor interrupción del suministro de combustibles fósiles en\
    \ la historia para casi duplicar sus beneficios conjuntos, que el año pasado por\
    \ estas mismas fechas rondaban los 50.000 millones de dólares, mientras que los\
    \ activistas advierten de que millones de hogares están pagando las consecuencias\
    \ en forma de facturas más elevadas y caos climático.\n    \n        Los datos\
    \ sugieren que las ocho empresas petroleras —Aramco, BP, Shell, Equinor, TotalEnergies,\
    \ Eni, Chevron y ExxonMobil— obtuvieron más de 700.000 dólares de beneficio cada\
    \ minuto durante el trimestre de primavera.\n    \n        Mientras sus valoraciones\
    \ bursátiles se disparaban en unos 600.000 millones de dólares hasta superar los\
    \ 3 billones, las temperaturas se disparaban hasta provocar una serie de olas\
    \ de calor mortales, todas ellas más probables y más severas debido a la quema\
    \ de combustibles fósiles.\n    \n        Las emisiones de carbono de las mayores\
    \ empresas de combustibles fósiles del mundo se relacionaron directamente, por\
    \ primera vez, con episodios mortales de calor extremo, según un análisis científico\
    \ publicado el pasado mes de septiembre. El estudio reveló que las emisiones de\
    \ cualquiera de las 14 empresas más grandes bastaban por sí solas para provocar\
    \ más de 50 olas de calor que, de otro modo, habrían sido prácticamente imposibles.\n\
    \    \n        Los mayores beneficios petroleros del trimestre de primavera los\
    \ obtuvo la empresa petrolera estatal de Arabia Saudí, Aramco, que registró un\
    \ aumento del 34% en sus beneficios netos trimestrales hasta superar los 33.000\
    \ millones de dólares, a pesar de que sus infraestructuras sufrieron daños a causa\
    \ de los ataques con drones y misiles perpetrados por las fuerzas iraníes y hutíes.\n\
    \    \n        La producción de combustibles fósiles de Saudi Aramco la ha convertido\
    \ en la mayor empresa de emisiones de carbono de la historia, según la base de\
    \ datos Carbon Majors; le siguen Chevron y ExxonMobil, mientras que Shell y BP\
    \ figuran entre las diez primeras. Arabia Saudí lleva décadas liderando con éxito\
    \ los esfuerzos por bloquear y retrasar la acción internacional contra el cambio\
    \ climático.\n    \n        El martes, BP se convirtió en una de las últimas grandes\
    \ petroleras en publicar sus resultados correspondientes al periodo de abril a\
    \ junio, con unos beneficios trimestrales de 5.73 mil millones de dólares —los\
    \ más altos desde el primer año de la guerra a gran escala de Rusia contra Ucrania\
    \ y más del doble de los 2.5 mil millones de dólares de los tres meses anteriores—.\n\
    \    \n        El siguiente gráfico compara los beneficios de las mayores petroleras\
    \ obtenidos en el segundo trimestre de este año frente al mismo periodo del ejercicio\
    \ anterior.\n    \n        \n                                            \n\n\n\
    \n\n\n\n    \n                                    \n                         \
    \                                                                            \
    \                                   \n                                       \
    \             \n                                                \n           \
    \                                                                            \
    \                                 \n                                         \
    \           \n                                                \n             \
    \                                                       \n                   \
    \                                 \n                                         \
    \       \n                                    \n                \n\n         \
    \       \n\n            \n            \n\n            \n            \n       \
    \     \n                \n        Patrick Galey, responsable del área de combustibles\
    \ fósiles en Global Witness, afirma: “Los beneficios astronómicos de BP son un\
    \ escandaloso recordatorio de quién se ha estado enriqueciendo a costa del sufrimiento\
    \ humano este año. Mientras los incendios forestales amenazan a comunidades de\
    \ todo el mundo, la sequía azota y los costes energéticos se disparan, las familias\
    \ de a pie están pagando el precio de que las grandes petroleras antepongan la\
    \ riqueza de los accionistas a un planeta habitable”.\n    \n        Y añade:\
    \ “Es hora de hacer que los gigantes petroleros paguen para reparar la crisis\
    \ climática que ellos mismos están provocando. Piensa en cuántas defensas contra\
    \ incendios e inundaciones podríamos construir, o cuántos paneles solares podríamos\
    \ instalar, si las grandes petroleras pagaran la parte que les corresponde en\
    \ impuestos”.\n    \n        Rosie Downes, directora de campañas de Friends of\
    \ the Earth, afirma: “Mientras BP se embolsa otra ronda de enormes beneficios,\
    \ millones de hogares están pagando el precio a través de facturas de energía\
    \ desorbitadas y una crisis climática que se está acelerando rápidamente y se\
    \ está saliendo de control”.\n    \n        La nueva directora ejecutiva de BP,\
    \ Meg O’Neill, defendió los beneficios de la empresa afirmando que esta estaba\
    \ “centrada en las medidas que podemos tomar para intentar ayudar a abordar la\
    \ situación”, como producir de forma fiable una mayor cantidad de los productos\
    \ petrolíferos que escasean.\n    \n        La empresa ha ido recortando el gasto\
    \ en energía verde desde que, a principios del año pasado, abandonó sus ambiciones\
    \ medioambientales en el marco de un “reajuste fundamental”, reduciendo su presupuesto\
    \ anual para la transición energética de 5.000 millones de dólares a entre 1.500\
    \ y 2.000 millones de dólares.\n    \n        En los últimos años, BP ha escindido\
    \ sus parques eólicos marinos del Reino Unido en una empresa conjunta y ha vendido\
    \ su negocio eólico terrestre en EEUU, y el martes anunció que vendería su negocio\
    \ de biogás en EE. UU., valorado en 4.000 millones de dólares, que captura metano\
    \ de vertederos y es el mayor productor de gas renovable del país.\n    \n   \
    \     Según el Financial Times, se encuentra en negociaciones avanzadas para vender\
    \ su negocio de energía solar, Lightsource, a un consorcio respaldado por el fondo\
    \ soberano de Kuwait.\n    \n        El viernes, BP puso a la venta su negocio\
    \ de petróleo y gas del Mar del Norte tras más de 60 años de explotación, lo que\
    \ reavivó los llamamientos al Gobierno británico para que descarte la explotación\
    \ de dos controvertidos yacimientos del Mar del Norte en esta cuenca en proceso\
    \ de envejecimiento.\n    \n        Shell comunicó la semana pasada sus segundos\
    \ beneficios trimestrales más altos de su historia, ya que sus ingresos netos\
    \ se dispararon hasta los 9.840 millones de dólares, a pesar de producir menos\
    \ gas en su planta de Qatar debido a los daños por valor de miles de millones\
    \ de dólares causados por la guerra. Los beneficios de Equinor ascendieron a 3.200\
    \ millones de dólares en el mismo periodo, frente a los 1.800 millones del trimestre\
    \ de primavera del año pasado.\n    \n        En EEUU, los beneficios declarados\
    \ por Chevron y ExxonMobil provocaron las críticas de Donald Trump. El presidente\
    \ estadounidense acusó a ambas empresas de «ganar demasiado dinero» gracias a\
    \ su guerra contra Irán y advirtió de que se les obligaría a devolver los beneficios\
    \ a la ciudadanía, en un momento en el que se acercan las elecciones de mitad\
    \ de legislatura de noviembre y sus índices de popularidad están en baja.\n  \
    \  \n        Chevron declaró unos ingresos netos de 12.200 millones de dólares\
    \ en el segundo trimestre, lo que supone un aumento de más de cinco veces con\
    \ respecto al mismo periodo del año anterior. ExxonMobil declaró un beneficio\
    \ de 14 500 millones de dólares, el doble de lo que ganó en el mismo periodo del\
    \ año anterior y su mayor beneficio trimestral desde la invasión de Ucrania por\
    \ parte de Rusia en 2022.\n    \n        Para Galey “se sabe que las grandes petroleras\
    \ nos están tomando el pelo cuando uno de sus mayores aliados, Donald Trump, les\
    \ está diciendo que frenen su especulación”.\n    \n        \n               \
    \                             \n\n\n\n\n\n\n    \n                           \
    \         \n                                                                 \
    \                                                                       \n   \
    \                                                 \n                         \
    \                       \n                                                   \
    \                                                                     \n     \
    \                                               \n                           \
    \                     \n                                                     \
    \               \n                                                    \n     \
    \                                           \n                               \
    \     \n                \n\n                \n\n            \n            \n\n\
    \            \n            \n            \n                \n        Entre las\
    \ consecuencias de este verano se encuentra la peor ola de calor de la historia\
    \ de Europa, otra de las que los científicos califican de “imposible” sin el calentamiento\
    \ global provocado por el ser humano. Se estima que unas 20.000 personas han fallecido\
    \ a causa de las temperaturas extremas, incluidas cerca de 3.000 en el Reino Unido\
    \ solo en mayo y junio. \n    \n        Corea del Sur y Japón también han registrado\
    \ temperaturas récord de hasta 42,5 °C; la agencia meteorológica coreana ordenó\
    \ a la población que “cesara inmediatamente todas las actividades al aire libre”,\
    \ mientras que la crisis climática provocó un aumento de las temperaturas en gran\
    \ parte de África en julio. \n    \n        El gráfico anterior recoge el aumento\
    \ de las temperaturas como consecuencia de la contaminación por carbonoo. Son\
    \ medias móviles de cinco años, en relación con el valor de referencia preindustrial\n\
    \    \n        El calentamiento global hace que cada ola de calor sea más intensa\
    \ y más probable, y el aumento de las temperaturas globales mata a una persona\
    \ por minuto en todo el mundo, según estimó en octubre un informe publicado en\
    \ The Lancet.\n    \n        El responsable de clima de la ONU, Simon Stiell,\
    \ afirmó: “En todo el mundo, los desastres provocados por el clima están alcanzando\
    \ proporciones de pesadilla. Lo que hay que hacer está claro: abandonar el carbón,\
    \ el petróleo y el gas más rápidamente, ampliar las energías renovables y proteger\
    \ a las personas allí donde los efectos ya están golpeando con mayor dureza”.\n\
    \    \n        \n                                            \n\n\n\n\n\n\n  \
    \  \n                                    \n                                  \
    \                                                                            \
    \                          \n                                                \
    \    \n                                                \n                    \
    \                                                                            \
    \                        \n                                                  \
    \  \n                                                \n                      \
    \                                              \n                            \
    \                        \n                                                \n\
    \                                    \n                \n\n                \n\n\
    \            \n            \n\n            \n            \n                  \
    \          \n            \n                Trabajos de extinción del incendio\
    \ forestal en Fermoselle (Zamora) este miércoles.                            \n\
    \                                    \n            \n                \n      \
    \  La sucesión de olas de calor en Europa ha resecado los suelos y ha provocado\
    \ una sequía extrema, lo que ha dañado los cultivos, desde el maíz hasta el girasol\
    \ y las lechugas. Se prevé una pérdida de al menos 9 millones de toneladas de\
    \ cereales; el Reino Unido, por ejemplo, se enfrenta a la peor cosecha de su historia.\n\
    \    \n        Las condiciones de sequía también han propiciado enormes incendios\
    \ forestales en España (a los que corresponde la foto anterior), Francia, Portugal\
    \ y Grecia, que han causado daños por valor de miles de millones de euros. Los\
    \ incendios provocan un aumento vertiginoso de la contaminación atmosférica tóxica\
    \ y, en EEUU y Canadá, se estima que los incendios ocurridos entre el 15 y el\
    \ 23 de julio causaron unas 4.000 muertes en la semana posterior a la exposición.\
    \ La crisis climática está agravando las condiciones meteorológicas propicias\
    \ para los incendios y el humo de los incendios forestales acorta la vida de alrededor\
    \ de 1,5 millones de personas al año.\n    \n        En el sur de Asia, la crisis\
    \ climática está potenciando las precipitaciones extremas: el aire que es 1 °C\
    \ más cálido retiene un 7 % más de agua. A principios de julio, por ejemplo, cayeron\
    \ más de 40 cm de lluvia en 24 horas en Chattogram (Bangladesh), lo que provocó\
    \ inundaciones repentinas. Las inundaciones y los deslizamientos de tierra se\
    \ han cobrado vidas y han destruido medios de subsistencia en Pakistán y la India.\
    \ También se han producido decenas de víctimas mortales en el noroeste de China,\
    \ donde se ha evacuado a muchos miles de personas debido a fuertes tormentas.\n\
    \    \n        Se contactó con las ocho empresas petroleras para recabar sus comentarios."
