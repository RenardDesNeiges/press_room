- title: 'La Bolsa, a récord por día: por qué el Ibex consolida los 20.000 puntos
    y prolonga su rally histórico'
  summary: "El selectivo cierra en 20.057 puntos impulsado por la banca y el buen\
    \ momento de los resultados empresariales, según los expertos, en la última marca\
    \ de una carrera al alza que dejó atrás el anterior techo (16.000 puntos, de 2007)\
    \ hace casi un año\nLas grandes petroleras obtienen 93.000 millones de dólares\
    \ de beneficios en medio de la guerra de Irán\n\n        La Bolsa española va\
    \ a récord por día y se afianza por encima de los 20.000 puntos. Tras superar\
    \ por primera vez esa barrera, el principal índice de la Bolsa española ha vuelto\
    \ a cerrar este miércoles en máximos históricos alcanzando una cifra de 20.057\
    \ puntos. Con un avance del 0,17%, ha consolidado un nivel que hasta hace apenas\
    \ unas jornadas parecía inalcanzable. El selectivo prolonga así un rally que acumula\
    \ más de un 40% de revalorización en el último año, impulsado por la banca, unos\
    \ beneficios empresariales mejores de lo esperado y el renovado interés de los\
    \ inversores por la renta variable europea.\n    \n        La sesión estuvo marcada\
    \ por las ganancias en Wall Street y por la continuidad del optimismo en los mercados\
    \ pese a la incertidumbre geopolítica en Oriente Medio. El petróleo, que el martes\
    \ se desplomó ante las expectativas de un acuerdo entre Estados Unidos e Irán\
    \ para reabrir el estrecho de Ormuz, rebotó ligeramente este miércoles, mientras\
    \ el Ibex volvía a registrar nuevos máximos intradía y encadenaba otro cierre\
    \ histórico.\n    \n        El selectivo sigue en terreno desconocido: el récord\
    \ certifica un cambio de ciclo para la Bolsa española. Tras casi dos décadas sin\
    \ superar los máximos alcanzados antes de la crisis financiera, el índice no solo\
    \ dejó atrás el techo de 2007 el pasado octubre, sino que apenas diez meses después\
    \ ha conseguido instalarse por encima de una cota (los 20.000 puntos) que durante\
    \ años pareció inalcanzable.\n    De la burbuja de 2007 al hundimiento de la pandemia\n\
    \        El repunte no es flor de un día: el índice acumula un rally superior\
    \ al 41% en poco más de trece meses, desde los 14.000 puntos de hace un año hasta\
    \ los máximos actuales. 2025 fue su mejor año en lo que va de siglo, con una revalorización\
    \ del 49%, solo superada por el 54% de 1993. Y en lo que llevamos de 2026 (que\
    \ arrancó en 17.307 puntos) el índice suma ya más de un 15%.\n    \n        El\
    \ 8 de noviembre de 2007 el Ibex marcó lo que durante casi dos décadas fue su\
    \ máximo histórico de cierre, en 15.945,70 puntos, impulsado por el auge del crédito\
    \ y del sector inmobiliario. Al día siguiente llegó a tocar un máximo intradía\
    \ de 16.040,40 puntos, aunque esa sesión terminó cerrando a la baja. Apenas unos\
    \ meses después comenzó un desplome que borró más de la mitad de su valor con\
    \ la crisis de Lehman Brothers, la recesión y, posteriormente, la crisis de deuda\
    \ de la eurozona.\n    \n        Ese récord tardó casi dieciocho años en caer:\
    \ no fue hasta el 27 de octubre de 2025 cuando el Ibex cerró por encima de los\
    \ 15.945,70 puntos de 2007, en 16.000,2 puntos, y poco después dejó atrás también\
    \ el máximo intradía de aquel noviembre. Desde entonces el índice no ha dejado\
    \ de encadenar máximos, hasta llegar a los 20.000 puntos de esta semana.\n   \
    \ \n        Entremedias, la pandemia supuso otro golpe de enorme magnitud. En\
    \ marzo de 2020, con el confinamiento global y la paralización de la actividad\
    \ económica, el Ibex llegó a perder cerca del 40% de su valor en apenas unas semanas\
    \ y cayó hasta los 6.107 puntos, su nivel más bajo desde 2012. Aunque la recuperación\
    \ fue rápida en otros índices, el mercado español tardó más tiempo en recomponerse\
    \ por el peso de sectores especialmente castigados, como el turismo, y por la\
    \ debilidad de la banca en un entorno de tipos de interés negativos.\n    \n \
    \       Precisamente ahí está una de las claves del momento actual para los expertos.\
    \ “La combinación de beneficios empresariales sólidos, liderazgo de la banca y\
    \ las infraestructuras, una valoración atractiva frente a otros mercados y la\
    \ vuelta del capital internacional hacia Europa explica que el Ibex haya llegado\
    \ ahora a los 20.000 puntos”, resume Javier Molina, analista de mercados de eToro.\n\
    \    El peso de la banca\n        Si hay un protagonista del rally bursátil de\
    \ los últimos años es el sector financiero. La composición del Ibex, tradicionalmente\
    \ criticada por su elevada dependencia de los bancos y su escasa presencia tecnológica,\
    \ se ha convertido en esta ocasión en una ventaja.\n    \n        “Durante casi\
    \ una década la banca operó con tipos negativos que penalizaban enormemente su\
    \ rentabilidad. Hoy el escenario es completamente distinto, con márgenes financieros\
    \ mucho más elevados”, explica Manuel Pinto, analista de mercados de XTB.\n  \
    \  \n        Las sucesivas subidas de los tipos de interés del Banco Central Europeo\
    \ desde 2022 dispararon el margen de intereses de las entidades financieras y\
    \ permitieron encadenar beneficios récord. Como consecuencia, bancos como Santander,\
    \ BBVA, CaixaBank, Sabadell o Unicaja han sido algunos de los grandes motores\
    \ del índice.\n    \n        Ese protagonismo, sin embargo, tiene una doble lectura.\
    \ Que el sector financiero represente alrededor del 40% del Ibex ha impulsado\
    \ al índice en este ciclo, pero también aumenta su dependencia de un único factor:\
    \ la política monetaria del BCE.\n    \n        “Hoy es una ventaja porque coincide\
    \ con el ciclo, pero a largo plazo aumenta la dependencia del índice a un único\
    \ sector y reduce su diversificación estructural”, advierte Molina.\n    \n  \
    \      Pinto coincide en ese diagnóstico. Considera que el principal riesgo es\
    \ que un endurecimiento excesivo de la política monetaria termine frenando la\
    \ demanda de crédito y, con ello, los beneficios de las entidades financieras.\n\
    \    \n        Dentro de ese bloque bancario, además, conviene no tratarlo como\
    \ un todo homogéneo, tal y como advierten los expertos. Los dos grandes bancos\
    \ del Ibex , por ejemplo, están siguiendo estrategias de capital casi opuestas.\
    \ Santander ha optado por crecer vía adquisiciones (como TSB o Webster Financial),\
    \ mientras que BBVA ha priorizado devolver capital a sus accionistas mediante\
    \ recompras y amortizaciones de acciones.\n    Más que una rotación hacia el ‘value’\n\
    \        El buen comportamiento del Ibex tampoco puede explicarse únicamente por\
    \ el regreso del apetito de los inversores por sectores tradicionales frente a\
    \ las grandes tecnológicas estadounidenses.\n    \n        Los analistas coinciden\
    \ en que la rotación internacional hacia compañías consideradas value (bancos,\
    \ energía, industria o infraestructuras) ha favorecido especialmente al mercado\
    \ español, pero subrayan que esa corriente se ha apoyado también en unos resultados\
    \ empresariales sólidos.\n    \n        “La rotación internacional ha actuado\
    \ como catalizador, pero difícilmente habría tenido el mismo impacto si las compañías\
    \ españolas no estuvieran presentando unos resultados sólidos”, sostiene Pinto.\n\
    \    \n        El crecimiento económico de España, más intenso de lo previsto,\
    \ el buen comportamiento del empleo, el turismo y el consumo han reforzado los\
    \ beneficios de buena parte de las cotizadas. A ello se suma la mejora de las\
    \ perspectivas para compañías ligadas a infraestructuras y energía, favorecidas\
    \ por el aumento de la inversión en centros de datos y electrificación.\n    Un\
    \ índice con fortalezas… y carencias\n        Paradójicamente, una de las debilidades\
    \ históricas del Ibex se ha convertido en una de sus fortalezas. Durante años\
    \ el mercado español fue visto como un índice con poca exposición a tecnología\
    \ y excesivamente concentrado en banca, energía, infraestructuras y turismo.\n\
    \    \n        En el contexto actual esa composición juega a su favor porque son\
    \ precisamente esos sectores los que están captando buena parte de los flujos\
    \ internacionales. Sin embargo, ambos analistas coinciden en que el mercado español\
    \ mantiene una asignatura pendiente: la escasa presencia de grandes compañías\
    \ tecnológicas, de software, inteligencia artificial, ciberseguridad o biotecnología.\n\
    \    \n        “El tejido empresarial español sigue muy orientado hacia banca,\
    \ energía, infraestructuras, turismo y servicios, sectores de enorme calidad pero\
    \ con un perfil de crecimiento diferente al de las grandes tecnológicas internacionales”,\
    \ apunta Pinto.\n    \n        Con un matiz: Inditex, la segunda mayor cotizada\
    \ del selectivo tras Santander, pesa por sí sola alrededor del 15% de la capitalización\
    \ total del Ibex. Aunque pertenece al sector textil y no al tecnológico, su modelo\
    \ de 'fast fashion' y sus márgenes (comparables a los de firmas de lujo) la sitúan\
    \ más cerca del perfil de crecimiento que del resto del índice, y matizan algo\
    \ la imagen de un Ibex compuesto solo por sectores cíclicos más tradicionales.\n\
    \    Un récord… ¿y ahora qué?\n        Desde un punto de vista financiero, superar\
    \ los 20.000 puntos no cambia el valor de las empresas. Pero sí tiene un fuerte\
    \ componente psicológico. Las cifras redondas suelen atraer la atención de inversores\
    \ y gestores y aumentan la visibilidad internacional de la Bolsa española.\n \
    \   \n        Los analistas rechazan, sin embargo, que el mercado esté inmerso\
    \ en una burbuja. “No hablaría de euforia. A diferencia de otros episodios históricos,\
    \ la subida ha venido acompañada de un crecimiento muy sólido de los beneficios\
    \ empresariales”, afirma Pinto. Molina también considera que los 20.000 puntos\
    \ reflejan “una mejora real del mercado”, aunque recuerda que, tras un rally tan\
    \ intenso, conviene distinguir entre fortaleza y complacencia.\n    \n       \
    \ La incógnita ahora es si el Ibex será capaz de consolidarse por encima de esa\
    \ cota o si el nivel acabará funcionando como un techo psicológico tras las fuertes\
    \ subidas de los dos últimos años.\n    \n        Los dos analistas coinciden\
    \ en que el comportamiento del mercado seguirá dependiendo de los beneficios empresariales\
    \ y, sobre todo, de la banca, el gran motor del índice desde el inicio del ciclo\
    \ de subidas de tipos del BCE. Pero también creen que el margen para seguir escalando\
    \ es ahora más estrecho.\n    \n        Pinto prevé una segunda mitad del año\
    \ “mucho más selectiva”. Considera que mantener cotizaciones claramente por encima\
    \ de los 20.000 puntos exigirá una mejora adicional de los beneficios, especialmente\
    \ en el sector financiero, mientras que otros sectores como las infraestructuras,\
    \ el turismo o las utilities podrían ganar protagonismo si la banca pierde impulso.\n\
    \    \n        Molina comparte esa cautela. Aunque considera que el récord refleja\
    \ una mejora real del mercado español, advierte de que los inversores deberán\
    \ vigilar la evolución de los resultados empresariales, la política monetaria\
    \ y el crecimiento económico europeo. El consenso entre ambos es que el gran reto\
    \ ya no era alcanzar los 20.000 puntos, sino demostrar que existen fundamentos\
    \ suficientes para permanecer en ellos."
