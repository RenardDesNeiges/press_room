- title: '«Sans lui, il aurait pu y avoir des morts»: un policier vaudois jugé pour
    une intervention tendue sur son jour de congé'
  summary: S’est-il pris pour un sherif, ou a-t-il simplement fait son devoir? Un
    agent vaudois, alors instructeur à l’Académie de police, comparaissait ce mardi
    pour abus d’autorité après avoir interpellé en civil des chauffards à l’aide de
    son chien. L’intervention s’était finie par un échange de coups et une morsure«J’ai
    fait mon travail, c’est tout. Les rodéos routiers tuent, j’ai protégé la population,
    c’est mon devoir.» Droit dans ses bottes, bien qu’ébranlé, Didier* a assuré devant
    le Tribunal de Nyon, ce mardi matin, avoir agi au plus près de sa conscience et
    de la doctrine policière, ce dimanche de décembre 2023, lors d’une intervention
    en civil qui a mal tourné.Le Ministère public vaudois, lui, estime au contraire
    qu’il s’est rendu coupable d’abus d’autorité et de contravention à la loi vaudoise
    sur la police des chiens. Il avait condamné l’agent à 20 jours-amende avec sursis,
    dans une ordonnance pénale à laquelle celui-ci s’est opposé. «Ce n’est pas la
    sanction qui compte. Si cette ordonnance absurde est maintenue, sa carrière s’écroule»,
    a rappelé son avocat Me Raphaël Mahaim.Voir plus
