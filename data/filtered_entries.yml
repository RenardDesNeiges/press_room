- title: Muere el guitarrista Pepe Habichuela, discreto revolucionario del flamenco,
    a los 82 años
  summary: "Nacido en Granada en 1944, fue una de las figuras más influyentes de la\
    \ guitarra flamenca contemporáneaAdiós a 'El Cabrero', la voz jonda, blasfema\
    \ y libérrima\n\n        El guitarrista flamenco José Antonio Carmona Carmona,\
    \ más conocido como Pepe Habichuela, ha muerto este martes a los 82 años en Madrid\
    \ a causa de una enfermedad pulmonar. Fue una de las figuras más influyentes de\
    \ la guitarra flamenca contemporánea. El tanatorio Servisa de Carabanchel estará\
    \ abierto durante la mañana del miércoles y después será trasladado a Granada\
    \ para su entierro.\n    \n        “En la calle La Alegría donde se pasea mi alma,\
    \ unos cantan y otros bailan y yo hablo con mi guitarra, y el ritmo me llega/\
    \ Alegría que sale de mi, habla al corazón, huele a Yerbabuena”. Esta letra grabada\
    \ hace 25 suena hoy a epitafio, a manifiesto sobre la manera de estar en el mundo\
    \ del maestro Pepe Habichuela. La encontramos en Oriente, la rumba que abre Yerbabuena\
    \ (Nuevos Medios 2001), su disco en colaboración con la orquesta india Bollywood\
    \ Strings. Entre guitarras y violines, un coro de mujeres deja esta letanía de\
    \ colores que lo impregna todo. Oriente suena actual y fresco un cuarto de siglo\
    \ después y ejemplifica la carrera del músico granadino, musicalidad, flamencura\
    \ y mestizaje con otras músicas.\n    \n        La curiosidad y la valentía de\
    \ Pepe Habichuela viene de mucho antes de Yerbabuena, viene de hace 50 años, cuando\
    \ abandona el sueldo fijo de un tablao para sentarse junto a otro granadino, Enrique\
    \ Morente, a pegarle tres vueltas al flamenco. Nervios, ilusión y ninguna certeza\
    \ hacia el futuro ante un ambiente de lo jondo que rechazaba de pleno los caminos\
    \ de la experimentación. “Me he partido los cuernos yendo todos los días a casa\
    \ de Enrique a trabajar”, confesó el año pasado en una entrevista en Radio3.\n\
    \    \n        El resultado de esos meses encerrados en el estudio mientras su\
    \ mujer, Amparo Bengala, mantenía la casa con su sueldo de bailaora en Torres\
    \ Bermejas, fueron dos discos que se publicaron en 1977, Homenaje a don Antonio\
    \ Chacón y Despegando. Con ellos, y con los años que siguieron, Enrique Morente\
    \ y Pepe Habichuela se convirtieron en una de las parejas más decisivas en la\
    \ actualización y evolución del flamenco. \n    \n        \n                 \
    \                           \n\n\n\n\n\n\n    \n                             \
    \       \n                                                                   \
    \                                                                     \n     \
    \                                               \n                           \
    \                     \n                                                     \
    \                                                                   \n       \
    \                                             \n                             \
    \                   \n                                                       \
    \             \n                                                    \n       \
    \                                         \n                                 \
    \   \n                \n\n                \n\n            \n            \n\n \
    \           \n            \n                            \n            \n     \
    \           Pepe Habichuela tras recibir la Gran Cruz de la Orden Civil de Alfonso\
    \ X el Sabio en febrero de 2026.                            \n               \
    \                     \n            \n                \n        Pepe Habichuela\
    \ nació José Antonio Carmona en Granada en 1944 en el seno de una dinastía de\
    \ artistas. Desde que era un niño subía las cuestas del Sacromonte arrastrando\
    \ su guitarra para ganarse unas perras en las zambras. El mayor de los hermanos,\
    \ Juan, antes de embarcarse en una gira internacional le llamó desde Madrid para\
    \ que ocupase su lugar en el tablao Torres Bermejas. Ahí, codeándose con los grandes\
    \ artistas del momento, se labró el reconocimiento como profesional y el cariño\
    \ como persona.\n    \n        Dicen que cuando los Habichuelas tocaban juntos\
    \ se producían desconchones en los techos encalados de las cuevas de Granada.\
    \ Ese rasgueo poderoso y único que necesitaba para que la guitarra se dejase oír\
    \ en las bullangueras zambras y en los tablaos fue el elemento diferencial de\
    \ la guitarra de la mítica saga de tocaores. Pero había mucho más en esas guitarras\
    \ granaínas. El Día de Andalucía de 1993 Morente presentó a sus acompañantes en\
    \ el concierto del mítico colegio mayor San Juan Evangelista, Juan y Pepe Habichuela\
    \ como “la orquesta sinfónica del Albaicín”. \n    \n        Tras acompañar a\
    \ Enrique en las primeras diabluras jondas, Pepe inició una carrera en solitario\
    \ que se consagró con el primer disco flamenco del sello Nuevos Medios. Con A\
    \ Mandeli, Pepe estrenaba la denominación Jóvenes Flamencos que tan de moda se\
    \ puso posteriormente. En plena grabación del mismo el segundo de los hermanos\
    \ Habichuela le comentó al jefe de Nuevos Medios, Mario Pacheco, hay unos chavales\
    \ que están haciendo un flamenco fresco que merece la pena. Eran los Ketama y\
    \ este golpe de nepotismo visionario hacia su hijo y sus sobrinos impulsó al grupo\
    \ que puso a bailar a toda España en los años 90. \n    \n        Gracias a su\
    \ curiosidad y a la libertad creativa que le daba Nuevos Medios, Pepe Habichuela\
    \ —con el apoyo incondicional y discreto de su hijo Josemi Carmona— pudo tejer\
    \ una de las carreras más internacionales del flamenco. Además de la ya citada\
    \ colaboración con la orquesta india Bollywood Strings, Pepe Habichuela grabó\
    \ con el trompetista Don Cherry —que decía que su guitarra era “un árbol llorando”—\
    \ o el bajista Jaco Pastorius. Especialmente fructífera fue su colaboración con\
    \ el también bajista Dave Holand con quien giró varios años por los mejores festivales\
    \ de jazz. Hace pocos meses Holland se dejó caer por la casa de los Habichuela\
    \ en el barrio de Lucero de Madrid para despedirse de su amigo, que ya peleaba\
    \ con la cruel enfermedad que se lo ha llevado. Los abrazos y las sonrisas sortearon\
    \ una vez más las barreras de comunicación, aunque no vino mal la ayuda de algún\
    \ nieto y de la fotógrafa alemana Anya Bartels Suermont, amiga de la casa. \n\
    \    \n        Esta vez no ha hecho falta llegar al día de la despedida para dar\
    \ vida a la leyenda de un artista. La leyenda y el reconocimiento a Pepe Habichuela\
    \ no ha hecho nada más que empezar, pero arrancó hace ya algunos años, cuando\
    \ los que tienen poder de decisión resolvieron que, por su bondad artística y\
    \ humana, era necesario celebrarlo en vida. Todo empezó en el Circo Price, donde\
    \ músicos de muy distintas disciplinas le rindieron homenaje en tres días consecutivos;\
    \ el Festival Flamenco On Fire de Pamplona le nombró desde la primera edición\
    \ su embajador perpetuo aunque él prefería llamarse “el emBadajoz del flamenconfair”.\n\
    \    \n        El ministro de Cultura José Guirao le concedió la Medalla de Oro\
    \ del Mérito a las Bellas Artes, algo que el Gobierno actual elevó recientemente\
    \ a la Gran Cruz de Alfonso X El Sabio, la más alta distinción de nuestra cultura.\
    \ El tributo que el mundo del flamenco le brindó el verano pasado en las Noches\
    \ del Botánico de Madrid, entre otros tantos gestos de agradecimiento por toda\
    \ España, son la muestra del cariño que ha recibido merecidamente en los últimos\
    \ años. El regalo más importante que nos deja Pepe Habichuela a todos los aficionados\
    \ a la música es haberse ido con las botas puestas tocando hasta hace muy pocos\
    \ meses, bien pasados los ochenta, en los mejores escenarios con la misma sonrisa\
    \ y la misma flamencura de siempre."
