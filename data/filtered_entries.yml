- title: Les personnes atteintes d’un cancer du sang sont toujours plus nombreuses,
    malgré les progrès
  summary: 'Une étude publiée mardi 4 août constate que des traitements permettent
    aux malades de vivre plus longtemps, mais que la mortalité ne faiblit pas toujours,
    selon les affections. En cause: la hausse de l’incidence. Les pesticides sont
    parmi les facteurs de risque identifiés.'
  media: https://static.mediapart.fr/etmagine/default/files/2026/08/05/260805-img-cancers-du-sang-des-malades-toujours-plus-nombreux-l-environnement-en-cause.jpg
  url: https://www.mediapart.fr/journal/ecologie/050826/les-personnes-atteintes-d-un-cancer-du-sang-sont-toujours-plus-nombreuses-malgre-les-progres
  date: '2026-08-05T14:45:41+00:00'
  lang: FR
  author: Caroline Coq-Chodorge
  source: Mediapart
  EID: 3
- title: L’Argentine se mobilise contre un projet de loi sur la propriété privée
  summary: Avec son texte sur «l’inviolabilité de la propriété privée», facilitant
    l’achat d’énormes portions de terre par des capitaux étrangers, le président argentin
    Javier Milei a provoqué une contestation. En parallèle du vote de la loi prévu
    le jeudi 6 août, les opposants appellent à une manifestation, qui s’annonce massive.
  media: https://static.mediapart.fr/etmagine/default/files/2026/08/04/260804-img-ils-veulent-nous-faire-revenir-au-temps-de-la-colonie-en-argentine-une-loi-facilitant-la-vente-de-t.jpg
  url: https://www.mediapart.fr/journal/international/050826/l-argentine-se-mobilise-contre-un-projet-de-loi-sur-la-propriete-privee
  date: '2026-08-05T14:45:36+00:00'
  lang: FR
  author: Louise André-Williams
  source: Mediapart
  EID: 4
- title: La mémoire de Patrice Lumumba résiste à l’annihilation occidentale
  summary: La famille du leader congolais n’a pas renoncé à obtenir justice et vérité,
    soixante-cinq ans après son assassinat. Devenu une «icône de la libération» de
    l’Afrique, l’ancien premier ministre du Congo incarne l’idéal d’une souveraineté
    pleine et entière des États africains.
  media: https://static.mediapart.fr/etmagine/default/files/2026/08/01/article-3.jpg
