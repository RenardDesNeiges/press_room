  summary: Politique migratoire, retour des pesticides, présomption de légitime défense
    des policiers… La droite et le macronisme font tout pour que nul ne constate de
    changement notable entre la fin de la mandature d’Emmanuel Macron et les éventuels
    premiers mois d’une présidence Le Pen, estime le philosophe.
