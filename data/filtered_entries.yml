- title: Por qué es una "buena noticia" el repunte inusual del paro este julio
  summary: "El auge es moderado y está vinculado principalmente al proceso de regularización\
    \ de migrantes, que está aflorando empleo sumergido y que da paso al mercado laboral\
    \ formal y con derechosEspaña supera el récord de 22,5 millones de trabajadores\
    \ gracias a la regularización aunque el paro sube en 19.500 personas \n    \n\
    \            \n    \n        Apuntarse al paro es una mala noticia para la inmensa\
    \ mayoría de las personas, pero no siempre. A veces, es el primer paso de la inclusión\
    \ en el mercado laboral. Este escenario más halagüeño es el protagonista de la\
    \ inusual subida del paro de este julio, en 19.500 personas, moderada y que se\
    \ debe principalmente a la regularización extraordinaria de migrantes, que sobre\
    \ todo está provocando un fuerte crecimiento del empleo en los últimos meses.\
    \ \n    \n        El paro registrado, las personas que se apuntan como desempleadas\
    \ a las oficinas públicas de empleo, ascendió este julio frente a los descensos\
    \ habituales en este mes. “Aunque veamos un aumento, es una buena noticia para\
    \ el país”, ha valorado este martes la ministra de Trabajo y Economía Social,\
    \ Yolanda Díaz. \n    \n    \n            \n\n\n\n\n\n    ¿Cuánto sube o baja\
    \ el paro en cada año?\n    Evolución de la variación del paro registrado entre\
    \ mayo y abril de cada año desde 2001\n    \n    Fuente: Ministerio de Inclusión,\
    \ Seguridad Social y Migraciones\n\n\n\n    \n        Cuando se ahonda en quién\
    \ forma parte de este aumento de 19.500 personas más en paro, se observa que sobresalen\
    \ los trabajadores extranjeros –unos 15.500– y, en especial, aquellos que se incorporan\
    \ por primera vez al mercado de trabajo formal (“colectivo sin empleo anterior”,\
    \ en la estadística oficial), que se sitúan en 11.300. \n    \n    \n        \
    \    \n    \n        Trabajo ha explicado que estos datos están vinculados a la\
    \ regularización extraordinaria masiva de migrantes que está en proceso en estos\
    \ momentos y que, sobre todo, se está traduciendo en un gran auge del crecimiento\
    \ del empleo. \n    \n        Por un lado, la Seguridad Social ha cifrado en unas\
    \ 263.000 personas regularizadas que han pasado a estar trabajando de alta, con\
    \ datos hasta el pasado 30 de julio. Por su parte, Trabajo señala un aumento del\
    \ paro desde abril de alrededor de 18.000 las personas extranjeras extracomunitarias,\
    \ entre las que están los ciudadanos acogidos a la regularización.  \n    \n \
    \   \n            \n\n    \n        En Trabajo, ubican este aumento del paro dentro\
    \ de lo “normal” de la entrada simultánea de miles de personas al mercado laboral\
    \ formal, ha explicado el secretario de Estado de Trabajo. Joaquín Pérez Rey ha\
    \ expresado además su confianza en que en la mayoría de casos será un paso breve\
    \ por el paro registrado antes de formalizar sus primeros contratos laborales,\
    \ como ocurrió en la pasada regularización extraordinaria de mediados de los 2000.\
    \ \n    Está aflorando empleo sumergido y sin derechos \n        El Gobierno y\
    \ los sindicatos mayoritarios, CCOO y UGT, han destacado este martes que el proceso\
    \ de regularización es positivo además porque está aflorando miles de empleos\
    \ que hasta ahora se mantenían en la economía sumergida, en un número difícil\
    \ de determinar, y que afectan en gran medida a las personas migrantes sin papeles.\
    \ \n    \n        “Es otra de las conquistas del proceso de regularización”, ha\
    \ destacado el 'número dos' de Yolanda Díaz, que ha recordado que el empleo informal\
    \ tiene “un fuerte componente de explotación” y va ligado de manera inherente\
    \ a una falta de derechos laborales. \n    \n        Por ello, Joaquín Pérez Rey\
    \ ha destacado de manera positiva que estos ciudadanos estén ejerciendo su nuevo\
    \ derecho a acudir a las oficinas públicas de empleo para poder buscar y encontrar\
    \ empleo a través de los canales legales. \n    \n        El empleo informal no\
    \ es solo una “lacra” para los trabajadores que lo sufren, sino también para las\
    \ arcas del Estado, por la falta de cotización y el pago de impuestos, así como\
    \ por una práctica de competencia desleal a la baja para el resto de empresas.\
    \ \n    \n        Aunque aún hay que esperar a cómo evoluciona el paro y el empleo\
    \ en los próximos meses, el secretario de Estado de la Seguridad Social, Borja\
    \ Suárez, ha recordado que las personas extranjeras han sido claves en la creación\
    \ de empleo en España en los últimos años, algo que ha sido compatible con el\
    \ crecimiento del empleo de la población nacional y con la reducción del paro\
    \ a mínimos desde 2008. \n    \n    \n            \n\n\n\n\n\n    Así ha evolucionado\
    \ el paro registrado en los últimos años\n    Evolución del paro registrado en\
    \ las Oficinas de la Seguridad Social y el número de parados según la Encuesta\
    \ de Población Activa (EPA)\n    \n    Fuente: Ministerio de Inclusión, Seguridad\
    \ Social y Migraciones; INE (EPA)\n\n\n\n    El paro registrado da derecho a ayudas\
    \ para las empresas\n        Además, que los trabajadores se apunten al paro en\
    \ las oficinas públicas de empleo es en muchos casos un trámite administrativo\
    \ previo para que las empresas puedan beneficiarse de ayudas a la contratación.\n\
    \    \n        “Parte de estas personas pueden estar incorporándose a las estadísticas\
    \ de desempleo para acceder a programas de inserción laboral o facilitar su contratación\
    \ mediante incentivos y bonificaciones en las cotizaciones sociales”, ha recordado\
    \ este martes la patronal CEOE. \n    \n        La organización empresarial ha\
    \ valorado que la regularización de trabajadores extranjeros “está contribuyendo\
    \ positivamente al crecimiento de la afiliación” y ha destacado la “capacidad”\
    \ del sector privado “para sostener el empleo pese a la persistencia de desequilibrios\
    \ estructurales”. \n    \n        En cualquier caso, los empresarios han reclamado\
    \ “un entorno regulatorio que refuerce la empleabilidad, favorezca la competitividad\
    \ y el crecimiento de las empresas y permita aprovechar, plenamente, el potencial\
    \ del mercado de trabajo para impulsar una creación de empleo más sólida y sostenible”."
