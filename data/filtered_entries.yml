- title: 'General Motors apuesta por China: alarga 20 años su alianza con SAIC'
  summary: "La compañía estadounidense desafía el veto de Trump con una ampliación\
    \ del acuerdo con la china SAIC hasta 2047 para lanzar modelos en el país asiático\
    \ y exportar vehículos a otros mercados al margen de EEUULos coches chinos inundan\
    \ Europa: guía para no perderse en el mapa de marcas\n        General Motors (GM)\
    \ redobla su apuesta por China saltándose el muro impuesto por Donald Trump en\
    \ EEUU. El fabricante estadounidense ha renovado por otros 20 años, hasta 2047,\
    \ su histórica empresa conjunta con el grupo estatal chino SAIC, un movimiento\
    \ con el que no solo reafirma su compromiso con el mayor mercado mundial del automóvil,\
    \ sino que también convierte al país asiático en un centro estratégico para desarrollar\
    \ y exportar vehículos a mercados internacionales, al margen de Estados Unidos.\n\
    \    \n        El acuerdo supone un claro contraste con la estrategia de veto\
    \ impulsada por la Administración de Donald Trump, que ha blindado el mercado\
    \ estadounidense frente a los vehículos fabricados en China mediante elevados\
    \ aranceles y prepara nuevas restricciones a los fabricantes con tecnología o\
    \ capital chino. En este contexto, GM deja claro que sus futuros modelos desarrollados\
    \ junto a SAIC no tendrán como destino Estados Unidos, sino la propia China y\
    \ regiones como Oriente Medio, África, Sudamérica, México y Asia-Pacífico.\n \
    \   \n        “El acuerdo refleja nuestra confianza compartida en SAIC-GM y en\
    \ su potencial de crecimiento a largo plazo. Estamos comprometidos con un sólido\
    \ desempeño en el mercado chino y vemos importantes oportunidades para competir\
    \ en determinados mercados internacionales”, aseguró John Roth, vicepresidente\
    \ sénior de GM y presidente de GM China.\n    \n        La alianza entre ambas\
    \ compañías nació en 1997 como una empresa conjunta al 50% para fabricar y comercializar\
    \ vehículos de las marcas Buick, Cadillac y Chevrolet en China. En casi tres décadas\
    \ ha producido más de 20 millones de vehículos y llegó a convertir al gigante\
    \ asiático en el principal mercado de General Motors entre 2010 y 2023. La empresa\
    \ conjunta también produce el microcoche eléctrico más vendido en China junto\
    \ al fabricante Wulling.\n    China, laboratorio tecnológico y plataforma mundial\n\
    \        La renovación del acuerdo llega acompañada de un profundo cambio estratégico.\
    \ SAIC-GM dejará de ser únicamente una filial comercial para convertirse en uno\
    \ de los principales centros de desarrollo tecnológico del grupo estadounidense.\n\
    \    \n        La empresa conjunta prevé lanzar al menos 30 vehículos electrificados\
    \ antes de 2030, entre eléctricos puros, híbridos enchufables y modelos de autonomía\
    \ extendida, además de incorporar soluciones de software y conectividad desarrolladas\
    \ específicamente para el mercado chino.\n    \n        Buick será la gran protagonista\
    \ de esta ofensiva con la familia Electra, una gama diseñada íntegramente en China\
    \ sobre la nueva arquitectura Xiao Yao. Su primer modelo, el SUV Electra E7, superó\
    \ las 10.000 unidades vendidas durante su primer mes de comercialización y será\
    \ también el primer vehículo premium desarrollado en China que GM exportará a\
    \ otros mercados a partir de octubre.\n    \n        La compañía centrará además\
    \ su estrategia en China en las marcas Buick y Cadillac, mientras Chevrolet dejará\
    \ de comercializarse en el mercado chino, aunque seguirá fabricándose para la\
    \ exportación a través de la alianza con SAIC y Wuling. Para SAIC, el acuerdo\
    \ también abre posibilidades de expansión son su aliado de EEUU dentro de su estrategia\
    \ internacional, en la que ha decidido poner en marcha un centro de ensamblaje\
    \ para Europa en Ferrol para sus modelos con la marca MG.\n    La respuesta al\
    \ auge de BYD y los fabricantes chinos\n        La renovación de la 'joint venture'\
    \ también refleja la necesidad de GM de adaptarse a un mercado que ha cambiado\
    \ radicalmente en pocos años. El fabricante estadounidense pasó de obtener beneficios\
    \ cercanos a los 2.000 millones de dólares anuales entre 2014 y 2018 a encadenar\
    \ pérdidas en 2024 y 2025 tras verse superado por fabricantes locales como BYD.\n\
    \    \n        Su cuota de mercado en China se ha reducido desde el 14,9% registrado\
    \ en 2015 hasta el 6,8% al cierre del primer semestre de este año. Las ventas\
    \ también ilustran ese deterioro: en 2025 comercializó alrededor de 1,9 millones\
    \ de vehículos, prácticamente la mitad que en el máximo alcanzado en 2017, cuando\
    \ superó los cuatro millones de unidades.\n    \n        El desplome obligó a\
    \ GM a poner en marcha una profunda reestructuración anunciada en 2024, con el\
    \ cierre de plantas, la eliminación de modelos y un impacto financiero superior\
    \ a los 5.000 millones de dólares. Tras ese ajuste, la compañía ha vuelto a registrar\
    \ varios trimestres consecutivos de beneficios en sus operaciones chinas.\n  \
    \  \n        General Motors no está sola en este giro hacia China. Pese a la creciente\
    \ competencia de las marcas locales y al enfriamiento de la economía del país,\
    \ fabricantes como Volkswagen o Honda también han renovado recientemente sus alianzas\
    \ con socios chinos para reforzar su presencia en el mayor mercado automovilístico\
    \ del mundo.\n    \n        La diferencia es que GM aspira ahora a aprovechar\
    \ el ecosistema chino no solo para vender vehículos localmente, sino también como\
    \ fuente de innovación y plataforma de exportación. Una estrategia que, según\
    \ el analista independiente Lei Xing, puede convertirse en un referente para otras\
    \ empresas conjuntas entre fabricantes occidentales y chinos."
