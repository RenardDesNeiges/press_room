- title: Jordania acusa a la FIFA de "chantaje" para forzar el apoyo a la reelección
    de Infantino como presidente
  summary: "El presidente de la Federación jordana de fútbol afirma que se le comunicó\
    \ verbalmente que \"si apoyaba a Infantino, eso contribuiría en gran medida a\
    \ ayudar\" a su organización, lo que considera \"un chantaje\"El futuro de Infantino\
    \ en la FIFA, en peligro: Gales se convierte en la primera federación en retirarle\
    \ su apoyo para la reelección\n\n        El presidente de la Federación Jordana\
    \ de Fútbol, el príncipe Ali bin al-Hussein, ha acusado a la administración de\
    \ Gianni Infantino de “chantaje”, alegando que la FIFA amenazó con retener la\
    \ ayuda económica destinada a su federación si esta se negaba a respaldar la candidatura\
    \ del presidente a la reelección.\n    \n        El príncipe Ali, que se presentó\
    \ a la presidencia de la FIFA contra Infantino en 2016 y quedó en tercer lugar,\
    \ enumeró una serie de problemas que acosan al organismo rector del fútbol mundial\
    \ y aseguró que a los jugadores jordanos aún no se les ha pagado por su participación\
    \ en la Copa Árabe del año pasado. El príncipe Ali es el presidente de la Federación\
    \ de Fútbol de Asia Occidental, que incluye a Estados influyentes como Catar y\
    \ los Emiratos Árabes Unidos, que hasta ahora han respaldado la continuidad de\
    \ Infantino.\n    \n        La intervención de Ali se produjo el mismo día que\
    \ el liderazgo de Infantino sufrió un nuevo revés, con el distanciamiento de dos\
    \ aliados clave para su fallido plan de privatizar el Mundial. Por un lado, se\
    \ desveló un correo electrónico dirigió al personal de la organización en el que\
    \ su número dos, el secretario general de la FIFA, Mattias Grafström, había calificado\
    \ la iniciativa como “una serie de acontecimientos tristes y censurables”. Por\
    \ su parte, el exentrenador del Arsenal, Arsène Wenger, que ahora ocupa el cargo\
    \ de director de desarrollo global de la FIFA, afirmó que la retirada del proyecto\
    \ era «absolutamente necesaria e incuestionable».\n    \n        Infantino está\
    \ perdiendo progresivamente el respaldo de países que habían enviado cartas para\
    \ apoyar su continuidad en el cargo para un cuarto mandato. Se da por hecho que\
    \ Grecia es la última federación en retirar su apoyo, siguiendo el ejemplo de\
    \ países como Inglaterra, Gales, Finlandia y Serbia. Se espera que más federaciones\
    \ europeas sigan sus pasos en los próximos días, mientras que varias naciones\
    \ de la CONCACAF —la confederación de Norteamérica, Centroamérica y el Caribe—\
    \ también están considerando seriamente retirar su apoyo.\n    \n        La declaración\
    \ del príncipe Ali, publicada en X, describía la situación de un pequeño país\
    \ que se enfrentaba a una serie interminable de obstáculos a la hora de recibir\
    \ ayuda del organismo rector mundial. Jordania participó este año en su primer\
    \ Mundial, pero el príncipe explicó que algunos de sus aficionados no habían recibido\
    \ los visados, a pesar de haber comprado entradas, y expresó su indignación por\
    \ tener que pagar impuestos en Estados Unidos por tener su sede en ese país.\n\
    \    \n\n    \n    \n      \n      \"El dinero que nuestro equipo debería recibir\
    \ por haber llegado a la final de la Copa Árabe aún no se ha abonado, mientras\
    \ la FIFA se jacta de los miles de millones que tiene en reserva\"\n         \
    \       \n                        Príncipe Ali\n                             \
    \           — Presidente de la Federación jordana\n                      \n  \
    \        \n\n  \n        “Llevamos esperando desde diciembre el dinero de las\
    \ primas para nuestros jugadores por la Copa Árabe de Catar, que es un evento\
    \ de la FIFA”, reza su comunicado. “El dinero que nuestro equipo debería recibir\
    \ por haber llegado a la final aún no se ha abonado, mientras la FIFA se jacta\
    \ de los miles de millones que tiene en reserva”.\n    \n        “Está claro que\
    \ el problema radica realmente en el liderazgo. Durante meses, la FIFA se ha negado\
    \ a ayudarnos en ninguno de estos ni otros asuntos, hasta que, durante el Mundial,\
    \ se me comunicó verbalmente que, si apoyaba a Infantino, eso contribuiría en\
    \ gran medida a ayudar a nuestra Federación de Fútbol”, apunta el representante\
    \ jordano. “En Jordania nos enorgullecemos de defender los valores éticos. No\
    \ le apoyamos antes y, desde luego, tampoco lo haremos ahora. Pero toda esta situación\
    \ equivale a un chantaje y nos negamos a ceder ante ello”.\n    \n        Se cree\
    \ que otros países han sido sometidos a una presión concertada para que respaldaran\
    \ formalmente a Infantino antes de las elecciones de la FIFA en marzo, aunque\
    \ los detalles de cómo se ejerció dicha presión siguen sin estar claros en esos\
    \ casos.\n    \n        El correo electrónico de Grafström instaba al personal\
    \ de la FIFA a mantener la moral alta tras lo que se percibió como un Mundial\
    \ exitoso. Su mensaje no llegó a criticar explícitamente a Infantino y prometía\
    \ proteger a los compañeros de las disputas que envuelven a su organización. “Una\
    \ serie de acontecimientos tristes y censurables —que, afortunadamente, concluyeron\
    \ con el abandono definitivo del proyecto FFE—, por mucho que nos consternen,\
    \ no deberían eclipsar esta realidad”, se leía en un fragmento del correo electrónico.\n\
    \    \n        Grafström se refirió a “una situación convulsa, difícil de comprender\
    \ y aceptar” y afirmó: “Las personas, los momentos de inestabilidad y los episodios\
    \ desafortunados van y vienen. La institución, su misión y su responsabilidad\
    \ para con el fútbol mundial perduran. Por eso debemos mantener siempre nuestra\
    \ profesionalidad, nuestra perspectiva y nuestra serenidad”.\n    \n        Wenger,\
    \ que asumió su cargo actual en noviembre de 2019, confirmó que había sido uno\
    \ de los muchos altos cargos de la FIFA apartados por el plan de Infantino. “No\
    \ participé en este plan estratégico y me enteré del proyecto por primera vez\
    \ a través de los medios de comunicación”, afirmó. “La decisión de retirar el\
    \ proyecto era absolutamente necesaria e incuestionable, porque creo firmemente\
    \ en una FIFA independiente que sirva a nuestro deporte con compromiso, transparencia\
    \ e integridad”.\n    \n        The Guardian ha contactado con la FIFA para preguntar\
    \ sobre las acusaciones del príncipe Ali.\n    \n        Según las informaciones,\
    \ Infantino ha convocado al personal de la FIFA a una reunión de crisis en la\
    \ capital marroquí, Rabat, este miércoles, en un intento por aferrarse a su cargo."
