- title: 'El alcalde del PP íntimo de Pérez Llorca que vivió a todo trapo el Mundial:
    privilegio en la vacunación Covid, lazos con la Gürtel y una gran deuda municipal'
  summary: "Bernabé Cano, alcalde de La Nucía, acumula una serie de escándalos de\
    \ los que ha salido indemne: aparece en las grabaciones de la trama Gürtel por\
    \ su amistad con 'El Bigotes', acumula proyectos urbanísticos fallidos de dudosa\
    \ reputación y se coló en la vacunación como médico del club de fútbolUn alcalde\
    \ del PP, amigo de Pérez Llorca, viajó en el charter de la Federación al Mundial\
    \ y fue a las semifinales y la final\n\n        Todas las familias felices se\
    \ parecen, pero hay familias que tienen más suerte que otras. Familias a las que\
    \ les va bien en los negocios, en la política, en los deportes a los que son aficionados\
    \ e, incluso, en las campañas de vacunación. Y entre las más afortunadas se encuentra\
    \ la del alcalde de La Nucía, Bernabé Cano, uno de los pesos pesados del PP de\
    \ Alicante, que lleva más de 25 años cosechando mayorías absolutas en su municipio\
    \ y sorteando acusaciones de las que ha salido sin apenas un rasguño. \n    \n\
    \        Amigo íntimo de Juanfran Pérez Llorca, gobierna desde 2001 el municipio\
    \ alicantino de La Nucía, de la misma comarca que Finestrat, donde fue alcalde\
    \ Pérez Llorca. Hijo del primer alcalde democrático del municipio, Camilo Cano,\
    \ y médico de familia de profesión, entró como concejal en 1991 con apenas 25\
    \ años. Se ocupó de la cartera de Urbanismo en 1995, hasta que el conseller de\
    \ Zaplana Diego Such, el alcalde que sucedió a su padre, lo designó sucesor en\
    \ la alcaldía. La proximidad geográfica e ideológica entre La Nucía y Finestrat\
    \ le ha generado una valiosa amistad con el ahora presidente de la Generalitat,\
    \ otro hombre con suerte. Ambos han podido disfrutar a todo trapo de la final\
    \ del Mundial de Fútbol en Estados Unidos y ninguno ha aclarado los detalles de\
    \ su viaje, que en el caso del alcalde todavía se prolongó más: viajó en el charter\
    \ de la Federación el 15 de julio a Dallas a las semifinales, y con la misma comitiva\
    \ se desplazó a Nueva York, según él mismo relató en una entrevista en la radio.\
    \ \n    \n        El PP de La Marina Baixa es ya prácticamente un clan en el partido:\
    \ un grupo de hombres de la misma quinta —nacidos en los setenta o a finales de\
    \ los sesenta— que se están haciendo con el control de la formación en detrimento\
    \ de València. Y eso que Cano, años atrás, militó en las filas de Francisco Camps,\
    \ cuando el control de Alicante lo tenía su enemigo interno, José Joaquín Ripoll.\
    \ Camps lo valoró para plantar cara al zaplanista Joaquín Ripoll en la presidencia\
    \ provincial, aunque al final se decantó por el entonces alcalde de Benidorm,\
    \ Manuel Pérez Fenoll. También sonó para delegado del Consell en Alicante, aunque\
    \ el puesto acabó siendo ocupado por el alcalde de Teulada, José Ciscar, que fue\
    \ diputado autonómico hasta la pasada legislatura.\n    \n        La de Cano es\
    \ una familia con suerte. Su hermana Marián fue nombrada consellera de Turismo\
    \ e Innovación tras la estrepitosa caída de Núria Montes, debido a un desafortunado\
    \ comentario tras la dana, todavía con Carlos Mazón al frente del Consell. Su\
    \ hija Ángela fue nombrada directora general de Análisis y Estudios el pasado\
    \ diciembre, uno de los primeros puestos elegidos por Pérez Llorca, adscrito a\
    \ la conselleria de Presidencia. A su madre, Ángeles, y su tío, Gabriel, unos\
    \ potentes promotores les compraron en 2002 unos terrenos para urbanizar un PAI\
    \ en el municipio, operación cifrada en unos 3 millones de euros. Y a su exconcejal\
    \ de Urbanismo, Miguel Ángel Ivorra, la pieza clave en los PAI, el PP lo nombró\
    \ director general del mismo ramo en 2023, dándole las llaves de los grandes desarrollos\
    \ urbanísticos en la autonomía. \n    \n        'Berna', como se refieren a él\
    \ sus compañeros, es también diputado provincial en la corporación de Alicante,\
    \ responsable de Deportes. Lleva siéndolo desde 2007, aunque dejó la Corporación\
    \ en el mandato del 2011 al 2015, cuando se reincorporó como responsable de las\
    \ obras municipales. Ese año, cuando el PP tuvo que pactar con Ciudadanos el gobierno\
    \ de la Diputación de Alicante, los naranjas pusieron varias reticencias a Cano\
    \ en pos de la 'regeneración' política. Con todo, el entonces presidente, César\
    \ Sánchez (ahora diputado en el Congreso), lo incorporó. \n    \n        ¿Y cuáles\
    \ eran esas dudas sobre un alcalde que ya entonces cosechaba mayorías absolutas?\
    \ Sus vinculaciones con la trama Gürtel -un caso en el que nunca ha sido imputado-\
    \ y los grandes proyectos urbanísticos. Las mismas dudas que frenaron su ascenso\
    \ en el PP tras estallar el caso y limitaron su margen de maniobra a su municipio,\
    \ donde ha sabido sacarle partido. \n    Los lazos con la trama Gürtel\n     \
    \   En la primera década de los 2000, Cano se acercó a los cabecillas y empresarios\
    \ de la trama Gürtel, con negocios comunes. El alcalde de La Nucía labró amistad\
    \ con Álvaro Pérez, 'El Bigotes', quien tenía un chalet en la localidad alicantina\
    \ y cuya mujer presentó las campanadas de 2006 en Canal 9, acto que se emitió\
    \ desde La Nucía. El ayuntamiento realizó varios contratos con empresas vinculadas\
    \ a la trama y señaladas en informes de la UDEF: Altius Levante, la concesionaria\
    \ de la piscina municipal, contrató posteriormente a Orange Market una campaña\
    \ de marketing, y Especial Events, que contrató los premios Luis del Olmo. El\
    \ alcalde de La Nucía, que cosecha mayorías absolutas desde 2001, aparece en las\
    \ transcripciones de las grabaciones de la trama como anfitrión de una fiesta\
    \ con “tías impresionantes”. Fue precisamente el registro municipal de La Nucía\
    \ el canal mediante el que Orange Market presentó su oferta al concurso del expositor\
    \ de la Comunitat Valenciana en Fitur 2006.\n    \n        Entre los negocios,\
    \ se le señaló en conversaciones sobre el PAI Pie de Monte, una operación inmobiliaria\
    \ frustrada entre los cabecillas de la Gürtel y empresarios como José Luis Ulibarri,\
    \ beneficiario de numerosas licencias de TDT. En una grabación de la trama, Correa\
    \ aseguraba tener “un tema gordo en Valencia”, con un PAI prácticamente cerrado\
    \ y mencionaba al alcalde, aunque el negocio no cuajó. Posteriormente, el empresario\
    \ Gerardo Martínez Riquelme compró a través de una mercantil (Inerzia) junto a\
    \ Antonio Rocamora más de la mitad del PAI, desbloqueando la operación. El promotor,\
    \ dueño de uno de los locales que frecuentaban 'El Bigotes' y Francisco Correa,\
    \ vendió por medio millón de euros dos pisos en Altea al alcalde de La Nucía,\
    \ según publicó El Mundo. Según publicó el diario Levante en 2009, los empresarios\
    \ Martínez Riquelme y Rocamora urbanizaron diez parcelas a nombre de la madre\
    \ y el tío del alcalde Cano, a través de la empresa Saga Bonperal. Estos empresarios\
    \ compraron parte de otro PAI en La Nucía, el de La Serreta, que posteriormente\
    \ vendieron con grandes ganancias, según el mismo medio. Ninguno de los dos proyectos\
    \ llegó a desarrollarse. La Generalitat Valenciana, aplicando una sentencia del\
    \ Tribunal Supremo, anuló el plan urbanístico ligado a la Gürtel y el urbanizador\
    \ de La Serreta quebró.\n    \n        En 2024 el alcalde y todo su equipo de\
    \ gobierno fueron denunciados por la organización ecologista Agró por el desarrollo\
    \ de este proyecto. Según Acció Ecologista-Agró, en marzo de 2021 la Junta de\
    \ Gobierno Local del Ayuntamiento de La Nucía aprobó definitivamente el Plan de\
    \ Actuación Integrada en la Unidad de Ejecución 1 (PAI de la UE-1) del Sector\
    \ 'La Serreta' y las obras se iniciaron “sin cumplir los condicionantes establecidos\
    \ en la Declaración de Impacto Ambiental”. Es el PAI más grande del País Valenciano\
    \ en desarrollo. \n    \n        \n                                          \
    \  \n\n\n\n\n\n\n    \n                                    \n                \
    \                                                                            \
