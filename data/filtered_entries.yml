- title: La Reserva Federal autoriza la compra de Webster Bank por parte de Banco
    Santander
  summary: "La previsión de Santander es que la adquisición se cierre el próximo 20\
    \ de agosto; hasta entonces, la entidad que preside Ana Botín y Webster seguirán\
    \ operando de forma independienteLa venta de la filial de Polonia eleva un 31,3%\
    \ el beneficio del Santander, que gana 8.973 millones hasta junio\n        La\
    \ Reserva Federal de Estados Unidos (EEUU) ha notificado a Banco Santander su\
    \ visto bueno para seguir adelante con la adquisición de Webster Financial, según\
    \ ha indicado la compañía en un comunicado este miércoles.\n    \n        La operación\
    \ fue aprobada a finales de mayo por los accionistas de Webster y también recibió\
    \ el visto bueno de la Oficina del Controlador de la Moneda el 12 de junio, así\
    \ como la del Banco Central Europeo el 21 de julio.\n    \n        La previsión\
    \ de Santander es que la adquisición se cierre el próximo 20 de agosto. Hasta\
    \ entonces, Santander y Webster seguirán operando de forma independiente.\n  \
    \  \n        La operación previsiblemente reforzará el negocio de Santander en\
    \ EEUU y acelerará el cumplimiento de sus objetivos financieros. Una vez completada\
    \ la integración, Santander prevé que ese mercado alcance un retorno sobre el\
    \ capital tangible (ROTE) de alrededor del 18% en 2028.\n    \n        Asimismo,\
    \ se estima que la operación genere un incremento del beneficio por acción de\
    \ en torno al 7% u 8%, así como un retorno sobre el capital invertido cercano\
    \ al 15%, también para 2028.\n    \n        Cuando se complete la operación, la\
    \ mayor parte de los negocios de Webster pasarán a integrarse en Santander Bank,\
    \ la entidad bancaria de Santander en Estados Unidos. Hasta el cierre, Santander\
    \ y Webster seguirán operando de forma independiente.\n    \n        La presidenta\
    \ de Santander, Ana Botín, ha declarado que “Santander US y Webster encajan a\
    \ la perfección”.\n    \n        “Juntos, con el apoyo de las plataformas globales,\
    \ la tecnología y la experiencia de Santander, crearemos un banco más sólido y\
    \ con la escala necesaria para ofrecer un mejor servicio a nuestros clientes y\
    \ a las comunidades en las que operamos”, ha añadido, señalando que esta combinación\
    \ “reforzará su posición en uno de los mercados bancarios más atractivos del mundo\
    \ y les sitúa en una posición privilegiada para construir uno de los bancos con\
    \ mejores resultados entre sus competidores en EEUU.\n    \n        Por su parte,\
    \ la consejera delegada y directora general de Santander Holdings USA, Christiana\
    \ Riley, ha afirmado que les alegra estar “un paso más cerca de completar esta\
    \ importante adquisición estratégica, que completará su modelo de negocio en EEUU”.\
    \ “La integración de dos negocios tan complementarios permitirá a Santander ofrecer\
    \ un mejor servicio a clientes particulares y empresas, y contribuirá al desarrollo\
    \ de las comunidades locales”, ha asegurado.\n    \n        El presidente y consejero\
    \ delegado of Webster, John Ciulla, ha expresado que este es un hito “muy importante\
    \ que les permitirá unir muy pronto a las dos organizaciones en beneficio de sus\
    \ clientes y de las comunidades en las que operan”. “La mayor escala, las mejores\
    \ capacidades y la solidez financiera de Santander nos ayudarán a estrechar nuestras\
    \ relaciones con las comunidades locales y a mejorar la confianza que los clientes\
    \ de Webster han depositado en nosotros”, ha concluido."
