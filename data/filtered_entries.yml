- title: 'El monstruo que se comió el sol: por qué culturas de todo el mundo inventaron
    el mismo mito sobre el eclipse'
  summary: "Bestias zooformes que engullen estrellas, jaguares hambrientos o la cabeza\
    \ decapitada de un demonio que persigue al gran astro representaron el fenómeno\
    \ astronómicoMAPA | Dónde ver el eclipse solar del 12 de agosto: recorrido y visibilidad\
    \ en cada municipio, minuto a minuto\n        Los días en que la luz desaparecía,\
    \ la humanidad se defendía a pedradas. Durante milenios, cuando la luz se apagaba\
    \ de manera inesperada, la respuesta colectiva era el ataque. Era pura supervivencia.\
    \ Si la fuente de vida era ahora una curva oscura, la mente primitiva no veía\
    \ un fenómeno astronómico, sino que imaginaba unas fauces invisibles devorando\
    \ el sol y, ante este fenómeno, se debía obligar al firmamento a escupirlo.\n\
    \    \n        El mito del mordisco al sol es una constante en la historia de\
    \ las civilizaciones antiguas. De él habla Moncho Núñez, divulgador científico\
    \ y primer director de los Museos Científicos Coruñeses, en su libro Eclipses,\
    \ donde analiza cómo la fantasía popular necesitaba inventar un culpable y una\
    \ solución a la desaparición repentina del sol: “La gente necesitaba atribuir\
    \ aquello a un animal gigante al que hacer responsable. Eso generaba un ritual\
    \ que consistía en hacer ruido, sonar tambores o el gong, o lanzar piedras y flechas\
    \ al aire para espantar a la criatura. Y como al rato el rito funcionaba y el\
    \ sol volvía, todos quedaban felices”.\n    \n        De hecho, da igual el rincón\
    \ del mapa que se examine, la necesidad de certidumbres dio pie a relatos casi\
    \ idénticos. Para los vikingos, la culpa era de dos lobos gigantescos empeñados\
    \ en engullir la luz. En México, los aztecas temían que el jaguar de la noche\
    \ mordiera el sol hasta provocar un apagón permanente que haría bajar a las fieras\
    \ para exterminar a los hombres. En China, la bestia era un perro celestial al\
    \ que la población intentaba ahuyentar a flechazos.\n    \n        \n        \
    \                                    \n\n\n\n\n\n\n    \n                    \
    \                \n                                                          \
    \                                                                            \
    \  \n                                                    \n                  \
    \                              \n                                            \
    \                                                                            \n\
    \                                                    \n                      \
    \                          \n                                                \
    \                    \n                                                    \n\
    \                                                \n                          \
    \          \n                \n\n                \n\n            \n          \
    \  \n\n            \n            \n                            \n            \n\
    \                Tepeyóllotl descrito en el Códice Borgia                    \
    \        \n                                    \n            \n              \
    \  \n        En India, el menú venía acompañado de una historia más sangrienta.\
    \ La leyenda contaba que la cabeza decapitada de un demonio perseguía el sol y\
    \ lo engullía entero. Pero al carecer de cuerpo, la estrella terminaba escapando\
    \ victoriosa, deslizándose de nuevo hacia el firmamento a través del corte de\
    \ su cuello. Historias en puntos geográficos distantes compartían una misma lógica:\
    \ la desaparición paulatina del sol se interpretaba como el bocado progresivo\
    \ de una fiera hambrienta. \n    \n        Según los expertos la respuesta de\
    \ esta coincidencia narrativa para explicar este fenómeno entre culturas reside\
    \ en la arquitectura del cerebro humano. La investigadora Candela Antón, divulgadora\
    \ en antropología cognitiva y evolutiva, señala que ante un evento que rompe la\
    \ realidad, la psique busca el atajo de las metáforas más primarias que acerquen\
    \ la experiencia sublime a una realidad fácilmente comprensible: “Primeramente\
    \ sentimos miedo. Nuestro cerebro tiene un sesgo muy claro hacia lo que rompe\
    \ los patrones esperables”. Para la mente, la súbita pérdida del sol quiebra la\
    \ “estructura misma de la vida”.\n    \n        Para explicar esta catarsis perceptiva\
    \ del momento en que el sol desaparece de la vista, Antón recurre al concepto\
    \ antropológico de la 'liminalidad' del instante en que el día deja de ser día\
    \ sin llegar a ser la noche: “Es la locura de que el tiempo se quede en un limbo”.\
    \ \n    \n        Y frente a esa catarsis, se construye una respuesta, para la\
    \ divulgadora, acerca de si el mito de comer el sol se repite entre culturas es\
    \ porque responde a una vivencia física elemental: “Si algo es culturalmente consistente\
    \ es porque responde a una experiencia tangible mediada por la percepción de nuestro\
    \ propio cuerpo como las bocas y los dientes”. Imaginar que el motivo de la penumbra\
    \ es el resultado de una bestia hincando el diente se convierte así en una respuesta\
    \ intuitiva ante la forma circular y paulatina en que el sol va desapareciendo,\
    \ lo que puede representar, cuando desaparece del todo, que finalmente ha sido\
    \ engullido.\n    \n        Este cúmulo de historias coincidentes sobrevivió incluso\
    \ cuando la ciencia comenzó a abrirse paso. Paradójicamente, la astronomía técnica\
    \ convivió durante siglos con la superstición popular y la metáfora del sol aún\
    \ mantenía su fuerza. El profesor de investigación en el Instituto de Astrofísica\
    \ de Canarias (IAC), Juan Antonio Belmonte, recuerda cómo esa dualidad se experimentaba\
    \ en Oriente: “En la tradición hindú, el mito contaba que el demonio se comía\
    \ el sol, pero teniendo ya contacto con los grecorromanos, había astrónomos indios\
    \ que sabían de los eclipses y contradecían el mito calculando con precisión el\
    \ fenómeno”.\n    \n        \n                                            \n\n\
    \n\n\n\n\n    \n                                    \n                       \
    \                                                                            \
    \                                     \n                                     \
    \               \n                                                \n         \
    \                                                                            \
    \                                   \n                                       \
    \             \n                                                \n           \
    \                                                         \n                 \
    \                                   \n                                       \
    \         \n                                    \n                \n\n       \
    \         \n\n            \n            \n\n            \n            \n     \
    \                       \n            \n                El perro celestial Tiāngǒu,\
    \                            \n                                    \n        \
    \    \n                \n        Aunque la astronomía avanzaba, el pánico popular\
    \ a ser engullidos por las sombras también fue una herramienta de dominación.\
    \ Belmonte apunta que en civilizaciones como la Mesopotamia babilónica (VIII y\
    \ VI a. C.) o la China imperial de la dinastía Shang (siglos XVII a. C. al XI\
    \ a. C.), el control del calendario y la predicción de los eclipses eran tan cruciales\
    \ que a los astrónomos reales “les iba la vida en ello” y podían ser ejecutados\
    \ si fallaban. El miedo a las fauces celestes mantenía a la población subordinada\
    \ a quienes aseguraban entender los ritmos del cosmos.\n    \n        El miedo\
    \ a que el sol fuera engullido solo empezó a disiparse cuando la ciencia fue capaz\
    \ de cartografiar la sombra antes de que sucediera. Núñez sitúa el punto de inflexión\
    \ definitivo en 1715, cuando el astrónomo Edmond Halley trazó el mapa del eclipse\
    \ para medir el tiempo exacto de la penumbra. Como recuerda el divulgador, “la\
    \ racionalidad terminó por imponerse cuando Edmond Halley trazó el mapa del eclipse\
    \ antes de que sucediera y le pidió a la gente que colaborara con él”.\n    \n\
    \        Al comprobarse que la matemática predecía con precisión el instante exacto\
    \ en que la luz regresaba, las bestias zooformes que engullían estrellas y demás\
    \ mitos bizarros perdieron su razón de ser. El viejo terror a la mordedura del\
    \ sol dio paso a la simple mecánica del cosmos, demostrando que la criatura que\
    \ lo devoraba no habitaba en las estrellas, sino en las profundidades del cerebro\
    \ humano."
