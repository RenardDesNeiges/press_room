- title: España envió por primera vez más paquetes que cartas en 2025
  summary: "El informe anual del sector postal de Competencia (CNMC) recoge que solo\
    \ un 14% de ciudadanos mandó cartas, mientras que un 60% dice haber recibido al\
    \ menos una compra 'online'Correos se reinventa ante una sociedad que ya no envía\
    \ cartas: “Nos transformamos o morimos”\n\n        En 2025, por primera vez se\
    \ enviaron más paquetes que cartas en España, según se desprende del Informe Anual\
    \ del Sector Postal 2025 de la Comisión Nacional de los Mercados y la Competencia\
    \ (CNMC).\n    \n        Durante el pasado año, se enviaron 1.335 millones de\
    \ paquetes en España, un 10% más que en 2024 y un 148% más que en 2019, mientras\
    \ que los envíos tradicionales (cartas, tarjetas postales, notificaciones administrativas,\
    \ publicidad directa) descendieron un 8%, hasta los 1.164 millones –la mitad que\
    \ en 2019 y la tercera parte de los de 2015–.\n    \n        La paquetería obtuvo\
    \ 7.325 millones de ingresos, un 10% más que en 2024 (+86% respecto a 2019), frente\
    \ a los 1.146 millones del sector postal tradicional, un 3% más con respecto al\
    \ año anterior, pero un 17% menos respecto a 2019.\n    Las entidades públicas\
    \ mandaron el 30% de las cartas enviadas\n        Dos de cada tres envíos de mensajería\
    \ y paquetería fueron paquetes de poco peso (hasta dos kilogramos), y casi ocho\
    \ de cada diez envíos tradicionales fueron cartas ordinarias o tarjetas postales.\
    \ Las Administraciones Públicas realizaron el 30% del total de los envíos postales\
    \ tradicionales.\n    \n        En este contexto, Correos presentó una cuota del\
    \ 84% en el sector postal tradicional y del 16% en paquetería. Las compañías inscritas\
    \ en el registro de operadores postales pasaron de 1.765 a 4.565 en los últimos\
    \ diez años impulsados por la paquetería del comercio electrónico.\n    \n   \
    \     Según el Panel de hogares de la CNMC (oleada del segundo semestre de 2025),\
    \ solo el 14% de los ciudadanos envió cartas, el 43% las recibió de empresas o\
    \ suministradores, y el 43% recibió notificaciones administrativas. El 38% visitó\
    \ al menos una vez una oficina postal en los últimos seis meses, apenas tres puntos\
    \ porcentuales menos que hace diez años, mayoritariamente para enviar o recoger\
    \ paquetes.\n    Un 60% de ciudadanos ha recibido alguna compra online\n     \
    \   No obstante, solo el 10% recibió paquetes no vinculados al comercio electrónico\
    \ (hace diez diez años era el 17 %), y el 61,2% recibió al menos un envío derivado\
    \ de una compra online (hace diez años era el 29%). De estos, el 35% devolvió\
    \ alguna compra (logística inversa) y el 16% tuvo alguna incidencia en la entrega\
    \ de su último paquete.\n    \n        La gran mayoría de los paquetes se entregó\
    \ en el domicilio del destinatario (86%), seguido de los puntos de conveniencia\
    \ (9%) y las taquillas autoservicio (3%). Estas infraestructuras de logística\
    \ de última milla van en aumento."
