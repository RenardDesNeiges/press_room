- title: Un guardia civil asesina a su expareja, también agente y registrada en VioGén,
    en el cuartel de Llanes
  summary: "El agresor, que estaba divorciado de la víctima con la que tenía tres\
    \ hijos, ha fallecido a causa de las heridas sufridas en un cruce de disparos\
    \ con varios compañeros que intentaron auxiliar a su exmujer. Recientemente recibió\
    \ una resolución de separación del servicio y no disponía de arma reglamentaria.\
    \ Delegación del Gobierno, Principado de Asturias y Ayuntamiento de Llanes convocan\
    \ una concentración de repulsa mañana, a las 18.30 horas, ante el consistorio\
    \ llaniscoLa Guardia Civil de Asturias detiene a un hombre que hirió a otro al\
    \ dispararle con un arma desde una ventana\n        La agente de la Guardia Civil\
    \ de Llanes, Laura C.V., de 50 años y natural de Madrid, ha sido asesinada por\
    \ su expareja, un agente de 49 años y origen gallego, quien ha irrumpido armado\
    \ en dependencias policiales y, tras acercarse a ella, le ha disparado. Agresor\
    \ y víctima estaban divorciados y tenían tres hijos en común: un chico de 18 años\
    \ y dos gemelas de 14 años. El exmarido ha fallecido mientras era atendido por\
    \ los servicios sanitarios.\n    \n        La Delegación del Gobierno, el Principado\
    \ de Asturias y el Ayuntamiento de Llanes han convocado conjuntamente una concentración\
    \ de repulsa ante este crimen, que califican ya como asesinato machista, para\
    \ mañana, día 6, a las 18.30 horas, ante el consistorio llanisco.\n    Registrada\
    \ en VioGén\n        Laura C.V. estaba registrada en el sistema VioGén. Fuentes\
    \ cercanas a la investigación han asegurado que había interpuesto denuncias por\
    \ malos tratos contra su exmarido quien tenía vigente una orden de alejamiento.\
    \ Por esa razón estaba destinado actualmente a la Comandancia de Zamora.\n   \
    \ \n        Al parecer, hace unos días recibió una resolución de separación del\
    \ servicio, por lo que no tenía arma reglamentaria. La investigación tratará de\
    \ determinar ahora cómo consiguió el arma utilizada para matar a su exmujer.\n\
    \    \n        \n                                            \n\n\n\n\n\n\n  \
    \  \n                                    \n                                  \
    \                                                                            \
    \                          \n                                                \
    \    \n                                                \n                    \
    \                                                                            \
    \                        \n                                                  \
    \  \n                                                \n                      \
    \                                              \n                            \
    \                        \n                                                \n\
    \                                    \n                \n\n                \n\n\
    \            \n            \n\n            \n            \n                  \
    \          \n            \n                Vista del cuartel de la Guardia Civil\
    \ de Llanes donde este miércoles un agente ha matado a tiros a su exmujer, Laura\
    \ C.V.                            \n                                    \n   \
    \         \n                La agresión\n        Los hechos ocurrieron poco antes\
    \ de las 13.30 horas de hoy. El agente entró armado al cuartel y, tras disparar\
    \ contra su exmujer, intentó escapar.\n    \n        En su huida “abrió fuego\
    \ contra otros efectivos que se encontraban en las dependencias oficiales, quienes\
    \ pudieron repeler la agresión”, según ha explicado un portavoz de la Guardia\
    \ Civil de la Zona/Comandancia de Asturias.\n    Disparó a otros agentes\n   \
    \     Un teniente intentó auxiliar a la víctima y salió en persecución del agresor.\
    \ En el cruce de disparos ambos resultaron heridos.\n    \n        El agresor\
    \ murió, poco después, cuando era atendido por los servicios sanitarios, según\
    \ ha confirmado a elDiario.es Asturias el portavoz de la Guardia Civil.\n    \n\
    \        \n                                            \n\n\n\n\n\n\n    \n  \
