editorial: 'L''ingérence russe s''impose comme le fil rouge de cette journée politique
  française, ciblant désormais les principaux prétendants à l''Élysée : après Raphaël
  Glucksmann, c''est Gabriel Attal qui est visé par de faux reportages usurpant l''identité
  de médias, affirmant notamment qu''il présenterait des signes de la maladie de Parkinson.
  Le président de Renaissance a réagi en dénonçant ces «occupations illégales» des
  gens du voyage en Vendée, tandis que Glucksmann appelle les autorités à ne pas avoir
  «la main qui tremble» face à TikTok et X, plateformes sur lesquelles prospèrent
  ces campagnes de désinformation. Cette offensive numérique s''accompagne d''une
  bataille judiciaire : Eric Ciotti, nouveau maire de Nice, veut se porter partie
  civile dans l''affaire de la tête de cochon, dénonçant un possible scandale d''État.
  Dans le même temps, la question des suicides à Matignon refait surface, les services
  du Premier ministre donnant leur version des faits après les révélations de France
  Inter.


  La Suisse est dominée par la figure de Christoph Blocher, qui mène à 86 ans sa «dernière
  croisade» pour l''initiative sur la neutralité, soumise au vote le 27 septembre,
  tandis que sa fille Magdalena Martullo-Blocher s''apprête à reprendre le flambeau
  contre les bilatérales III. Le conseiller fédéral Albert Rösti, lui, assume difficilement
  les coupes dans l''adaptation des forêts face au changement climatique, tout en
  préparant une nouvelle loi CO₂ et une stratégie nationale pour l''eau. Armasuisse
  confirme que la neutralité n''interdit pas l''achat d''armes à l''Ukraine, alors
  que le chef de l''armement s''est récemment rendu en Israël.


  Aux États-Unis, les «comptes Trump» d''épargne-action séduisent déjà sept millions
  d''enfants, une initiative qui pourrait atténuer les appels à la taxe sur la fortune.
  Les républicains espèrent surprendre aux élections de mi-mandat, tandis que les
  victoires socialistes à New York sont minimisées par les démocrates centristes.
  Le débat sur la prospérité comparée entre Américains et Européens est relancé par
  une étude contredisant le récit dominant.


  Sur le plan géopolitique, les discussions de Rome entre Liban et Israël butent sur
  le désarmement du Hezbollah, tandis que l''attentat de Berlin pourrait révéler un
  tournant sahélien du djihad européen. L''enquête OSINT sur la ruée vers Ceuta met
  en lumière le rôle des réseaux sociaux dans l''organisation de la migration massive.
  DeepSeek, avec son modèle V4-Flash cent fois moins cher que Claude Fable 5, confirme
  la stratégie chinoise de l''IA à bas coût, tandis que Yanis Varoufakis développe
  le concept de «technoféodalisme» pour qualifier le pouvoir excessif des géants de
  la tech. Elon Musk, lui, continue d''intervenir directement pour réactiver des comptes
  d''extrême droite français suspendus sur X, posant la question d''une éditorialisation
  de la plateforme.'
