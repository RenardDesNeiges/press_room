editorial: "**Titre : L’extrême droite à l’assaut, la gauche doit répondre**\n\n**Chapeau\
  \ :**  \nCe 5 août 2026, l’actualité dessine une offensive coordonnée des forces\
  \ réactionnaires, des réseaux sociaux aux institutions, tandis que les résistances\
  \ s’organisent. Entre normalisation des idées extrêmes et fragilisation démocratique,\
  \ le camp progressiste ne peut plus se contenter de subir.\n\n**Cœur de l’édito\
  \ :**  \nEn France, l’analyse de Michel Feher tombe comme un pavé dans la mare :\
  \ l’« arc républicain » n’est plus qu’un marchepied pour Marine Le Pen. La droite\
  \ et le macronisme, en adoptant ses thèmes – immigration, sécurité, pesticides –,\
  \ préparent l’opinion à une alternance sans rupture. Pendant ce temps, Raphaël Glucksmann,\
  \ cible d’une campagne de désinformation, réclame une main ferme contre TikTok et\
  \ X. Mais ces plateformes, dirigées par des milliardaires comme Elon Musk, ne sont\
  \ pas de simples vecteurs : elles deviennent des outils politiques assumés. Musk,\
  \ interpellé par une militante identitaire, réactive des comptes d’extrême droite\
  \ français. La techno-liberté n’est qu’un alibi pour une éditorialisation réactionnaire.\n\
  \nEn Suisse, la même lame de fond se dessine. Christoph Blocher, à 86 ans, mène\
  \ sa dernière croisade pour une neutralité stricte, tandis que des saluts nazis\
  \ se multiplient dans un musée de la Résistance. L’UDC prospère sur les peurs, et\
  \ le Conseil fédéral, englué dans ses compromis, laisse faire. Pendant ce temps,\
  \ la polémique sur l’achat d’armes à l’Ukraine révèle les contradictions d’une neutralité\
  \ à géométrie variable – on peut s’approvisionner en Israël, mais pas à Kiev. La\
  \ géopolitique sert toujours les intérêts dominants.\n\nAux États-Unis, Trump peut\
  \ encore gagner les midterms, selon les analyses. Les sondages erronés et les divisions\
  \ démocrates offrent un boulevard au trumpisme. Et pendant que l’IA chinoise DeepSeek\
  \ casse les prix avec son modèle à bas coût, les géants américains imposent leur\
  \ loi, accentuant les inégalités technologiques et économiques.\n\nFace à ce rouleau\
  \ compresseur, des résistances émergent. Les révélations sur les suicides à Matignon\
  \ rappellent la souffrance au travail, y compris au sommet de l’État. Les initiatives\
  \ locales, comme le Jardin Robinson au Lignon ou les pompiers du rail à Olten, montrent\
  \ que la solidarité et le service public restent des remparts. Mais ces contre-feux\
  \ sont dispersés et manquent d’un projet politique unifié.\n\n**Regard prospectif\
  \ :**  \nLes prochains mois seront décisifs : élections françaises de 2027, votation\
  \ suisse sur la neutralité, midterms américains. La gauche doit cesser de courir\
  \ après les thèmes de l’extrême droite et proposer une alternative claire : défense\
  \ des services publics, justice sociale, régulation des plateformes, refus de l’austérité.\
  \ L’heure n’est plus à la modération, mais à la mobilisation.\n\n**Conclusion :**\
  \  \nSi la nuit semble s’épaissir, chaque acte de résistance, chaque collectif qui\
  \ s’organise, chaque voix qui refuse la normalisation du pire est une brèche dans\
  \ le mur. La gauche n’a pas le droit de se résigner."
