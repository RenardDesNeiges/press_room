- title: Le tunnel routier du Gothard sera fermé durant douze nuits
  summary: 'Du 10 au 27 août, le trajet routier vers le Tessin devra s’effectuer par
    le col du Gothard durant 10 nuits, pour des travaux d''«entretien préventif»Les
    automobilistes souhaitant se rendre au Tessin vont devoir passer par le col du
    Gothard à certaines heures ces prochains jours. Le tunnel routier du Gothard sera
    en effet fermé durant douze nuits, du 10 au 27 août.L’ouvrage restera clos entre
    23h et 5h du lundi soir au vendredi matin, indique mercredi l’Office fédéral des
    routes (Ofrou). Du vendredi soir au lundi matin, les voitures pourront circuler
    dans le tunnel.

    Lire aussi: Environ 14 km de bouchon au Gothard, pendant que les régions proches
    disent leur énervement


    Rénover la voûte intermédiaire

    Cette fermeture doit permettre de procéder à des travaux d''«entretien préventif»,
    explique l’Ofrou. Ils concernent la voûte intermédiaire. Des découpes seront effectuées
    à titre préventif pour soulager ces éléments de construction et réduire ainsi
    le risque de dommages.Les tensions sur la voûte intermédiaire seront surveillées
    en continu. En 2023, une fissure s’était formée près du portail nord, provoquant
    l’éclatement de débris. En cause, des changements de tension dans la montagne,
    qui auraient entraîné des modifications locales de la pression et sollicité le
    tunnel dans le tronçon concerné.'
