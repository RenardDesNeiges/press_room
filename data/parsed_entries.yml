- title: 'Caserne, train d’extinction et déluge d’eau: à Olten, les pompiers du rail
    offrent un aperçu de leur quotidien'
  summary: 'Le service du feu des CFF fête les 20 ans de sa professionnalisation et
    procédait à un exercice à la caserne d’Olten, à Soleure. 340 collaborateurs se
    répartissent sur 15 sites à travers la Suisse, avec une centrale située à BerneLe
    service d’intervention des pompiers CFF est en alerte. De la fumée s’échappe d’un
    wagon de S-Bahn de la ZVV. Il a dérayé et penche dangereusement sur la droite.
    Une voiture d’intervention rouge pétant débarque à vive allure, gyrophare bleu
    sur le toit. Des secouristes ferroviaires, casques jaune fluo et combinaison réfléchissante
    sur le dos, s’activent, dressent un plan du sinistre, jaugent de sa gravité. Puis
    débarque un véhicule de première intervention (VPI) avec tout une batterie de
    matériel pour diverses situations: une lance incendie apponté à un réservoir de
    400 litres d’eau, des équipements de mise à la terre pour mettre hors tension
    la ligne de contact, un pont d’évacuation, un système de ventilation, des appareils
    respiratoires, une échelle, de l’éclairage, du matériel médical.Un bruit sourd
    de locomotive se fait entendre. C’est au tour de l’artillerie lourde d’intervenir.
    Un TES, ou train d’extinction et de sauvetage, se place derrière le wagon en difficulté
    et prend le relais avec ses 48 000 litres de réservoir. Après le VPI, le déluge.
    Ce mercredi, c’est matinée d’exercice pour le service du feu de l’ex-régie fédérale.
    Chaque année, les quelque 340 employés de cette organisation professionnelle effectuent
    environ 10 500 interventions de la sorte sur tout le territoire. Ce service, sur
    le pont 24h sur 24 et 7 jours sur 7, fête les 20 ans de sa professionnalisation
    et livre quelques-uns de ses secrets sur son site d’Olten.Voir plus'
