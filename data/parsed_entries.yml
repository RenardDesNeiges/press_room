- title: Les Blocher, d’un combat contre l’Europe à l’autre
  summary: 'Trente ans après le refus historique de l’EEE mené par Christoph Blocher,
    sa fille Magdalena Martullo-Blocher s’apprête à mener la charge contre les bilatérales III.
    Rencontre dans leur fief d’Herrliberg, où ils ont accepté de raconter cette histoire
    de transmission, où la réussite économique a précédé le relais politique. Et où
    l’indépendance de la Suisse s’est imposée comme un dogme familialA Noël, le soir
    du 24 décembre, il est interdit de parler politique à la table des Blocher. Cette
    règle d’or absolue, c’est Silvia Blocher qui l’a imposée, lassée de voir le ton
    monter. Car quand son mari Christoph Blocher et leur fille Magdalena Martullo-Blocher
    empoignent un sujet d’actualité, ils finissent toujours par s’emporter et l’émotion
    déborde immanquablement. Cette anecdote pourrait sembler triviale, si elle ne
    touchait pas l’une des dynasties les plus marquantes et les plus polarisantes
    de l’histoire suisse récente. Elle permet aussi de raconter cette histoire rare
    de succession qui fut économique avant d’être politique.L’aînée des quatre enfants
    n’a en effet pas seulement repris avec succès les rênes de l’empire familial d’EMS-Chemie,
    dont elle est aujourd’hui la directrice générale et actionnaire majoritaire. Depuis
    2015, elle poursuit également l’engagement de son père dans la Berne fédérale,
    où elle siège comme conseillère nationale, sous la bannière de l’UDC des Grisons.
    Un parti dont elle est vice-présidente suisse. Plus de trente ans après le combat
    victorieux de son père contre l’Espace économique européen (EEE), Magdalena Martullo-Blocher
    s’apprête une fois de plus à reprendre le flambeau. Ce sera contre les bilatérales
    III, avec toujours le même mantra familial: la force de la Suisse réside dans
    son indépendance.Voir plus'
