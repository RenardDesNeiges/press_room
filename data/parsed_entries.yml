- title: Je suis plus raciste que toi
  summary: 'Si le modèle politique de Vox est celui impulsé par Trump, basé sur des
    expulsions massives, des perquisitions et une exhibition constante de la force
    face à l''immigration irrégulière, jusqu''où serait-il prêt à suivre le PP pour
    conserver une majorité parlementaire ?


    Il y a des images qui témoignent d''une crise. Il y en a d''autres qui témoignent
    d''une époque. Les images de milliers de personnes tentant d''atteindre Ceuta
    parlent, bien sûr, du échec du modèle migratoire européen. Mais, au-delà de cela,
    elles révèlent une autre réalité : la compétition politique, en Espagne et dans
    l''Union européenne (UE), pour prouver qui est le plus dur avec ceux qui tentent
    de franchir leurs limites territoriales. La discussion ne tourne plus uniquement
    autour de la façon de gérer l''arrivée de personnes. Elle tourne, avant tout,
    autour de qui promet le plus d''expulsions.


    Ce n''est pas une exception. L''externalisation du contrôle des frontières a transformé
    les pays tiers en gardiens du périmètre sud. En échange de financement, de coopération
    ou de soutien diplomatique, des États comme le Maroc ou la Turquie contiennent
    les flux migratoires. C''est l''une des grandes faiblesses du modèle européen
    : celui qui contrôle ce robinet dispose d''une puissante arme de pression géopolitique.
    Cela s''est produit sur le fleuve Evros, lorsque la Turquie a poussé des milliers
    de personnes vers la Grèce en 2020 pour pressionner Bruxelles. Cela s''est à nouveau
    produit en 2021, lorsque le régime d''Alexandre Loukachenko a facilité l''arrivée
    de citoyens du Proche-Orient et les a dirigés vers la Pologne, la Lituanie et
    la Lettonie, faisant partie d''une stratégie de guerre hybride. Le même année,
    le Maroc a permis l''entrée de 10 000 personnes pour punir l''Espagne après l''accueil
    hospitalier du chef du Front Polisario, Brahim Ghali. Le Parlement européen a
    alors condamné l''utilisation des êtres humains comme arme de pression politique.


    Ainsi, les personnes cessent d''être des sujets de droits pour devenir de l''artillerie
    humaine, des pièces d''échecs de la négociation entre États. Elles passent ensuite
    à un second rôle : celui de ressource électorale. Le scénario se répète à Lampedusa,
    en Grèce, en Pologne ou à Ceuta. D''abord, les images ; ensuite, les rumeurs ;
    enfin, les promesses de dureté.


    Les événements de ces jours illustrent clairement cette dynamique. Jordan Bardella
    a accusé Sanchez d''avoir "ouvert les portes de l''Europe". Meloni a relevé le
    ton jusqu''à proposer la suspension de Schengen concernant l''Espagne, et la Finlande
    a soutenu cette position, malgré le fait que Ceuta ne fait pas partie de cet espace
    de libre circulation. En Allemagne, la pression de AfD pousse à nouveau le débat
    migratoire vers des positions de plus en plus extrêmes. Aucune de ces réactions
    ne peut ni ne doit être comprise en dehors des calendriers électoraux que font
    face plusieurs pays européens cette année.


    L''Espagne n''a pas non plus échappé à cette logique. Le député de Vox José María
    Figaredo a même exigé de "chasser" ceux qui sont entrés à Ceuta. Santiago Abascal
    a parlé d''une "invasion", a lié l''arrivée de personnes à la criminalité, à l''insécurité
    et au déclin des services publics, a annulé son voyage en Colombie pour se rendre
    à la ville autonome et a transformé la frontière en axe de sa offensive politique.
    En même temps, Alvise Pérez et des membres de Núcleo Nacional sont allés à Ceuta
    pour contester à Vox le monopole du discours raciste.


    Rien de cela n''est le fruit de l''improvisation. Cela fait partie d''une stratégie
    connue : transformer une crise frontalière en opportunité politique. Le peur mobilise,
    la xénophobie unit et transformer l''immigrant en ennemi intérieur continue d''être
    l''un des principaux appels idéologiques de l''ultra-droite. Partant de là, la
    rivalité ne consiste plus qu''à prouver qui propose le programme le plus intransigeant
    et utilise le langage le plus agressif.


    Mais le véritable problème n''est pas Vox. De Vox, personne ne peut dire qu''il
    cache son projet. Ce qui est préoccupant, c''est un PP qui a cessé de combattre
    les cadres de la droite extrême pour les adopter. Les applaudissements aux paroles
    de Léon XIV, qui rappelait que "la dignité humaine n''a pas de passeport et ne
    perd pas de valeur en traversant une frontière", ont disparu après les événements
    de Ceuta. La mobilité humaine a cessé d''être abordée comme un phénomène complexe,
    qui nécessite une coopération internationale et un respect des droits humains,
    pour devenir un instrument de confrontation partisane.


    Lorsque la droite traditionnelle accepte le cadre défini par la droite radicale,
    elle cesse de discuter des solutions et finit, non seulement en renforçant le
    récit de celui qui marque le débat, mais en l''extrêmisant encore plus, car de
    l''extrémisme, il y aura plus à crier, des désamorcages plus grossiers et des
    mesures encore plus inhumaines. Par exemple, en portant au niveau du discours
    politique ce qui n''avait jusque-là eu de nature que dans les rues : chasser l''immigré.
    Comme à Torre Pacheco il y a exactement un an. Cela s''est également produit avec
    l''Agenda 2030 et les politiques climatiques. Cela se produit maintenant avec
    l''immigration, le sommet des politiques de déshumanisation, car dans ce cas,
    il s''agit – ou devrait s''agir – de personnes humaines.


    La question la plus importante n''est pas ce que dit aujourd''hui l''opposition,
    mais ce qui se passera lorsque celle-ci gouvernera. Car le Maroc restera là et
    continuera à faire la même chose : utiliser les flux migratoires comme outil de
    pression géopolitique. Aucun gouvernement espagnol ne sera immunisé contre des
    épisodes comme celui de Ceuta.


    Alors, qui le blâmera ?


    Gouverner exige quelque chose de plus difficile que d''attribuer des responsabilités
    : cela oblige à gérer des problèmes pour lesquels il n''existe pas de solutions
    simples. De plus, cela oblige à répondre à une autre question. Si le modèle politique
    de Vox est celui impulsé par Trump, basé sur des expulsions massives, des perquisitions
    et une exhibition constante de la force face à l''immigration irrégulière, jusqu''où
    serait-il prêt à suivre le PP pour conserver une majorité parlementaire ? Les
    accords autonomiques offrent quelques indices, car le PP a accepté le principe
    de "priorité nationale" ou des restrictions à des organisations sociales qui aident
    des personnes en situation irrégulière. Cession après cession, l''espace politique
    du PP se déplace vers la droite radicale.


    C''est ce qui représente le véritable risque. Aucun État n''est à l''abri du fait
    qu''un pays tiers utilise la migration comme outil de pression. La différence
    réside dans la façon dont on répond à ces situations : par la gestion, la coopération
    européenne et le respect de l''État de droit, ou par la peur, la recherche de
    coupables et la compétition pour prouver qui est le plus implacable. Alors la
    politique ne consistera plus qu''à prouver qui peut crier le plus fort : je suis
    plus raciste que toi.'
