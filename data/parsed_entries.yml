- title: Le Rock’R Sauvage, festival de plus en plus à l’ouest (et c’est heureux)
  summary: Le raout ajoulot dédié aux musiques indépendantes s’est trouvé un nouveau
    lieu d’élection. Il débute jeudi. Brève présentationSi on fait un pas de côté
    alors qu’on est déjà à la marge, est-ce qu’on tombe? En Ajoie, pas forcément,
    et c’est ce que tentera le Rock’R Sauvage dès ce jeudi. Ces dernières années,
    le festival dédié aux musiques indépendantes avait ses quartiers au parc du Pré
    de l’Etang, à Porrentruy. Il se déplace cette année dans l’un des villages adjacents,
    à Courtedoux.On est à peine plus à l’ouest géographiquement, et la programmation
