- title: 'La neutralité: la dernière croisade de Christoph Blocher'
  summary: 'A 86 ans, l’ancien conseiller fédéral mène personnellement la campagne
    en faveur de l’initiative sur la neutralité, soumise au vote le 27 septembre.
    Financier et figure de proue du texte, le Zurichois entend inscrire dans la Constitution
    une conception stricte de ce principe, au risque, selon ses opposants, d’isoler
    la SuisseRarement un ancien conseiller fédéral ne s’est autant engagé pour une
    votation populaire. Au point que la presse alémanique parle de «l’initiative Blocher»
    quand elle écrit au sujet de l’initiative sur la neutralité, soumise au peuple
    le 27 septembre prochain. A 86 ans, l’UDC zurichois est sur tous les fronts. Alors
    que vendredi dernier il tenait un discours enflammé devant 1500 personnes réunies
    sur le site du théâtre en plein air de Guillaume Tell, non loin d’Interlaken,
    Christoph Blocher participait ce mardi matin à la traditionnelle conférence de
    presse d’ouverture de campagne à Berne. Le milliardaire est également l’un des
    principaux financiers d’un texte lancé en 2022, après la reprise par le Conseil
    fédéral des sanctions européennes contre la Russie, par l’association Pro Suisse
    (issue de l’Action pour une Suisse indépendante et neutre, qu’il a fondée en 1986).

    Lire également: Un manifeste pour contrer l’initiative sur la neutralité de Christoph
    Blocher

    Voir plus'
