- title: Il y a plus de Suisses frontaliers que de Lausannois
  summary: 'Une enquête de Tamedia montre que 154 700 Suisses vivent près de la frontière
    et travaillent en Suisse. On ne peut pas parler de boom, mais la proportion augmente
    peu à peu, y compris du côté de l''AutricheEn théorie, la quatrième ville de Suisse,
    c''est Lausanne, avec ses 151 300 habitants. En volumes généraux, la place est
    toutefois ravie par les Suisses frontaliers, le peuple qui vit au-delà de la frontière
    en ayant presque toutes ses activités en Suisse. Le Tages-Anzeiger a compilé des
    chiffres de l''Office fédéral de la statistique (OFS) et indique que 154 700 personnes
    sont dans ce cas, une part qui augmente peu à peu. L''OFS calcule que le nombre
    de Suisses vivant à l’étranger a crû de 14 % au cours des sept dernières années.Genève
    est bien sûr la région la plus concernée. Depuis 2014, environ 16 000 Suisses
    ont déménagé de Genève à l’étranger. Parmi toutes les régions frontalières, la
    Haute-Savoie est, de loin, celle qui attire le plus de Suisses: elle compte plus
    de 50 000 résidents helvétiques, rassemblant ainsi près de 24% de tous les Suisses
    frontaliers. 18 000 vivent dans le département de l’Ain.

    Lire aussi: Le casse-tête des parents frontaliers avant la rentrée ou quand «l’éducation
    des enfants compte plus que sa propre maison»


    «Il n’y a jamais eu de forte augmentation soudaine»

    La tendance est à la hausse, mais sans explosion. Le journal alémanique cite Stéphanie
    Périllard, consule générale de Suisse à Lyon: «Il n’y a jamais eu de forte augmentation
    soudaine», indique-t-elle: «L’évolution est lente et constante.» S''agissent de
    la région bâloise, son collègue Istvan Kocsis, consul général à Stuttgart, raconte:
    «Ma première hypothèse était que ce sont des retraités qui s’installent par exemple
    dans la Forêt-Noire». De fait, les données lui ont appris le contraire: ce sont
    avant tout des actifs qui s’installent dans le pays voisin.A Bâle, deuxième grande
    ville frontalière du pays, entre 2017 et 2025, 4000 Suisses se sont installés
    dans le département français voisin du Haut-Rhin, et plus de 3000 dans le district
    allemand de Fribourg. Le journal parle de «boom immobilier» en France voisine.
    Des interlocuteurs qui ont franchi le seuil estiment qu''ils économisent 40% sur
    leur loyer, et le déplacement est d''autant plus aisé à Bâle que le réseau de
    bus et de trams est dense.

    Dans l''autre sens: Salaire, opportunités, culture... Pourquoi les Français viennent
    travailler ou s’installer en Suisse, et ce qui les surprend


    Le plus grand bond, c''est le Liechtenstein, à 8% par an

    En termes de croissance annuelle du nombre de Suisses, le cas genevois est un
    peu relativisé: c''est le Liechtenstein qui croît le plus vite, à 8% par an, pour
    un total de 5600 Suisses. Même si on part d''assez bas, quelques centaines de
    personnes voire un peu plus de 1000, les régions autrichiennes à l''est de Saint-Gall
    croissent le plus vite.Cette propension à sauter les frontières ne va pas diminuer.
    La semaine passée, Comparis publiait un sondage lié à sa division immobilière
    indiquant qu''à l''heure actuelle, 92 400 Romands (4,2% des sondés) sont «activement
    à la recherche» d''un bien immobilier en France voisine, à la location ou la vente.
    70% des francophones jugent leur loyer «cher», un ménage sur quatre y consacre
    plus de 36% de ses revenus, au-delà du seuil couramment admis. Le frein peut venir
    des temps de déplacement: 75% des personnes interrogées «n''acceptent pas» un
    temps de trajet supplémentaire supérieur à 30 minutes.Retrouvez notre suivi de
    l''actualité frontalière'
