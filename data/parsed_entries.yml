entries:
- title: Quel est le fondement de l'attaque de Meloni envers l'Espagne concernant
    la crise de Ceuta
  summary: 'Les événements de Ceuta ont servi à la leader ultra pour relancer des
    propositions contre l''immigration comme son controversé ''Modèle Albanie'' et
    pour récupérer du pouvoir en vue des élections de 2027 en Italie sous la pression
    d''un nouveau rival encore plus ultra. Meloni assure que la suspension de Schengen
    avec l''Espagne est «extraordinaire» et nécessaire pour «sauvegarder la sécurité
    nationale».


    Si il y a une leader politique qui, ces dernières années, a cherché à se positionner
    en référence antimmigration en Europe, c''est Giorgia Meloni. Le gouvernement
    italien de droite extrême n''a pas manqué l''occasion que lui a offerte l''arrivée
    irrégulière de dizaines de milliers de personnes à Ceuta pour relancer à nouveau
    ses propositions contre ceux qui tentent d''entrer sur le territoire européen.


    Ce qui s''est passé en Espagne a occupé les titres en Italie et la première ministre
    a profité de l''impact international de l''arrivée des migrants dans la ville
    autonome pour relancer un plan de rétention dans des pays tiers similaire au connu
    comme le ''Modèle Albanie'' et mener une offensive contre le modèle de Pedro Sánchez
    qui place Meloni en première ligne de la bataille migratoire en Europe.


    Selon des analystes, des critiques et des forces opposantes, cela lui a permis
    de gagner en force dans le débat politique italien et de marquer son propre profil
    face au président espagnol, vu en Italie comme le paladin du progrès et l''ennemi
    idéologique principal de Meloni. Dans un contexte européen où les thèses antimmigration
    dominent, la première ministre cherche à capitaliser sur la situation pour récupérer
    du protagonisme dans un sujet où elle avait perdu du poids.


    C''est une forme opportuniste et insensée d''ouvrir une crise diplomatique avec
    un autre État de l''UE.


    Laura Boldrini

    — députée du parti d''opposition Parti Démocrate


    L''offensive de Meloni a déclenché une crise diplomatique entre l''Italie et l''Espagne,
    la plus dure des dernières années, avec la suspension du traité Schengen de libre
    circulation avec l''Espagne, un pas vu comme propagandistique par ses détracteurs.
    Selon eux, la réaction de la première ministre obéit à ses propres intérêts politiques,
    dans un contexte de faiblesse interne après avoir perdu des consensus et de la
    popularité cette année, alors que les élections générales de 2027 se rapprochent
    et qu''elle pourrait se retrouver sans majorité pour rester au pouvoir selon plusieurs
    sondages.


    « La crise de Ceuta a été manipulée avec la seule finalité d''attaquer Sanchez.
    Il est inquiétant que certains pays européens aient instrumentalisé ce qui s''est
    passé au lieu de montrer la solidarité avec un partenaire européen qui a fait
    face à une urgence », dit à elDiario.es Laura Boldrini, députée du Parti Démocrate
    (le principal parti d''opposition) et ex-présidente du Parlement italien. Boldrini
    considère la suspension du traité Schengen avec l''Espagne comme « une forme opportuniste
    et insensée d''ouvrir une crise diplomatique avec un autre État de l''UE ».


    Meloni agit face à un rival plus ultra

    Pour Luigi Quercetti, analyste politique avec des liens avec la formation progrès
    +Europe, « Meloni a joué un jeu de propagande sale contre Sanchez parce qu''ils
    ont des couleurs politiques différentes, ainsi que des intérêts électoraux et
    idéologiques différents de ceux du président espagnol. Au lieu d''offrir la solidarité
    et l''aide humanitaire, elle a fermé les frontières ». Elle a agi comme le ferait
    Donald Trump ou Elon Musk. « La crise de Ceuta a été exploitée par tout le monde
    du univers MAGA et Meloni s''est jetée dans la polémique parce qu''elle fait partie
    de cet environnement », souligne Quercetti.


    La première ministre italienne durcit également son discours ultra face à la concurrence
    de Roberto Vannacci, ancien militaire et nouveau leader ultra-suprémaciste italien
    qui pourrait lui arracher des voix. De plus, avec une Italie déjà plongée dans
    la course électorale, Meloni cherche à se projeter à nouveau au niveau européen
    comme étendard d''une stratégie de rétention et de transfert forcé de migrants
    dans des centres fermés dans des pays tiers, une initiative que son gouvernement
    a activée en Albanie, bien que cela ait échoué après plusieurs revers judiciaires.


    Ceuta a été le terreau idéal

    Mais Meloni ne lâche pas prise et a trouvé le terreau idéal dans la crise de Ceuta.
    Elle n''a pas seulement relancé ses stratégies antimmigration qui ces années ont
    été pionnières en Europe, mais elle a mobilisé de nombreux gouvernements de droite
    et de centre-droite qui ne voient pas d''un bon œil les politiques migratoires
    de l''Espagne et leur régularisation des migrants.


    Ce qui s''est passé à Ceuta « a offert à Meloni l''opportunité de montrer comment
    ses idées et projets font partie d''une vision politique à long terme » et « lui
    a donné un coup de pouce pour retrouver du protagonisme sur le sujet migratoire
    », argumente à elDiario.es Giorgia Bulli, experte en ultra-droite et enseignante
    à l''Université des Études de Florence. De cette façon, explique Bulli, Meloni
    revendique la pertinence de son modèle face à la pression de Vannacci, mais aussi
    face à la position plus centriste de l''opposition italienne.


    Selon Muhammad Dihani, réfugié sahraoui résident à Rome et activiste pour les
    droits humains lié à Amnesty International, « en Italie, il y a eu plusieurs attaques
    contre l''Espagne » à propos de Ceuta. « L''une est contre la politique migratoire
    du gouvernement Sanchez et l''autre, très grave, contre le Tribunal Suprême »
    de l''Espagne, qui en juillet a considéré illégales les « expulsions en chaîne
    » des migrants interceptés en mer lorsqu''ils tentent d''atteindre Ceuta et Melilla
    à la nage.


    Le jugement du Tribunal Suprême a été cité dans la lettre que Meloni a présentée
    avec sa collègue danoise, Mette Frederiksen, avec le soutien de 20 autres gouvernements
    européens, pour demander une réunion extraordinaire des ministres de l''Intérieur
    de l''UE. « La sentence du Tribunal Suprême espagnol a été utilisée pour déclencher
    l''attaque et abuser de notre système de migration et d''asile », ont écrit dans
    la missive, dans laquelle ils ont demandé « renforcer les frontières extérieures,
    combattre l''immigration irrégulière, lutter contre les trafiquants d''êtres humains,
    rendre plus efficaces les expulsions et éliminer tout facteur qui puisse inciter
    de nouveaux entrées illégales ».


    Dans le texte, ils ont également critiqué la récente régularisation des migrants
    en Espagne, en la reliant à un supposé « effet appel », ce que l''a souligné le
    ministre des Affaires étrangères italien, Antonio Tajani, dans un tweet la semaine
    dernière, ce qui a encore accru les tensions avec l''Espagne.


    Dans une interview ce mardi avec le journal Il Corriere della Sera, le vice-premier
    ministre italien a réitéré ses critiques : « L''Espagne est en train de régulariser
    500 000 étrangers indocumentés sans avoir partagé cette décision avec ses partenaires
    européens, cela n''est pas bien ». Il a lancé une avertissement : « Ce qui s''est
    passé à Ceuta n''est pas un fait isolé, cela marque un risque pour toute l''Union
    et nous avons le droit de demander des mesures supplémentaires, des clarifications
    et des mesures préventives pour assurer qu''il ne se reproduise pas ».


    Le commissaire européen à l''Intérieur et à l''Immigration, Magnus Brunner, a
    nié ce mardi qu''il y ait une relation entre la régularisation des migrants et
    l''entrée de personnes migrantes à Ceuta. Les personnes qui sont passées à la
    ville autonome la semaine dernière ne peuvent pas se prévaloir du procédé extraordinaire,
    dont la date limite de dépôt des demandes a fermé il y a un mois et qui exigeait,
    entre autres, d''avoir entré avant le 1er janvier 2026 et d''avoir vécu en Espagne
    de manière continue au moins cinq mois.


    Italie revendique le ''Modèle Albanie'''
