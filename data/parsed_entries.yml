- title: La neutralité suisse n’interdit pas l’achat d’armes à l’Ukraine, confirme
    Armasuisse
  summary: Le chef de l’armement s’est récemment rendu en Israël, pays en guerre,
    notamment pour s’informer sur un système anti-drones. Pourquoi ne pas se rendre
    aussi en Ukraine, pays le plus avancé dans ce domaine? Armasuisse met en avant
    la neutralité, tout en confirmant que celle-ci n’interdit pas l’achat d’armes
    à un pays belligérantLa Suisse peut-elle acheter des armes à l’Ukraine? Ou sa
    neutralité est-elle un obstacle? La semaine dernière, en réponse à une sollicitation
    du Temps, Armasuisse indiquait qu’il «n’existe actuellement aucune coopération
    en matière d’armement entre la Suisse et l’Ukraine». Sa porte-parole Lea Ryf précisait
    à ce propos qu’«il convient toutefois de respecter les dispositions légales en
    matière d’acquisitions et de neutralité, ainsi que les éventuelles sanctions».
    Pourquoi Berne met-elle le droit de la neutralité en avant lorsqu’il s’agit de
    l’Ukraine et ne la mentionne pas lorsqu’il s’agit d’Israël, deux pays en guerre?«Il
    n’y a aucune différence dans l’appréciation juridique des marchés israélien et
    ukrainien en ce qui concerne une éventuelle acquisition de matériel de guerre»,
    répond aujourd’hui Lea Ryf. La loi sur le matériel de guerre, les obligations
    de la Suisse en matière de neutralité ainsi que les sanctions éventuelles s’appliquent
    «quel que soit le pays fournisseur». Mi-juillet, le chef suisse de l’armement,
    Urs Loher, était en Israël pour évoquer divers projets d’acquisition d’armement
    en cours (drones, système radio). Il en avait profité pour se «renseigner» sur
    les dernières technologies en matière de lutte anti-drones. Aucun nouveau contrat
    n’a toutefois été signé.Voir plus
