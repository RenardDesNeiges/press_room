  Aux États-Unis, [Le Grand Continent](https://legrandcontinent.eu/fr/2026/08/05/trump-peut-encore-gagner-les-elections-de-mi-mandat/)
  estime que Trump peut encore gagner les élections de mi-mandat. [La NZZ](https://www.nzz.ch/wirtschaft/aktiensparen-mit-dem-praesidenten-schon-sieben-millionen-kinder-in-amerika-haben-einen-trump-account-ld.10018055)
  rapporte que sept millions d’enfants possèdent déjà un « compte Trump ». [Jacobin](https://jacobin.com/2026/08/gdp-us-europe-economy-inequality)
  relativise la prospérité américaine : un PIB supérieur ne profite pas aux travailleurs
  ordinaires. [Yanis Varoufakis](https://jacobin.com/2026/08/varoufakis-tech-capital-marxism-technofeudalism)
  qualifie le pouvoir des Big Tech de « technoféodalisme ». [Le Grand Continent](https://legrandcontinent.eu/fr/2026/08/05/avec-v4-flash-deepseek-mise-sur-lia-a-faible-cout-plutot-que-sur-la-course-a-la-puissance/)
  présente DeepSeek V4-Flash, une IA chinoise cent fois moins chère que son concurrent,
  qui mise sur le faible coût plutôt que la puissance.


  Point de vigilance : la lettre des 20 gouvernements pourrait produire des mesures
  concrètes lors de la réunion des ministres de l’Intérieur de l’UE réclamée par Meloni.'
title: Offensive migratoire italienne contre l'Espagne
