- title: Au Jardin Robinson, les enfants Crusoé de la cité du Lignon
  summary: 'Alors que la nature a été boutée hors des villes et que les angoisses
    parentales atteignent des sommets, le Jardin Robinson du Lignon fait de la résistance.
    Depuis 1971, les enfants de ce quartier populaire genevois y apprennent l’art
    de la débrouilleSur le bitume de la cité du Lignon, le long du petit chemin qui
    longe le Rhône derrière les tours, Tournesol a laissé un indice. Ou peut-être
    est-ce Coco, Rubis ou Cheyenne. Qui de l’âne ou des poneys a osé? Insolite pour
    le visiteur, le crottin n’étonnera aucun des habitants de ce quartier populaire
    de Vernier. La présence d’animaux de ferme au pied des méga-immeubles est en réalité
    presque aussi vieille que la cité elle-même: c’est parce que les enfants des premiers
    locataires jouaient sur le chantier lors de sa construction dans les années 1960
    que des parents ont imaginé un espace où les plus jeunes pourraient gambader,
    sans risquer le drame.Ainsi commence l’histoire du premier Jardin Robinson de
    Suisse romande, conte l’animatrice Théa en faisant les présentations avec le charmeur
    et charmant Tournesol, naseaux de velours et yeux à tomber. Un peu plus haut,
    il y a aussi Maïs, Flamme et une ribambelle de lapins, des poules et des tortues,
    des petites parcelles de forêt, un hangar à vélos et un pavillon principal dans
    lequel on trouve un atelier bois, une cuisine et autres recoins à coussins colorés.
    Le royaume du papier mâché, des plans de travail encombrés et des parties de baby-foot
    endiablées.Voir plus'
