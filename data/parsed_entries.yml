- title: L'Espagne progressive dans une UE rétrograde
  summary: "Le problème grave est que, face à une action extérieure contre l'Espagne,\
    \ les droites européennes – avec un grand accent des locales – ont réagi contre\
    \ le gouvernement de notre pays qui n'est pas de leur échelle idéologique et ne\
    \ partage pas leurs « valeurs » si dégradantes.\n        « Sous le tapis apparaît\
    \ un sol qui est pourri et ne s'améliorera pas en le recousant. L'Occident peut\
    \ connaître le même sort que d'autres empires disparus, laissant un vide sous\
    \ le mot Europe ». (José Luis Sampedro (Reacciona 2011)    \n    \n        Les\
    \ ministres de l'UE, réunis en vidéoconférence à l'instigation d'Espagne, ont\
    \ convenu de tempérer les hostilités émergées à cause de la crise de Ceuta. Dans\
    \ un communiqué adopté à l'unanimité, ils « valorisent les efforts rapides et\
    \ efficaces des autorités espagnoles pour répondre à la situation ». Ils maintiennent\
    \ « la nécessité de continuer à lutter sans relâche contre les réseaux de trafic\
    \ de migrants », de renforcer les expulsions ou « renforcer » les frontières de\
    \ l'UE, dans les thèmes d'usage. Le ministre espagnol Grande-Marlaska s'est satisfait\
    \ de cela. Une notable récolte de volets ou un impasse dont le développement reste\
    \ à voir. \n    \n        Un missile a frappé les fondations de l'Union européenne,\
    \ cependant. Il est devenu clair que, si ce club n'a jamais été un modèle d'équilibres\
    \ et de contre-poids, maintenant priment plus que jamais ce qu'ils appellent eux-mêmes\
    \ « les intérêts électoraux nationaux ». Quels sont-ils ? Racisme, ultradroite\
    \ frôlant – et parfois entrant – le fascisme, inégalité, egoïsme profond, peu\
    \ ou rien pour résoudre les problèmes des citoyens, et avec un fort essai de manipulation\
    \ de l'opinion publique qui les soutient. Encore les soutient-ils. Le problème\
    \ grave est que, face à une action extérieure contre l'Espagne, les droites européennes\
    \ – y compris avec un grand accent les espagnoles – ont réagi contre le gouvernement\
    \ de notre pays qui n'est pas de leur échelle idéologique et ne partage pas leurs\
    \ « valeurs » si dégradantes. Ménageons, bien sûr, que le gouvernement présidé\
    \ par Sánchez est progressiste dans les paramètres actuels. On peut toujours demander\
    \ plus, mais pour la manière dont va le pays, cela les provoque des ampoules.\
    \ \n    \n         Parallèlement à tout cela, par ailleurs, des juristes allemands\
    \ se sont multipliés jusqu'à dépasser le millier pour demander la prohibition\
    \ du parti ultra Alternative pour l'Allemagne. Les démocrates allemands, comme\
    \ les espagnols, savent le danger que représentent les fascismes. Immense, fatal.\
    \ C'est l'UE elle-même qui leur a permis d'entrer dans la cuisine des institutions\
    \ après s'être installés dans divers pays dans une stratégie soigneusement élaborée.\
    \ Avec la manipulation médiatique qui l'accompagne, subventionnée, elle a connu\
    \ un succès croissant. En Espagne, nous les avons vu encouragés dans divers programmes,\
    \ maintenant en augmentation.  \n    \n        Donald Trump, paradigme de la corruption\
    \ présidentielle, manœuvre avec Netanyahu sans aucune retenue. Des congressistes\
    \ américains dénoncent le plan – doté de fonds abondants – pour « réintégrer »\
    \ le Maroc Ceuta, Melilla et le Sahara occidental – qui, d'ailleurs, est en partie\
    \ colonisé. Avec la complicité, bien sûr, du roi du Maroc, ce milliardaire qui\
    \ vit à Paris tandis que son peuple souffre d'une précarité intolérable. \n  \
    \  \n        ElDiario.es a documenté ces jours-ci des données clés de ce qui se\
    \ passe. Résumons quelques points essentiels.  \n    \n        - « Les relations\
    \ entre l'Espagne et le Maroc et l'Algérie sont un jeu compliqué de somme zéro.\
    \ Le soutien aux thèses de Rabat a fait cesser la collaboration entre l'Algérie\
    \ et l'Espagne. Maintenant, il y a des motifs pour suspecter que le voyage de\
    \ Sánchez à Alger et les accords conclus ont provoqué la réponse marocaine que\
    \ nous avons vue à Ceuta ». \n    \n        - Le Maroc s'arme jusqu'aux dents\
    \ alors que les tensions avec la voisine Algérie n'ont fait que s'aggraver. Le\
    \ Maroc est le plus grand acheteur d'armement américain en Afrique. \n    \n \
    \        - Rabat courtise le FMI et la Banque d'Exportation et d'Importation des\
    \ États-Unis (Exim Bank) pour financer un gazoduc de 26 milliards de dollars qui\
    \ coulerait le long de la côte africaine. Le gazoduc, de 6 800 kilomètres, prévoit\
    \ de relier les gisements de gaz du Nigeria, du Sénégal et de Maurice, avant de\
    \ se joindre au gazoduc Magreb-Europe, qui relie déjà le Maroc à l'Espagne. Dans\
    \ la prévision, le circuit passerait par les territoires du Sahara occidental,\
    \ que le Maroc revendique. \n    \n        - Le Maroc détient 70 % des réserves\
    \ mondiales de phosphate, mais ne tire et ne fournit que moins de 15 % de la demande\
    \ mondiale. Le phosphate est clé tant pour la production de engrais que pour la\
    \ production des batteries des voitures électriques. \n    \n        Que face\
    \ à tout cela, l'UE et la majorité de ses pays se comportent comme ils le font\
    \ envers l'Espagne est inqualifiable. Égoïste, maladroit et lâche. La Danemark,\
    \ dont nous avons défendu la voracité cupide de Trump, va rétablir le service\
    \ militaire obligatoire ! pour défendre la Groenlandie, au lieu de chercher des\
    \ soutiens réels dans l'UE. Il y a quelque chose et beaucoup qui ne va pas ici.\
    \  \n    \n        Et ensuite, il y a la droite espagnole. Répugnant son alignement\
    \ avec ses confrères ultradroits européens, avec son dieu Trump, avec Netanyahu\
    \ et qui sait qui encore pour truquer la Moncloa à tout prix. Insupportables,\
    \ les barbaries qu'ils déversent dans les médias et les réseaux. Quelle façon\
    \ de vitupérer le président Sánchez pour son public d'odieux et de dummies. Bien\
    \ sûr, il manque des points à clarifier. Par exemple, que pensent le PP et Vox\
    \ de la prétendue annexion de Ceuta et Melilla au Maroc. Le parti de la Dana,\
    \ des incendies, de la pandémie à Madrid (sans parler des exploits d'Aznar), ne\
    \ peut pas se permettre, du point de vue de la moindre décence, de lancer ses\
    \ hauts fonctionnaires pour dire que Sánchez « n'a pas été à la hauteur avec la\
    \ pandémie, ni avec la crue de Valence, ni avec les incendies, ni avec la crise\
    \ de Ceuta ». Ni a droit à des vacances malgré sa maigreur et sa pâleur due à\
    \ l'intense trafic de cette saison. Le Roi oui, et ils nous donnent des détails\
    \ sur son ocio estival. Sans aucune gêne tout cela.\n    \n         Par contre,\
    \ il y a un mouvement international, avec des noms puissants, de soutien à Sánchez,\
    \ scandalisés par la réponse européenne qui a probablement influencé la récolte\
    \ de volets de ce mardi. De ces imbéciles de là-bas, ils ne comprennent pas bien,\
    \ c'est vrai, mais nous, les citoyens, nous en souffrons. \n    \n        Ce homme\
    \ qui, si je suis sincère, ne me donnait pas cette impression initiale, est devenu\
    \ une sorte de héros imprévu qui, plongé dans ce tourbillon, avance pour voir\
    \ ce qui sauve de la ruine que nous préparent. Laquelle se réalise dans certains\
    \ territoires où l'extrême-droite se sent déjà, avec le PP, aux commandes. La\
    \ situation internationale terrible ne peut nous faire oublier dans quelle conjonction\
    \ se cristallise cela. Le gouvernement de Moreno Bonilla, par exemple, cède à\
    \ Vox le service pour évaluer les victimes de violences sexuelles que les Abascal\
    \ demandaient « à purger » pour leur « biais idéologique ». C'est placer les victimes\
    \ devant un bourreau avec encore plus de pouvoir que leur agresseur. C'est inqualifiable.\
