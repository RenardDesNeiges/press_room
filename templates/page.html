<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$site_title</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23F0F8FF' stroke='black' stroke-width='1'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="page.css">
</head>
<body>
  <div class="page">
    <header class="top-bar">
      <div class="top-bar-inner">
        <h1 class="top-bar-title">Pressroom</h1>
        <span class="top-bar-date">$generated_at</span>
      </div>
    </header>
    $headline
    $feature_image
    <section class="lead-section">
      <div class="editorial" id="editorial">
        $audio_player
        $editorial_content
      </div>
      <div class="lead-articles">
        $lead_articles
      </div>
    </section>
    <main class="article-grid">
      $articles
    </main>
    <footer>
      Généré a partir des flux RSS des médias en questions · $article_count articles sélectionés
    </footer>
  </div>
  <script>
    (function () {
      const player = document.querySelector('.audio-player');
      if (!player) return;
      const audio = player.querySelector('audio');
      const button = player.querySelector('.audio-play-button');
      const timeDisplay = player.querySelector('.audio-time');
      if (!audio || !button) return;

      function formatTime(seconds) {
        if (!isFinite(seconds) || isNaN(seconds)) return '0:00';
        const minutes = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return minutes + ':' + (secs < 10 ? '0' : '') + secs;
      }

      function updateTime() {
        if (timeDisplay) {
          timeDisplay.textContent = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration);
        }
      }

      button.addEventListener('click', function () {
        if (audio.paused) {
          audio.play();
          button.textContent = '❚❚ Pause';
        } else {
          audio.pause();
          button.textContent = '▶ Écouter l\'édito';
        }
      });

      function setPlaying(isPlaying) {
        button.classList.toggle('is-playing', isPlaying);
        button.textContent = isPlaying ? '❚❚ Pause' : '▶ Écouter l\'édito';
      }

      audio.addEventListener('play', function () { setPlaying(true); });
      audio.addEventListener('pause', function () { setPlaying(false); });
      audio.addEventListener('ended', function () { setPlaying(false); });

      audio.addEventListener('timeupdate', updateTime);
      audio.addEventListener('loadedmetadata', updateTime);
      audio.addEventListener('durationchange', updateTime);
    })();
  </script>
  <script>
    (function () {
      const fills = document.querySelectorAll('.stats-bar-fill.anim');
      if (!fills.length || !('IntersectionObserver' in window)) return;
      const observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.style.width = entry.target.getAttribute('data-width') + '%';
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.3 });
      fills.forEach(function (fill) { observer.observe(fill); });
    })();
  </script>
  <script>
    (function () {
      const links = document.querySelectorAll('.stats-bar-link[data-scroll-source]');
      const topBar = document.querySelector('.top-bar');
      const offset = topBar ? topBar.offsetHeight + 16 : 0;
      function scrollToEl(el) {
        const target = el.getBoundingClientRect().top + window.pageYOffset - offset;
        window.scrollTo({ top: target, behavior: 'smooth' });
      }
      links.forEach(function (link) {
        link.addEventListener('click', function (event) {
          event.preventDefault();
          const source = link.getAttribute('data-scroll-source');
          const article = document.querySelector('.article[data-source="' + source + '"][data-source]');
          if (article) scrollToEl(article);
        });
      });
    })();
  </script>
  <script>
    (function () {
      const titleLink = document.querySelector('.headline-link');
      const editorial = document.getElementById('editorial');
      if (!titleLink || !editorial) return;
      titleLink.addEventListener('click', function (event) {
        event.preventDefault();
        const topBar = document.querySelector('.top-bar');
        const offset = topBar ? topBar.offsetHeight + 16 : 0;
        const target = editorial.getBoundingClientRect().top + window.pageYOffset - offset;
        window.scrollTo({ top: target, behavior: 'smooth' });
        history.replaceState(null, '', '#editorial');
      });
    })();
  </script>
  <script>
    (function () {
      // Lightweight live reload: reload the page if press_room.html changes.
      let lastModified = null;
      const checkInterval = 30000; // 30 seconds

      async function checkForUpdate() {
        try {
          const response = await fetch("press_room.html", { method: "HEAD", cache: "no-store" });
          const modified = response.headers.get("Last-Modified");
          if (lastModified && modified && lastModified !== modified) {
            location.reload();
          }
          lastModified = modified || lastModified;
        } catch (err) {
          // Ignore network errors; retry on the next interval.
        }
      }

      checkForUpdate();
      setInterval(checkForUpdate, checkInterval);
    })();
  </script>
</body>
</html>
