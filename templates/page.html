<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$site_title</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #000000;
      --accent: #000000;
      --rule: #000000;
      --font-title: "Playfair Display", Georgia, "Times New Roman", serif;
      --font-body: "GT Pressura Mono", "Courier New", Courier, "Lucida Console", monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      line-height: 1.55;
    }

    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 4rem 5vw;
    }

    header.masthead {
      text-align: center;
      border-top: 4px solid var(--rule);
      border-bottom: 2px solid var(--rule);
      padding: 1.5rem 0;
      margin-bottom: 2.5rem;
    }

    .masthead-title {
      margin: 0;
      font-family: var(--font-title);
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      text-transform: lowercase;
    }

    .masthead-tagline {
      margin: 0.5rem 0 0;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2.5rem;
    }

    .article {
      border-top: 1px solid var(--rule);
      padding-top: 1rem;
    }

    .article-link {
      display: block;
      text-decoration: none;
      color: inherit;
    }

    .article-link:hover .article-title {
      text-decoration: underline;
    }

    .article img {
      display: block;
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      margin-bottom: 1rem;
      border: 1px solid var(--rule);
      filter: grayscale(100%);
    }

    .article-title {
      margin: 0 0 0.6rem;
      font-family: var(--font-title);
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .article-byline {
      margin: 0 0 0.8rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .article-summary {
      margin: 0;
      font-size: 0.95rem;
    }

    footer {
      margin-top: 4rem;
      padding-top: 1rem;
      border-top: 1px solid var(--rule);
      font-size: 0.75rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    @media (max-width: 600px) {
      .page {
        padding: 2rem 1.5rem;
      }
      .masthead-title {
        font-size: 2.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <h1 class="masthead-title">$site_title</h1>
      <p class="masthead-tagline">A daily selection of the press</p>
    </header>
    <main class="grid">
      $articles
    </main>
    <footer>
      Generated from filtered_entries.yml · $article_count articles selected
    </footer>
  </div>
</body>
</html>
