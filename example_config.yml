# Pressroom configuration example file.
# Copy into a config.yml to actually setup the config for your installation.
# Every default set in config.py can be overridden here. If this file is
# absent, the built-in defaults in config.py are used instead.

# --- paths ------------------------------------------------------------------
paths:
  data_dir: "data"
  feeds: "feeds.yml"
  filtered_entries: "filtered_entries.yml"
  parsed_entries: "parsed_entries.yml"
  prepared_entries: "prepared_entries.yml"
  mp3: "editorial.mp3"
  interests: "readers_interests.md"
  title_guide: "titre.md"
  additional_rerank_prompt: "additional_rerank_prompt.md"
  template_dir: "src/templates"
  db: "pressroom.db"

# --- editorial --------------------------------------------------------------
editorial:
  minutes: 5

# --- models -----------------------------------------------------------------
models:
  default: "qwen/qwen-2.5-7b-instruct:nitro"
  fancy: "deepseek/deepseek-v4-flash-0731:nitro"
  section: "deepseek/deepseek-v4-flash-0731:nitro"

# --- pipeline ---------------------------------------------------------------
pipeline:
  candidates_count: 120
  final_count: 50
  max_per_source: 10
  section_size: 5

# --- web --------------------------------------------------------------------
web:
  secret_key: "dev-secret-change-me"
  port: 8080

# Domains left out of the archive.ph link wrapper (default list).
excluded_domains:
  - "blog.mondediplo.net"
  - "politico.eu"
  - "politico.com"
  - "rts.ch"
  - "srf.ch"
  - "eldiario.es"
  - "elpais.com"
  - "lvsl.fr"
  - "contretemps.eu"
  - "chinadaily.com.cn"
  - "mediapart.fr"
  - "news.cgtn.com"
  - "granma.cu"
  - "cubadebate.cu"
  - "jornada.com"
  - "solidaire.org"
  - "orientxxi.info"

# Daily pipeline schedule for the webapp. `time` is interpreted in `timezone`
# (a valid IANA timezone; falls back to Europe/Paris if absent or invalid).
schedule:
  enabled: true
  time: "06:00"
  timezone: "Europe/Paris"
  users:
    - "titou"