<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$site_title</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23F0F8FF' stroke='black' stroke-width='1'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="page.css">
</head>
<body>
  <div class="page">
    <header class="top-bar">
      <div class="top-bar-inner">
        <h1 class="top-bar-title">Pressroom</h1>
        <div class="top-bar-right">
          <span class="top-bar-date">$generated_at</span>
          $user_info
        </div>
      </div>
    </header>
    $headline
    $feature_image
    <section class="lead-section">
      <div class="editorial" id="editorial">
        $audio_player
        $editorial_content
      </div>
      <div class="lead-articles">
        $lead_articles
      </div>
    </section>
    <main class="article-grid">
      $articles
    </main>
    <footer>
      Généré a partir des flux RSS des médias en questions · $article_count articles sélectionés
    </footer>
  </div>
    <script src="page.js"></script>
</body>
</html>
