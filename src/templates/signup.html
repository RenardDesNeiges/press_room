<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pressroom — Inscription</title>
  <link rel="stylesheet" href="/page.css">
</head>
<body>
  <div class="page">
    <header class="top-bar">
      <div class="top-bar-inner">
        <h1 class="top-bar-title">Pressroom</h1>
        <span class="top-bar-date">Inscription</span>
      </div>
    </header>
    <main class="login-form">
      <h2>Créer un compte</h2>
      {% if error %}
      <p class="login-error">{{ error }}</p>
      {% endif %}
      <form method="post">
        <label>
          Nom d'utilisateur
          <input type="text" name="username" required autofocus>
        </label>
        <label>
          Mot de passe
          <input type="password" name="password" required>
        </label>
        <button type="submit">S'inscrire</button>
      </form>
      <p class="login-alt"><a href="/login">Déjà un compte ? Se connecter</a></p>
    </main>
  </div>
</body>
</html>
