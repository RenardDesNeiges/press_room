<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pressroom — {{ stage }} · {{ user_name }} · {{ day }}</title>
  <link rel="stylesheet" href="/page.css">
</head>
<body>
  <div class="page">
    <header class="top-bar">
      <div class="top-bar-inner">
        <h1 class="top-bar-title">Pressroom</h1>
        <div class="top-bar-right">
          <a class="top-bar-link" href="/">Lire l'édition</a>
          <a class="top-bar-link" href="/settings">Paramètres</a>
          <a class="top-bar-link" href="/admin">Admin</a>
          <a class="top-bar-link" href="/admin/data">Données des pipelines</a>
          <span class="top-bar-user">{{ username }}</span>
          <a class="top-bar-logout" href="/logout">Déconnexion</a>
        </div>
        <button type="button" class="hamburger" aria-label="Menu" aria-expanded="false">☰</button>
      </div>
    </header>

    <main class="settings">
      <h1 class="settings-title">Étape « {{ stage }} »</h1>
      <p class="settings-hint">Utilisateur : {{ user_name }} · Édition du {{ day }}</p>
      <pre class="admin-code">{{ content }}</pre>
      <div class="settings-actions">
        <a class="feeds-download" href="/admin/data">Retour aux données des pipelines</a>
      </div>
    </main>
  </div>
  <script src="/page.js"></script>
</body>
</html>
