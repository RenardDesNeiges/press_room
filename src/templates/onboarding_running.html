<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pressroom — Préparation de l'édition</title>
  <meta http-equiv="refresh" content="30">
  <link rel="stylesheet" href="/page.css">
</head>
<body>
  <div class="page">
    <header class="top-bar">
      <div class="top-bar-inner">
        <h1 class="top-bar-title">Pressroom</h1>
        <div class="top-bar-right">
          <a class="top-bar-link" href="/settings">Paramètres</a>
          <span class="top-bar-user">{{ username }}</span>
          <a class="top-bar-logout" href="/logout">Déconnexion</a>
        </div>
        <button type="button" class="hamburger" aria-label="Menu" aria-expanded="false">☰</button>
      </div>
    </header>
    <main class="settings">
      <section class="settings-section">
        <p class="onboarding-intro">Revenez dans quelques minutes.</p>
        <p class="onboarding-running">Préparation de l'édition en cours.</p>
      </section>
    </main>
  </div>
</body>
</html>
